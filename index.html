rn free and equal; slavery is always against nature",who:"the Stoics, Rousseau, the abolitionists"}]},{q:"Is slavery merely conventional?",sides:[{view:"It rests only on law, force, and convention, not nature",who:"the critics"},{view:"It reflects a real natural hierarchy",who:"the ancient defenders"}]},{q:"Can enslavement ever be legitimate?",sides:[{view:"By just war or consent, to spare a life",who:"some traditions"},{view:"No one can rightfully own another or alienate their freedom",who:"Rousseau"}]}],positions:[{name:"Aristotle",claim:"Holds some are 'slaves by nature,' lacking the capacity to rule themselves -- though many, he grants, are enslaved unjustly."},{name:"The Stoics",claim:"All human beings share in reason; slavery binds only the body -- all are by nature free and kin."},{name:"Rousseau",claim:"'Man is born free'; to renounce liberty is to renounce one's humanity -- 'slavery' and 'right' contradict."},{name:"Locke",claim:"Rejects voluntary self-enslavement, though he allows enslaving captives of a just war -- a much-criticized view."}],topics:["The nature of slavery","Slavery by nature vs. by convention","The justice of slavery","The ancient defense and its critics","Freedom and human equality","Political slavery and despotism","The abolition of slavery","Slavery and natural law"],key_texts:[{text:"Aristotle, Politics I",when:"c. 335 BC"},{text:"Seneca; Epictetus",when:"c. 108-180 AD"},{text:"Locke, Second Treatise (IV)",when:"1689"},{text:"Rousseau, The Social Contract I",when:"1762"}],example:"Rousseau cut the old defense: might makes no right, for if force alone rules, then the moment the slave can break free, he does no wrong in doing so.",related:["liberty","justice","labor"],hook:"Persons held as property.",quotes:[{text:"Man is born free, and everywhere he is in chains.",who:"Rousseau",work:"The Social Contract I",when:"1762",context:"The opening line. Rousseau does not propose to strike off the chains but to ask what could make them legitimate -- his answer is a contract in which one obeys only rules one has authored."}]},{id:"soul",name:"Soul",cluster:"divine",gist:"The principle of life\u2014and perhaps of immortality.",framing:"The soul is the principle of life and mind -- what makes a living thing alive and, in us, what thinks and chooses. Whether it is a separate substance, the body's form, or nothing beyond the body is a defining question.",senses:["Principle of life (nutrition, growth) shared by all that lives","Seat of sensation and desire (in animals)","Rational intellect (in humans)","A separable substance vs. the body's form"],disputes:[{q:"What is the soul's relation to the body?",sides:[{view:"A separate substance lodged in the body",who:"Plato, Descartes"},{view:"The form or first actuality of a living body",who:"Aristotle"},{view:"Nothing but the body's functions",who:"the materialists"}]},{q:"Is the soul immortal?",sides:[{view:"Yes -- being simple and rational",who:"Plato, Aquinas"},{view:"No -- it perishes with the body",who:"Lucretius"}]},{q:"Do plants and animals have souls?",sides:[{view:"Yes -- graded vegetative, sensitive, and rational souls",who:"Aristotle"},{view:"No -- animals are mere machines",who:"Descartes"}]}],positions:[{name:"Plato",claim:"The soul is immortal and tripartite -- reason, spirit, appetite -- ruling the body from within."},{name:"Aristotle",claim:"The soul is the form or first actuality of a living body; its powers are graded."},{name:"Descartes",claim:"The soul is a thinking substance, wholly distinct from the extended body it inhabits."},{name:"Aquinas",claim:"The rational soul is the single substantial form of the human being, subsistent and immortal."},{name:"Hume",claim:"Finds no soul-substance -- only a bundle of perceptions."}],topics:["The definition of the soul","Soul and body","The parts or powers of the soul","The vegetative, sensitive, and rational soul","The intellect","The soul's immortality","The seat of the soul","Soul in plants and animals"],key_texts:[{text:"Plato, Phaedo; Phaedrus",when:"c. 370 BC"},{text:"Aristotle, On the Soul",when:"c. 350 BC"},{text:"Descartes, Meditations",when:"c. 175 AD"},{text:"Aquinas, Summa Theologica I QQ.75-89",when:"1265-1274"}],example:"Aristotle rejects Plato's separable soul: as sight is to the eye, soul is to the body\u2014the form that makes this matter a living thing, not a ghost within it.",related:["mind","life-and-death","immortality"],hook:"What makes a body alive.",quotes:[{text:"The soul is the first actuality of a natural body having life potentially.",who:"Aristotle",work:"On the Soul II",when:"c. 350 BC",context:"Deliberately deflationary. The soul is not a passenger in the body but the organizing form that makes it a living thing at all -- as sight is to the eye."}]},{id:"space",name:"Space",cluster:"being",gist:"The extension in which bodies exist and move.",framing:"Space is the extension in which bodies are located and move -- but is it a real thing, a mere relation among bodies, or a form our minds impose? The answer shapes physics and metaphysics alike.",senses:["Place (the boundary containing a body) vs. space (extension in general)","The void or empty space","Absolute space (a fixed container) vs. relational space","Space as a form of intuition (Kant)"],disputes:[{q:"Is there void or empty space?",sides:[{view:"A void is impossible; nature abhors a vacuum",who:"Aristotle, Descartes"},{view:"Empty space exists and is needed for motion",who:"the atomists, Newton"}]},{q:"Is space absolute or relational?",sides:[{view:"Absolute space exists independent of bodies",who:"Newton"},{view:"Space is only the order of relations among bodies",who:"Leibniz, Einstein"}]},{q:"Is space real or mind-dependent?",sides:[{view:"Space is a real feature of the world",who:"the realists"},{view:"Space is the a priori form of outer intuition",who:"Kant"}]}],positions:[{name:"Aristotle",claim:"Denies the void and defines place as the inner surface of the containing body."},{name:"Descartes",claim:"Identifies space with extended matter; there is no empty extension."},{name:"Newton",claim:"Absolute space exists -- uniform, immovable, the frame of true motion."},{name:"Leibniz",claim:"Space is nothing but the order of coexisting things; absolute space is a fiction."},{name:"Kant",claim:"Space is not a thing but the form under which we must perceive outer objects."}],topics:["Space and place","The reality of the void","The infinity of space","Absolute vs. relational space","Space and matter","Space as a form of intuition","The geometry of space","Space and motion"],key_texts:[{text:"Aristotle, Physics IV.1-9",when:"c. 350 BC"},{text:"Descartes, Principles II",when:"1644"},{text:"Newton, Principia (Scholium)",when:"1687"},{text:"Leibniz-Clarke Correspondence",when:"1715-1716"},{text:"Kant, Critique of Pure Reason (Transcendental Aesthetic)",when:"1781"}],example:"Leibniz argued that if space were an absolute container, God could have no reason to place the whole universe here rather than three feet over\u2014so space must be relational.",related:["time","matter","physics"],hook:"Where bodies are, and move.",quotes:[{text:"Space is not an empirical concept drawn from outer experience.",who:"Kant",work:"Critique of Pure Reason",when:"1781",context:"We cannot derive space from experience because we must already presuppose it to have any outer experience at all. Kant concludes it is a form the mind contributes, not a property of things in themselves."}]},{id:"state",name:"State",cluster:"polis",gist:"The sovereign political community.",framing:"The state is the sovereign political community -- the highest and most complete association, claiming authority over all within its bounds. Its origin, its ends, its rights over the individual, and its relation to society are foundational political questions.",senses:["The political community or city (Aristotle's complete association)","The sovereign apparatus of authority (the modern state, monopolizing legitimate force)","The state vs. society (the political order vs. the broader social life)","The state as an end in itself vs. an instrument for individual ends"],disputes:[{q:"Is the state natural or artificial?",sides:[{view:"Natural -- man is a political animal, completed in the state",who:"Aristotle"},{view:"Artificial -- erected by contract to escape the state of nature",who:"Hobbes, Locke, Rousseau"}]},{q:"Is the state prior to the individual, or the reverse?",sides:[{view:"The whole is prior; the individual is fulfilled only in it",who:"Aristotle, Hegel"},{view:"Individuals with rights are prior; the state serves them",who:"liberalism"}]},{q:"What are the ends and limits of the state?",sides:[{view:"To secure the good life and virtue",who:"the ancients"},{view:"To secure peace and rights, leaving the rest free",who:"the liberals"}]}],positions:[{name:"Aristotle",claim:"The state exists by nature and is prior to the individual; it comes to be for life, but exists for the good life."},{name:"Hobbes",claim:"The state ('Leviathan') is an artificial person created by covenant, ending the war of all against all."},{name:"Locke",claim:"The state is instituted by consent to protect natural rights; its power is limited and held in trust."},{name:"Rousseau",claim:"The state embodies the general will, through which a people becomes a sovereign moral body."},{name:"Hegel",claim:"The state is the actuality of ethical life -- the realization of concrete freedom, higher than family or civil society."}],topics:["The nature and origin of the state","The state as natural or conventional","The ends of the state","The state and the individual","Sovereignty","The state and society","The limits of state power","The state and the good life"],key_texts:[{text:"Aristotle, Politics I, III",when:"c. 335 BC"},{text:"Hobbes, Leviathan",when:"1651"},{text:"Locke, Second Treatise",when:"1689"},{text:"Rousseau, The Social Contract",when:"1762"},{text:"Hegel, Philosophy of Right",when:"1821"}],example:"Aristotle held the state comes to be for survival but exists for the good life\u2014its point is not mere living together but living well.",related:["government","constitution","citizen"],hook:"The sovereign community.",quotes:[{text:"Man is by nature a political animal.",who:"Aristotle",work:"Politics I",when:"c. 335 BC",context:"Not that men are sociable, but that the human being is only completed in the polis. Speech exists to declare the just and unjust; one who needs no city is a beast or a god."}]},{id:"temperance",name:"Temperance",cluster:"good",gist:"Self-mastery over pleasure and appetite.",framing:"Temperance is the virtue that moderates desire and pleasure -- self-mastery over the appetites for food, drink, and sex. The discipline by which reason governs the body's cravings, it is a cardinal virtue and the mark of a well-ordered soul.",senses:["Moderation of bodily appetites and pleasures","Self-control or self-mastery generally","The harmony of the soul's parts (reason ruling appetite)","The mean between self-indulgence and insensibility"],disputes:[{q:"Is temperance the same as self-control, or higher?",sides:[{view:"The temperate person has ordered desires and feels no inner conflict",who:"Aristotle"},{view:"The merely continent must fight their appetites",who:"the contrast Aristotle draws"}]},{q:"Should appetite be moderated or denied?",sides:[{view:"Moderate and order the appetites",who:"Aristotle"},{view:"Renounce and mortify them",who:"the ascetic ideal"}]},{q:"Is temperance chiefly personal or also political?",sides:[{view:"A virtue of the individual soul",who:"the ethical focus"},{view:"Also the civic harmony where each part accepts its place",who:"Plato"}]}],positions:[{name:"Plato",claim:"Temperance is the harmony in which reason rules and appetite consents -- in soul and city alike."},{name:"Aristotle",claim:"Temperance is the mean concerning bodily pleasures; the temperate person desires rightly, not merely resists."},{name:"The Stoics",claim:"Temperance is knowledge of what to choose in matters of desire; the sage is master of appetite."},{name:"Aquinas",claim:"Temperance restrains the concupiscible appetite according to reason; its parts include humility and chastity."}],topics:["The nature of temperance","The appetites and their pleasures","Self-mastery","Temperance vs. continence","The mean in pleasure","Temperance and reason","Asceticism and moderation","Temperance in soul and city"],key_texts:[{text:"Plato, Republic IV; Charmides",when:"c. 395 BC"},{text:"Aristotle, Nicomachean Ethics III",when:"c. 340 BC"},{text:"Epictetus, Discourses",when:"c. 108 AD"},{text:"Aquinas, Summa Theologica II-II QQ.141-170",when:"1265-1274"}],example:"Plato locates temperance not in one part of the soul but in the agreement of all three about who should rule\u2014harmony, not mere suppression of appetite.",related:["virtue-and-vice","courage","pleasure-and-pain"],hook:"Mastery of one's own appetites.",quotes:[{text:"The temperate man does not even desire wrongly.",who:"Aristotle",work:"Nicomachean Ethics VII",when:"c. 340 BC",context:"His distinction between temperance and mere self-control. The merely continent resist temptation and win; the temperate have trained desire itself, so the struggle no longer arises."}]},{id:"theology",name:"Theology",cluster:"divine",gist:"Reasoned discourse about God.",framing:"Theology is reasoned discourse about God -- founded either on revelation (sacred theology) or on unaided reason (natural theology). Its scope and method mark the boundary, and the meeting-point, of faith and philosophy.",senses:["Natural theology (God known by reason from creatures)","Sacred or revealed theology (from Scripture)","Theology as a science ordered from principles","The negative (apophatic) and mystical ways"],disputes:[{q:"Is theology a science?",sides:[{view:"Yes -- it reasons from revealed principles",who:"Aquinas"},{view:"No -- it lacks self-evident premises",who:"its critics"}]},{q:"How much of God can reason reach?",sides:[{view:"Much -- his existence and some attributes",who:"natural theology"},{view:"Little or nothing without revelation",who:"the fideists"}]},{q:"Faith seeking understanding, or reason grounding faith?",sides:[{view:"Believe in order to understand",who:"Augustine, Anselm"},{view:"Reason must first secure its ground",who:"the rationalists"}]}],positions:[{name:"Augustine",claim:"'Faith seeking understanding' -- belief first, then reason illumines what is believed."},{name:"Anselm",claim:"'I believe in order that I may understand'; reason unfolds the content of faith."},{name:"Aquinas",claim:"Sacred doctrine is a science drawing its principles from God's revelation; reason serves faith."},{name:"Maimonides",claim:"Guards God's transcendence; negative attributes protect against anthropomorphism."},{name:"Kant",claim:"Speculative theology overreaches; God is a matter of practical faith, not theoretical science."}],topics:["Natural vs. revealed theology","Theology as a science","The knowledge of God","The divine attributes","Faith and reason","The methods of theology (affirmation, negation, analogy)","Theology and philosophy","Mystical theology"],key_texts:[{text:"Augustine, On Christian Doctrine",when:"397-426 AD"},{text:"Anselm, Proslogion",when:"1078"},{text:"Aquinas, Summa Theologica I Q.1",when:"1265-1274"},{text:"Maimonides, Guide for the Perplexed",when:"c. 1190"},{text:"Calvin, Institutes of the Christian Religion",when:"1536"}],example:"Aquinas treats theology as a genuine science that borrows its first principles from God's own knowledge, as optics borrows from geometry\u2014faith supplying what reason cannot reach.",related:["god","religion","metaphysics"],hook:"Reason turned toward God.",quotes:[{text:"I believe in order that I may understand.",who:"Anselm",work:"Proslogion",when:"1078",context:"Reverses the modern order. Faith is not the conclusion of the argument but the condition of seeing it -- understanding deepens what is already believed rather than establishing it from outside."}]},{id:"time",name:"Time",cluster:"being",gist:"The measure of change\u2014past, present, and future.",framing:"Time is the measure of change, the order of before and after -- yet what it is, and whether it is real, remains among the deepest puzzles. It binds together motion, memory, eternity, and the self.",senses:["The measure or number of motion","Duration lived and felt","Absolute time (flowing uniformly) vs. relative time","The tensed present vs. the tenseless order of events"],disputes:[{q:"Is time real or ideal?",sides:[{view:"Time is a real feature of motion and the world",who:"Aristotle, Newton"},{view:"Time depends on the numbering soul, or is a form of intuition",who:"Aristotle's puzzle; Kant"}]},{q:"Is time absolute or relative?",sides:[{view:"Absolute time flows equably, independent of all else",who:"Newton"},{view:"Time is an order of events, relative to observers",who:"Leibniz; Einstein"}]},{q:"Does time have a beginning?",sides:[{view:"Time began with creation; there was no time before the world",who:"Augustine"},{view:"Time is eternal, without beginning",who:"Aristotle"}]}],positions:[{name:"Aristotle",claim:"Time is the number of motion with respect to before and after; he puzzles over the reality of past and future."},{name:"Augustine",claim:"We measure past and future only in the present mind -- memory and expectation."},{name:"Newton",claim:"Absolute, true, mathematical time flows uniformly without relation to anything external."},{name:"Leibniz",claim:"Time is the order of succession, not a self-standing thing."},{name:"Kant",claim:"Time is the a priori form of inner sense, ordering all our experience."}],topics:["The definition of time","Time and motion","The reality of past and future","The now or instant","Lived vs. measured time","Absolute vs. relative time","The beginning of time","Time and eternity","Time and the soul"],key_texts:[{text:"Aristotle, Physics IV.10-14",when:"c. 350 BC"},{text:"Augustine, Confessions XI",when:"c. 400 AD"},{text:"Newton, Principia (Scholium)",when:"1687"},{text:"Leibniz-Clarke Correspondence",when:"1715-1716"},{text:"Kant, Transcendental Aesthetic",when:"1781"}],example:"Augustine's famous confession: 'What then is time? If no one asks me, I know; if I wish to explain, I do not know'\u2014the most familiar thing turned mysterious.",related:["change","eternity","space"],hook:"The measure of before and after.",quotes:[{text:"What then is time? If no one asks me, I know.",who:"Augustine",work:"Confessions XI",when:"c. 400 AD",context:"The most quoted line on the subject. Augustine's puzzle is that past and future do not exist and the present has no duration -- leading him to locate time in the soul's own extension."}]},{id:"truth",name:"Truth",cluster:"mind",gist:"The agreement of thought with what is.",framing:"Truth is the agreement of thought or statement with reality -- the goal of all inquiry and the standard by which belief is judged. What truth consists in, and whether we can attain it, are questions as old as philosophy.",senses:["Correspondence (thought matching reality)","Coherence (fitting a consistent system)","What works (pragmatism)","Logical truth of propositions vs. the intelligibility of being; eternal vs. changing truth"],disputes:[{q:"What does truth consist in?",sides:[{view:"Correspondence of statement to fact",who:"Aristotle"},{view:"Coherence within a system",who:"the rationalists and idealists"},{view:"Practical success",who:"the pragmatists"}]},{q:"Is truth absolute or relative?",sides:[{view:"Some truths are timeless and universal",who:"the mainstream"},{view:"'Man is the measure' -- truth is relative to the perceiver",who:"Protagoras"}]},{q:"Can truth be attained with certainty?",sides:[{view:"Yes -- of first principles and clear ideas",who:"the rationalists"},{view:"The skeptic withholds assent",who:"the skeptics"}]}],positions:[{name:"Aristotle",claim:"To say of what is that it is, and of what is not that it is not, is true -- truth is in the judgment."},{name:"Protagoras",claim:"'Man is the measure of all things' -- things are as they appear to each, relativizing truth."},{name:"Aquinas",claim:"Truth is the adequation of intellect and thing, grounded ultimately in the divine intellect."},{name:"Kant",claim:"Truth is agreement of knowledge with its object, but we know objects only as they appear."},{name:"James",claim:"An idea is true insofar as it works, proving itself in the course of experience."}],topics:["The nature of truth","Correspondence, coherence, and pragmatic theories","Truth in judgment and proposition","The truth of being","Absolute vs. relative truth","Eternal truths","The criterion of truth","Truth and skepticism"],key_texts:[{text:"Plato, Theaetetus",when:"c. 369 BC"},{text:"Aristotle, Metaphysics IV",when:"c. 340 BC"},{text:"Aquinas, Summa Theologica I Q.16",when:"1265-1274"},{text:"Kant, Critique of Pure Reason",when:"1781"},{text:"James, Pragmatism",when:"1907"}],example:"William James unsettled the tradition by making truth a matter of 'cash value'\u2014an idea is true insofar as believing it works and leads us rightly through experience.",related:["knowledge","opinion","judgment"],hook:"Thought matching what is.",quotes:[{text:"Man is the measure of all things.",who:"Protagoras",work:"Truth",when:"c. 450 BC",context:"The founding statement of relativism: things are to each person as they appear to that person. Plato's reply in the Theaetetus is that the doctrine undercuts itself, since it makes its own denial equally true."}]},{id:"tyranny",name:"Tyranny",cluster:"polis",gist:"Lawless rule for the ruler's own sake.",framing:"Tyranny is the corrupt rule of one who governs for his own interest, lawlessly and by force, against the good of the ruled. The archetypal bad regime, it defines by contrast what legitimate authority and the rule of law must be.",senses:["The perversion of monarchy (one ruling for himself)","Lawless, arbitrary rule (unbound by law or consent)","Despotism (ruling free men as a master rules slaves)","The 'tyranny of the majority' (a modern extension)"],disputes:[{q:"What makes rule tyrannical -- who rules or how?",sides:[{view:"The selfish, lawless end, not the number of rulers -- so even the many can be tyrants",who:"Aristotle, Tocqueville"},{view:"The usurpation or illegitimacy of a single ruler",who:"the narrower sense"}]},{q:"May a tyrant be resisted or killed?",sides:[{view:"Tyranny forfeits authority; tyrannicide can be just",who:"the classical and medieval tradition"},{view:"Resistance breeds worse disorder; endure or restrain by lawful means",who:"the order-first view"}]},{q:"Can tyranny take modern, softer forms?",sides:[{view:"Only overt despotism is tyranny",who:"the classical sense"},{view:"Majorities and administrative power can tyrannize over mind and custom",who:"Tocqueville, Mill"}]}],positions:[{name:"Plato",claim:"The tyrant is the least happy of men -- a slave to his own lawless desires, the soul in worst disorder."},{name:"Aristotle",claim:"Tyranny is the worst constitution, the perversion of kingship -- ruling for the tyrant's good by force and fear."},{name:"Aquinas",claim:"Since the tyrant governs against the common good, his rule lacks true authority and may be resisted."},{name:"Tocqueville",claim:"Warns of a new 'tyranny of the majority' and a mild but all-encompassing administrative despotism."}],topics:["The nature of tyranny","Tyranny as perverted rule","Lawlessness and arbitrary power","Despotism","The unhappiness of the tyrant","Resistance and tyrannicide","The tyranny of the majority","Tyranny and the rule of law"],key_texts:[{text:"Plato, Republic VIII-IX",when:"c. 375 BC"},{text:"Aristotle, Politics IV-V",when:"c. 335 BC"},{text:"Aquinas, On Kingship",when:"c. 1267"},{text:"Tocqueville, Democracy in America",when:"1835-1840"}],example:"Plato paints the tyrant as the unhappiest man alive\u2014ruler of a city but slave to his own appetites, feared by all and trusting no one.",related:["monarchy","liberty","government"],hook:"Lawless rule, for the ruler.",quotes:[{text:"The tyrant is the least free of men.",who:"Plato",work:"Republic IX",when:"c. 375 BC",context:"The Republic's final argument that justice pays. Having power over everyone, the tyrant is enslaved by his own lawless appetites and can trust no one -- his outward mastery conceals total inner disorder."}]},{id:"universal-and-particular",name:"Universal and Particular",cluster:"being",gist:"The general kind and the individual instance.",framing:"The universal is what can be common to many (man, red, triangle); the particular is the individual, this one here. Their relation -- whether universals are real, mental, or mere words -- is the 'problem of universals' that divides the whole tradition.",senses:["The universal as a real Form apart from things","As a common nature in things","As a concept in the mind","As a general name; the particular as the concrete individual"],disputes:[{q:"Do universals exist, and how?",sides:[{view:"Real and separate, before the thing (ante rem)",who:"Plato"},{view:"Real but only in things (in re)",who:"Aristotle"},{view:"Only names or concepts, after the thing (post rem)",who:"nominalists, Ockham"}]},{q:"What is known -- universals or particulars?",sides:[{view:"Science is of the universal; the particular as such is not known",who:"Aristotle"},{view:"Only particulars are real objects of knowledge",who:"empiricists, nominalists"}]},{q:"How is the individual individuated?",sides:[{view:"Matter individuates the common form",who:"Aquinas"},{view:"A unique 'thisness' (haecceity) individuates",who:"Scotus"}]}],positions:[{name:"Plato",claim:"Universals are eternal Forms; particulars are real only by participating in them."},{name:"Aristotle",claim:"The universal exists in particulars and is abstracted by intellect; only individuals subsist."},{name:"Ockham",claim:"Only individuals exist; universals are natural signs in the mind, not things."},{name:"Aquinas",claim:"The common nature exists in individuals and is universalized by the mind; matter individuates."}],topics:["The problem of universals","Realism, conceptualism, nominalism","Universals ante rem, in re, post rem","Abstraction","The individuation of particulars","Universality in knowledge and science","Genus, species, and individual"],key_texts:[{text:"Plato, Republic; Parmenides",when:"c. 370 BC"},{text:"Aristotle, Categories; Metaphysics VII",when:"c. 340 BC"},{text:"Porphyry, Isagoge",when:"c. 270 AD"},{text:"Ockham, Summa Logicae",when:"c. 1323"},{text:"Aquinas, On Being and Essence",when:"c. 1252"}],example:"Ockham's razor cuts against Plato's Forms: why posit a realm of universals when only individual things exist and 'humanity' is just a name we apply to many?",related:["form","one-and-many","idea"],hook:"The kind, and the individual.",quotes:[{text:"Thisness.",who:"Scotus",work:"Ordinatio",when:"c. 1300",context:"His term (haecceity) for whatever makes an individual this one and no other. Species and form are shared; something further must account for singularity itself."}]},{id:"virtue-and-vice",name:"Virtue and Vice",cluster:"good",gist:"Excellence and defect of character.",framing:"Virtue is excellence of character -- the settled disposition to be and do good; vice is its corruption. What the virtues are, whether they can be taught, and whether they suffice for the good life form the core of moral philosophy.",senses:["Excellence of any kind (arete) vs. specifically moral virtue","Moral virtues (of character) vs. intellectual virtues (of mind)","The cardinal virtues and the theological virtues","Virtue as a mean; vice as excess or defect"],disputes:[{q:"Can virtue be taught?",sides:[{view:"Virtue is knowledge, hence teachable",who:"Socrates"},{view:"It comes by habit and practice, not teaching alone",who:"Aristotle"},{view:"It is a gift of grace or nature",who:"the theologians"}]},{q:"Is virtue one or many?",sides:[{view:"The virtues are one -- to have one is to have all, since all are wisdom",who:"Socrates, the Stoics"},{view:"The virtues are distinct",who:"Aristotle"}]},{q:"Is virtue sufficient for happiness?",sides:[{view:"Yes -- virtue alone makes the happy life",who:"the Stoics"},{view:"No -- some external goods are also needed",who:"Aristotle"}]}],positions:[{name:"Socrates",claim:"Virtue is knowledge; no one does wrong willingly, so vice is a kind of ignorance."},{name:"Aristotle",claim:"Moral virtue is a settled disposition to choose the mean, formed by habit and guided by practical wisdom."},{name:"The Stoics",claim:"Virtue is the only good, sufficient for happiness; the passions are to be overcome."},{name:"Aquinas",claim:"Adds the theological virtues -- faith, hope, charity, infused by grace -- to the cardinal virtues."},{name:"Hume",claim:"Virtues are qualities useful or agreeable to ourselves or others, approved by moral sentiment."}],topics:["The nature of virtue","Moral vs. intellectual virtue","The cardinal and theological virtues","Virtue as a mean","Whether virtue can be taught","The unity of the virtues","Virtue and happiness","Vice and moral weakness"],key_texts:[{text:"Plato, Meno; Protagoras",when:"c. 390 BC"},{text:"Aristotle, Nicomachean Ethics II-VI",when:"c. 340 BC"},{text:"Epictetus; Seneca",when:"c. 108-180 AD"},{text:"Aquinas, Summa Theologica I-II QQ.55-67",when:"1265-1274"},{text:"Hume, Enquiry Concerning the Principles of Morals",when:"1751"}],example:"Socrates' paradox: no one does wrong willingly, since to truly know the good is to do it\u2014vice, then, is a kind of ignorance rather than a free choice of evil.",related:["good-and-evil","habit","happiness"],hook:"Excellence and defect of character.",quotes:[{text:"We become just by doing just acts.",who:"Aristotle",work:"Nicomachean Ethics II",when:"c. 340 BC",context:"Moral virtue is not taught like geometry but acquired like a craft, by practice. This is why upbringing matters so much: habits formed young decide what later feels natural."},{text:"No one does wrong willingly.",who:"Socrates",work:"Plato, Protagoras",when:"c. 390 BC",context:"The Socratic paradox. If we always pursue what seems good, wrongdoing is a failure of knowledge rather than of will -- which implies vice is ignorance and virtue can be taught."}]},{id:"war-and-peace",name:"War and Peace",cluster:"polis",gist:"Organized violence between communities\u2014and its cessation.",framing:"War is organized armed conflict between communities; peace, the condition of concord and order. Whether war is natural or avoidable, whether it can be just, and how a lasting peace might be secured are questions of the gravest human weight.",senses:["Armed conflict between states or peoples","The 'state of war' (a relation of hostility, even without fighting)","Just war vs. unjust war","Peace as the mere absence of war vs. the 'tranquillity of order'; perpetual peace as an ideal"],disputes:[{q:"Is war natural or contrary to nature?",sides:[{view:"A permanent possibility rooted in human nature and scarcity",who:"Hobbes, Thucydides"},{view:"An aberration; peace is the natural and rational condition",who:"the cosmopolitans"}]},{q:"Can war be just?",sides:[{view:"Yes -- under just cause, right authority, and right conduct",who:"Augustine, Aquinas"},{view:"War is beyond justice, or is always a crime",who:"realists and pacifists"}]},{q:"Can lasting peace be achieved?",sides:[{view:"A federation of states under law could secure perpetual peace",who:"Kant"},{view:"Peace is only ever a pause between wars",who:"the tragic realists"}]}],positions:[{name:"Thucydides",claim:"Exposes the harsh logic of power -- 'the strong do what they can, the weak suffer what they must.'"},{name:"Augustine",claim:"Even war is waged for the sake of peace; a just war requires just cause and rightful authority."},{name:"Aquinas",claim:"Sets the conditions of a just war -- legitimate authority, just cause, and right intention."},{name:"Hobbes",claim:"Without a common power, men are in a war of all against all; peace requires the sovereign."},{name:"Kant",claim:"Proposes 'perpetual peace' through republican constitutions and a federation of free states under law."}],topics:["The nature and causes of war","The state of war","Just and unjust war","War and human nature","The ends of war","Peace as the tranquillity of order","The possibility of perpetual peace","War among nations and international law"],key_texts:[{text:"Thucydides, History of the Peloponnesian War",when:"c. 400 BC"},{text:"Augustine, City of God XIX",when:"413-426 AD"},{text:"Aquinas, Summa Theologica II-II Q.40",when:"1265-1274"},{text:"Hobbes, Leviathan I",when:"1651"},{text:"Kant, Perpetual Peace",when:"1795"}],example:"Kant argued that republics, whose citizens bear war's costs, would tend toward peace\u2014sketching a federation of free states as the road to ending war.",related:["justice","state","government"],hook:"Organized violence, and its end.",quotes:[{text:"The strong do what they can and the weak suffer what they must.",who:"Thucydides",work:"History V",when:"c. 400 BC",context:"From the Melian Dialogue, where Athens demands surrender from a neutral island. Thucydides reports it without comment; the Athenians who reason this way are destroyed in Sicily soon after."}]},{id:"wealth",name:"Wealth",cluster:"polis",gist:"The possession and production of external goods.",framing:"Wealth is the abundance of goods and money -- the material means of life and power. What wealth is, how it is rightly acquired and used, and its place in the good life and the just society are questions of economics and ethics alike.",senses:["An abundance of useful goods and property","Money or riches (a store of exchangeable value)","Natural wealth (goods for use) vs. artificial (money-making for its own sake)","Wealth as a means to the good life vs. as an end in itself"],disputes:[{q:"Is the pursuit of wealth natural and good, or corrupting?",sides:[{view:"Providing the means of life is natural and limited; unlimited money-making is unnatural",who:"Aristotle"},{view:"The pursuit of wealth through exchange enriches all",who:"Adam Smith"}]},{q:"What is the source and measure of wealth?",sides:[{view:"The labor embodied in goods",who:"Smith, Ricardo, Marx"},{view:"Money and gold",who:"the mercantilists"}]},{q:"How should wealth be distributed?",sides:[{view:"By merit and law, through free exchange",who:"Smith and the classical liberals"},{view:"Private accumulation is theft from labor -- abolish private property",who:"Marx"}]}],positions:[{name:"Aristotle",claim:"Distinguishes natural, limited household provision from unlimited money-making; condemns usury."},{name:"Adam Smith",claim:"Wealth is the annual produce of a nation's labor; free exchange, guided by an 'invisible hand,' increases it for all."},{name:"Marx",claim:"Capitalist wealth is accumulated from the surplus value of unpaid labor; private property should be abolished."},{name:"The Gospels",claim:"Warn of the love of money as a root of evils, and of how hard it is for the rich to enter the kingdom."}],topics:["The nature of wealth","The acquisition of wealth (natural and unnatural)","Money and exchange","Wealth as means or end","The source and measure of value","The distribution of wealth","Wealth and the good life","Wealth, poverty, and justice"],key_texts:[{text:"Aristotle, Politics I; Nicomachean Ethics",when:"c. 340 BC"},{text:"Adam Smith, The Wealth of Nations",when:"1776"},{text:"Marx, Capital",when:"1867"},{text:"the Gospels (on riches)",when:"c. 65-100 AD"}],example:"Aristotle warned against chrematistics\u2014wealth-seeking with no natural limit\u2014since money, unlike food or shelter, tempts us to pursue it endlessly for its own sake.",related:["labor","justice","happiness"],hook:"External goods, made and held.",quotes:[{text:"Led by an invisible hand.",who:"Adam Smith",work:"The Wealth of Nations IV",when:"1776",context:"Used once, and modestly: a merchant preferring domestic industry for his own security promotes an end he did not intend. Smith, a moral philosopher, was not claiming markets are always self-correcting."}]},{id:"will",name:"Will",cluster:"good",gist:"The power of rational choice and self-determination.",framing:"The will is the power of rational choice -- by which we decide, consent, and commit ourselves to act. Whether the will is free, how it relates to reason and desire, and whether it can choose against the good are pivotal questions for ethics and theology.",senses:["Rational appetite (the desire that follows reason's judgment)","The power of free choice (liberum arbitrium)","Sheer volition or self-determination","The will as distinct from -- and sometimes opposed to -- the intellect"],disputes:[{q:"Is the will free?",sides:[{view:"Yes -- we are the undetermined authors of our choices",who:"the libertarians"},{view:"No -- the will is determined by motives, causes, or God",who:"the determinists"},{view:"Freedom is acting from one's own nature without compulsion",who:"the compatibilists"}]},{q:"Does intellect or will have primacy?",sides:[{view:"The will follows the intellect's judgment of the good",who:"Aquinas (intellectualism)"},{view:"The will is the higher, freer power",who:"Scotus (voluntarism)"}]},{q:"Can the will choose evil knowingly?",sides:[{view:"No -- we will only under the aspect of good",who:"the classical view"},{view:"Yes -- the will can perversely reject the known good",who:"Augustine on sin"}]}],positions:[{name:"Augustine",claim:"The will is free but, since the Fall, in bondage to sin, needing grace to will the good rightly."},{name:"Aquinas",claim:"The will is rational appetite; it necessarily seeks the good in general but is free as to particular goods."},{name:"Scotus",claim:"The will is self-determining and, in a sense, superior to the intellect (voluntarism)."},{name:"Kant",claim:"A free, autonomous will legislating the moral law to itself is the ground of morality."},{name:"Schopenhauer",claim:"Will is the blind, striving essence of the world, of which intellect is only the servant."}],topics:["The nature of the will","Will and reason","Will and desire","Free will and determinism","Freedom and grace","The primacy of will or intellect","Weakness of will","The will and the good"],key_texts:[{text:"Augustine, On Free Choice of the Will",when:"c. 395 AD"},{text:"Aquinas, Summa Theologica I QQ.82-83; I-II QQ.6-17",when:"1265-1274"},{text:"Kant, Groundwork; Critique of Practical Reason",when:"1788"},{text:"Schopenhauer, The World as Will and Representation",when:"1818"}],example:"Augustine agonizes that he commands his hand and it obeys, yet commands his will and it resists\u2014the self strangely unable to simply will what it wills.",related:["liberty","desire","duty"],hook:"The power of rational choice.",quotes:[{text:"Grant what you command, and command what you will.",who:"Augustine",work:"Confessions X",when:"c. 400 AD",context:"The prayer that provoked the Pelagian controversy. If we cannot obey without grace, is the will free? Augustine's answer -- that grace frees rather than overrides -- shapes the debate for centuries."}]},{id:"wisdom",name:"Wisdom",cluster:"mind",gist:"Knowledge of the highest things, and how to live.",framing:"Wisdom is the highest knowledge -- of first causes and of how to live well. It unites the theoretical grasp of ultimate things with the practical mastery of conduct, and is the very end that philosophy loves.",senses:["Theoretical wisdom (sophia -- of first principles and highest things)","Practical wisdom (phronesis or prudence -- knowing how to act)","Wisdom as a gift of God (in Scripture)","Wisdom vs. mere cleverness or learning"],disputes:[{q:"Is wisdom theoretical or practical?",sides:[{view:"Contemplation of the highest truths is its peak",who:"Aristotle"},{view:"Wisdom is chiefly knowing how to live",who:"the Stoics, practical traditions"}]},{q:"Is wisdom human or divine?",sides:[{view:"The philosopher can attain it",who:"the Aristotelian view"},{view:"Only God is wise; humans merely love wisdom",who:"Socrates"}]},{q:"Can wisdom be taught?",sides:[{view:"It can be cultivated and learned",who:"the schools"},{view:"Even the wise cannot simply transmit it",who:"the Socratic doubt"}]}],positions:[{name:"Socrates",claim:"Knows that he knows nothing; human wisdom begins in recognizing one's own ignorance."},{name:"Aristotle",claim:"Distinguishes theoretical wisdom (of first causes) from practical wisdom (right deliberation about action)."},{name:"The Stoics",claim:"The sage is wholly governed by reason and virtue, indifferent to fortune."},{name:"Aquinas",claim:"Wisdom judges all things by the highest cause, God; it is both a virtue and a gift."}],topics:["The nature of wisdom","Theoretical vs. practical wisdom","Wisdom and the first causes","Wisdom and virtue","Human vs. divine wisdom","The wise man or sage","Wisdom and philosophy","Whether wisdom can be taught"],key_texts:[{text:"Plato, Apology",when:"c. 399 BC"},{text:"Aristotle, Nicomachean Ethics VI; Metaphysics I",when:"c. 340 BC"},{text:"Proverbs; Ecclesiastes",when:"c. 3rd century BC"},{text:"Aquinas, Summa Theologica II-II Q.45",when:"1265-1274"}],example:"The oracle called Socrates wisest, and he agreed only in this: others thought they knew what they didn't, while he alone knew the extent of his own ignorance.",related:["knowledge","philosophy","prudence"],hook:"Knowing the highest things, and how to live.",quotes:[{text:"I know that I know nothing.",who:"Socrates",work:"Plato, Apology",when:"399 BC",context:"His gloss on the oracle that called him wisest. He knows less than he is credited with, but unlike others he knows that -- human wisdom begins in recognizing the limits of one's knowledge."}]},{id:"world",name:"World",cluster:"being",gist:"The ordered whole of all that is.",framing:"The world is the ordered whole of all that is -- the cosmos. Ideas about it swing between order and chaos, eternity and creation, one world or many, and whether it is intelligible, good, and made for a purpose.",senses:["The physical universe or cosmos","An ordered whole (kosmos = order)","The totality of finite things, as against God","The plurality of worlds"],disputes:[{q:"Did the world have a beginning?",sides:[{view:"The world is eternal",who:"Aristotle"},{view:"The world was created and began",who:"Augustine, Aquinas"},{view:"Reason cannot decide (antinomy)",who:"Kant"}]},{q:"Is there one world or many?",sides:[{view:"One unique, finite cosmos",who:"Aristotle, Ptolemy"},{view:"Infinitely many worlds",who:"atomists, Bruno"}]},{q:"Is the world ordered by design or chance?",sides:[{view:"The cosmos is a work of intelligence and providence",who:"Plato, Stoics, theists"},{view:"Order arises from the chance motion of atoms",who:"Democritus, Epicurus"}]}],positions:[{name:"Plato",claim:"The Timaeus depicts a craftsman shaping the cosmos on eternal models -- an ordered, ensouled whole."},{name:"Aristotle",claim:"One eternal, finite cosmos, moved from beyond by the unmoved mover."},{name:"Lucretius",claim:"Infinite worlds form and dissolve by the chance concourse of atoms."},{name:"Augustine",claim:"God freely created the world, and time with it, out of nothing."},{name:"Kant",claim:"The world-whole is an idea of reason; claims about its bounds fall into antinomies."}],topics:["The world as ordered whole","The origin of the world (eternity vs. creation)","The plurality of worlds","The order and design of the cosmos","The world-soul","The extent and shape of the universe","The end or destiny of the world","The world and God"],key_texts:[{text:"Plato, Timaeus",when:"c. 360 BC"},{text:"Aristotle, On the Heavens",when:"c. 350 BC"},{text:"Lucretius, On the Nature of Things",when:"c. 55 BC"},{text:"Augustine, City of God XI-XII",when:"413-426 AD"},{text:"Kant, Critique of Pure Reason (Antinomies)",when:"1781"}],example:"Plato's Timaeus depicts the cosmos as the work of a craftsman shaping chaos toward the good\u2014the world as ordered artifact, not random heap.",related:["nature","astronomy","god"],hook:"All that is, as one order.",quotes:[{text:"The best of all possible worlds.",who:"Leibniz",work:"Theodicy",when:"1710",context:"Not a claim that nothing is bad. A perfect God choosing among possible worlds must choose the one whose overall richness and order is greatest -- which may require particular evils. Voltaire's Candide mocks the doctrine rather than refuting it."}]}],people:{"Adam Smith":{name:"Adam Smith",dates:"1723 \u2013 1790",era:"Enlightenment",role:"Scottish moral philosopher and political economist",note:"Founded modern economics, showing how the division of labor and free exchange, guided as if by an invisible hand, enlarge a nation's wealth.",works:"The Wealth of Nations (1776); The Theory of Moral Sentiments (1759)",sortYear:1723},Anaxagoras:{name:"Anaxagoras",dates:"c. 500 \u2013 c. 428 BC",era:"Pre-Socratic Greece",role:"Greek philosopher active at Athens",note:"Introduced Mind (nous) as the ordering principle that sets an original mixture in motion -- the first appeal to intelligence as a cosmic cause.",works:"On Nature (fragments)",sortYear:-500},Anselm:{name:"Anselm of Canterbury",dates:"1033 \u2013 1109",era:"Medieval",role:"Benedictine monk, Archbishop of Canterbury",note:"Coined 'faith seeking understanding' and devised the ontological argument, reasoning from the concept of God to God's existence.",works:"Proslogion; Monologion",sortYear:1033},Aquinas:{name:"Thomas Aquinas",dates:"1225 \u2013 1274",era:"Medieval",role:"Dominican friar and theologian at Paris and Naples",note:"Synthesized Aristotle with Christian doctrine, holding faith and reason distinct but harmonious. His treatment of law, virtue, God and the soul is the tradition's most systematic.",works:"Summa Theologica; Summa Contra Gentiles; On Kingship",sortYear:1225},Archimedes:{name:"Archimedes",dates:"c. 287 \u2013 c. 212 BC",era:"Hellenistic Greece",role:"Greek mathematician and engineer of Syracuse",note:"Founded statics and hydrostatics -- the law of the lever and the principle of buoyancy -- uniting mathematics with physical machines.",works:"On the Equilibrium of Planes; On Floating Bodies",sortYear:-287},Aristotle:{name:"Aristotle",dates:"384 \u2013 322 BC",era:"Classical Greece",role:"Greek philosopher, student of Plato, tutor of Alexander",note:"Brought the Forms down into things as their form and end, and founded logic, biology and systematic ethics and politics. The single most-cited voice in the tradition.",works:"Metaphysics; Physics; Nicomachean Ethics; Politics; On the Soul; Poetics",sortYear:-384},Augustine:{name:"Augustine of Hippo",dates:"354 \u2013 430 AD",era:"Early Christianity",role:"Bishop of Hippo, Church Father",note:"Fused Platonism with Christianity, made the inward self a philosophical subject, and framed evil as privation, time as a puzzle of the soul, and history as two cities.",works:"Confessions; City of God; On Free Choice of the Will",sortYear:354},Austin:{name:"John Austin",dates:"1790 \u2013 1859",era:"Modern",role:"English legal philosopher",note:"Founded legal positivism: law is the command of a sovereign backed by sanction, and its existence is one thing, its merit another.",works:"The Province of Jurisprudence Determined (1832)",sortYear:1790},Bacon:{name:"Francis Bacon",dates:"1561 \u2013 1626",era:"Scientific Revolution",role:"English statesman and philosopher of science",note:"Called for a new method of systematic observation and induction, so that knowledge might extend human power -- nature is commanded by being obeyed.",works:"Novum Organum (1620); The Advancement of Learning",sortYear:1561},Beccaria:{name:"Cesare Beccaria",dates:"1738 \u2013 1794",era:"Enlightenment",role:"Italian jurist and criminal-law reformer",note:"Argued punishment is justified only to deter, should be the mildest sufficient, prompt and certain -- and never capital.",works:"On Crimes and Punishments (1764)",sortYear:1738},Bentham:{name:"Jeremy Bentham",dates:"1748 \u2013 1832",era:"Modern",role:"English jurist and founder of utilitarianism",note:"Made the greatest happiness of the greatest number the standard of law and morals, and proposed to measure pleasures and pains directly.",works:"An Introduction to the Principles of Morals and Legislation (1789)",sortYear:1748},Berkeley:{name:"George Berkeley",dates:"1685 \u2013 1753",era:"Enlightenment",role:"Irish philosopher and Anglican bishop",note:"Denied matter altogether: sensible things are collections of ideas, and to be is to be perceived.",works:"A Treatise Concerning the Principles of Human Knowledge (1710)",sortYear:1685},Boethius:{name:"Boethius",dates:"c. 477 \u2013 524 AD",era:"Late Antiquity",role:"Roman senator and philosopher, executed for treason",note:"Wrote in prison the Consolation of Philosophy, whose solution to foreknowledge and freedom -- that God sees all time at once -- became standard.",works:"The Consolation of Philosophy",sortYear:477},Bradley:{name:"F. H. Bradley",dates:"1846 \u2013 1924",era:"Modern",role:"English idealist philosopher at Oxford",note:"Located moral obligation concretely in 'my station and its duties' rather than in abstract rules.",works:"Ethical Studies (1876); Appearance and Reality (1893)",sortYear:1846},Burke:{name:"Edmund Burke",dates:"1729 \u2013 1797",era:"Enlightenment",role:"Anglo-Irish statesman and political writer",note:"Founded modern conservatism by defending custom and prescription as the accumulated wisdom of generations against abstract revolutionary reason.",works:"Reflections on the Revolution in France (1790)",sortYear:1729},Cantor:{name:"Georg Cantor",dates:"1845 \u2013 1918",era:"Modern",role:"German mathematician",note:"Made the actual infinite mathematically respectable, proving there are different sizes of infinity and founding set theory.",works:"Contributions to the Founding of the Theory of Transfinite Numbers (1895)",sortYear:1845},Carnap:{name:"Rudolf Carnap",dates:"1891 \u2013 1970",era:"Modern",role:"German-American philosopher of the Vienna Circle",note:"Held that metaphysical statements are literally meaningless because unverifiable, and sought to rebuild knowledge on logic and observation.",works:"The Logical Structure of the World (1928)",sortYear:1891},Cicero:{name:"Cicero",dates:"106 \u2013 43 BC",era:"Roman Republic",role:"Roman statesman, orator and philosopher",note:"Transmitted Greek philosophy to Rome and to the Latin West, and gave the natural-law tradition its classic statement: one eternal law, the same for all peoples.",works:"On Duties; On the Laws; On the Commonwealth",sortYear:-106},"Claude Bernard":{name:"Claude Bernard",dates:"1813 \u2013 1878",era:"Modern",role:"French physiologist",note:"Founded experimental medicine, insisting on controlled experiment and the constancy of the body's internal environment.",works:"Introduction to the Study of Experimental Medicine (1865)",sortYear:1813},Comte:{name:"Auguste Comte",dates:"1798 \u2013 1857",era:"Modern",role:"French philosopher, founder of positivism and sociology",note:"Held that humanity passes through theological, metaphysical and positive stages, and that science alone yields real knowledge.",works:"Course of Positive Philosophy (1830-42)",sortYear:1798},Condorcet:{name:"Marquis de Condorcet",dates:"1743 \u2013 1794",era:"Enlightenment",role:"French mathematician and revolutionary",note:"Wrote, while in hiding from the Terror, the classic statement of the indefinite perfectibility of the human mind.",works:"Sketch for a Historical Picture of the Progress of the Human Mind (1795)",sortYear:1743},Copernicus:{name:"Nicolaus Copernicus",dates:"1473 \u2013 1543",era:"Scientific Revolution",role:"Polish astronomer and canon",note:"Placed the sun at the center and set the earth in motion, beginning the revolution that displaced humanity from the middle of the cosmos.",works:"On the Revolutions of the Heavenly Spheres (1543)",sortYear:1473},Darwin:{name:"Charles Darwin",dates:"1809 \u2013 1882",era:"Modern",role:"English naturalist",note:"Explained the diversity of life by descent with modification through natural selection, and placed man within the same continuum as the other animals.",works:"On the Origin of Species (1859); The Descent of Man (1871)",sortYear:1809},Democritus:{name:"Democritus",dates:"c. 460 \u2013 c. 370 BC",era:"Pre-Socratic Greece",role:"Greek philosopher, co-founder of atomism",note:"With Leucippus held that all that exists is atoms moving in the void, and that sensible qualities like color and sweetness are conventions rather than features of things.",works:"fragments only",sortYear:-460},Descartes:{name:"Rene Descartes",dates:"1596 \u2013 1650",era:"Early Modern",role:"French philosopher, mathematician and scientist",note:"Rebuilt knowledge from the one thing he could not doubt -- that he was thinking -- and split reality into thinking mind and extended matter.",works:"Discourse on Method (1637); Meditations on First Philosophy (1641)",sortYear:1596},Dewey:{name:"John Dewey",dates:"1859 \u2013 1952",era:"Modern",role:"American pragmatist philosopher and educational reformer",note:"Treated experience as the organism's active transaction with its environment, and education as growth through doing rather than absorbing.",works:"Democracy and Education (1916); Experience and Nature (1925)",sortYear:1859},Empedocles:{name:"Empedocles",dates:"c. 494 \u2013 c. 434 BC",era:"Pre-Socratic Greece",role:"Greek philosopher and poet of Acragas",note:"Proposed the four roots -- earth, air, fire, water -- mixed and separated by Love and Strife, an early attempt to explain change without denying being.",works:"On Nature; Purifications",sortYear:-494},Epicurus:{name:"Epicurus",dates:"341 \u2013 270 BC",era:"Hellenistic Greece",role:"Greek philosopher, founder of the Garden at Athens",note:"Taught an atomism with a swerve to save freedom, and a hedonism aimed at tranquility -- freedom from bodily pain and mental disturbance, not indulgence.",works:"Letter to Menoeceus; Principal Doctrines",sortYear:-341},Euclid:{name:"Euclid",dates:"fl. c. 300 BC",era:"Hellenistic Greece",role:"Greek mathematician at Alexandria",note:"His Elements organized geometry into definitions, postulates and demonstrations, and became the model of rigorous knowledge for two thousand years.",works:"Elements",sortYear:-300},"Frege and Russell":{name:"Gottlob Frege & Bertrand Russell",dates:"1848\u20131925; 1872\u20131970",era:"Modern",role:"German logician and British philosopher",note:"Recast logic in symbolic form capable of expressing relations and generality, vastly extending what Aristotle's syllogism could capture.",works:"Frege, Begriffsschrift (1879); Russell & Whitehead, Principia Mathematica (1910-13)",sortYear:1848},Freud:{name:"Sigmund Freud",dates:"1856 \u2013 1939",era:"Modern",role:"Austrian neurologist, founder of psychoanalysis",note:"Made the unconscious central to mind, traced love to the sexual drive sublimated into higher aims, and read religion as illusion.",works:"The Interpretation of Dreams (1900); Civilization and Its Discontents (1930)",sortYear:1856},Galen:{name:"Galen",dates:"129 \u2013 c. 216 AD",era:"Roman Empire",role:"Greek physician to the imperial court",note:"Systematized the medicine of the humors, whose balance is health; his authority dominated medicine until the Renaissance.",works:"On the Natural Faculties",sortYear:129},Galileo:{name:"Galileo Galilei",dates:"1564 \u2013 1642",era:"Scientific Revolution",role:"Italian astronomer, physicist and mathematician",note:"Turned the telescope on the heavens and mathematized motion, insisting nature's book is written in mathematics. Condemned by the Inquisition in 1633.",works:"Dialogue Concerning the Two Chief World Systems (1632); Two New Sciences (1638)",sortYear:1564},Hegel:{name:"G. W. F. Hegel",dates:"1770 \u2013 1831",era:"Modern",role:"German idealist philosopher at Berlin",note:"Made contradiction the engine of development, and read history as the progressive self-realization of freedom in the consciousness of Spirit.",works:"Phenomenology of Spirit (1807); Philosophy of Right (1821)",sortYear:1770},Heraclitus:{name:"Heraclitus",dates:"c. 535 \u2013 c. 475 BC",era:"Pre-Socratic Greece",role:"Philosopher of Ephesus, called 'the obscure'",note:"Taught that all things flow and that strife is the father of all -- reality is process, held together by an underlying logos. The great ancient champion of change against Parmenides.",works:"On Nature (surviving in fragments)",sortYear:-535},Hippocrates:{name:"Hippocrates",dates:"c. 460 \u2013 c. 370 BC",era:"Classical Greece",role:"Greek physician, 'father of medicine'",note:"Insisted diseases have natural rather than divine causes and that the physician assists nature; his name attaches to the oath binding doctors to do no harm.",works:"Airs, Waters, Places; Aphorisms; the Hippocratic Oath",sortYear:-460},Hobbes:{name:"Thomas Hobbes",dates:"1588 \u2013 1679",era:"Early Modern",role:"English philosopher, writing through the Civil War",note:"Derived politics from matter in motion and appetite: without a common power life is solitary, poor, nasty, brutish and short, so men covenant to erect an absolute sovereign.",works:"Leviathan (1651); De Cive",sortYear:1588},Horace:{name:"Horace",dates:"65 \u2013 8 BC",era:"Roman Empire",role:"Roman lyric poet and critic",note:"His verse letter on poetry gave later ages the formula that the poet aims to instruct and to delight, and the demand for disciplined craft.",works:"Ars Poetica; Odes",sortYear:-65},Hume:{name:"David Hume",dates:"1711 \u2013 1776",era:"Enlightenment",role:"Scottish philosopher and historian",note:"Traced all ideas to impressions, showed that no reasoning justifies our expectation that the future will resemble the past, and made custom the great guide of life.",works:"A Treatise of Human Nature (1739); Enquiry Concerning Human Understanding (1748)",sortYear:1711},James:{name:"William James",dates:"1842 \u2013 1910",era:"Modern",role:"American philosopher and psychologist",note:"Founded pragmatism -- an idea is true insofar as it works -- and treated religion by its fruits in lived experience.",works:"The Principles of Psychology (1890); Pragmatism (1907); Varieties of Religious Experience (1902)",sortYear:1842,aliasOf:"William James"},Jefferson:{name:"Thomas Jefferson",dates:"1743 \u2013 1826",era:"Enlightenment",role:"American statesman, third president",note:"Drafted the Declaration of Independence and distinguished a natural aristocracy of virtue and talent from an artificial one of birth and wealth.",works:"Declaration of Independence (1776); Notes on the State of Virginia",sortYear:1743},Kant:{name:"Immanuel Kant",dates:"1724 \u2013 1804",era:"Enlightenment",role:"Prussian philosopher at Konigsberg",note:"Argued the mind supplies the forms that make experience possible, limiting knowledge to appearances, and grounded morality in a categorical imperative binding rational wills.",works:"Critique of Pure Reason (1781); Groundwork (1785); Critique of Judgment (1790)",sortYear:1724},Kepler:{name:"Johannes Kepler",dates:"1571 \u2013 1630",era:"Scientific Revolution",role:"German astronomer and mathematician",note:"Replaced circles with ellipses and found the laws of planetary motion, completing the Copernican revolution mathematically.",works:"New Astronomy (1609); Harmonices Mundi (1619)",sortYear:1571},Lamarck:{name:"Jean-Baptiste Lamarck",dates:"1744 \u2013 1829",era:"Modern",role:"French naturalist",note:"Proposed the first systematic theory of evolution, driven by use, disuse and the inheritance of acquired characteristics.",works:"Zoological Philosophy (1809)",sortYear:1744},Laplace:{name:"Pierre-Simon Laplace",dates:"1749 \u2013 1827",era:"Modern",role:"French mathematician and astronomer",note:"Pushed mechanical determinism to its limit: an intelligence knowing all forces and positions could see the whole future -- and had no need of the hypothesis of God.",works:"Celestial Mechanics; A Philosophical Essay on Probabilities (1814)",sortYear:1749},"Later methodologists":{name:"Later philosophers of science",dates:"20th century",era:"Modern",role:"Popper, Kuhn, Lakatos and others",note:"Argued science advances not by simple induction but by proposing bold conjectures and testing them severely against experience.",works:"",sortYear:1950},Lavoisier:{name:"Antoine Lavoisier",dates:"1743 \u2013 1794",era:"Scientific Revolution",role:"French chemist, guillotined in the Terror",note:"Overturned phlogiston, named oxygen, and established that matter is conserved through chemical change -- founding modern chemistry.",works:"Elements of Chemistry (1789)",sortYear:1743},Leibniz:{name:"Gottfried Wilhelm Leibniz",dates:"1646 \u2013 1716",era:"Early Modern",role:"German philosopher, mathematician and diplomat",note:"Co-invented the calculus and argued that nothing is without a sufficient reason, that substance is force, and that this is the best of all possible worlds.",works:"Monadology (1714); Theodicy (1710); New Essays",sortYear:1646},Locke:{name:"John Locke",dates:"1632 \u2013 1704",era:"Early Modern",role:"English philosopher and physician",note:"Denied innate ideas, deriving all knowledge from experience, and grounded government in consent and the protection of life, liberty and property.",works:"Essay Concerning Human Understanding (1689); Two Treatises of Government (1689)",sortYear:1632},Lucretius:{name:"Lucretius",dates:"c. 99 \u2013 c. 55 BC",era:"Roman Republic",role:"Roman poet and Epicurean",note:"Put Epicurus into verse to free men from fear of gods and death, arguing the soul is atoms that scatter -- so death is nothing to us.",works:"On the Nature of Things",sortYear:-99},Machiavelli:{name:"Niccolo Machiavelli",dates:"1469 \u2013 1527",era:"Renaissance",role:"Florentine diplomat and political writer",note:"Severed political prudence from Christian virtue, asking what actually preserves a state rather than what ought to.",works:"The Prince; Discourses on Livy",sortYear:1469},Maimonides:{name:"Moses Maimonides",dates:"1138 \u2013 1204",era:"Medieval",role:"Jewish philosopher, jurist and physician of Cordoba and Cairo",note:"Guarded God's transcendence by insisting we can say only what God is not, and treated prophecy as a natural perfection of intellect and imagination.",works:"Guide for the Perplexed; Mishneh Torah",sortYear:1138},Marx:{name:"Karl Marx",dates:"1818 \u2013 1883",era:"Modern",role:"German economist, historian and revolutionary",note:"Read history as driven by material conditions and class struggle, and analyzed capitalist wealth as accumulated surplus taken from labor.",works:"The Communist Manifesto (1848); Capital (1867)",sortYear:1818},Michels:{name:"Robert Michels",dates:"1876 \u2013 1936",era:"Modern",role:"German-Italian sociologist",note:"Formulated the iron law of oligarchy: even avowedly democratic organizations tend to fall under the control of a few.",works:"Political Parties (1911)",sortYear:1876},Mill:{name:"John Stuart Mill",dates:"1806 \u2013 1873",era:"Modern",role:"English philosopher, economist and MP",note:"Refined utilitarianism by ranking higher pleasures above lower, and defended liberty on the ground that society may restrain us only to prevent harm to others.",works:"On Liberty (1859); Utilitarianism (1863); A System of Logic (1843)",sortYear:1806},Milton:{name:"John Milton",dates:"1608 \u2013 1674",era:"Early Modern",role:"English poet and republican polemicist",note:"Dramatized the fall of angels and men, and argued in prose for free speech and the liberty of conscience.",works:"Paradise Lost (1667); Areopagitica (1644)",sortYear:1608},"Modern liberalism":{name:"Modern liberalism",dates:"17th century \u2013 present",era:"Modern",role:"The tradition running from Locke through Mill and beyond",note:"Holds that individuals possess rights prior to the state, which exists to secure them and is limited by them.",works:"",sortYear:1650},Montaigne:{name:"Michel de Montaigne",dates:"1533 \u2013 1592",era:"Renaissance",role:"French essayist and magistrate",note:"Invented the essay as self-examination, using the diversity of human customs to puncture the assumption that our own habits are nature's law.",works:"Essays (1580)",sortYear:1533},Montesquieu:{name:"Montesquieu",dates:"1689 \u2013 1755",era:"Enlightenment",role:"French judge and political philosopher",note:"Classified governments by their animating principles and argued liberty depends on separating legislative, executive and judicial power.",works:"The Spirit of the Laws (1748)",sortYear:1689},Newton:{name:"Isaac Newton",dates:"1643 \u2013 1727",era:"Scientific Revolution",role:"English mathematician and physicist",note:"United heaven and earth under three laws of motion and universal gravitation, and professed to frame no hypotheses beyond the phenomena.",works:"Principia Mathematica (1687); Opticks (1704)",sortYear:1643},Ockham:{name:"William of Ockham",dates:"c. 1287 \u2013 1347",era:"Medieval",role:"Franciscan friar and logician",note:"Denied that universals exist outside the mind and urged that explanations not multiply entities beyond necessity -- the razor that bears his name.",works:"Summa Logicae",sortYear:1287},Parmenides:{name:"Parmenides",dates:"c. 515 \u2013 c. 450 BC",era:"Pre-Socratic Greece",role:"Philosopher of Elea, founder of the Eleatic school",note:"Argued that being simply is -- ungenerated, indivisible, unchanging -- and that change and plurality are illusions of the senses. Sets the permanence side of the tradition's oldest quarrel.",works:"On Nature (a philosophical poem)",sortYear:-515},Pascal:{name:"Blaise Pascal",dates:"1623 \u2013 1662",era:"Early Modern",role:"French mathematician, physicist and religious thinker",note:"Founded probability theory, then turned to defending faith -- portraying man as a thinking reed, wretched and great, suspended between beast and angel.",works:"Pensees (1670); Provincial Letters",sortYear:1623},Pelagius:{name:"Pelagius",dates:"c. 354 \u2013 c. 420 AD",era:"Early Christianity",role:"British-born monk and theologian",note:"Denied inherited sin and insisted the will is free to keep God's law -- the position against which Augustine defined original sin and grace.",works:"condemned 418; writings largely lost",sortYear:354},"Pico della Mirandola":{name:"Pico della Mirandola",dates:"1463 \u2013 1494",era:"Renaissance",role:"Italian humanist philosopher",note:"His Oration made man the one creature without a fixed nature, free to shape himself toward beast or angel -- the manifesto of Renaissance humanism.",works:"Oration on the Dignity of Man",sortYear:1463},Plato:{name:"Plato",dates:"c. 428 \u2013 c. 348 BC",era:"Classical Greece",role:"Athenian philosopher, student of Socrates, founder of the Academy",note:"Held that the changing things we see imitate eternal Forms, knowable by reason. His dialogues set the agenda for nearly every idea in this index.",works:"Republic; Phaedo; Symposium; Timaeus; Theaetetus; Laws",sortYear:-428},Plotinus:{name:"Plotinus",dates:"c. 204 \u2013 270 AD",era:"Roman Empire",role:"Founder of Neoplatonism",note:"Derived all reality by emanation from a single ineffable One, through Intellect and Soul -- the bridge between Plato and Christian theology.",works:"Enneads",sortYear:204},Polybius:{name:"Polybius",dates:"c. 200 \u2013 c. 118 BC",era:"Hellenistic Greece",role:"Greek historian taken hostage to Rome",note:"Explained Rome's success by its mixed constitution, balancing consuls, senate and people, and described the cycle by which constitutions decay.",works:"The Histories (Book VI)",sortYear:-200},Protagoras:{name:"Protagoras",dates:"c. 490 \u2013 c. 420 BC",era:"Classical Greece",role:"The most famous of the Sophists",note:"His dictum that man is the measure of all things made him the ancestor of relativism, and Plato's recurring opponent on truth and knowledge.",works:"Truth; On the Gods (fragments)",sortYear:-490},"Pseudo-Dionysius":{name:"Pseudo-Dionysius",dates:"c. 500 AD",era:"Late Antiquity",role:"Anonymous Syrian theologian writing under an apostolic name",note:"Set out the celestial hierarchy of angels and the negative way of speaking about God, shaping medieval mysticism.",works:"The Celestial Hierarchy; The Divine Names",sortYear:500},Ptolemy:{name:"Ptolemy",dates:"c. 100 \u2013 c. 170 AD",era:"Roman Empire",role:"Greek astronomer and geographer at Alexandria",note:"His geocentric system of epicycles predicted the planets accurately enough to govern astronomy for fourteen centuries.",works:"Almagest",sortYear:100},Quintilian:{name:"Quintilian",dates:"c. 35 \u2013 c. 100 AD",era:"Roman Empire",role:"Roman rhetorician and teacher",note:"Defined the orator as the good man skilled in speaking, binding eloquence inseparably to character and civic duty.",works:"Institutes of Oratory",sortYear:35},Rawls:{name:"John Rawls",dates:"1921 \u2013 2002",era:"Contemporary",role:"American political philosopher at Harvard",note:"Revived systematic political philosophy with justice as fairness -- principles chosen behind a veil of ignorance. A modern extension beyond Adler's 1952 set.",works:"A Theory of Justice (1971)",sortYear:1921},Rousseau:{name:"Jean-Jacques Rousseau",dates:"1712 \u2013 1778",era:"Enlightenment",role:"Genevan philosopher and novelist",note:"Held that man is born free yet is everywhere in chains, that legitimate rule expresses the general will, and that civilization has corrupted natural goodness.",works:"The Social Contract (1762); Emile (1762); Discourse on Inequality (1755)",sortYear:1712},Russell:{name:"Bertrand Russell",dates:"1872 \u2013 1970",era:"Modern",role:"British philosopher, logician and public intellectual",note:"Helped found modern logic and analytic philosophy, and argued much traditional metaphysics dissolves under logical analysis.",works:"Principia Mathematica (1910-13); The Problems of Philosophy (1912)",sortYear:1872},Schopenhauer:{name:"Arthur Schopenhauer",dates:"1788 \u2013 1860",era:"Modern",role:"German philosopher",note:"Held that behind appearances lies a blind, striving Will, of which the intellect is merely the servant -- the root of philosophical pessimism.",works:"The World as Will and Representation (1818)",sortYear:1788},Scotus:{name:"John Duns Scotus",dates:"c. 1266 \u2013 1308",era:"Medieval",role:"Franciscan theologian, 'the Subtle Doctor'",note:"Argued for the primacy of the will over intellect, and coined 'thisness' (haecceity) as the principle making each individual uniquely itself.",works:"Ordinatio",sortYear:1266},Sidney:{name:"Philip Sidney",dates:"1554 \u2013 1586",era:"Renaissance",role:"English poet, courtier and soldier",note:"Defended poetry as teaching virtue more movingly than philosophy or history, by joining precept to living example.",works:"A Defence of Poesie",sortYear:1554},Socrates:{name:"Socrates",dates:"c. 470 \u2013 399 BC",era:"Classical Greece",role:"Athenian philosopher, executed by the city",note:"Wrote nothing, but by relentless questioning turned philosophy toward how one ought to live. His claim that virtue is knowledge, and that he knew only his own ignorance, shapes everything after.",works:"known through Plato and Xenophon",sortYear:-470},Spinoza:{name:"Baruch Spinoza",dates:"1632 \u2013 1677",era:"Early Modern",role:"Dutch philosopher, expelled from his synagogue",note:"Identified God with Nature -- one infinite substance -- and treated the emotions as following necessary laws, so that freedom comes through understanding.",works:"Ethics (1677); Theologico-Political Treatise (1670)",sortYear:1632},"The Federalist":{name:"The Federalist authors",dates:"1787 \u2013 1788",era:"Modern",role:"Alexander Hamilton, James Madison and John Jay",note:"Argued for the proposed U.S. Constitution, showing how checks, balances and an extended republic could restrain both tyranny and majority faction.",works:"The Federalist Papers (1788)",sortYear:1787},"The Gospels":{name:"The Gospels",dates:"c. 65 \u2013 100 AD",era:"Early Christianity",role:"The four canonical accounts of the life of Jesus",note:"Their teaching on love, poverty and the kingdom reshaped Western thought about charity, wealth, humility and the neighbor.",works:"Matthew; Mark; Luke; John",sortYear:65},"The Romans":{name:"The Roman jurists",dates:"c. 200 BC \u2013 550 AD",era:"Roman Republic & Empire",role:"The lawyers and codifiers of Roman law",note:"Built citizenship into a legal status with defined rights extendable across an empire, and left the vocabulary of Western law.",works:"the Digest; the Institutes of Justinian",sortYear:-200},"The Sophists":{name:"The Sophists",dates:"5th century BC",era:"Classical Greece",role:"Itinerant teachers of rhetoric and success in Greek cities",note:"They drew the great antithesis between nature (physis) and convention (nomos), arguing much of morality is merely customary -- the provocation to which Socrates and Plato reply.",works:"",sortYear:-450},"The Stoics":{name:"The Stoics",dates:"c. 300 BC \u2013 200 AD",era:"Hellenistic & Roman",role:"School founded by Zeno of Citium; later Seneca, Epictetus, Marcus Aurelius",note:"Held that the cosmos is a rational, providential whole, that virtue alone is good, and that freedom lies in accepting what is not up to us.",works:"Epictetus, Discourses; Marcus Aurelius, Meditations; Seneca, Letters",sortYear:-300},"The modern synthesis":{name:"The modern synthesis",dates:"1930s \u2013 1940s",era:"Modern",role:"The union of Darwinian selection with genetics",note:"Showed how heredity supplies the variation on which natural selection acts, resolving the chief objection to Darwin.",works:"",sortYear:1930},"The tragedians":{name:"The Greek tragedians",dates:"5th century BC",era:"Classical Greece",role:"Aeschylus, Sophocles and Euripides",note:"The Athenian dramatists staged the collisions of fate, law, family and the gods, giving the tradition its most powerful images of necessity and human limit.",works:"Oresteia; Antigone; Oedipus the King; Bacchae",sortYear:-450},"The utilitarians":{name:"The utilitarians",dates:"18th \u2013 19th century",era:"Modern",role:"Bentham, Mill and their followers",note:"Made the greatest happiness of the greatest number the test of every law, institution and act.",works:"",sortYear:1750},Thrasymachus:{name:"Thrasymachus",dates:"c. 459 \u2013 c. 400 BC",era:"Classical Greece",role:"Sophist and rhetorician of Chalcedon",note:"In Plato's Republic he presses the hardest challenge to justice -- that it is merely whatever serves the interest of the stronger.",works:"appears in Plato, Republic I",sortYear:-459},Thucydides:{name:"Thucydides",dates:"c. 460 \u2013 c. 400 BC",era:"Classical Greece",role:"Athenian general and historian",note:"Wrote the first rigorously causal history, stripped of myth, as a possession for all time -- and the founding text of political realism.",works:"History of the Peloponnesian War",sortYear:-460},Tocqueville:{name:"Alexis de Tocqueville",dates:"1805 \u2013 1859",era:"Modern",role:"French aristocrat, magistrate and observer of America",note:"Judged democratic equality providential and just, yet warned of the tyranny of the majority and a mild, all-embracing administrative despotism.",works:"Democracy in America (1835, 1840)",sortYear:1805},Tolstoy:{name:"Leo Tolstoy",dates:"1828 \u2013 1910",era:"Modern",role:"Russian novelist and moral thinker",note:"Judged art by the sincerity of the feeling it transmits and its service to human brotherhood, condemning much celebrated art as counterfeit.",works:"War and Peace (1869); What Is Art? (1897)",sortYear:1828},Vico:{name:"Giambattista Vico",dates:"1668 \u2013 1744",era:"Enlightenment",role:"Neapolitan philosopher of history",note:"Argued we can know history because men made it, and that nations pass through recurring ages of gods, heroes and men.",works:"The New Science (1725)",sortYear:1668},"William James":{name:"William James",dates:"1842 \u2013 1910",era:"Modern",role:"American philosopher and psychologist",note:"Founded pragmatism -- an idea is true insofar as it works -- and treated religion by its fruits in lived experience.",works:"The Principles of Psychology (1890); Pragmatism (1907); Varieties of Religious Experience (1902)",sortYear:1842}},eraOrder:["Pre-Socratic Greece","Classical Greece","Hellenistic Greece","Hellenistic & Roman","Roman Republic","Roman Republic & Empire","Roman Empire","Early Christianity","Late Antiquity","Medieval","Renaissance","Scientific Revolution","Early Modern","Enlightenment","Modern","Contemporary"]},O={paper:"#F6F4EE",panel:"#FBFAF6",ink:"#1A1815",muted:"#6B6456",faint:"#8C8574",rule:"#DAD4C5",oxblood:"#6E2231",oxtint:"#9A4A57",slate:"#2E3E52",gilt:"#9C7A3C"},Ze={new:{label:"Unread",color:"#C6BFAD"},learning:{label:"Learning",color:O.slate},young:{label:"Familiar",color:O.oxtint},mature:{label:"Mastered",color:O.gilt}},ym=`
@import url('https://cdn.jsdelivr.net/gh/aaaakshat/cm-web-fonts@latest/fonts.css');

:root{
  --serif:'Computer Modern Serif','Latin Modern Roman',Georgia,'Times New Roman',serif;
  --mono:'Computer Modern Typewriter','Latin Modern Mono','Courier New',monospace;
  --sans:'Computer Modern Sans','Latin Modern Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
.syn-root{
  font-family:var(--serif);
  color:INK; background:PAPER;
  min-height:100vh; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  font-size:18px;
}
.syn-root ::selection{ background:OXTINT; color:#fff }
.syn-app{ display:flex; min-height:100vh }

/* ---- left rail ---- */
.syn-rail{
  width:220px; flex:0 0 220px; border-right:1px solid RULE;
  padding:30px 20px; position:sticky; top:0; height:100vh;
  display:flex; flex-direction:column; gap:6px; background:PANEL;
}
.syn-brand{ margin-bottom:26px }
.syn-brand-t{ font-size:23px; font-weight:700; letter-spacing:.3px; line-height:1.05 }
.syn-brand-s{ font-family:var(--mono); font-size:10.5px; letter-spacing:1.5px;
  text-transform:uppercase; color:FAINT; margin-top:8px }
.syn-nav-btn{
  font-family:var(--mono); font-size:12px; letter-spacing:1px; text-transform:uppercase;
  text-align:left; padding:9px 12px; border:0; background:none; color:MUTED;
  cursor:pointer; border-radius:3px; display:flex; align-items:center; gap:10px;
  transition:background .15s,color .15s;
}
.syn-nav-btn:hover{ color:INK; background:rgba(110,34,49,.05) }
.syn-nav-btn[data-on="1"]{ color:OXBLOOD; background:rgba(110,34,49,.08); font-weight:700 }
.syn-nav-num{ font-size:10px; color:FAINT; min-width:16px }
.syn-nav-btn[data-on="1"] .syn-nav-num{ color:OXBLOOD }
.syn-rail-foot{ margin-top:auto; font-family:var(--mono); font-size:10px;
  color:FAINT; letter-spacing:.5px; line-height:1.6 }

.syn-main{ flex:1; min-width:0; padding:0 }
.syn-wrap{ max-width:860px; margin:0 auto; padding:46px 34px 120px }

/* ---- index hero ---- */
.syn-hero{ padding-bottom:26px; margin-bottom:30px; border-bottom:2px solid OXBLOOD; position:relative }
.syn-hero-e{ font-family:var(--mono); font-size:11px; letter-spacing:2.5px;
  text-transform:uppercase; color:OXBLOOD }
.syn-hero-t{ font-size:52px; font-weight:700; letter-spacing:.5px; margin:12px 0 4px; line-height:1 }
.syn-hero-s{ font-size:19px; font-style:italic; color:MUTED; max-width:56ch }
.syn-hero-stats{ display:flex; gap:30px; margin-top:22px; flex-wrap:wrap }
.syn-hstat b{ font-size:26px; font-weight:700 }
.syn-hstat.gilt b{ color:GILT }
.syn-hstat.ox b{ color:OXBLOOD }
.syn-hstat span{ display:block; font-family:var(--mono); font-size:10px;
  letter-spacing:1.5px; text-transform:uppercase; color:FAINT; margin-top:3px }

/* ---- toolbar ---- */
.syn-toolbar{ display:flex; flex-direction:column; gap:14px; margin-bottom:34px }
.syn-search{ display:flex; align-items:center; gap:9px; border:1px solid RULE;
  background:PANEL; border-radius:4px; padding:9px 13px }
