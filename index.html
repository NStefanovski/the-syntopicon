 depending on others",who:"the Stoics"}]},{q:"Does virtue seek honor or scorn it?",sides:[{view:"The great-souled man claims the honor he deserves",who:"Aristotle"},{view:"The sage is indifferent to reputation",who:"the Stoics"}]},{q:"Is honor rooted in others' opinion or one's own worth?",sides:[{view:"It depends on the judgment of others",who:"the social view"},{view:"True honor is one's own conscience and integrity",who:"the inward view"}]}],positions:[{name:"Aristotle",claim:"Honor is the greatest external good and the natural reward of virtue, but not the highest good itself."},{name:"The Stoics",claim:"Honor and reputation are 'indifferents'; the wise care only for virtue."},{name:"Hobbes",claim:"Honor is the acknowledgment of power; men compete endlessly for precedence and glory."},{name:"Montesquieu",claim:"Honor -- the desire for distinction -- is the animating principle of monarchy."}],topics:["The nature of honor","Honor and virtue","Honor and reputation","The desire for glory","Honor and self-esteem","Honor as a political principle","The honor of the warrior","Honor vs. conscience"],key_texts:["Aristotle, Nicomachean Ethics I, IV","Marcus Aurelius, Meditations","Hobbes, Leviathan I","Montesquieu, The Spirit of the Laws"],example:"Falstaff asks what honor is\u2014can it set a broken leg? 'A word.' Air.\u2014deflating the battlefield glory his betters are willing to die for.",related:["virtue-and-vice","courage","wealth"],hook:"Worth made public."},{id:"hypothesis",name:"Hypothesis",cluster:"mind",gist:"The supposition put forward to be tested.",framing:"A hypothesis is a supposition adopted to explain facts or to begin a line of reasoning -- provisional, to be tested or built upon. It marks the difference between what is assumed and what is proven.",senses:["An assumption or postulate (in mathematics)","A tentative explanation to be tested (in science)","A conjecture whose consequences are examined","An unproven starting point ('from hypotheses')"],disputes:[{q:"Are hypotheses feigned or found?",sides:[{view:"'I frame no hypotheses' -- deduce laws from phenomena",who:"Newton"},{view:"Bold conjectures are indispensable to inquiry",who:"Descartes and later methodologists"}]},{q:"Can a hypothesis be proved by its successful consequences?",sides:[{view:"True consequences confirm it",who:"confirmation theory"},{view:"Many false hypotheses also yield true consequences",who:"the logical caution"}]},{q:"Is scientific knowledge ever more than hypothesis?",sides:[{view:"Theories can be true, not merely useful",who:"the realists"},{view:"All theory remains provisional",who:"the fallibilists"}]}],positions:[{name:"Plato",claim:"The mathematician reasons from hypotheses; dialectic rises above them to the first principle."},{name:"Newton",claim:"Professes to 'frame no hypotheses,' deriving his laws from the phenomena themselves."},{name:"Kant",claim:"Distinguishes constitutive principles from regulative hypotheses that guide inquiry."},{name:"Later methodologists",claim:"Science advances by proposing hypotheses and testing their observable consequences."}],topics:["Hypothesis vs. first principle","Hypothesis in mathematics","The hypothetical method in science","Confirmation and refutation","Hypothesis and induction","Saving the appearances","The provisional character of theory"],key_texts:["Plato, Republic VI (the divided line); Meno","Aristotle, Posterior Analytics","Newton, Principia (General Scholium)","Kant, Critique of Pure Reason (Appendix to the Dialectic)"],example:"Newton described gravity's law precisely yet refused to guess its hidden cause\u2014'hypotheses non fingo'\u2014distinguishing a tested law from a mere conjecture.",related:["induction","reasoning","science"],hook:"A supposition on trial."},{id:"idea",name:"Idea",cluster:"mind",gist:"The object of thought\u2014concept, form, or mental content.",framing:"An idea is an object of thought -- but is it a mental image in the individual mind, a concept, or an eternal reality independent of any mind? The word's history runs from Plato's eternal Forms to Locke's contents of consciousness.",senses:["An eternal Form or archetype (Plato)","Any content of the mind -- perception, concept, image (Locke, Descartes)","Innate vs. acquired ideas","The exemplars in the divine mind"],disputes:[{q:"Are ideas in the mind or independent of it?",sides:[{view:"Mental contents",who:"Descartes, Locke"},{view:"Eternal, mind-independent Forms",who:"Plato"}]},{q:"Are any ideas innate?",sides:[{view:"Yes -- some ideas are inborn",who:"Descartes"},{view:"No -- all come from experience",who:"Locke"}]},{q:"Do we perceive things, or only our ideas of them?",sides:[{view:"We directly know things",who:"the direct realists"},{view:"We know only our own ideas (the veil of perception)",who:"representationalism, Berkeley"}]}],positions:[{name:"Plato",claim:"Ideas (Forms) are eternal, perfect originals that particulars imitate; the mind recollects them."},{name:"Descartes",claim:"Ideas are the modes of thought; some -- God, the self -- are innate, clear, and distinct."},{name:"Locke",claim:"Every idea comes from sensation or reflection; the mind starts empty."},{name:"Berkeley",claim:"Ideas are all that exist for the mind; to be is to be perceived."},{name:"Hume",claim:"Ideas are the faint copies of vivid impressions."}],topics:["Ideas as Forms vs. as mental contents","Innate vs. acquired ideas","The origin of ideas","Ideas and things (the veil of perception)","Simple and complex ideas","Abstract ideas","Ideas in the divine mind"],key_texts:["Plato, Republic; Phaedo","Descartes, Meditations","Locke, Essay II","Berkeley, Principles","Hume, Enquiry"],example:"Berkeley pressed Locke's premise to its edge: if all we ever have is ideas, we can't peek behind them to compare\u2014so why assume matter behind them at all?",related:["knowledge","form","mind"],hook:"What the mind holds before it."},{id:"immortality",name:"Immortality",cluster:"divine",gist:"Survival of the soul beyond bodily death.",framing:"Immortality is the idea that the soul, or the person, survives bodily death. It joins metaphysics -- is the soul the kind of thing that can persist? -- to ethics and religion, for it asks whether justice requires an afterlife.",senses:["Immortality of the individual soul","Impersonal survival (absorption into intellect or world-soul)","Bodily resurrection vs. immortality of the soul alone","Symbolic immortality (in offspring, works, fame)"],disputes:[{q:"Is the soul naturally immortal?",sides:[{view:"Yes -- being simple and akin to the eternal, it cannot perish",who:"Plato"},{view:"No -- the soul dissolves with the body",who:"Lucretius, the mortalists"}]},{q:"Is it the soul or the whole person that survives?",sides:[{view:"The soul survives, freed from the body",who:"Platonic tradition"},{view:"The whole person is restored in the resurrection of the body",who:"Christian tradition"}]},{q:"Can immortality be proved by reason?",sides:[{view:"Yes -- by the soul's simplicity and its grasp of the Forms",who:"Plato"},{view:"No -- it is only a postulate of practical reason",who:"Kant"}]}],positions:[{name:"Plato",claim:"The Phaedo argues the soul, simple and kin to the eternal Forms, cannot perish."},{name:"Aristotle",claim:"Only the active intellect may be deathless; the individual soul is the form of a perishable body."},{name:"Lucretius",claim:"Soul is atoms that scatter at death, so 'death is nothing to us.'"},{name:"Aquinas",claim:"The rational soul is subsistent and immortal, yet awaits the resurrection to be complete."},{name:"Kant",claim:"Immortality cannot be proved, but is postulated so virtue and happiness may finally accord."}],topics:["Arguments for immortality","The soul's simplicity and survival","Personal vs. impersonal immortality","Resurrection vs. immortality of the soul","Immortality and moral desert","The fear of death","Immortality and the Forms"],key_texts:["Plato, Phaedo","Aristotle, On the Soul III","Lucretius, On the Nature of Things III","Aquinas, Summa Theologica I Q.75","Kant, Critique of Practical Reason"],example:"Kant argued we can't prove the soul immortal, but morality demands endless progress toward perfection\u2014so we must postulate a life long enough to achieve it.",related:["soul","life-and-death","eternity"],hook:"The part of you that outlasts the body."},{id:"induction",name:"Induction",cluster:"mind",gist:"Reasoning from particular cases to general truths.",framing:"Induction is reasoning from particular cases to general conclusions -- the move from what we observe to laws we did not see. Its power built modern science; its justification remains philosophy's most stubborn problem.",senses:["Generalization from instances","The intuitive grasp of a universal from particulars (epagoge)","Complete (enumerative) vs. incomplete induction","The experimental methods of induction (Mill)"],disputes:[{q:"Can induction be justified?",sides:[{view:"It grounds all empirical science",who:"Aristotle, Bacon, Mill"},{view:"No argument justifies inferring the unobserved from the observed",who:"Hume"}]},{q:"Is induction rational insight or mere habit?",sides:[{view:"A grasp of the universal in the particular",who:"Aristotle"},{view:"Custom and expectation, not reasoning",who:"Hume"}]},{q:"Does science really proceed by induction?",sides:[{view:"Yes -- generalize from gathered data",who:"Bacon, Mill"},{view:"No -- it conjectures and tests, never simply induces",who:"later critics"}]}],positions:[{name:"Aristotle",claim:"Induction leads the mind from particulars to the universal, supplying the principles reason then uses."},{name:"Bacon",claim:"True induction ascends gradually from gathered instances, using tables of presence and absence."},{name:"Hume",claim:"No reasoning justifies the leap from past to future; induction rests on custom, not proof."},{name:"Mill",claim:"Formulates canons -- agreement, difference, residues, concomitant variation -- to find causes."}],topics:["Induction vs. deduction","Enumerative induction","The grasp of universals","The problem of induction","Induction and causation","The methods of experimental inquiry","The uniformity of nature","Probability and induction"],key_texts:["Aristotle, Posterior Analytics II.19","Bacon, Novum Organum","Hume, Enquiry IV-V","Mill, A System of Logic III"],example:"Hume's challenge: the sun has risen every day, but no argument proves it must rise tomorrow\u2014our confidence is habit, not logic.",related:["experience","hypothesis","reasoning"],hook:"From these cases to the rule."},{id:"infinity",name:"Infinity",cluster:"being",gist:"The unbounded\u2014in number, magnitude, or being.",framing:"The infinite is the boundless or unlimited -- in number, magnitude, time, or being. Long treated as a paradox to be tamed, it forces a choice: can the endless actually exist, or only be endlessly approached?",senses:["Potential infinite (always more, never completed) vs. actual infinite (a completed whole)","The infinitely large vs. the infinitely small","The mathematical infinite vs. the metaphysical infinite (God)"],disputes:[{q:"Does an actual infinite exist?",sides:[{view:"Only a potential infinite; no completed infinite in nature",who:"Aristotle"},{view:"Actual infinites are coherent and exist (in mathematics, in God)",who:"Cantor; theologians"}]},{q:"Is the universe infinite?",sides:[{view:"The cosmos is finite and bounded",who:"Aristotle, Ptolemy"},{view:"The universe is infinite or unbounded",who:"atomists, Bruno, Newton's space"}]},{q:"Can the infinite be measured or compared?",sides:[{view:"An infinite cannot be traversed, so time had a beginning",who:"kalam-style arguments"},{view:"Infinite sets have precise, comparable sizes",who:"Cantor"}]}],positions:[{name:"Aristotle",claim:"Rejects the actual infinite; infinity exists only potentially, in division and addition."},{name:"Aquinas",claim:"God alone is actually infinite; all created things are finite."},{name:"Galileo",claim:"Notes paradoxes (as many squares as numbers), warning that infinity defies 'greater' and 'less.'"},{name:"Cantor",claim:"There are different, comparable sizes of infinity; the actual infinite is mathematically respectable."}],topics:["Potential vs. actual infinity","The infinite in magnitude and number","Infinite divisibility of the continuum","The infinity of the world","The infinity of God","Paradoxes of the infinite","The infinitesimal in the calculus","Infinity and the beginning of time"],key_texts:["Aristotle, Physics III.4-8","Aquinas, Summa Theologica I Q.7","Galileo, Two New Sciences","Pascal, Pensees (the two infinities)"],example:"Cantor showed the infinity of all decimals is strictly larger than the infinity of counting numbers\u2014some infinities dwarf others.",related:["quantity","eternity","mathematics"],hook:"The endless, made a subject."},{id:"judgment",name:"Judgment",cluster:"mind",gist:"The act of affirming or denying\u2014where truth is won or lost.",framing:"Judgment is the act of mind that affirms or denies -- joining subject and predicate into something true or false. It is the unit of assertion, the seat of truth, and, in conduct, the exercise of practical wisdom in deciding.",senses:["The mental act of affirming or denying (vs. simple apprehension)","The proposition, as the thing judged","The faculty of subsuming particulars under rules (Kant)","Practical judgment -- good sense in deciding"],disputes:[{q:"Where do truth and falsity reside?",sides:[{view:"In the judgment, not in isolated concepts",who:"Aristotle"},{view:"Elsewhere -- in things, or in language",who:"rival views"}]},{q:"Is judgment a distinct faculty?",sides:[{view:"A special power of subsuming cases under rules, which cannot itself be taught",who:"Kant"},{view:"Reducible to association of ideas",who:"the empiricists"}]},{q:"Are there synthetic a priori judgments?",sides:[{view:"Yes -- and they make mathematics and science possible",who:"Kant"},{view:"No -- judgments are either analytic or empirical",who:"his critics"}]}],positions:[{name:"Aristotle",claim:"Truth and falsehood exist only in the combining and separating of judgment, not in isolated terms."},{name:"Aquinas",claim:"Distinguishes the intellect's simple apprehension from its second act, judgment (composing and dividing)."},{name:"Kant",claim:"Judgment subsumes particulars under universals; how synthetic a priori judgments are possible is his question."},{name:"Hume",claim:"Our factual 'judgments' about cause are really habits of expectation."}],topics:["Judgment as affirmation and denial","The proposition","Truth as belonging to judgment","Kinds of judgment","Analytic vs. synthetic judgments","The faculty of judgment","Practical judgment and prudence"],key_texts:["Aristotle, On Interpretation","Aquinas, Summa Theologica I Q.85","Kant, Critique of Pure Reason; Critique of Judgment"],example:"A doctor may know every rule of medicine yet still need judgment to see which rule this patient, with these symptoms, actually calls for.",related:["reasoning","truth","prudence"],hook:"Where a thought becomes true or false."},{id:"justice",name:"Justice",cluster:"polis",gist:"Giving each their due\u2014the bond of communities.",framing:"Justice is rendering to each his due -- the virtue of persons and the first virtue of societies. What each is owed, whether justice is natural or conventional, and whether it pays to be just are among the oldest and most consequential questions.",senses:["Rendering to each his due (suum cuique)","General justice -- lawfulness and complete virtue toward others -- vs. particular justice","Fairness and equality: distributive (proportionate) and corrective (arithmetic)","The naturally right vs. the merely enacted (natural vs. legal justice)"],disputes:[{q:"Is justice natural or conventional?",sides:[{view:"Grounded in the human good and natural law",who:"Plato, Aristotle, Aquinas"},{view:"The interest of the stronger, mere convention",who:"Thrasymachus, Callicles"},{view:"It arises by covenant, out of the state of nature",who:"Hobbes"}]},{q:"Does it pay to be just?",sides:[{view:"The just soul is healthy and happy; justice is its own reward",who:"Socrates"},{view:"The ring of Gyges suggests we are just only for fear of being caught",who:"Glaucon's challenge"}]},{q:"What is the criterion of distribution?",sides:[{view:"Proportion to merit",who:"Aristotle"},{view:"According to need",who:"Marx"},{view:"Benefit to the least advantaged",who:"Rawls"}]},{q:"Can a law be unjust?",sides:[{view:"An unjust law is no true law",who:"Augustine, Aquinas"},{view:"Law is valid by enactment, whatever its content",who:"legal positivism"}]}],positions:[{name:"Plato",claim:"In the Republic, justice is each part of soul and city doing its own proper work; the just are happier than the unjust."},{name:"Aristotle",claim:"Distinguishes general justice (lawfulness) from particular; divides the latter into distributive (by merit) and corrective."},{name:"Thrasymachus",claim:"Justice is nothing but the advantage of the stronger -- the ruling party's interest encoded as law."},{name:"Aquinas",claim:"Justice is grounded in eternal law; a human law against it is a perversion, not binding in conscience."},{name:"Hobbes",claim:"Before the covenant nothing is unjust; justice begins with the common power that enforces contracts."},{name:"Rawls",claim:"Justice as fairness -- principles chosen behind a veil of ignorance, permitting inequality only to benefit the least advantaged."}],topics:["Justice as a virtue of soul and of society","Rendering each his due","General vs. particular justice","Distributive justice and merit","Corrective and commutative justice","Natural vs. legal justice","The just and the unjust law","Whether the just are happier","Punishment","Justice among nations"],key_texts:["Plato, Republic","Aristotle, Nicomachean Ethics V; Politics","Aquinas, Summa Theologica II-II QQ.57-79","Hobbes, Leviathan I-II","Rawls, A Theory of Justice (a modern extension beyond the original set)"],example:"Rawls asks what rules you'd pick for society if you didn't know whether you'd be rich or poor in it\u2014ignorance of your place forcing fairness.",related:["law","virtue-and-vice","liberty"],hook:"To each, their due."},{id:"knowledge",name:"Knowledge",cluster:"mind",gist:"Justified grasp of what is true\u2014as against mere opinion.",framing:"Knowledge is the mind's grasp of what is true -- but what marks it off from mere belief, and how far it reaches, are the founding questions of epistemology. To know is more than to be right; it is to be right with justification and assurance.",senses:["Justified true belief (vs. opinion and ignorance)","Scientific knowledge of causes vs. practical know-how","Knowledge by acquaintance vs. by description","A priori vs. empirical knowledge"],disputes:[{q:"What is the source of knowledge?",sides:[{view:"Reason and innate ideas",who:"the rationalists"},{view:"Sense-experience",who:"the empiricists"}]},{q:"Is certain knowledge possible?",sides:[{view:"Yes -- of first principles, the cogito, mathematics",who:"Descartes, the rationalists"},{view:"No -- suspend judgment",who:"the skeptics"}]},{q:"What is the object of knowledge?",sides:[{view:"The unchanging universal or Form",who:"Plato"},{view:"Particulars grasped through the senses",who:"the empiricists"}]}],positions:[{name:"Plato",claim:"Knowledge is of the eternal Forms, distinct from opinion about sensibles -- true belief 'with an account.'"},{name:"Aristotle",claim:"To know scientifically is to know the cause -- why the thing cannot be otherwise -- reached from experience."},{name:"Descartes",claim:"Clear and distinct perception, starting from the cogito, yields an indubitable foundation."},{name:"Hume",claim:"Limits knowledge to relations of ideas and matters of fact; causal 'knowledge' is only probable belief."},{name:"Kant",claim:"Knowledge needs both intuition and concept: thoughts without content are empty, intuitions without concepts blind."}],topics:["Knowledge vs. opinion and belief","The sources of knowledge","The possibility of certainty","Scientific knowledge and its objects","A priori vs. empirical knowledge","The limits of knowledge","Skepticism","Degrees of assent"],key_texts:["Plato, Theaetetus; Meno; Republic","Aristotle, Posterior Analytics","Descartes, Meditations","Hume, Enquiry","Kant, Critique of Pure Reason"],example:"Plato's Meno: a slave boy 'discovers' a geometry proof by answering questions, suggesting knowledge is recollected and grounded, not just true by luck.",related:["opinion","truth","experience"],hook:"Truth you can stand on."},{id:"labor",name:"Labor",cluster:"polis",gist:"Human work\u2014its dignity, its burden, its value.",framing:"Labor is the toil by which human beings wrest their living from nature and transform the world. Long despised as servile, it was raised by the moderns to the source of value, of property, and even of human self-making.",senses:["Toil or work (the effort of production)","The source of economic value (the labor theory)","A servile burden vs. dignified self-realization","Manual vs. intellectual labor"],disputes:[{q:"Is labor degrading or ennobling?",sides:[{view:"Servile toil, unfit for the free, who need leisure",who:"the ancients"},{view:"The dignity and very essence of man",who:"Locke, Marx"}]},{q:"Is labor the source of value?",sides:[{view:"Value comes from the labor embodied in goods",who:"Smith, Ricardo, Marx"},{view:"Value comes from utility, scarcity, and demand",who:"later economists"}]},{q:"Does labor ground property?",sides:[{view:"Mixing one's labor with nature makes it one's own",who:"Locke"},{view:"Property has other, conventional foundations",who:"his critics"}]}],positions:[{name:"Aristotle",claim:"Manual labor is servile and, ideally, left to others so citizens may have leisure for politics and thought."},{name:"Locke",claim:"Labor is the origin of property -- what a man mixes his labor with becomes his own."},{name:"Adam Smith",claim:"Labor is the real measure of value; the division of labor multiplies its power."},{name:"Marx",claim:"Labor is man's essential activity, but under capitalism it is alienated -- the worker estranged from product and self."}],topics:["The nature and dignity of labor","Labor and leisure","Labor as the source of value","The division of labor","Labor and property","The alienation of labor","Manual vs. intellectual work","Labor, capital, and class"],key_texts:["Aristotle, Politics I","Locke, Second Treatise (V)","Adam Smith, The Wealth of Nations","Marx, Capital; Economic and Philosophic Manuscripts"],example:"Adam Smith's pin factory: one worker alone makes a few pins a day, but ten dividing the steps make thousands\u2014the division of labor multiplying output.",related:["wealth","slavery","justice"],hook:"Work that makes and remakes the world."},{id:"language",name:"Language",cluster:"expr",gist:"The system of signs by which minds meet.",framing:"Language is the system of signs by which we mean and communicate -- the medium of thought, society, and tradition. Its origin, its relation to reality and to thought, and whether its structure limits or enables us are enduring questions.",senses:["A system of conventional signs (words)","Speech (the distinctively human power) vs. writing","The inner word (thought) vs. its outward expression","Natural language vs. formal or ideal languages"],disputes:[{q:"Is language natural or conventional?",sides:[{view:"Words are conventional signs, by agreement",who:"Aristotle"},{view:"Names fit their objects by nature",who:"one side of Plato's Cratylus"}]},{q:"Does language mirror reality or shape it?",sides:[{view:"It names a pre-given reality or thought",who:"the classical view"},{view:"Its structure shapes how we think and what we can say",who:"the moderns"}]},{q:"Is thought possible without language?",sides:[{view:"Thought precedes and could exist without words",who:"the traditional view"},{view:"Thought is bound up with, even constituted by, language",who:"modern challenges"}]}],positions:[{name:"Plato",claim:"The Cratylus debates whether names are correct by nature or by convention, without fully deciding."},{name:"Aristotle",claim:"Spoken words are symbols of affections in the soul; they signify by convention, not by nature."},{name:"Augustine",claim:"Reflects on how words are learned and how they point beyond themselves to things and to the inner teacher."},{name:"Hobbes",claim:"Names are marks for memory and signs for communication; truth lies in their right ordering."},{name:"Locke",claim:"Words stand for ideas in the speaker's mind; misused language is a chief source of error."}],topics:["The nature and origin of language","Natural vs. conventional signs","Language and thought","Words and meaning","Language and reality","The abuse of words","Grammar and logic","The diversity of languages"],key_texts:["Plato, Cratylus","Aristotle, On Interpretation","Augustine, On the Teacher; Confessions I","Hobbes, Leviathan I","Locke, Essay III"],example:"In the Cratylus, one side says names fit their things by nature, the other that 'dog' could equally have been any sound we all agreed to use.",related:["sign-and-symbol","rhetoric","definition"],hook:"Signs that let minds meet."},{id:"law",name:"Law",cluster:"polis",gist:"The rule of reason binding a community.",framing:"Law is the rule of conduct laid down by authority for the common good -- binding a community and backed by force. What law is, where its authority comes from, and how it relates to justice and morality are the central questions of jurisprudence.",senses:["An ordinance of reason for the common good, promulgated by authority (Aquinas)","The command of a sovereign backed by sanction (positivism)","The kinds of law -- eternal, natural, human, divine","Law vs. mere force or custom"],disputes:[{q:"What makes a law valid -- justice or enactment?",sides:[{view:"A law contrary to natural justice is no true law",who:"the natural-law tradition"},{view:"Law is valid if duly enacted, whatever its content",who:"legal positivism"}]},{q:"Is there a natural law above human law?",sides:[{view:"Yes -- an unchanging law, knowable by reason, binding all",who:"the Stoics, Aquinas, Locke"},{view:"No -- all law is human posit or command",who:"the positivists"}]},{q:"Must unjust laws be obeyed?",sides:[{view:"Unjust laws do not bind in conscience",who:"Aquinas, King"},{view:"Even bad laws must be obeyed for the sake of order",who:"the order-first view"}]}],positions:[{name:"Aristotle",claim:"Law is 'reason free from passion'; the rule of law is preferable to the rule of any individual."},{name:"Cicero",claim:"There is one eternal, natural law, the same for all, from which just human laws derive."},{name:"Aquinas",claim:"Law is an ordinance of reason for the common good; human law draws its force from the natural law."},{name:"Hobbes",claim:"Law is the command of the sovereign; without a common power to enforce it, covenants are but words."},{name:"Austin",claim:"Law is the command of the sovereign backed by sanction -- its existence is one thing, its merit another."}],topics:["The definition of law","The kinds of law (eternal, natural, human, divine)","Law and reason","Law and the common good","Natural law vs. positive law","Law and justice","The obligation to obey","The rule of law"],key_texts:["Aristotle, Politics III; Nicomachean Ethics V","Cicero, On the Laws","Aquinas, Summa Theologica I-II QQ.90-97","Hobbes, Leviathan II","Austin, The Province of Jurisprudence Determined"],example:"Aquinas holds a law that violates reason and the common good is 'no law but a corruption of law'\u2014mere force wearing law's clothes.",related:["justice","government","custom-and-convention"],hook:"Reason made binding."},{id:"liberty",name:"Liberty",cluster:"polis",gist:"Freedom from constraint\u2014and freedom for the good.",framing:"Liberty is freedom -- the absence of constraint and the power of self-determination. What it is to be free, in the soul, in the state, and before the law, and how liberty is reconciled with authority and with others' freedom, are central to ethics and politics.",senses:["Political liberty (freedom from arbitrary rule, under law)","Personal and civil liberty (rights and a protected private sphere)","'Negative' liberty (absence of interference) vs. 'positive' liberty (self-mastery)","Free will (the freedom of choice)"],disputes:[{q:"What is liberty -- non-interference or self-mastery?",sides:[{view:"The absence of external restraint",who:"Hobbes, Mill"},{view:"Self-rule -- obedience to a law one gives oneself",who:"Rousseau, Kant"}]},{q:"Is liberty opposed to law, or secured by it?",sides:[{view:"Every law is a restraint on liberty",who:"Hobbes"},{view:"Where there is no law there is no freedom -- law secures liberty",who:"Locke"}]},{q:"How far may liberty be limited?",sides:[{view:"Only to prevent harm to others (the harm principle)",who:"Mill"},{view:"Society may also enforce morality and the common good",who:"his critics"}]}],positions:[{name:"Hobbes",claim:"Liberty is the absence of external impediments; subjects are free wherever the law is silent."},{name:"Locke",claim:"Freedom is not license but life under a known law; where there is no law, there is no freedom."},{name:"Rousseau",claim:"Civil liberty is obedience to the general will -- the law one prescribes to oneself; man is 'forced to be free.'"},{name:"Kant",claim:"Freedom is autonomy -- the will's self-legislation of the moral law."},{name:"Mill",claim:"Over himself the individual is sovereign; liberty may be restrained only to prevent harm to others."}],topics:["The meaning of liberty","Negative vs. positive liberty","Liberty and law","Political and civil liberty","Freedom of thought and speech","The limits of liberty","Liberty and authority","Free will and freedom"],key_texts:["Hobbes, Leviathan II","Locke, Second Treatise","Rousseau, The Social Contract","Kant, Groundwork","Mill, On Liberty"],example:"Mill's harm principle draws the line: your liberty to swing your fist ends where another's nose begins; society may restrain you only to prevent harm to others.",related:["justice","democracy","will"],hook:"Free from constraint, free for the good."},{id:"life-and-death",name:"Life and Death",cluster:"nature",gist:"The line between the living and the lifeless\u2014and its crossing.",framing:"Life is what distinguishes the living from the inert -- self-nourishing, growing, self-moving; death is its cessation. What life is, whether it is more than matter in motion, and what death means for the self are among the deepest human concerns.",senses:["The activity of an organized, ensouled body (nutrition, growth, reproduction)","Biological life vs. the 'life' of mind or spirit","Death as the parting of soul and body vs. the breakdown of the organism","Mortality as the human condition"],disputes:[{q:"Is life reducible to matter and mechanism?",sides:[{view:"Life needs a special vital principle or soul",who:"the vitalists"},{view:"Life is physico-chemical process",who:"the mechanists"}]},{q:"Is death the end of the self, or a passage?",sides:[{view:"Death is annihilation -- 'nothing to us'",who:"Epicurus"},{view:"Death frees the immortal soul",who:"Plato"}]},{q:"Should death be feared?",sides:[{view:"No -- it is either nothing or a good",who:"Socrates, Epicurus"},{view:"It is the ultimate evil, to be resisted",who:"the common fear"}]}],positions:[{name:"Aristotle",claim:"Life is the self-nutrition, growth, and decay of a naturally organized body; the soul is its principle."},{name:"Epicurus",claim:"'Death is nothing to us': where we are, death is not; where death is, we are not."},{name:"Plato",claim:"The philosopher practices dying -- the soul's release from the body to contemplate the Forms."},{name:"Montaigne",claim:"'To philosophize is to learn to die'; facing mortality frees us to live."}],topics:["The definition of life","The living vs. the non-living","The principle of life (soul or mechanism)","Reproduction and growth","The meaning of death","The fear of death","Immortality and mortality","Life, death, and the good"],key_texts:["Aristotle, On the Soul II","Plato, Phaedo","Epicurus, Letter to Menoeceus","Lucretius, On the Nature of Things III","Montaigne, Essays"],example:"Montaigne kept death in view not to be morbid but to disarm it\u2014'he who has learned how to die has unlearned how to be a slave.'",related:["animal","soul","immortality"],hook:"The vital spark, and its going out."},{id:"logic",name:"Logic",cluster:"mind",gist:"The science of valid inference.",framing:"Logic is the study of the forms of valid reasoning -- of what follows from what, apart from particular content. It is at once an instrument of every science and a discipline debated as art, science, or the very laws of thought.",senses:["The art or instrument of reasoning (the Organon)","Formal logic (validity by form: syllogism, inference)","The laws of thought (identity, non-contradiction, excluded middle)","Symbolic or mathematical logic"],disputes:[{q:"Is logic about thought or about being?",sides:[{view:"The laws of correct thinking",who:"Kant's 'general logic'"},{view:"The most general laws of reality itself",who:"Hegel and some metaphysicians"}]},{q:"Is logic a science or only an instrument?",sides:[{view:"A genuine science",who:"the Stoics, moderns"},{view:"Merely a tool serving the other sciences",who:"much of the tradition"}]},{q:"Is the syllogism the whole of logic?",sides:[{view:"The syllogism is essentially complete",who:"the Aristotelian tradition"},{view:"Modern logic of relations and quantifiers vastly extends it",who:"Frege, Russell"}]}],positions:[{name:"Aristotle",claim:"Founds logic with the syllogism: from two premises a conclusion follows by form alone."},{name:"The Stoics",claim:"Develop a logic of propositions and if-then inference, complementing Aristotle's."},{name:"Kant",claim:"Logic is the a priori science of the understanding's forms; adds a 'transcendental logic.'"},{name:"Frege and Russell",claim:"Recast logic in symbolic, mathematical form, capturing relations and generality."}],topics:["The subject and use of logic","The syllogism and valid inference","The laws of thought","Terms, propositions, and arguments","Deduction vs. induction","Formal vs. material validity","Symbolic logic","Logic and language"],key_texts:["Aristotle, Prior and Posterior Analytics","Kant, Critique of Pure Reason (Transcendental Logic)","Mill, A System of Logic","Frege and Russell (modern logic)"],example:"Aristotle's syllogism: all men are mortal, Socrates is a man, therefore Socrates is mortal\u2014the conclusion forced by form alone, whatever the terms.",related:["reasoning","dialectic","definition"],hook:"What follows from what."},{id:"love",name:"Love",cluster:"good",gist:"The force that binds\u2014desire, friendship, charity.",framing:"Love is the movement of the soul toward what it finds good or beautiful, and the bond that unites persons. Ranging from bodily desire to friendship to the love of God, it is at once the deepest human experience and a cosmic principle.",senses:["Eros -- desiring, passionate love, longing for beauty","Philia -- friendship, affection between equals","Agape or caritas -- self-giving, charitable love","Love of the good and of God; self-love"],disputes:[{q:"Is love desire for what one lacks, or gift of what one has?",sides:[{view:"Eros as lack, longing for beauty",who:"Plato"},{view:"Agape as generous self-giving, willing the other's good",who:"the Christian tradition"}]},{q:"Is love selfish or selfless at root?",sides:[{view:"All love is finally self-love or self-interest",who:"Hobbes, La Rochefoucauld"},{view:"Genuine love wills the good of the other for their own sake",who:"Aristotle, Aquinas"}]},{q:"Can love be commanded, or is it a passion beyond will?",sides:[{view:"Charity is a commanded love, an act of will",who:"the theologians"},{view:"Love is a passion that simply befalls us",who:"the romantics"}]}],positions:[{name:"Plato",claim:"Eros is the soul's longing, ascending from beautiful bodies to Beauty itself -- the ladder of love."},{name:"Aristotle",claim:"Analyzes friendship -- of utility, pleasure, and virtue; the best is mutual love of the good."},{name:"Augustine",claim:"Rightly ordered love (caritas) turns the soul to God; disordered love (cupiditas) to lesser goods."},{name:"Aquinas",claim:"To love is to will the good of another; charity is the highest of the virtues."},{name:"Freud",claim:"Love (libido) is rooted in the sexual drive, sublimated into higher aims."}],topics:["The kinds of love (eros, philia, agape)","Love and desire","Love and friendship","The ascent of love","Self-love and love of others","Love of God","Whether love can be commanded","Love and the good"],key_texts:["Plato, Symposium; Phaedrus","Aristotle, Nicomachean Ethics VIII-IX","Augustine, Confessions","Aquinas, Summa Theologica II-II QQ.23-27"],example:"Plato's ladder of love climbs from one beautiful body, to all bodies, to beautiful souls and laws, and finally to Beauty itself\u2014desire schooled upward.",related:["desire","beauty","family"],hook:"The force that binds."},{id:"man",name:"Man",cluster:"nature",gist:"The rational animal\u2014subject and object of every inquiry.",framing:"Man is the being who asks what he is -- the 'rational animal,' the union of body and soul, the maker of tools, language, and cities. Every conception of human nature carries consequences for ethics, politics, and the meaning of life.",senses:["Rational animal (defined by reason and speech)","Image of God (the theological view)","One animal among others (the naturalist view)","Maker, worker, and social-political being"],disputes:[{q:"What defines the human?",sides:[{view:"Reason and speech",who:"Aristotle"},{view:"Tool-making and labor",who:"Franklin, Marx"},{view:"The image of God",who:"the theological tradition"}]},{q:"Is human nature fixed or made?",sides:[{view:"A fixed nature or essence",who:"the classical view"},{view:"Self-made through history and society",who:"Marx, the existentialists"}]},{q:"Is man good or corrupt by nature?",sides:[{view:"Naturally social and good",who:"Aristotle, Rousseau"},{view:"Naturally at war and self-interested",who:"Hobbes"},{view:"Fallen and in need of grace",who:"the theologians"}]}],positions:[{name:"Aristotle",claim:"Man is the rational animal and by nature a political animal, fulfilled only in the city."},{name:"Pico della Mirandola",claim:"Man has no fixed nature; he is free to shape himself toward beast or angel."},{name:"Hobbes",claim:"Man is matter in motion, driven by appetite; without a common power life is 'nasty, brutish, and short.'"},{name:"Pascal",claim:"Man is a paradox -- a thinking reed, wretched and great, suspended between beast and angel."},{name:"Kant",claim:"The human being is a person, an end in himself, belonging to a kingdom of ends."}],topics:["The definition of man","Reason and speech","The union of soul and body","Man and the other animals","Man as social and political","Human nature -- fixed or made","The dignity of the person","Man's place in the cosmos"],key_texts:["Sophocles, Antigone (Ode to Man)","Aristotle, Nicomachean Ethics; Politics","Pico, Oration on the Dignity of Man","Pascal, Pensees","Kant, Groundwork of the Metaphysics of Morals"],example:"Pascal: man is a reed, the weakest in nature, but a thinking reed\u2014the universe can crush him, yet he knows it does, and it knows nothing.",related:["animal","soul","mind"],hook:"The animal that asks what it is."},{id:"mathematics",name:"Mathematics",cluster:"mind",gist:"The science of number, magnitude, and pure form.",framing:"Mathematics is the science of number, magnitude, and pattern -- the very model of certain, demonstrative knowledge. What its objects are, and why it applies so uncannily to the world, are enduring puzzles.",senses:["The science of quantity (number and magnitude)","The study of abstract structure and form","Pure vs. applied mathematics","The language of nature"],disputes:[{q:"What are mathematical objects?",sides:[{view:"Real, eternal entities the mind discovers",who:"Platonism"},{view:"Abstractions from sensible things, or mental constructions",who:"Aristotle, the intuitionists"},{view:"Mere marks and rules",who:"formalism"}]},{q:"Are mathematical truths a priori or empirical?",sides:[{view:"A priori and necessary",who:"most of the tradition"},{view:"Very general inductions from experience",who:"Mill"}]},{q:"Why does mathematics fit the world?",sides:[{view:"Because nature itself is mathematical",who:"Galileo, Descartes"},{view:"Because we impose mathematical form on appearances",who:"Kant"}]}],positions:[{name:"Plato",claim:"Mathematics studies eternal objects and turns the soul from becoming toward being."},{name:"Aristotle",claim:"The mathematician studies the quantitative aspects of things by abstraction, not separate entities."},{name:"Descartes",claim:"Makes mathematics the model of method and unites algebra with geometry."},{name:"Kant",claim:"Mathematical knowledge is synthetic a priori, grounded in the pure intuitions of space and time."},{name:"Mill",claim:"Even mathematics rests on very general inductions from experience."}],topics:["The objects of mathematics","Number and magnitude","Mathematical certainty and demonstration","A priori vs. empirical status","The applicability of mathematics","The infinite in mathematics","Pure vs. applied mathematics","Mathematics and philosophy"],key_texts:["Euclid, Elements","Plato, Republic VII","Aristotle, Metaphysics XIII-XIV","Descartes, Geometry","Kant, Critique of Pure Reason"],example:"Euclid builds an entire geometry from five postulates, showing how vast, certain knowledge can grow from a handful of self-evident starting points.",related:["quantity","knowledge","science"],hook:"Certainty built from axioms."},{id:"matter",name:"Matter",cluster:"being",gist:"The stuff underlying change and bodily existence.",framing:"Matter is that out of which things are made and that which persists through their changes -- the stuff, substratum, or bodily principle of the world. Whether matter is all there is, or the lowest rung of a richer reality, divides materialists from their opponents.",senses:["Physical stuff or body","The substratum of change","Prime matter (pure potentiality, formless)","Extension (Descartes) or mass-energy (physics)"],disputes:[{q:"Is matter all that exists?",sides:[{view:"Only matter is real; mind is material too",who:"Democritus, Hobbes"},{view:"Mind or spirit is irreducible to matter",who:"Plato, Descartes, idealists"}]},{q:"What is matter's nature?",sides:[{view:"Matter is extension in space",who:"Descartes"},{view:"Matter is potentiality, actualized by form",who:"Aristotle"},{view:"'Matter' is only perceptions; no mind-independent stuff",who:"Berkeley"}]},{q:"Is matter continuous or atomic?",sides:[{view:"Continuous and infinitely divisible",who:"Aristotle, Descartes"},{view:"Composed of atoms in the void",who:"the atomists"}]}],positions:[{name:"Lucretius",claim:"Nothing exists but atoms and void; even soul is made of fine atoms."},{name:"Aristotle",claim:"Matter is potentiality; prime matter has no form of its own but can take on all forms."},{name:"Descartes",claim:"Matter is res extensa, pure extension, wholly distinct from thinking substance."},{name:"Hobbes",claim:"All that exists is body in motion; there is no incorporeal substance."},{name:"Berkeley",claim:"To be is to be perceived; mind-independent 'matter' is an incoherent abstraction."}],topics:["The meaning of matter","Matter and form","Prime matter and potentiality","Matter as extension","The atomic constitution of matter","Matter and mind (materialism)","The divisibility of matter","Matter and individuation","The conservation of matter"],key_texts:["Lucretius, On the Nature of Things","Aristotle, Physics I; Metaphysics VII","Descartes, Principles of Philosophy","Berkeley, Principles of Human Knowledge","Hobbes, Leviathan I"],example:"Aristotle's 'prime matter' is pure potential\u2014no shape, size, or quality of its own\u2014knowable only as the 'what' that takes on form.",related:["form","element","mind"],hook:"The stuff that takes on shape."},{id:"mechanics",name:"Mechanics",cluster:"nature",gist:"The science of motion and force.",framing:"Mechanics is the science of motion and its causes -- of forces, bodies, and machines. As the first branch of physics to be fully mathematized, it became the model of exact science and the heart of the mechanical worldview.",senses:["The science of machines (the lever and simple machines)","The general science of motion and force (statics, dynamics)","The mechanical philosophy -- all nature as matter in motion","Celestial vs. terrestrial mechanics"],disputes:[{q:"Can all of nature be explained mechanically?",sides:[{view:"Yes -- everything is matter in motion, pushing and pulling",who:"the mechanical philosophy"},{view:"No -- life, mind, and ends resist mechanism",who:"its critics"}]},{q:"Is motion natural, or does it require a cause?",sides:[{view:"Bodies seek their natural places; motion needs a mover",who:"Aristotle"},{view:"Bodies persist in motion by inertia unless forced",who:"Galileo, Newton"}]},{q:"Is action at a distance intelligible?",sides:[{view:"Gravity acts across empty space",who:"Newton's law"},{view:"Only contact and impulse are intelligible",who:"Descartes, the mechanists"}]}],positions:[{name:"Archimedes",claim:"Founds statics -- the law of the lever and the principle of buoyancy."},{name:"Galileo",claim:"Establishes the law of falling bodies and inertia, mathematizing terrestrial motion."},{name:"Descartes",claim:"Makes matter in motion, governed by impact and conserved motion, the key to all nature."},{name:"Newton",claim:"Three laws of motion plus universal gravitation unify mechanics into one system."}],topics:["The simple machines","Statics and dynamics","The laws of motion","Inertia and force","The mechanical philosophy","Action at a distance","Celestial vs. terrestrial mechanics","The conservation laws"],key_texts:["Archimedes, On the Equilibrium of Planes","Galileo, Two New Sciences","Descartes, Principles II","Newton, Principia"],example:"Newton's insight: the same force pulling an apple down holds the Moon in orbit\u2014terrestrial and celestial motion obey one law.",related:["physics","cause","change"],hook:"Motion, made exact."},{id:"medicine",name:"Medicine",cluster:"nature",gist:"The art and science of health and healing.",framing:"Medicine is the art and science of health and healing -- of the body's balance, its diseases, and their cure. It raises questions of art versus science, of nature's role in healing, and of the physician's ethical duties.",senses:["A practical art (techne) of healing","A science of the body and its causes","Preventive vs. curative medicine","Health as balance vs. as the absence of disease"],disputes:[{q:"Is medicine an art or a science?",sides:[{view:"A conjectural practical art, judging particulars",who:"the Hippocratic view"},{view:"A rigorous science of causes",who:"the modern aspiration"}]},{q:"Does the physician heal, or only assist nature?",sides:[{view:"Nature is the true healer; the doctor removes obstacles",who:"Hippocrates"},{view:"Active intervention masters disease",who:"modern medicine"}]},{q:"What is health?",sides:[{view:"A balance of the body's humors or constituents",who:"Galen"},{view:"The proper functioning of parts; the absence of pathology",who:"the modern view"}]}],positions:[{name:"Hippocrates",claim:"Disease has natural, not divine, causes; the physician aids nature and, first, does no harm."},{name:"Galen",claim:"Systematizes the four humors, whose balance is health and imbalance disease."},{name:"Descartes",claim:"The body is a machine; medicine studies its mechanism in order to repair it."},{name:"Claude Bernard",claim:"Founds experimental medicine, seeking the constancy of the body's internal environment."}],topics:["Medicine as art and science","The causes of disease","Health as balance","The healing power of nature","Diagnosis and prognosis","The physician's method","Preventive medicine","Medical ethics"],key_texts:["Hippocrates, Airs, Waters, Places; the Oath","Galen, On the Natural Faculties","Descartes, Treatise on Man","Claude Bernard, Introduction to the Study of Experimental Medicine"],example:"Hippocrates broke with superstition by treating epilepsy, the 'sacred disease,' as having natural causes like any other illness\u2014medicine as science, not magic.",related:["life-and-death","animal","art"],hook:"Knowledge aimed at healing."},{id:"memory-and-imagination",name:"Memory and Imagination",cluster:"mind",gist:"The powers that retain the past and picture the absent.",framing:"Memory retains and recovers the past; imagination forms images of what is absent, past, or merely possible. Together they mediate between sense and thought -- the storehouse and the workshop of the mind.",senses:["Memory as retention and recollection of the past","Imagination as image-making: reproductive (recombining) vs. productive (creating)","Imagination as the bridge between sense and intellect","Fancy vs. the shaping imagination"],disputes:[{q:"Is memory a passive trace or an active reconstruction?",sides:[{view:"A stored impression or imprint",who:"the classic image"},{view:"An active recollection that reconstructs",who:"later views"}]},{q:"Is imagination merely reproductive or genuinely creative?",sides:[{view:"It only recombines what sense supplied",who:"Hobbes, Hume"},{view:"It is productive and shaping",who:"Kant, the Romantics"}]},{q:"What is imagination's role in knowledge?",sides:[{view:"Indispensable -- the soul never thinks without an image",who:"Aristotle"},{view:"A source of error to be disciplined",who:"the rationalists"}]}],positions:[{name:"Aristotle",claim:"Memory is of the past and belongs to the image-making power; the soul never thinks without a phantasm."},{name:"Augustine",claim:"Marvels at the vast 'fields and palaces of memory' where the self and even God are sought."},{name:"Hobbes",claim:"Imagination is 'decaying sense'; memory is sense remembered."},{name:"Hume",claim:"Imagination freely combines ideas, but only from materials given by impressions."},{name:"Kant",claim:"The productive imagination synthesizes the manifold, mediating intuition and concept."}],topics:["Memory and the past","Recollection vs. retention","The arts of memory","Imagination as image-making","Reproductive vs. productive imagination","Imagination and knowledge","Imagination and creativity","Memory, imagination, and error"],key_texts:["Aristotle, On Memory; On the Soul III","Augustine, Confessions X","Hobbes, Leviathan I","Hume, Treatise I","Kant, Critique of Pure Reason"],example:"Augustine marvels at memory as vast fields and palaces where he meets himself and even recalls forgetting\u2014an inner world larger than the outer.",related:["sense","idea","mind"],hook:"Holding the past, picturing the absent."},{id:"metaphysics",name:"Metaphysics",cluster:"being",gist:"First philosophy: the study of being as being.",framing:"Metaphysics is the inquiry into the first principles and ultimate nature of reality -- being as such, substance, cause, God, and the categories every other science presupposes. Its very possibility as knowledge has been repeatedly affirmed and denied.",senses:["The science of being as being (ontology)","'First philosophy' -- first causes and principles","The study of what lies beyond physics (God, soul, cosmos)","The a priori structure of thought (Kant's transformed sense)"],disputes:[{q:"Is metaphysics possible as a science?",sides:[{view:"Yes -- the science of being and first causes",who:"Aristotle, Aquinas"},{view:"No -- it oversteps possible experience and breeds illusion",who:"Hume, the positivists"},{view:"Only as a critique of reason's own limits",who:"Kant"}]},{q:"What is metaphysics about?",sides:[{view:"Being as being, in general (ontology)",who:"Aristotle"},{view:"The supreme being, God (special metaphysics)",who:"the theological tradition"}]},{q:"Are metaphysical statements meaningful?",sides:[{view:"They state deep truths about reality",who:"the realists"},{view:"They are literally meaningless -- neither empirical nor logical",who:"logical positivists"}]}],positions:[{name:"Aristotle",claim:"First philosophy studies being as being and its highest cause, the unmoved mover."},{name:"Aquinas",claim:"Metaphysics rises from creatures to God as being itself, distinguishing essence and existence."},{name:"Hume",claim:"Reasoning beyond experience yields 'sophistry and illusion' -- commit it to the flames."},{name:"Kant",claim:"Old metaphysics is impossible as knowledge; a critical metaphysics maps the conditions of experience."},{name:"Carnap",claim:"Metaphysical claims are pseudo-statements lacking any verifiable content."}],topics:["The subject matter of metaphysics","Being as being","Substance and the categories","First principles and first causes","God in metaphysics","The possibility of metaphysical knowledge","Metaphysics vs. physics","The critique of metaphysics"],key_texts:["Aristotle, Metaphysics","Aquinas, Summa Theologica I","Descartes, Meditations","Hume, Enquiry XII","Kant, Critique of Pure Reason (Preface, Dialectic)"],example:"Kant compared past metaphysics to a battlefield of endless, undecidable combat\u2014and set out to fix its borders so it would stop overreaching.",related:["being","philosophy","principle"],hook:"The study of being itself."},{id:"mind",name:"Mind",cluster:"mind",gist:"The thinking, knowing power\u2014and its relation to body.",framing:"Mind is the power of thinking, knowing, and willing -- the intellect that sets the human above the merely animal. Its nature, and its relation to the body, are among philosophy's hardest and most contested questions.",senses:["Intellect or reason (the power of concepts and judgment)","Consciousness in general (all awareness)","The divine ordering Mind (nous)","Mind vs. brain (the mind-body question)"],disputes:[{q:"Is mind distinct from body?",sides:[{view:"A distinct thinking substance",who:"Descartes"},{view:"Identical with, or produced by, the body",who:"the materialists"},{view:"The form of a living body",who:"Aristotle"}]},{q:"Is intellect separate from sense?",sides:[{view:"Reason grasps universals beyond any sense",who:"Plato, Aristotle"},{view:"Thought is only refined sensation",who:"the empiricists"}]},{q:"Is there mind in nature or the cosmos?",sides:[{view:"A world-ordering nous",who:"Anaxagoras, the Stoics"},{view:"Mind is only in animals and humans",who:"the naturalists"}]}],positions:[{name:"Anaxagoras",claim:"Mind (nous) is the ordering principle that sets the cosmos in motion."},{name:"Aristotle",claim:"The intellect grasps universals; the active intellect may be separable and deathless."},{name:"Descartes",claim:"Mind is a thinking substance, better known than the body and really distinct from it."},{name:"Hobbes",claim:"'Mind' is nothing but motions in the body; all is matter in motion."},{name:"Kant",claim:"The mind actively constitutes experience through its a priori forms and categories."}],topics:["The nature of mind and intellect","Mind and body","Intellect and sense","The active and passive intellect","Consciousness and self-consciousness","Mind in nature","Reason vs. the animal soul","The powers of the mind"],key_texts:["Anaxagoras (fragments)","Plato, Phaedo","Aristotle, On the Soul III","Descartes, Meditations","Hobbes, Leviathan I","Kant, Critique of Pure Reason"],example:"Descartes' cogito: even a deceiving demon can't make me doubt that I, doubting, exist\u2014the one certainty from which mind rebuilds the world.",related:["soul","idea","knowledge"],hook:"The knower, knowing."},{id:"monarchy",name:"Monarchy",cluster:"polis",gist:"Rule by one\u2014for good or ill.",framing:"Monarchy is rule by one -- government in which sovereign power rests with a single person. From the philosopher-king to the absolute sovereign to the constitutional crown, it poses the question whether one ruler can best embody unity, wisdom, and order.",senses:["Rule of one for the common good (the ideal) vs. tyranny (its perversion)","Kingship under law vs. absolute monarchy","Hereditary vs. elective monarchy","Constitutional or limited monarchy (the modern form)"],disputes:[{q:"Is rule by one the best form?",sides:[{view:"One wise ruler gives unity and decisive rule",who:"Plato; Hobbes"},{view:"Concentrated power tends to tyranny; law and the many are safer",who:"the constitutionalists"}]},{q:"Should the monarch be above the law or under it?",sides:[{view:"An absolute sovereign, source of law, above it",who:"Hobbes, Bodin"},{view:"A king under the law -- else he is a tyrant",who:"Aristotle, the constitutionalists"}]},{q:"Whence the king's authority?",sides:[{view:"By divine right or nature",who:"the royalists"},{view:"By the consent or contract of the people",who:"the contractarians"}]}],positions:[{name:"Plato",claim:"The ideal is the rule of the one who knows -- the philosopher-king, wiser than any law."},{name:"Aristotle",claim:"True kingship rules for the common good and by law; lawless, it degenerates into tyranny."},{name:"Hobbes",claim:"Favors an undivided sovereign -- most naturally one man -- whose absolute power alone secures peace."},{name:"Locke",claim:"Rejects absolute monarchy, since none may rightly be judge in his own case."},{name:"Montesquieu",claim:"In a moderate monarchy, intermediate powers and honor restrain the prince from despotism."}],topics:["Monarchy vs. tyranny","Rule of one for the common good","Absolute vs. limited monarchy","Hereditary vs. elective kingship","The king and the law","Divine right vs. consent","The philosopher-king","Constitutional monarchy"],key_texts:["Plato, Statesman; Republic","Aristotle, Politics III","Hobbes, Leviathan II","Locke, Two Treatises","Montesquieu, The Spirit of the Laws"],example:"Aristotle's hinge: the king rules for the good of all, the tyrant for his own\u2014same office, opposite aim, and that aim is the whole difference.",related:["tyranny","government","aristocracy"],hook:"One ruler\u2014king or tyrant."},{id:"nature",name:"Nature",cluster:"being",gist:"The whole of things, and the essence of each.",framing:"Nature means both the intrinsic principle that makes each thing behave as it does and the whole ordered system of such things -- the cosmos. It also sets a standard: what is 'according to nature' as against the artificial or the merely conventional.",senses:["A thing's essence (its 'nature')","The inner principle of motion and rest","Nature as the totality of things (the universe)","The natural vs. the artificial, conventional, or supernatural"],disputes:[{q:"Is nature purposive?",sides:[{view:"Nature does nothing in vain; it acts for ends",who:"Aristotle"},{view:"Nature is blind mechanism; ends are illusory",who:"the mechanists"}]},{q:"Is the natural the standard of right?",sides:[{view:"There is a natural right or law above convention",who:"Stoics, Aquinas, Locke"},{view:"Justice and law are conventional, not natural",who:"the Sophists, some moderns"}]},{q:"Is nature identical with God?",sides:[{view:"God and Nature are one (Deus sive Natura)",who:"Spinoza"},{view:"Nature is God's creation, distinct from Him",who:"the theistic tradition"}]}],positions:[{name:"Aristotle",claim:"Nature is an inner principle of motion and rest; each thing has an end proper to its kind."},{name:"The Stoics",claim:"To live well is to live 'according to nature,' i.e., the reason pervading the cosmos."},{name:"Spinoza",claim:"There is one substance, God-or-Nature; all things follow by necessity from its nature."},{name:"Bacon",claim:"Nature is to be studied by its laws and, so understood, commanded for human benefit."},{name:"Rousseau",claim:"Contrasts natural man -- good and free -- with man corrupted by society."}],topics:["The meaning of nature (essence vs. the whole)","Nature as principle of motion","The order and laws of nature","Nature and art","Nature and convention","Natural law and natural right","The state of nature","Nature and the supernatural","Nature and God"],key_texts:["Aristotle, Physics II","Lucretius, On the Nature of Things","Spinoza, Ethics I","Bacon, Novum Organum","Rousseau, Discourse on Inequality"],example:"Aristotle distinguishes the natural from the made: a bed, if buried, would sprout wood not a bed, because its nature is the wood, and 'bed' is only art.",related:["world","form","cause"],hook:"The whole, and each thing's essence."},{id:"necessity-and-contingency",name:"Necessity and Contingency",cluster:"being",gist:"What must be, and what merely happens to be.",framing:"The necessary is what cannot be otherwise; the contingent is what can. Sorting the two runs through logic, nature, freedom, and theology -- deciding whether the world had to be as it is, or might have been different.",senses:["Logical necessity vs. causal necessity","The necessary being (God) vs. contingent beings","Absolute vs. conditional (hypothetical) necessity","Necessity as compulsion vs. as unconditional certainty"],disputes:[{q:"Is everything necessary, or is there real contingency?",sides:[{view:"All events are necessitated; contingency is only apparent",who:"Stoics, Spinoza"},{view:"Some things are genuinely contingent, able to be otherwise",who:"Aristotle, defenders of free will"}]},{q:"Is there a necessary being?",sides:[{view:"Contingent beings require a necessary being as their ground",who:"Aquinas, Leibniz"},{view:"The inference to a necessary being is invalid",who:"Hume, Kant"}]},{q:"Are the laws of nature necessary?",sides:[{view:"Nature's laws hold with necessity",who:"the rationalists"},{view:"They are contingent regularities that might have been otherwise",who:"Hume, empiricists"}]}],positions:[{name:"Aristotle",claim:"Distinguishes the necessary, the possible, and the contingent; future contingents may lack settled truth."},{name:"Aquinas",claim:"From beings that might not have existed he argues to a being that exists necessarily."},{name:"Spinoza",claim:"Nothing is contingent; all follows with geometric necessity from God's nature."},{name:"Leibniz",claim:"Separates necessary 'truths of reason' from contingent 'truths of fact,' grounded in God's choice of the best."},{name:"Hume",claim:"No matter of fact is necessary; its contrary is always conceivable."}],topics:["The kinds of necessity","Necessity and contingency in being","The necessary being","Necessity in causation","Logical vs. real necessity","Contingency and chance","Necessity and free will","Future contingents","Possibility and possible worlds"],key_texts:["Aristotle, On Interpretation IX; Metaphysics V","Aquinas, Summa Theologica I Q.2 (Third Way)","Spinoza, Ethics I","Leibniz, Monadology; Theodicy","Hume, Enquiry"],example:"Aquinas's third way: contingent things need not exist, so if all were contingent, at some point nothing would have existed\u2014hence something must exist necessarily.",related:["cause","fate","chance"],hook:"The must-be and the might-not-be."},{id:"oligarchy",name:"Oligarchy",cluster:"polis",gist:"Rule by the few\u2014typically the rich.",framing:"Oligarchy is rule by the few -- typically the wealthy -- in their own interest. As the corrupt counterpart of aristocracy, it raises the perennial problem of the rich dominating the poor and of wealth translating into political power.",senses:["Rule of the few (neutral) vs. rule of the wealthy few for themselves","Plutocracy (rule of the rich)","The perversion of aristocracy","The tendency of organizations toward rule by a few"],disputes:[{q:"Is oligarchy ever just?",sides:[{view:"Rule of the few for the common good is aristocracy, not oligarchy",who:"Aristotle"},{view:"Property qualifications for rule are defensible",who:"its defenders"}]},{q:"Is the root conflict wealth vs. poverty?",sides:[{view:"The real political division is rich against poor, oligarchs against democrats",who:"Aristotle"},{view:"Other cleavages matter more",who:"later critics"}]},{q:"Can oligarchy be tempered?",sides:[{view:"Mix it with democracy into a stable 'polity'",who:"Aristotle"},{view:"Concentrated wealth inevitably captures power",who:"the pessimists"}]}],positions:[{name:"Plato",claim:"Oligarchy arises when wealth becomes the qualification for rule; it splits the city into rich and poor."},{name:"Aristotle",claim:"Oligarchy is rule by the wealthy few for their own advantage -- the perversion of aristocracy."},{name:"Polybius",claim:"Oligarchy is a stage in the cycle of constitutions, decaying from aristocracy toward mob rule."},{name:"Michels",claim:"Even democratic organizations tend toward rule by a few -- the 'iron law of oligarchy.'"}],topics:["The meaning of oligarchy","Rule of the few","Oligarchy vs. aristocracy","Wealth and political power","The conflict of rich and poor","Oligarchy and democracy","The mixed constitution","The tendency toward oligarchy"],key_texts:["Plato, Republic VIII","Aristotle, Politics III-V","Polybius, Histories VI"],example:"Aristotle's real dividing line isn't number but wealth: even if the rich were many and the poor few, rule in the rich's interest would still be oligarchy.",related:["aristocracy","democracy","wealth"],hook:"The wealthy few, for themselves."},{id:"one-and-many",name:"One and Many",cluster:"being",gist:"How unity and plurality coexist in reality.",framing:"How can reality be both one and many -- a single world yet countless distinct things? The tension between unity and plurality runs from the first cosmologies to disputes over identity, wholes, and the universal.",senses:["The One as ultimate principle or source","Unity as a property of each being (a thing is 'one')","The many as a plurality of individuals","The universal (one) present in many"],disputes:[{q:"Is reality ultimately one or many?",sides:[{view:"All is one; plurality is illusion",who:"Parmenides, the monists"},{view:"Reality is irreducibly many (atoms, monads, individuals)",who:"atomists, pluralists"}]},{q:"How is the one present in the many?",sides:[{view:"By participation in a single Form",who:"Plato"},{view:"By the same universal predicated of many",who:"Aristotle"}]},{q:"Is unity prior to plurality?",sides:[{view:"The One is the first principle, source of all",who:"Plotinus"},{view:"Unity and plurality are correlative, neither prior",who:"the pluralists"}]}],positions:[{name:"Parmenides",claim:"What is, is one and continuous; division and change are unreal."},{name:"Plato",claim:"Many sensible things are one by sharing a single Form; the Parmenides probes the puzzles."},{name:"Aristotle",claim:"'One' is said in many ways; the unity of a substance underlies its many accidents."},{name:"Plotinus",claim:"From the ineffable One all multiplicity emanates and to it returns."},{name:"Leibniz",claim:"Reality is a plurality of simple substances (monads), each mirroring the whole."}],topics:["The one and the many as first principles","Unity as a transcendental of being","Whole and parts","Identity and diversity","The universal in the many","Monism vs. pluralism","The One as source (emanation)","Numerical vs. specific unity"],key_texts:["Parmenides (fragments)","Plato, Parmenides; Sophist","Aristotle, Metaphysics V.6, X","Plotinus, Enneads","Leibniz, Monadology"],example:"Plato's 'one over many': many red things share one Form of redness\u2014a single unity accounting for the scattered plurality we sense.",related:["being","same-and-other","universal-and-particular"],hook:"Unity amid plurality."},{id:"opinion",name:"Opinion",cluster:"mind",gist:"Belief that falls short of knowledge.",framing:"Opinion is belief that falls short of knowledge -- assent held without full certainty, which may be true or false. Ranking between ignorance and knowledge, it governs most of practical life and the whole realm of the probable.",senses:["Belief without certainty (vs. knowledge)","Right opinion -- true belief lacking an account","The probable, in rhetoric and common life","Public opinion (a community's shared beliefs)"],disputes:[{q:"Is opinion sharply distinct from knowledge?",sides:[{view:"Yes -- knowledge is of the stable Forms, opinion of shifting sensibles",who:"Plato"},{view:"They differ in degree of justification, not in kind",who:"many moderns"}]},{q:"Can true opinion guide action as well as knowledge?",sides:[{view:"Right opinion suffices for action, though it is unstable",who:"Plato's Meno"},{view:"Only secure knowledge is a safe guide",who:"the rationalists"}]},{q:"Should opinion be trusted or overcome?",sides:[{view:"Reputable opinions are a proper starting point",who:"Aristotle"},{view:"Opinion must yield to reasoned knowledge",who:"Descartes"}]}],positions:[{name:"Plato",claim:"Opinion lies between knowledge and ignorance; true opinion becomes knowledge only when tied down by an account."},{name:"Aristotle",claim:"Reputable opinions (endoxa) are the proper starting points of dialectical and ethical inquiry."},{name:"Descartes",claim:"Resolves to treat as false whatever is merely opinion, admitting only the certain."},{name:"Locke",claim:"Where knowledge fails we must be governed by probability, proportioning assent to the evidence."}],topics:["Opinion vs. knowledge","True and false opinion","Right opinion and its instability","The probable and the plausible","Opinion and belief","Public opinion","The ethics of assent","Degrees of certainty"],key_texts:["Plato, Meno; Republic V; Theaetetus","Aristotle, Topics I","Descartes, Meditations I","Locke, Essay IV"],example:"Plato notes that a true opinion about the road to a town gets you there as surely as knowledge\u2014until, lacking grounds, it wanders off.",related:["knowledge","truth","judgment"],hook:"Belief without the receipts."},{id:"opposition",name:"Opposition",cluster:"being",gist:"The relation of contraries, contradictories, and correlatives.",framing:"Opposition is the relation between things that stand against each other -- contraries, contradictories, correlatives. It underlies logic's laws, the analysis of change (between opposite states), and dialectics that make conflict the engine of thought.",senses:["Contradiction (A and not-A)","Contrariety (hot/cold) and correlation (parent/child)","Privation (sight/blindness)","Logical opposition of propositions vs. real opposition of forces"],disputes:[{q:"Is the law of non-contradiction absolute?",sides:[{view:"Nothing can both be and not be in the same respect -- the firmest principle",who:"Aristotle"},{view:"Reality contains real contradictions that drive its development",who:"Hegel"}]},{q:"Do opposites explain nature?",sides:[{view:"Change and nature are governed by pairs of contraries",who:"Heraclitus, Aristotle"},{view:"Fundamental physics needs no contraries, only quantities and laws",who:"mathematical science"}]},{q:"Is opposition real or only conceptual?",sides:[{view:"Some oppositions are real forces (strife, polarity)",who:"Heraclitus; Kant on real opposition"},{view:"Opposition is a relation among concepts and propositions",who:"the logicians"}]}],positions:[{name:"Heraclitus",claim:"Opposites are one; strife is justice, and the world lives by tension."},{name:"Aristotle",claim:"Catalogues the kinds of opposition and defends non-contradiction as the ground of all reasoning."},{name:"Kant",claim:"Distinguishes logical opposition from 'real' opposition -- forces that cancel, like + and - quantities."},{name:"Hegel",claim:"Contradiction is no mere error but the motor of dialectical development."}],topics:["The kinds of opposition","Contradiction vs. contrariety","The square of opposition","Privation and negation","Opposition and change","The law of non-contradiction","Correlatives and relation","Opposition in dialectic"],key_texts:["Heraclitus (fragments)","Aristotle, Categories; Metaphysics IV, X","Kant, essay on negative magnitudes","Hegel, Science of Logic"],example:"Aristotle sorts oppositions: hot/cold are contraries (a mean lies between), while being/not-being are contradictories (no middle is possible).",related:["same-and-other","dialectic","relation"],hook:"Terms that stand against each other."},{id:"philosophy",name:"Philosophy",cluster:"mind",gist:"The love of wisdom\u2014reasoned inquiry into first things.",framing:"Philosophy is the love and pursuit of wisdom -- rational inquiry into the ultimate nature of reality, knowledge, and the good life. Its scope, method, and very possibility as knowledge are themselves perennial philosophical questions.",senses:["The pursuit of wisdom and the good life (a way of living)","The science of first principles and causes","The analysis of concepts and language (a modern turn)","Its parts: natural, moral, and first philosophy"],disputes:[{q:"Is philosophy a way of life or a body of doctrine?",sides:[{view:"A transformative practice",who:"the ancients"},{view:"A theoretical system or analysis",who:"many moderns"}]},{q:"Can philosophy attain truth, or only clarify?",sides:[{view:"It reaches first principles and the highest truths",who:"Plato, Aristotle"},{view:"It only analyzes or dissolves problems",who:"some moderns"}]},{q:"What is philosophy's relation to science and faith?",sides:[{view:"Their foundation",who:"Descartes"},{view:"The handmaid of theology",who:"the medievals"},{view:"An autonomous critical inquiry",who:"Kant"}]}],positions:[{name:"Socrates",claim:"Philosophy is the examined life; 'the unexamined life is not worth living.'"},{name:"Plato",claim:"The philosopher ascends from the cave to knowledge of the Forms and should therefore rule."},{name:"Aristotle",claim:"First philosophy studies being and its causes; the contemplative life is the highest happiness."},{name:"Descartes",claim:"Philosophy must be rebuilt from indubitable foundations, like a tree rooted in metaphysics."},{name:"Kant",claim:"Philosophy's task is critique -- to fix the powers and limits of reason itself."}],topics:["The definition of philosophy","Philosophy and wisdom","The branches of philosophy","Philosophy vs. science","Philosophy and religion","The philosophical life","The method of philosophy","The value and limits of philosophy"],key_texts:["Plato, Republic; Apology","Aristotle, Metaphysics I","Descartes, Discourse on Method","Kant, Critique of Pure Reason (Preface)"],example:"Socrates chose death over abandoning inquiry, insisting 'the unexamined life is not worth living'\u2014philosophy as a commitment, not a hobby.",related:["wisdom","metaphysics","knowledge"],hook:"The love of wisdom, by argument."},{id:"physics",name:"Physics",cluster:"nature",gist:"The science of nature\u2014matter, motion, and energy.",framing:"Physics is the science of nature -- of matter, motion, force, and the fundamental laws of the physical world. From Aristotle's study of change to the mathematical laws of the moderns, it is the arena where the deepest questions about reality become exact.",senses:["The general science of nature (Aristotle's study of changing things)","The mathematical science of matter and motion (the modern sense)","Fundamental physics (ultimate constituents and laws) vs. its branches","Physics vs. metaphysics"],disputes:[{q:"Is physics qualitative or quantitative?",sides:[{view:"A study of natures, qualities, and ends",who:"Aristotle"},{view:"The mathematical treatment of matter in motion",who:"Galileo, Newton"}]},{q:"Are there final causes in physics?",sides:[{view:"Nature acts for ends",who:"Aristotle"},{view:"Physics seeks only efficient causes and laws",who:"the moderns"}]},{q:"Is nature continuous or atomic?",sides:[{view:"A plenum of continuous matter",who:"Aristotle, Descartes"},{view:"Atoms moving in the void",who:"the atomists"}]}],positions:[{name:"Aristotle",claim:"Physics studies natural bodies as subject to motion and change, seeking all four kinds of cause."},{name:"Galileo",claim:"Nature's book is written in mathematics; he reduces motion to measurable law."},{name:"Newton",claim:"Formulates the laws of motion and gravitation, unifying the physics of heaven and earth."},{name:"Descartes",claim:"Builds a physics of extended matter and motion, banishing final causes."}],topics:["The science of nature","Matter and motion","Force and the laws of motion","Final vs. efficient causes in nature","The continuous and the atomic","Space, time, and motion","The mathematization of nature","Physics and metaphysics"],key_texts:["Aristotle, Physics","Galileo, Two New Sciences","Descartes, Principles of Philosophy","Newton, Principia","(contrast) Lucretius, On the Nature of Things"],example:"Einstein showed that two events simultaneous for one observer aren't for another moving relative to them\u2014time itself depends on the observer's motion.",related:["mechanics","matter","space"],hook:"The laws of the material world."},{id:"pleasure-and-pain",name:"Pleasure and Pain",cluster:"good",gist:"The felt goads that drive us toward and away.",framing:"Pleasure and pain are the most immediate goods and evils we feel -- the springs that draw us on and drive us back. Whether pleasure is the good itself, a sign of the good, or a distraction from it is one of ethics' oldest debates.",senses:["Bodily pleasures and pains vs. pleasures of the mind","Pleasure as a feeling vs. as the unimpeded activity of a natural power (Aristotle)","Pleasure as the good (hedonism) vs. as a byproduct","The calculus of pleasures and pains"],disputes:[{q:"Is pleasure the good?",sides:[{view:"Pleasure is the highest good and the end",who:"the hedonists, Epicurus (rightly understood)"},{view:"The good life is virtuous activity, not pleasure",who:"Plato, Aristotle, the Stoics"}]},{q:"Are all pleasures equal, or higher and lower?",sides:[{view:"Measure them only by quantity",who:"Bentham"},{view:"Some pleasures are higher in kind",who:"Mill, Plato"}]},{q:"Is pleasure a process or an activity?",sides:[{view:"The replenishing of a lack -- a process toward a state",who:"Plato"},{view:"The unimpeded activity itself, complete at each moment",who:"Aristotle"}]}],positions:[{name:"Epicurus",claim:"Pleasure is the beginning and end of the happy life -- but chiefly absence of pain and tranquility, not indulgence."},{name:"Plato",claim:"Examines and limits pleasure's claim; unmixed pleasures rank below wisdom in the good life."},{name:"Aristotle",claim:"Pleasure is not the good but accompanies and completes good activity, as bloom crowns youth."},{name:"Bentham",claim:"The good is the greatest pleasure; he proposes a calculus of intensity, duration, and the rest."},{name:"Mill",claim:"Distinguishes higher from lower pleasures -- better Socrates dissatisfied than a fool satisfied."}],topics:["The nature of pleasure and pain","Kinds of pleasure","Pleasure as the good (hedonism)","Higher vs. lower pleasures","Pleasure and activity","Pleasure and happiness","The measurement of pleasures","Pain and evil"],key_texts:["Plato, Philebus; Republic IX","Aristotle, Nicomachean Ethics VII, X","Epicurus, Letter to Menoeceus","Bentham, Principles of Morals and Legislation","Mill, Utilitarianism"],example:"Mill: better to be Socrates dissatisfied than a fool satisfied\u2014some pleasures are higher, and those who've known both prefer them.",related:["happiness","desire","good-and-evil"],hook:"The goads of gratification and distress."},{id:"poetry",name:"Poetry",cluster:"expr",gist:"Making in words\u2014imitation, music, and vision.",framing:"Poetry is imaginative making in words -- the art that, through image, rhythm, and story, moves and teaches. Its quarrel with philosophy over truth, and its power over the emotions, have made it a perennial subject of praise and suspicion.",senses:["Imaginative literature generally (including drama and epic)","Verse or metrical composition","Poetry as imitation (of action, character) vs. as inspired vision","The old 'quarrel' of poetry and philosophy"],dispu
