ls God.",related:["being","theology","cause"],hook:"The being all else depends on.",quotes:[{text:"That than which nothing greater can be conceived.",who:"Anselm",work:"Proslogion",when:"1078",context:"Anselm's definition, not yet his argument. He then reasons that such a being must exist in reality, since existing is greater than being merely thought -- the ontological argument, disputed ever since."},{text:"The heart has its reasons which reason knows nothing of.",who:"Pascal",work:"Pensees",when:"1670",context:"Not a licence for sentiment. Pascal means that first principles -- and the apprehension of God -- are grasped by an intuitive faculty rather than proved by demonstration."}]},{id:"good-and-evil",name:"Good and Evil",cluster:"good",gist:"The most basic distinction in the realm of action.",framing:"The good is what all things seek -- the desirable, the perfective, the end of action; evil is its privation or opposite. What the good is, whether it is one or many, and how evil enters the world are founding questions of ethics and theodicy.",senses:["The good as the object of desire and the end","The useful, the pleasant, the noble (kinds of good)","The highest good (summum bonum)","Moral vs. natural good and evil; evil as privation vs. as a positive force"],disputes:[{q:"Is the good one or many?",sides:[{view:"A single Form of the Good above all",who:"Plato"},{view:"Good is said in as many ways as being -- no one Idea",who:"Aristotle"}]},{q:"Is the good objective or relative?",sides:[{view:"A real feature of things, the end of nature",who:"Plato, Aristotle"},{view:"Whatever we desire or approve -- relative to us",who:"Hobbes, Spinoza"}]},{q:"Is evil real or a privation?",sides:[{view:"Only the absence or corruption of a due good",who:"Augustine, Aquinas"},{view:"A real, opposing principle",who:"the Manichaeans"}]}],positions:[{name:"Plato",claim:"The Form of the Good is the highest reality, source of being and knowledge, like the sun."},{name:"Aristotle",claim:"The good is that at which all things aim; the human good is activity of soul according to virtue."},{name:"Augustine",claim:"All that exists is good insofar as it exists; evil is the privation or corruption of good."},{name:"Hobbes",claim:"'Good' and 'evil' are just names for what we desire and avoid; nothing is good in itself."},{name:"Kant",claim:"The only thing good without qualification is a good will."}],topics:["The meaning of good","The good as the end","Kinds of good (useful, pleasant, noble)","The highest good","The good as one or many","Moral vs. natural good","The problem of evil","Evil as privation"],key_texts:[{text:"Plato, Republic VI-VII",when:"c. 375 BC"},{text:"Aristotle, Nicomachean Ethics I",when:"c. 340 BC"},{text:"Augustine, Confessions; Enchiridion",when:"c. 400 AD"},{text:"Hobbes, Leviathan I",when:"1651"},{text:"Kant, Groundwork",when:"1785"}],example:"Augustine argued evil is not a thing God made but a hole in the good, as blindness is not a substance but the absence of sight\u2014so no evil creator is needed.",related:["virtue-and-vice","happiness","beauty"],hook:"What to seek, what to shun.",quotes:[{text:"Nothing in the world can possibly be conceived good without qualification except a good will.",who:"Kant",work:"Groundwork",when:"1785",context:"Intelligence, courage and even happiness can be put to bad use; only the will that acts from duty is good in itself, whatever it manages to accomplish."}]},{id:"government",name:"Government",cluster:"polis",gist:"The organized power that rules a community.",framing:"Government is the ruling power in a community -- the authority that makes and enforces its common decisions. Its origin, its forms, its proper ends, and the limits of its power are the enduring questions of political philosophy.",senses:["The ruling authority, those who rule","A form or type (monarchy, aristocracy, democracy)","The activity of governing (administration)","Government vs. the state or society (the apparatus vs. the whole)"],disputes:[{q:"Whence does government derive its authority?",sides:[{view:"From nature or God",who:"the classical and divine-right views"},{view:"From the consent of the governed -- a social contract",who:"Locke, Rousseau"}]},{q:"What is the best form of government?",sides:[{view:"Rule of the best, or of one wise ruler",who:"Plato"},{view:"A mixed or balanced constitution",who:"Aristotle, Polybius"},{view:"Representative democracy",who:"the moderns"}]},{q:"What are the limits of government?",sides:[{view:"It exists to secure rights and may be resisted if it violates them",who:"Locke"},{view:"Sovereignty must be near-absolute to keep the peace",who:"Hobbes"}]}],positions:[{name:"Aristotle",claim:"Distinguishes correct governments (for the common good) from perversions (for the rulers); prefers the mixed polity."},{name:"Hobbes",claim:"To escape the war of all against all, men covenant to erect a sovereign whose power must be undivided."},{name:"Locke",claim:"Government is a trust to protect life, liberty, and property; betraying it, it may be replaced."},{name:"Montesquieu",claim:"Liberty depends on dividing and balancing the powers of government."}],topics:["The origin of government","The authority to rule","The forms of government","The ends of government","The consent of the governed","The limits of government","The separation of powers","The right of revolution"],key_texts:[{text:"Aristotle, Politics III",when:"c. 335 BC"},{text:"Hobbes, Leviathan II",when:"1651"},{text:"Locke, Second Treatise of Government",when:"1689"},{text:"Montesquieu, The Spirit of the Laws",when:"1748"},{text:"The Federalist",when:"1788"}],example:"Hobbes argued that without a common power to keep all in awe, life would be 'solitary, poor, nasty, brutish, and short'\u2014so we trade some liberty for order.",related:["constitution","state","law"],hook:"Power organized to rule.",quotes:[{text:"If men were angels, no government would be necessary.",who:"The Federalist",work:"Federalist 51",when:"1788",context:"Madison's case for checks and balances. Since neither rulers nor ruled are angels, the constitution must set ambition against ambition rather than rely on good intentions."}]},{id:"habit",name:"Habit",cluster:"good",gist:"The second nature built by repeated action.",framing:"Habit is a stable disposition, acquired by repetition, that makes action easy, prompt, and reliable. It is the very stuff of character -- for virtues and vices alike are habits -- and the means by which we become what we repeatedly do.",senses:["An acquired disposition or 'second nature'","Mere routine or custom vs. trained skill or virtue","Good habits (virtues) vs. bad habits (vices)","The learned automatic response (in psychology)"],disputes:[{q:"Is character made by habit or given by nature?",sides:[{view:"We become just by doing just acts -- virtue is habituated",who:"Aristotle"},{view:"Temperament and nature set the limits",who:"the naturists"}]},{q:"Is habit freeing or enslaving?",sides:[{view:"It frees attention and perfects action",who:"James"},{view:"It deadens and mechanizes -- the enemy of thought",who:"the critics"}]},{q:"Can habit produce real virtue, or only its form?",sides:[{view:"Repeated right action forms genuine virtue",who:"Aristotle"},{view:"True virtue needs right motive, not just habit",who:"Kant-leaning views"}]}],positions:[{name:"Aristotle",claim:"Moral virtue comes about by habituation; we acquire the virtues by first exercising them."},{name:"Aquinas",claim:"Habits are stable qualities perfecting a power for good or ill; virtues and vices are habits."},{name:"Hume",claim:"Custom is 'the great guide of human life,' the basis of causal expectation itself."},{name:"William James",claim:"Habit is the great flywheel of society; make the nervous system an ally, not an enemy."}],topics:["The nature of habit","Habit and repetition","Habit as second nature","Habit and character","Virtue and vice as habits","Habit and custom","Forming and breaking habits","Habit, freedom, and mechanism"],key_texts:[{text:"Aristotle, Nicomachean Ethics II",when:"c. 340 BC"},{text:"Aquinas, Summa Theologica I-II QQ.49-54",when:"1265-1274"},{text:"Hume, Enquiry V",when:"1748"},{text:"James, Principles of Psychology",when:"1890"}],example:"Aristotle: we aren't born just or brave but become so by practice, as a builder becomes a builder by building\u2014character is habituated, not innate.",related:["virtue-and-vice","custom-and-convention","will"],hook:"Repetition become character.",quotes:[{text:"Habit is the enormous flywheel of society.",who:"William James",work:"Principles of Psychology",when:"1890",context:"Habit keeps the social order running and saves us from deciding everything afresh. His practical advice follows: make the nervous system an ally rather than an enemy, since we are all bundles of habit by thirty."}]},{id:"happiness",name:"Happiness",cluster:"good",gist:"The final end\u2014what all else is sought for.",framing:"Happiness is the good life fully lived -- the final end that all our actions aim at for its own sake. What it consists in -- pleasure, virtue, contemplation, or fortune -- is the central question of ethics.",senses:["Flourishing, a life well lived (eudaimonia -- an activity, not a mood)","Pleasure or contentment (a subjective state)","Blessedness -- union with God","The greatest happiness (the utilitarian standard)"],disputes:[{q:"What does happiness consist in?",sides:[{view:"Virtuous activity, crowned by contemplation",who:"Aristotle"},{view:"Pleasure, or freedom from pain",who:"Epicurus, the hedonists"},{view:"Virtue alone",who:"the Stoics"}]},{q:"Is happiness in our power or dependent on fortune?",sides:[{view:"It needs some external goods and luck",who:"Aristotle"},{view:"It depends only on virtue, immune to fortune",who:"the Stoics"}]},{q:"Is happiness the right standard of morality?",sides:[{view:"Yes -- the good is what conduces to happiness",who:"eudaimonists, utilitarians"},{view:"No -- duty, not happiness, defines the moral",who:"Kant"}]}],positions:[{name:"Aristotle",claim:"Happiness is activity of soul in accordance with virtue, over a complete life, perfected in contemplation."},{name:"Epicurus",claim:"Happiness is pleasure rightly understood -- freedom from bodily pain and mental disturbance."},{name:"The Stoics",claim:"Happiness is virtue alone; nothing external is needed, for only the good will is truly good."},{name:"Augustine",claim:"The heart is restless until it rests in God; true happiness is enjoyment of the eternal."},{name:"Mill",claim:"The standard is the greatest happiness of the greatest number, higher pleasures counting for more."}],topics:["The definition of happiness","Happiness as the final end","Happiness and pleasure","Happiness and virtue","Happiness and fortune","The contemplative vs. the active life","Happiness and the highest good","The greatest-happiness principle"],key_texts:[{text:"Aristotle, Nicomachean Ethics I, X",when:"c. 340 BC"},{text:"Epicurus, Letter to Menoeceus",when:"c. 300 BC"},{text:"Epictetus; Marcus Aurelius",when:"c. 175 AD"},{text:"Augustine, Confessions",when:"c. 400 AD"},{text:"Mill, Utilitarianism",when:"1863"}],example:"Aristotle warns we can't call anyone happy until we see how the whole life ends\u2014Priam was fortunate for decades, then lost everything in old age.",related:["good-and-evil","pleasure-and-pain","virtue-and-vice"],hook:"The end behind every end.",quotes:[{text:"One swallow does not make a summer.",who:"Aristotle",work:"Nicomachean Ethics I",when:"c. 340 BC",context:"Happiness is not a mood or a good day but an activity of the soul in accordance with virtue over a complete life -- which is why he says no one can be called happy until it is finished."}]},{id:"history",name:"History",cluster:"polis",gist:"The record and meaning of human events in time.",framing:"History is both the course of human events and the inquiry that records and explains them. Whether history has a pattern or meaning, and whether it is science, art, or a guide to life, shapes how we understand our past and future.",senses:["The events themselves (what happened) vs. the account or inquiry","Narrative and political history vs. the philosophy of history","History as a science of causes vs. an art of narration","History as unique and unrepeatable vs. as lawlike and recurring"],disputes:[{q:"Does history have a meaning or direction?",sides:[{view:"It unfolds a rational or providential plan toward freedom",who:"Hegel; or class-liberation, Marx"},{view:"It is contingent, cyclical, or without overall meaning",who:"the ancients, the skeptics"}]},{q:"Is history a science or an art?",sides:[{view:"A rigorous inquiry into causes, even lawlike",who:"Thucydides, the positivists"},{view:"An interpretive narrative of the singular",who:"the humanists"}]},{q:"Does history teach lessons?",sides:[{view:"It is philosophy teaching by examples",who:"the classical view"},{view:"Its situations are too singular to yield laws",who:"the skeptics"}]}],positions:[{name:"Thucydides",claim:"Writes a rigorous, causal history 'as a possession for all time,' expecting patterns to recur."},{name:"Augustine",claim:"History is the drama of two cities, moving under providence toward a divine end."},{name:"Vico",claim:"History passes through recurring ages -- of gods, heroes, men -- knowable because men make it."},{name:"Hegel",claim:"History is the rational progress of Spirit in the consciousness of freedom."},{name:"Marx",claim:"History is driven by material conditions and class struggle toward a classless society."}],topics:["The nature of history","History as event and as inquiry","The causes in history","The philosophy of history","Progress, cycles, or providence in history","History as science or art","The lessons of history","Individuals vs. forces in history"],key_texts:[{text:"Thucydides, History of the Peloponnesian War",when:"c. 400 BC"},{text:"Augustine, City of God",when:"413-426 AD"},{text:"Vico, The New Science",when:"1725"},{text:"Hegel, The Philosophy of History",when:"1837"},{text:"Marx, on historical materialism",when:"1845-1859"}],example:"Tolstoy in War and Peace argues Napoleon merely rode a wave he didn't create; the war's course was the sum of countless small wills, not one man's plan.",related:["progress","man","time"],hook:"The past, and its pattern.",quotes:[{text:"A possession for all time.",who:"Thucydides",work:"History I",when:"c. 400 BC",context:"His claim for the work's value against mere prize-winning performance. Since human nature stays constant, an accurate account of this war will be useful to anyone facing a similar crisis."}]},{id:"honor",name:"Honor",cluster:"good",gist:"The public recognition of worth\u2014and the love of it.",framing:"Honor is the recognition and esteem owed to excellence -- the outward reward of virtue and the mark of worth in others' eyes. Whether honor is a worthy aim or a snare of vanity has divided moralists and shaped the ethics of warrior and citizen.",senses:["Public esteem or recognition (reputation, glory)","The inner sense of one's own worth (a code of honor)","The reward due to virtue","Rank or office"],disputes:[{q:"Is honor a worthy end?",sides:[{view:"The greatest of external goods, the prize of virtue",who:"Aristotle"},{view:"A hollow, unstable good depending on others",who:"the Stoics"}]},{q:"Does virtue seek honor or scorn it?",sides:[{view:"The great-souled man claims the honor he deserves",who:"Aristotle"},{view:"The sage is indifferent to reputation",who:"the Stoics"}]},{q:"Is honor rooted in others' opinion or one's own worth?",sides:[{view:"It depends on the judgment of others",who:"the social view"},{view:"True honor is one's own conscience and integrity",who:"the inward view"}]}],positions:[{name:"Aristotle",claim:"Honor is the greatest external good and the natural reward of virtue, but not the highest good itself."},{name:"The Stoics",claim:"Honor and reputation are 'indifferents'; the wise care only for virtue."},{name:"Hobbes",claim:"Honor is the acknowledgment of power; men compete endlessly for precedence and glory."},{name:"Montesquieu",claim:"Honor -- the desire for distinction -- is the animating principle of monarchy."}],topics:["The nature of honor","Honor and virtue","Honor and reputation","The desire for glory","Honor and self-esteem","Honor as a political principle","The honor of the warrior","Honor vs. conscience"],key_texts:[{text:"Aristotle, Nicomachean Ethics I, IV",when:"c. 340 BC"},{text:"Marcus Aurelius, Meditations",when:"c. 175 AD"},{text:"Hobbes, Leviathan I",when:"1651"},{text:"Montesquieu, The Spirit of the Laws",when:"1748"}],example:"Falstaff asks what honor is\u2014can it set a broken leg? 'A word.' Air.\u2014deflating the battlefield glory his betters are willing to die for.",related:["virtue-and-vice","courage","wealth"],hook:"Worth made public.",quotes:[{text:"Honor is the prize of virtue.",who:"Aristotle",work:"Nicomachean Ethics IV",when:"c. 340 BC",context:"The greatest of external goods, but still external -- which is why he denies it can be the highest good: it depends on those who bestow it rather than on the person honored."}]},{id:"hypothesis",name:"Hypothesis",cluster:"mind",gist:"The supposition put forward to be tested.",framing:"A hypothesis is a supposition adopted to explain facts or to begin a line of reasoning -- provisional, to be tested or built upon. It marks the difference between what is assumed and what is proven.",senses:["An assumption or postulate (in mathematics)","A tentative explanation to be tested (in science)","A conjecture whose consequences are examined","An unproven starting point ('from hypotheses')"],disputes:[{q:"Are hypotheses feigned or found?",sides:[{view:"'I frame no hypotheses' -- deduce laws from phenomena",who:"Newton"},{view:"Bold conjectures are indispensable to inquiry",who:"Descartes and later methodologists"}]},{q:"Can a hypothesis be proved by its successful consequences?",sides:[{view:"True consequences confirm it",who:"confirmation theory"},{view:"Many false hypotheses also yield true consequences",who:"the logical caution"}]},{q:"Is scientific knowledge ever more than hypothesis?",sides:[{view:"Theories can be true, not merely useful",who:"the realists"},{view:"All theory remains provisional",who:"the fallibilists"}]}],positions:[{name:"Plato",claim:"The mathematician reasons from hypotheses; dialectic rises above them to the first principle."},{name:"Newton",claim:"Professes to 'frame no hypotheses,' deriving his laws from the phenomena themselves."},{name:"Kant",claim:"Distinguishes constitutive principles from regulative hypotheses that guide inquiry."},{name:"Later methodologists",claim:"Science advances by proposing hypotheses and testing their observable consequences."}],topics:["Hypothesis vs. first principle","Hypothesis in mathematics","The hypothetical method in science","Confirmation and refutation","Hypothesis and induction","Saving the appearances","The provisional character of theory"],key_texts:[{text:"Plato, Republic VI (the divided line); Meno",when:"c. 375 BC"},{text:"Aristotle, Posterior Analytics",when:"c. 350 BC"},{text:"Newton, Principia (General Scholium)",when:"1687"},{text:"Kant, Critique of Pure Reason (Appendix to the Dialectic)",when:"1781"}],example:"Newton described gravity's law precisely yet refused to guess its hidden cause\u2014'hypotheses non fingo'\u2014distinguishing a tested law from a mere conjecture.",related:["induction","reasoning","science"],hook:"A supposition on trial.",quotes:[{text:"Saving the appearances.",who:"Ancient astronomy",work:"the Ptolemaic tradition",when:"c. 150 AD",context:"The task of devising geometrical models that reproduce observed motions. It leaves open whether the devices are real, which is why Copernicus could be read as merely calculating -- and why Galileo's realism was dangerous."}]},{id:"idea",name:"Idea",cluster:"mind",gist:"The object of thought\u2014concept, form, or mental content.",framing:"An idea is an object of thought -- but is it a mental image in the individual mind, a concept, or an eternal reality independent of any mind? The word's history runs from Plato's eternal Forms to Locke's contents of consciousness.",senses:["An eternal Form or archetype (Plato)","Any content of the mind -- perception, concept, image (Locke, Descartes)","Innate vs. acquired ideas","The exemplars in the divine mind"],disputes:[{q:"Are ideas in the mind or independent of it?",sides:[{view:"Mental contents",who:"Descartes, Locke"},{view:"Eternal, mind-independent Forms",who:"Plato"}]},{q:"Are any ideas innate?",sides:[{view:"Yes -- some ideas are inborn",who:"Descartes"},{view:"No -- all come from experience",who:"Locke"}]},{q:"Do we perceive things, or only our ideas of them?",sides:[{view:"We directly know things",who:"the direct realists"},{view:"We know only our own ideas (the veil of perception)",who:"representationalism, Berkeley"}]}],positions:[{name:"Plato",claim:"Ideas (Forms) are eternal, perfect originals that particulars imitate; the mind recollects them."},{name:"Descartes",claim:"Ideas are the modes of thought; some -- God, the self -- are innate, clear, and distinct."},{name:"Locke",claim:"Every idea comes from sensation or reflection; the mind starts empty."},{name:"Berkeley",claim:"Ideas are all that exist for the mind; to be is to be perceived."},{name:"Hume",claim:"Ideas are the faint copies of vivid impressions."}],topics:["Ideas as Forms vs. as mental contents","Innate vs. acquired ideas","The origin of ideas","Ideas and things (the veil of perception)","Simple and complex ideas","Abstract ideas","Ideas in the divine mind"],key_texts:[{text:"Plato, Republic; Phaedo",when:"c. 375 BC"},{text:"Descartes, Meditations",when:"c. 175 AD"},{text:"Locke, Essay II",when:"1689"},{text:"Berkeley, Principles",when:"1710"},{text:"Hume, Enquiry",when:"1748"}],example:"Berkeley pressed Locke's premise to its edge: if all we ever have is ideas, we can't peek behind them to compare\u2014so why assume matter behind them at all?",related:["knowledge","form","mind"],hook:"What the mind holds before it.",quotes:[{text:"The mind is white paper, void of all characters.",who:"Locke",work:"Essay II",when:"1689",context:"The rejection of innate ideas. Everything written on the mind comes from sensation or reflection -- a claim with political force, since it denies anyone is born to knowledge or authority others lack."}]},{id:"immortality",name:"Immortality",cluster:"divine",gist:"Survival of the soul beyond bodily death.",framing:"Immortality is the idea that the soul, or the person, survives bodily death. It joins metaphysics -- is the soul the kind of thing that can persist? -- to ethics and religion, for it asks whether justice requires an afterlife.",senses:["Immortality of the individual soul","Impersonal survival (absorption into intellect or world-soul)","Bodily resurrection vs. immortality of the soul alone","Symbolic immortality (in offspring, works, fame)"],disputes:[{q:"Is the soul naturally immortal?",sides:[{view:"Yes -- being simple and akin to the eternal, it cannot perish",who:"Plato"},{view:"No -- the soul dissolves with the body",who:"Lucretius, the mortalists"}]},{q:"Is it the soul or the whole person that survives?",sides:[{view:"The soul survives, freed from the body",who:"Platonic tradition"},{view:"The whole person is restored in the resurrection of the body",who:"Christian tradition"}]},{q:"Can immortality be proved by reason?",sides:[{view:"Yes -- by the soul's simplicity and its grasp of the Forms",who:"Plato"},{view:"No -- it is only a postulate of practical reason",who:"Kant"}]}],positions:[{name:"Plato",claim:"The Phaedo argues the soul, simple and kin to the eternal Forms, cannot perish."},{name:"Aristotle",claim:"Only the active intellect may be deathless; the individual soul is the form of a perishable body."},{name:"Lucretius",claim:"Soul is atoms that scatter at death, so 'death is nothing to us.'"},{name:"Aquinas",claim:"The rational soul is subsistent and immortal, yet awaits the resurrection to be complete."},{name:"Kant",claim:"Immortality cannot be proved, but is postulated so virtue and happiness may finally accord."}],topics:["Arguments for immortality","The soul's simplicity and survival","Personal vs. impersonal immortality","Resurrection vs. immortality of the soul","Immortality and moral desert","The fear of death","Immortality and the Forms"],key_texts:[{text:"Plato, Phaedo",when:"c. 380 BC"},{text:"Aristotle, On the Soul III",when:"c. 350 BC"},{text:"Lucretius, On the Nature of Things III",when:"c. 55 BC"},{text:"Aquinas, Summa Theologica I Q.75",when:"1265-1274"},{text:"Kant, Critique of Practical Reason",when:"1788"}],example:"Kant argued we can't prove the soul immortal, but morality demands endless progress toward perfection\u2014so we must postulate a life long enough to achieve it.",related:["soul","life-and-death","eternity"],hook:"The part of you that outlasts the body.",quotes:[{text:"Death is nothing to us.",who:"Epicurus",work:"Letter to Menoeceus",when:"c. 300 BC",context:"An argument, not bravado: while we exist death is absent, and when death is present we do not exist. Since all good and evil consist in sensation, there is no subject left for death to harm."}]},{id:"induction",name:"Induction",cluster:"mind",gist:"Reasoning from particular cases to general truths.",framing:"Induction is reasoning from particular cases to general conclusions -- the move from what we observe to laws we did not see. Its power built modern science; its justification remains philosophy's most stubborn problem.",senses:["Generalization from instances","The intuitive grasp of a universal from particulars (epagoge)","Complete (enumerative) vs. incomplete induction","The experimental methods of induction (Mill)"],disputes:[{q:"Can induction be justified?",sides:[{view:"It grounds all empirical science",who:"Aristotle, Bacon, Mill"},{view:"No argument justifies inferring the unobserved from the observed",who:"Hume"}]},{q:"Is induction rational insight or mere habit?",sides:[{view:"A grasp of the universal in the particular",who:"Aristotle"},{view:"Custom and expectation, not reasoning",who:"Hume"}]},{q:"Does science really proceed by induction?",sides:[{view:"Yes -- generalize from gathered data",who:"Bacon, Mill"},{view:"No -- it conjectures and tests, never simply induces",who:"later critics"}]}],positions:[{name:"Aristotle",claim:"Induction leads the mind from particulars to the universal, supplying the principles reason then uses."},{name:"Bacon",claim:"True induction ascends gradually from gathered instances, using tables of presence and absence."},{name:"Hume",claim:"No reasoning justifies the leap from past to future; induction rests on custom, not proof."},{name:"Mill",claim:"Formulates canons -- agreement, difference, residues, concomitant variation -- to find causes."}],topics:["Induction vs. deduction","Enumerative induction","The grasp of universals","The problem of induction","Induction and causation","The methods of experimental inquiry","The uniformity of nature","Probability and induction"],key_texts:[{text:"Aristotle, Posterior Analytics II.19",when:"c. 350 BC"},{text:"Bacon, Novum Organum",when:"1620"},{text:"Hume, Enquiry IV-V",when:"1748"},{text:"Mill, A System of Logic III",when:"1843"}],example:"Hume's challenge: the sun has risen every day, but no argument proves it must rise tomorrow\u2014our confidence is habit, not logic.",related:["experience","hypothesis","reasoning"],hook:"From these cases to the rule.",quotes:[{text:"So far, always.",who:"Hume",work:"Enquiry IV",when:"1748",context:"The most experience can license. That the sun has risen daily gives no demonstrative ground that it must rise tomorrow; the inference relies on an assumed uniformity that experience cannot itself establish."}]},{id:"infinity",name:"Infinity",cluster:"being",gist:"The unbounded\u2014in number, magnitude, or being.",framing:"The infinite is the boundless or unlimited -- in number, magnitude, time, or being. Long treated as a paradox to be tamed, it forces a choice: can the endless actually exist, or only be endlessly approached?",senses:["Potential infinite (always more, never completed) vs. actual infinite (a completed whole)","The infinitely large vs. the infinitely small","The mathematical infinite vs. the metaphysical infinite (God)"],disputes:[{q:"Does an actual infinite exist?",sides:[{view:"Only a potential infinite; no completed infinite in nature",who:"Aristotle"},{view:"Actual infinites are coherent and exist (in mathematics, in God)",who:"Cantor; theologians"}]},{q:"Is the universe infinite?",sides:[{view:"The cosmos is finite and bounded",who:"Aristotle, Ptolemy"},{view:"The universe is infinite or unbounded",who:"atomists, Bruno, Newton's space"}]},{q:"Can the infinite be measured or compared?",sides:[{view:"An infinite cannot be traversed, so time had a beginning",who:"kalam-style arguments"},{view:"Infinite sets have precise, comparable sizes",who:"Cantor"}]}],positions:[{name:"Aristotle",claim:"Rejects the actual infinite; infinity exists only potentially, in division and addition."},{name:"Aquinas",claim:"God alone is actually infinite; all created things are finite."},{name:"Galileo",claim:"Notes paradoxes (as many squares as numbers), warning that infinity defies 'greater' and 'less.'"},{name:"Cantor",claim:"There are different, comparable sizes of infinity; the actual infinite is mathematically respectable."}],topics:["Potential vs. actual infinity","The infinite in magnitude and number","Infinite divisibility of the continuum","The infinity of the world","The infinity of God","Paradoxes of the infinite","The infinitesimal in the calculus","Infinity and the beginning of time"],key_texts:[{text:"Aristotle, Physics III.4-8",when:"c. 350 BC"},{text:"Aquinas, Summa Theologica I Q.7",when:"1265-1274"},{text:"Galileo, Two New Sciences",when:"1638"},{text:"Pascal, Pensees (the two infinities)",when:"1670"}],example:"Cantor showed the infinity of all decimals is strictly larger than the infinity of counting numbers\u2014some infinities dwarf others.",related:["quantity","eternity","mathematics"],hook:"The endless, made a subject.",quotes:[{text:"The actual infinite.",who:"Cantor",work:"Transfinite Numbers",when:"1895",context:"Aristotle had allowed only potential infinity -- a series always extendable, never complete. Cantor treated completed infinite sets as legitimate objects and proved some are larger than others, reversing two millennia of caution."}]},{id:"judgment",name:"Judgment",cluster:"mind",gist:"The act of affirming or denying\u2014where truth is won or lost.",framing:"Judgment is the act of mind that affirms or denies -- joining subject and predicate into something true or false. It is the unit of assertion, the seat of truth, and, in conduct, the exercise of practical wisdom in deciding.",senses:["The mental act of affirming or denying (vs. simple apprehension)","The proposition, as the thing judged","The faculty of subsuming particulars under rules (Kant)","Practical judgment -- good sense in deciding"],disputes:[{q:"Where do truth and falsity reside?",sides:[{view:"In the judgment, not in isolated concepts",who:"Aristotle"},{view:"Elsewhere -- in things, or in language",who:"rival views"}]},{q:"Is judgment a distinct faculty?",sides:[{view:"A special power of subsuming cases under rules, which cannot itself be taught",who:"Kant"},{view:"Reducible to association of ideas",who:"the empiricists"}]},{q:"Are there synthetic a priori judgments?",sides:[{view:"Yes -- and they make mathematics and science possible",who:"Kant"},{view:"No -- judgments are either analytic or empirical",who:"his critics"}]}],positions:[{name:"Aristotle",claim:"Truth and falsehood exist only in the combining and separating of judgment, not in isolated terms."},{name:"Aquinas",claim:"Distinguishes the intellect's simple apprehension from its second act, judgment (composing and dividing)."},{name:"Kant",claim:"Judgment subsumes particulars under universals; how synthetic a priori judgments are possible is his question."},{name:"Hume",claim:"Our factual 'judgments' about cause are really habits of expectation."}],topics:["Judgment as affirmation and denial","The proposition","Truth as belonging to judgment","Kinds of judgment","Analytic vs. synthetic judgments","The faculty of judgment","Practical judgment and prudence"],key_texts:[{text:"Aristotle, On Interpretation",when:"c. 350 BC"},{text:"Aquinas, Summa Theologica I Q.85",when:"1265-1274"},{text:"Kant, Critique of Pure Reason; Critique of Judgment",when:"1781"}],example:"A doctor may know every rule of medicine yet still need judgment to see which rule this patient, with these symptoms, actually calls for.",related:["reasoning","truth","prudence"],hook:"Where a thought becomes true or false.",quotes:[{text:"Truth and falsehood belong to combination and separation.",who:"Aristotle",work:"On Interpretation",when:"c. 350 BC",context:"Neither 'man' nor 'white' is true or false by itself; only joining or dividing them yields something that can be true. This locates truth in the judgment rather than in the concept."}]},{id:"justice",name:"Justice",cluster:"polis",gist:"Giving each their due\u2014the bond of communities.",framing:"Justice is rendering to each his due -- the virtue of persons and the first virtue of societies. What each is owed, whether justice is natural or conventional, and whether it pays to be just are among the oldest and most consequential questions.",senses:["Rendering to each his due (suum cuique)","General justice -- lawfulness and complete virtue toward others -- vs. particular justice","Fairness and equality: distributive (proportionate) and corrective (arithmetic)","The naturally right vs. the merely enacted (natural vs. legal justice)"],disputes:[{q:"Is justice natural or conventional?",sides:[{view:"Grounded in the human good and natural law",who:"Plato, Aristotle, Aquinas"},{view:"The interest of the stronger, mere convention",who:"Thrasymachus, Callicles"},{view:"It arises by covenant, out of the state of nature",who:"Hobbes"}]},{q:"Does it pay to be just?",sides:[{view:"The just soul is healthy and happy; justice is its own reward",who:"Socrates"},{view:"The ring of Gyges suggests we are just only for fear of being caught",who:"Glaucon's challenge"}]},{q:"What is the criterion of distribution?",sides:[{view:"Proportion to merit",who:"Aristotle"},{view:"According to need",who:"Marx"},{view:"Benefit to the least advantaged",who:"Rawls"}]},{q:"Can a law be unjust?",sides:[{view:"An unjust law is no true law",who:"Augustine, Aquinas"},{view:"Law is valid by enactment, whatever its content",who:"legal positivism"}]}],positions:[{name:"Plato",claim:"In the Republic, justice is each part of soul and city doing its own proper work; the just are happier than the unjust."},{name:"Aristotle",claim:"Distinguishes general justice (lawfulness) from particular; divides the latter into distributive (by merit) and corrective."},{name:"Thrasymachus",claim:"Justice is nothing but the advantage of the stronger -- the ruling party's interest encoded as law."},{name:"Aquinas",claim:"Justice is grounded in eternal law; a human law against it is a perversion, not binding in conscience."},{name:"Hobbes",claim:"Before the covenant nothing is unjust; justice begins with the common power that enforces contracts."},{name:"Rawls",claim:"Justice as fairness -- principles chosen behind a veil of ignorance, permitting inequality only to benefit the least advantaged."}],topics:["Justice as a virtue of soul and of society","Rendering each his due","General vs. particular justice","Distributive justice and merit","Corrective and commutative justice","Natural vs. legal justice","The just and the unjust law","Whether the just are happier","Punishment","Justice among nations"],key_texts:[{text:"Plato, Republic",when:"c. 375 BC"},{text:"Aristotle, Nicomachean Ethics V; Politics",when:"c. 340 BC"},{text:"Aquinas, Summa Theologica II-II QQ.57-79",when:"1265-1274"},{text:"Hobbes, Leviathan I-II",when:"1651"},{text:"Rawls, A Theory of Justice (a modern extension beyond the original set)",when:"1971"}],example:"Rawls asks what rules you'd pick for society if you didn't know whether you'd be rich or poor in it\u2014ignorance of your place forcing fairness.",related:["law","virtue-and-vice","liberty"],hook:"To each, their due.",quotes:[{text:"Justice is nothing else than the advantage of the stronger.",who:"Thrasymachus",work:"Plato, Republic I",when:"c. 375 BC",context:"The challenge the whole Republic answers. Justice, he argues, is a con: rulers make laws in their own interest and call obedience virtue. Plato must show the just life is better even when injustice pays."},{text:"Behind a veil of ignorance.",who:"Rawls",work:"A Theory of Justice",when:"1971",context:"The thought experiment: choose society's basic rules without knowing your class, talents, race or beliefs. Self-interest then produces fairness, since you might turn out to be anyone."}]},{id:"knowledge",name:"Knowledge",cluster:"mind",gist:"Justified grasp of what is true\u2014as against mere opinion.",framing:"Knowledge is the mind's grasp of what is true -- but what marks it off from mere belief, and how far it reaches, are the founding questions of epistemology. To know is more than to be right; it is to be right with justification and assurance.",senses:["Justified true belief (vs. opinion and ignorance)","Scientific knowledge of causes vs. practical know-how","Knowledge by acquaintance vs. by description","A priori vs. empirical knowledge"],disputes:[{q:"What is the source of knowledge?",sides:[{view:"Reason and innate ideas",who:"the rationalists"},{view:"Sense-experience",who:"the empiricists"}]},{q:"Is certain knowledge possible?",sides:[{view:"Yes -- of first principles, the cogito, mathematics",who:"Descartes, the rationalists"},{view:"No -- suspend judgment",who:"the skeptics"}]},{q:"What is the object of knowledge?",sides:[{view:"The unchanging universal or Form",who:"Plato"},{view:"Particulars grasped through the senses",who:"the empiricists"}]}],positions:[{name:"Plato",claim:"Knowledge is of the eternal Forms, distinct from opinion about sensibles -- true belief 'with an account.'"},{name:"Aristotle",claim:"To know scientifically is to know the cause -- why the thing cannot be otherwise -- reached from experience."},{name:"Descartes",claim:"Clear and distinct perception, starting from the cogito, yields an indubitable foundation."},{name:"Hume",claim:"Limits knowledge to relations of ideas and matters of fact; causal 'knowledge' is only probable belief."},{name:"Kant",claim:"Knowledge needs both intuition and concept: thoughts without content are empty, intuitions without concepts blind."}],topics:["Knowledge vs. opinion and belief","The sources of knowledge","The possibility of certainty","Scientific knowledge and its objects","A priori vs. empirical knowledge","The limits of knowledge","Skepticism","Degrees of assent"],key_texts:[{text:"Plato, Theaetetus; Meno; Republic",when:"c. 369 BC"},{text:"Aristotle, Posterior Analytics",when:"c. 350 BC"},{text:"Descartes, Meditations",when:"c. 175 AD"},{text:"Hume, Enquiry",when:"1748"},{text:"Kant, Critique of Pure Reason",when:"1781"}],example:"Plato's Meno: a slave boy 'discovers' a geometry proof by answering questions, suggesting knowledge is recollected and grounded, not just true by luck.",related:["opinion","truth","experience"],hook:"Truth you can stand on.",quotes:[{text:"True opinion tied down by an account.",who:"Plato",work:"Meno",when:"c. 385 BC",context:"Plato's answer to what separates knowledge from a lucky true guess. Right belief is unstable and can run away; knowledge is belief anchored by reasons for it."}]},{id:"labor",name:"Labor",cluster:"polis",gist:"Human work\u2014its dignity, its burden, its value.",framing:"Labor is the toil by which human beings wrest their living from nature and transform the world. Long despised as servile, it was raised by the moderns to the source of value, of property, and even of human self-making.",senses:["Toil or work (the effort of production)","The source of economic value (the labor theory)","A servile burden vs. dignified self-realization","Manual vs. intellectual labor"],disputes:[{q:"Is labor degrading or ennobling?",sides:[{view:"Servile toil, unfit for the free, who need leisure",who:"the ancients"},{view:"The dignity and very essence of man",who:"Locke, Marx"}]},{q:"Is labor the source of value?",sides:[{view:"Value comes from the labor embodied in goods",who:"Smith, Ricardo, Marx"},{view:"Value comes from utility, scarcity, and demand",who:"later economists"}]},{q:"Does labor ground property?",sides:[{view:"Mixing one's labor with nature makes it one's own",who:"Locke"},{view:"Property has other, conventional foundations",who:"his critics"}]}],positions:[{name:"Aristotle",claim:"Manual labor is servile and, ideally, left to others so citizens may have leisure for politics and thought."},{name:"Locke",claim:"Labor is the origin of property -- what a man mixes his labor with becomes his own."},{name:"Adam Smith",claim:"Labor is the real measure of value; the division of labor multiplies its power."},{name:"Marx",claim:"Labor is man's essential activity, but under capitalism it is alienated -- the worker estranged from product and self."}],topics:["The nature and dignity of labor","Labor and leisure","Labor as the source of value","The division of labor","Labor and property","The alienation of labor","Manual vs. intellectual work","Labor, capital, and class"],key_texts:[{text:"Aristotle, Politics I",when:"c. 335 BC"},{text:"Locke, Second Treatise (V)",when:"1689"},{text:"Adam Smith, The Wealth of Nations",when:"1776"},{text:"Marx, Capital; Economic and Philosophic Manuscripts",when:"1844"}],example:"Adam Smith's pin factory: one worker alone makes a few pins a day, but ten dividing the steps make thousands\u2014the division of labor multiplying output.",related:["wealth","slavery","justice"],hook:"Work that makes and remakes the world.",quotes:[{text:"He hath mixed his labour with it.",who:"Locke",work:"Second Treatise V",when:"1689",context:"The labor theory of property. What is held in common becomes private when someone works on it -- provided, Locke adds, enough and as good is left for others, a proviso later readers press hard."}]},{id:"language",name:"Language",cluster:"expr",gist:"The system of signs by which minds meet.",framing:"Language is the system of signs by which we mean and communicate -- the medium of thought, society, and tradition. Its origin, its relation to reality and to thought, and whether its structure limits or enables us are enduring questions.",senses:["A system of conventional signs (words)","Speech (the distinctively human power) vs. writing","The inner word (thought) vs. its outward expression","Natural language vs. formal or ideal languages"],disputes:[{q:"Is language natural or conventional?",sides:[{view:"Words are conventional signs, by agreement",who:"Aristotle"},{view:"Names fit their objects by nature",who:"one side of Plato's Cratylus"}]},{q:"Does language mirror reality or shape it?",sides:[{view:"It names a pre-given reality or thought",who:"the classical view"},{view:"Its structure shapes how we think and what we can say",who:"the moderns"}]},{q:"Is thought possible without language?",sides:[{view:"Thought precedes and could exist without words",who:"the traditional view"},{view:"Thought is bound up with, even constituted by, language",who:"modern challenges"}]}],positions:[{name:"Plato",claim:"The Cratylus debates whether names are correct by nature or by convention, without fully deciding."},{name:"Aristotle",claim:"Spoken words are symbols of affections in the soul; they signify by convention, not by nature."},{name:"Augustine",claim:"Reflects on how words are learned and how they point beyond themselves to things and to the inner teacher."},{name:"Hobbes",claim:"Names are marks for memory and signs for communication; truth lies in their right ordering."},{name:"Locke",claim:"Words stand for ideas in the speaker's mind; misused language is a chief source of error."}],topics:["The nature and origin of language","Natural vs. conventional signs","Language and thought","Words and meaning","Language and reality","The abuse of words","Grammar and logic","The diversity of languages"],key_texts:[{text:"Plato, Cratylus",when:"c. 385 BC"},{text:"Aristotle, On Interpretation",when:"c. 350 BC"},{text:"Augustine, On the Teacher; Confessions I",when:"389 AD"},{text:"Hobbes, Leviathan I",when:"1651"},{text:"Locke, Essay III",when:"1689"}],example:"In the Cratylus, one side says names fit their things by nature, the other that 'dog' could equally have been any sound we all agreed to use.",related:["sign-and-symbol","rhetoric","definition"],hook:"Signs that let minds meet.",quotes:[{text:"Words are the signs of ideas.",who:"Locke",work:"Essay III",when:"1689",context:"The doctrine that makes meaning private: a word stands for an idea in the speaker's mind. Locke draws the consequence that most disputes are verbal, arising from men using the same words for different ideas."}]},{id:"law",name:"Law",cluster:"polis",gist:"The rule of reason binding a community.",framing:"Law is the rule of conduct laid down by authority for the common good -- binding a community and backed by force. What law is, where its authority comes from, and how it relates to justice and morality are the central questions of jurisprudence.",senses:["An ordinance of reason for the common good, promulgated by authority (Aquinas)","The command of a sovereign backed by sanction (positivism)","The kinds of law -- eternal, natural, human, divine","Law vs. mere force or custom"],disputes:[{q:"What makes a law valid -- justice or enactment?",sides:[{view:"A law contrary to natural justice is no true law",who:"the natural-law tradition"},{view:"Law is valid if duly enacted, whatever its content",who:"legal positivism"}]},{q:"Is there a natural law above human law?",sides:[{view:"Yes -- an unchanging law, knowable by reason, binding all",who:"the Stoics, Aquinas, Locke"},{view:"No -- all law is human posit or command",who:"the positivists"}]},{q:"Must unjust laws be obeyed?",sides:[{view:"Unjust laws do not bind in conscience",who:"Aquinas, King"},{view:"Even bad laws must be obeyed for the sake of order",who:"the order-first view"}]}],positions:[{name:"Aristotle",claim:"Law is 'reason free from passion'; the rule of law is preferable to the rule of any individual."},{name:"Cicero",claim:"There is one eternal, natural law, the same for all, from which just human laws derive."},{name:"Aquinas",claim:"Law is an ordinance of reason for the common good; human law draws its force from the natural law."},{name:"Hobbes",claim:"Law is the command of the sovereign; without a common power to enforce it, covenants are but words."},{name:"Austin",claim:"Law is the command of the sovereign backed by sanction -- its existence is one thing, its merit another."}],topics:["The definition of law","The kinds of law (eternal, natural, human, divine)","Law and reason","Law and the common good","Natural law vs. positive law","Law and justice","The obligation to obey","The rule of law"],key_texts:[{text:"Aristotle, Politics III; Nicomachean Ethics V",when:"c. 340 BC"},{text:"Cicero, On the Laws",when:"c. 51 BC"},{text:"Aquinas, Summa Theologica I-II QQ.90-97",when:"1265-1274"},{text:"Hobbes, Leviathan II",when:"1651"},{text:"Austin, The Province of Jurisprudence Determined",when:"1832"}],example:"Aquinas holds a law that violates reason and the common good is 'no law but a corruption of law'\u2014mere force wearing law's clothes.",related:["justice","government","custom-and-convention"],hook:"Reason made binding.",quotes:[{text:"An ordinance of reason for the common good.",who:"Aquinas",work:"Summa Theologica I-II Q.90",when:"1271",context:"Every word does work. Law must be reasonable (not mere will), aimed at the common rather than a private good, made by proper authority, and promulgated. A decree failing these is not law but violence."},{text:"Law is reason free from passion.",who:"Aristotle",work:"Politics III",when:"c. 335 BC",context:"The case for the rule of law over the rule of men: even a good ruler is subject to anger and appetite, whereas a standing law is not -- though Aristotle grants law's generality can fail the particular case."}]},{id:"liberty",name:"Liberty",cluster:"polis",gist:"Freedom from constraint\u2014and freedom for the good.",framing:"Liberty is freedom -- the absence of constraint and the power of self-determination. What it is to be free, in the soul, in the state, and before the law, and how liberty is reconciled with authority and with others' freedom, are central to ethics and politics.",senses:["Political liberty (freedom from arbitrary rule, under law)","Personal and civil liberty (rights and a protected private sphere)","'Negative' liberty (absence of interference) vs. 'positive' liberty (self-mastery)","Free will (the freedom of choice)"],disputes:[{q:"What is liberty -- non-interference or self-mastery?",sides:[{view:"The absence of external restraint",who:"Hobbes, Mill"},{view:"Self-rule -- obedience to a law one gives oneself",who:"Rousseau, Kant"}]},{q:"Is liberty opposed to law, or secured by it?",sides:[{view:"Every law is a restraint on liberty",who:"Hobbes"},{view:"Where there is no law there is no freedom -- law secures liberty",who:"Locke"}]},{q:"How far may liberty be limited?",sides:[{view:"Only to prevent harm to others (the harm principle)",who:"Mill"},{view:"Society may also enforce morality and the common good",who:"his critics"}]}],positions:[{name:"Hobbes",claim:"Liberty is the absence of external impediments; subjects are free wherever the law is silent."},{name:"Locke",claim:"Freedom is not license but life under a known law; where there is no law, there is no freedom."},{name:"Rousseau",claim:"Civil liberty is obedience to the general will -- the law one prescribes to oneself; man is 'forced to be free.'"},{name:"Kant",claim:"Freedom is autonomy -- the will's self-legislation of the moral law."},{name:"Mill",claim:"Over himself the individual is sovereign; liberty may be restrained only to prevent harm to others."}],topics:["The meaning of liberty","Negative vs. positive liberty","Liberty and law","Political and civil liberty","Freedom of thought and speech","The limits of liberty","Liberty and authority","Free will and freedom"],key_texts:[{text:"Hobbes, Leviathan II",when:"1651"},{text:"Locke, Second Treatise",when:"1689"},{text:"Rousseau, The Social Contract",when:"1762"},{text:"Kant, Groundwork",when:"1785"},{text:"Mill, On Liberty",when:"1859"}],example:"Mill's harm principle draws the line: your liberty to swing your fist ends where another's nose begins; society may restrain you only to prevent harm to others.",related:["justice","democracy","will"],hook:"Free from constraint, free for the good.",quotes:[{text:"Forced to be free.",who:"Rousseau",work:"The Social Contract I",when:"1762",context:"The tradition's most contested phrase. Rousseau means that compelling someone to obey a law he helped make frees him from personal domination -- critics have read it as licence for coercion in freedom's name."},{text:"Over himself, over his own body and mind, the individual is sovereign.",who:"Mill",work:"On Liberty I",when:"1859",context:"The harm principle. Society may restrain us only to prevent harm to others -- his own good, physical or moral, is not sufficient warrant, however much others disapprove."}]},{id:"life-and-death",name:"Life and Death",cluster:"nature",gist:"The line between the living and the lifeless\u2014and its crossing.",framing:"Life is what distinguishes the living from the inert -- self-nourishing, growing, self-moving; death is its cessation. What life is, whether it is more than matter in motion, and what death means for the self are among the deepest human concerns.",senses:["The activity of an organized, ensouled body (nutrition, growth, reproduction)","Biological life vs. the 'life' of mind or spirit","Death as the parting of soul and body vs. the breakdown of the organism","Mortality as the human condition"],disputes:[{q:"Is life reducible to matter and mechanism?",sides:[{view:"Life needs a special vital principle or soul",who:"the vitalists"},{view:"Life is physico-chemical process",who:"the mechanists"}]},{q:"Is death the end of the self, or a passage?",sides:[{view:"Death is annihilation -- 'nothing to us'",who:"Epicurus"},{view:"Death frees the immortal soul",who:"Plato"}]},{q:"Should death be feared?",sides:[{view:"No -- it is either nothing or a good",who:"Socrates, Epicurus"},{view:"It is the ultimate evil, to be resisted",who:"the common fear"}]}],positions:[{name:"Aristotle",claim:"Life is the self-nutrition, growth, and decay of a naturally organized body; the soul is its principle."},{name:"Epicurus",claim:"'Death is nothing to us': where we are, death is not; where death is, we are not."},{name:"Plato",claim:"The philosopher practices dying -- the soul's release from the body to contemplate the Forms."},{name:"Montaigne",claim:"'To philosophize is to learn to die'; facing mortality frees us to live."}],topics:["The definition of life","The living vs. the non-living","The principle of life (soul or mechanism)","Reproduction and growth","The meaning of death","The fear of death","Immortality and mortality","Life, death, and the good"],key_texts:[{text:"Aristotle, On the Soul II",when:"c. 350 BC"},{text:"Plato, Phaedo",when:"c. 380 BC"},{text:"Epicurus, Letter to Menoeceus",when:"c. 300 BC"},{text:"Lucretius, On the Nature of Things III",when:"c. 55 BC"},{text:"Montaigne, Essays",when:"1580"}],example:"Montaigne kept death in view not to be morbid but to disarm it\u2014'he who has learned how to die has unlearned how to be a slave.'",related:["animal","soul","immortality"],hook:"The vital spark, and its going out.",quotes:[{text:"To philosophize is to learn to die.",who:"Montaigne",work:"Essays I.20",when:"1580",context:"Borrowed from Cicero. Montaigne's version is practical: rehearsing mortality strips death of its strangeness and frees us to live without being ambushed by it."}]},{id:"logic",name:"Logic",cluster:"mind",gist:"The science of valid inference.",framing:"Logic is the study of the forms of valid reasoning -- of what follows from what, apart from particular content. It is at once an instrument of every science and a discipline debated as art, science, or the very laws of thought.",senses:["The art or instrument of reasoning (the Organon)","Formal logic (validity by form: syllogism, inference)","The laws of thought (identity, non-contradiction, excluded middle)","Symbolic or mathematical logic"],disputes:[{q:"Is logic about thought or about being?",sides:[{view:"The laws of correct thinking",who:"Kant's 'general logic'"},{view:"The most general laws of reality itself",who:"Hegel and some metaphysicians"}]},{q:"Is logic a science or only an instrument?",sides:[{view:"A genuine science",who:"the Stoics, moderns"},{view:"Merely a tool serving the other sciences",who:"much of the tradition"}]},{q:"Is the syllogism the whole of logic?",sides:[{view:"The syllogism is essentially complete",who:"the Aristotelian tradition"},{view:"Modern logic of relations and quantifiers vastly extends it",who:"Frege, Russell"}]}],positions:[{name:"Aristotle",claim:"Founds logic with the syllogism: from two premises a conclusion follows by form alone."},{name:"The Stoics",claim:"Develop a logic of propositions and if-then inference, complementing Aristotle's."},{name:"Kant",claim:"Logic is the a priori science of the understanding's forms; adds a 'transcendental logic.'"},{name:"Frege and Russell",claim:"Recast logic in symbolic, mathematical form, capturing relations and generality."}],topics:["The subject and use of logic","The syllogism and valid inference","The laws of thought","Terms, propositions, and arguments","Deduction vs. induction","Formal vs. material validity","Symbolic logic","Logic and language"],key_texts:[{text:"Aristotle, Prior and Posterior Analytics",when:"c. 350 BC"},{text:"Kant, Critique of Pure Reason (Transcendental Logic)",when:"1781"},{text:"Mill, A System of Logic",when:"1843"},{text:"Frege and Russell (modern logic)",when:"1879-1913"}],example:"Aristotle's syllogism: all men are mortal, Socrates is a man, therefore Socrates is mortal\u2014the conclusion forced by form alone, whatever the terms.",related:["reasoning","dialectic","definition"],hook:"What follows from what.",quotes:[{text:"Reason is nothing but reckoning.",who:"Hobbes",work:"Leviathan V",when:"1651",context:"Reasoning is adding and subtracting names and their consequences -- an early conception of thought as computation, three centuries before machines that could perform it."}]},{id:"love",name:"Love",cluster:"good",gist:"The force that binds\u2014desire, friendship, charity.",framing:"Love is the movement of the soul toward what it finds good or beautiful, and the bond that unites persons. Ranging from bodily desire to friendship to the love of God, it is at once the deepest human experience and a cosmic principle.",senses:["Eros -- desiring, passionate love, longing for beauty","Philia -- friendship, affection between equals","Agape or caritas -- self-giving, charitable love","Love of the good and of God; self-love"],disputes:[{q:"Is love desire for what one lacks, or gift of what one has?",sides:[{view:"Eros as lack, longing for beauty",who:"Plato"},{view:"Agape as generous self-giving, willing the other's good",who:"the Christian tradition"}]},{q:"Is love selfish or selfless at root?",sides:[{view:"All love is finally self-love or self-interest",who:"Hobbes, La Rochefoucauld"},{view:"Genuine love wills the good of the other for their own sake",who:"Aristotle, Aquinas"}]},{q:"Can love be commanded, or is it a passion beyond will?",sides:[{view:"Charity is a commanded love, an act of will",who:"the theologians"},{view:"Love is a passion that simply befalls us",who:"the romantics"}]}],positions:[{name:"Plato",claim:"Eros is the soul's longing, ascending from beautiful bodies to Beauty itself -- the ladder of love."},{name:"Aristotle",claim:"Analyzes friendship -- of utility, pleasure, and virtue; the best is mutual love of the good."},{name:"Augustine",claim:"Rightly ordered love (caritas) turns the soul to God; disordered love (cupiditas) to lesser goods."},{name:"Aquinas",claim:"To love is to will the good of another; charity is the highest of the virtues."},{name:"Freud",claim:"Love (libido) is rooted in the sexual drive, sublimated into higher aims."}],topics:["The kinds of love (eros, philia, agape)","Love and desire","Love and friendship","The ascent of love","Self-love and love of others","Love of God","Whether love can be commanded","Love and the good"],key_texts:[{text:"Plato, Symposium; Phaedrus",when:"c. 385 BC"},{text:"Aristotle, Nicomachean Ethics VIII-IX",when:"c. 340 BC"},{text:"Augustine, Confessions",when:"c. 400 AD"},{text:"Aquinas, Summa Theologica II-II QQ.23-27",when:"1265-1274"}],example:"Plato's ladder of love climbs from one beautiful body, to all bodies, to beautiful souls and laws, and finally to Beauty itself\u2014desire schooled upward.",related:["desire","beauty","family"],hook:"The force that binds.",quotes:[{text:"Our heart is restless until it rests in you.",who:"Augustine",work:"Confessions I",when:"c. 400 AD",context:"The book's thesis in its first paragraph. Every desire is finally desire for God; the wandering recounted in the Confessions is love mistaking its object, not lacking one."}]},{id:"man",name:"Man",cluster:"nature",gist:"The rational animal\u2014subject and object of every inquiry.",framing:"Man is the being who asks what he is -- the 'rational animal,' the union of body and soul, the maker of tools, language, and cities. Every conception of human nature carries consequences for ethics, politics, and the meaning of life.",senses:["Rational animal (defined by reason and speech)","Image of God (the theological view)","One animal among others (the naturalist view)","Maker, worker, and social-political being"],disputes:[{q:"What defines the human?",sides:[{view:"Reason and speech",who:"Aristotle"},{view:"Tool-making and labor",who:"Franklin, Marx"},{view:"The image of God",who:"the theological tradition"}]},{q:"Is human nature fixed or made?",sides:[{view:"A fixed nature or essence",who:"the classical view"},{view:"Self-made through history and society",who:"Marx, the existentialists"}]},{q:"Is man good or corrupt by nature?",sides:[{view:"Naturally social and good",who:"Aristotle, Rousseau"},{view:"Naturally at war and self-interested",who:"Hobbes"},{view:"Fallen and in need of grace",who:"the theologians"}]}],positions:[{name:"Aristotle",claim:"Man is the rational animal and by nature a political animal, fulfilled only in the city."},{name:"Pico della Mirandola",claim:"Man has no fixed nature; he is free to shape himself toward beast or angel."},{name:"Hobbes",claim:"Man is matter in motion, driven by appetite; without a common power life is 'nasty, brutish, and short.'"},{name:"Pascal",claim:"Man is a paradox -- a thinking reed, wretched and great, suspended between beast and angel."},{name:"Kant",claim:"The human being is a person, an end in himself, belonging to a kingdom of ends."}],topics:["The definition of man","Reason and speech","The union of soul and body","Man and the other animals","Man as social and political","Human nature -- fixed or made","The dignity of the person","Man's place in the cosmos"],key_texts:[{text:"Sophocles, Antigone (Ode to Man)",when:"441 BC"},{text:"Aristotle, Nicomachean Ethics; Politics",when:"c. 340 BC"},{text:"Pico, Oration on the Dignity of Man",when:"1486"},{text:"Pascal, Pensees",when:"1670"},{text:"Kant, Groundwork of the Metaphysics of Morals",when:"1797"}],example:"Pascal: man is a reed, the weakest in nature, but a thinking reed\u2014the universe can crush him, yet he knows it does, and it knows nothing.",related:["animal","soul","mind"],hook:"The animal that asks what it is.",quotes:[{text:"Solitary, poor, nasty, brutish, and short.",who:"Hobbes",work:"Leviathan XIII",when:"1651",context:"His description of life without a common power, not of human nature as such. The bleakness is the argument for the sovereign: men are not beasts, but without enforcement their reasonable fear makes conflict rational."},{text:"Man is a thinking reed.",who:"Pascal",work:"Pensees",when:"1670",context:"The universe can crush him without knowing it does; he dies knowing. Human greatness lies precisely in the awareness of human frailty."}]},{id:"mathematics",name:"Mathematics",cluster:"mind",gist:"The science of number, magnitude, and pure form.",framing:"Mathematics is the science of number, magnitude, and pattern -- the very model of certain, demonstrative knowledge. What its objects are, and why it applies so uncannily to the world, are enduring puzzles.",senses:["The science of quantity (number and magnitude)","The study of abstract structure and form","Pure vs. applied mathematics","The language of nature"],disputes:[{q:"What are mathematical objects?",sides:[{view:"Real, eternal entities the mind discovers",who:"Platonism"},{view:"Abstractions from sensible things, or mental constructions",who:"Aristotle, the intuitionists"},{view:"Mere marks and rules",who:"formalism"}]},{q:"Are mathematical truths a priori or empirical?",sides:[{view:"A priori and necessary",who:"most of the tradition"},{view:"Very general inductions from experience",who:"Mill"}]},{q:"Why does mathematics fit the world?",sides:[{view:"Because nature itself is mathematical",who:"Galileo, Descartes"},{view:"Because we impose mathematical form on appearances",who:"Kant"}]}],positions:[{name:"Plato",claim:"Mathematics studies eternal objects and turns the soul from becoming toward being."},{name:"Aristotle",claim:"The mathematician studies the quantitative aspects of things by abstraction, not separate entities."},{name:"Descartes",claim:"Makes mathematics the model of method and unites algebra with geometry."},{name:"Kant",claim:"Mathematical knowledge is synthetic a priori, grounded in the pure intuitions of space and time."},{name:"Mill",claim:"Even mathematics rests on very general inductions from experience."}],topics:["The objects of mathematics","Number and magnitude","Mathematical certainty and demonstration","A priori vs. empirical status","The applicability of mathematics","The infinite in mathematics","Pure vs. applied mathematics","Mathematics and philosophy"],key_texts:[{text:"Euclid, Elements",when:"c. 300 BC"},{text:"Plato, Republic VII",when:"c. 375 BC"},{text:"Aristotle, Metaphysics XIII-XIV",when:"c. 340 BC"},{text:"Descartes, Geometry",when:"1637"},{text:"Kant, Critique of Pure Reason",when:"1781"}],example:"Euclid builds an entire geometry from five postulates, showing how vast, certain knowledge can grow from a handful of self-evident starting points.",related:["quantity","knowledge","science"],hook:"Certainty built from axioms.",quotes:[{text:"There is no royal road to geometry.",who:"Euclid",work:"attributed",when:"c. 300 BC",context:"Said to have been his reply to a king who wanted an easier path. Demonstration cannot be shortened by rank: the proof must be walked through by anyone who would know."}]},{id:"matter",name:"Matter",cluster:"being",gist:"The stuff underlying change and bodily existence.",framing:"Matter is that out of which things are made and that which persists through their changes -- the stuff, substratum, or bodily principle of the world. Whether matter is all there is, or the lowest rung of a richer reality, divides materialists from their opponents.",senses:["Physical stuff or body","The substratum of change","Prime matter (pure potentiality, formless)","Extension (Descartes) or mass-energy (physics)"],disputes:[{q:"Is matter all that exists?",sides:[{view:"Only matter is real; mind is material too",who:"Democritus, Hobbes"},{view:"Mind or spirit is irreducible to matter",who:"Plato, Descartes, idealists"}]},{q:"What is matter's nature?",sides:[{view:"Matter is extension in space",who:"Descartes"},{view:"Matter is potentiality, actualized by form",who:"Aristotle"},{view:"'Matter' is only perceptions; no mind-independent stuff",who:"Berkeley"}]},{q:"Is matter continuous or atomic?",sides:[{view:"Continuous and infinitely divisible",who:"Aristotle, Descartes"},{view:"Composed of atoms in the void",who:"the atomists"}]}],positions:[{name:"Lucretius",claim:"Nothing exists but atoms and void; even soul is made of fine atoms."},{name:"Aristotle",claim:"Matter is potentiality; prime matter has no form of its own but can take on all forms."},{name:"Descartes",claim:"Matter is res extensa, pure extension, wholly distinct from thinking substance."},{name:"Hobbes",claim:"All that exists is body in motion; there is no incorporeal substance."},{name:"Berkeley",claim:"To be is to be perceived; mind-independent 'matter' is an incoherent abstraction."}],topics:["The meaning of matter","Matter and form","Prime matter and potentiality","Matter as extension","The atomic constitution of matter","Matter and mind (materialism)","The divisibility of matter","Matter and individuation","The conservation of matter"],key_texts:[{text:"Lucretius, On the Nature of Things",when:"c. 55 BC"},{text:"Aristotle, Physics I; Metaphysics VII",when:"c. 340 BC"},{text:"Descartes, Principles of Philosophy",when:"1644"},{text:"Berkeley, Principles of Human Knowledge",when:"1710"},{text:"Hobbes, Leviathan I",when:"1651"}],example:"Aristotle's 'prime matter' is pure potential\u2014no shape, size, or quality of its own\u2014knowable only as the 'what' that takes on form.",related:["form","element","mind"],hook:"The stuff that takes on shape.",quotes:[{text:"To be is to be perceived.",who:"Berkeley",work:"Principles",when:"1710",context:"Not the claim that things vanish when unobserved -- Berkeley holds God perceives them continually. His target is the notion of matter existing wholly unperceived, which he argues is unintelligible."}]},{id:"mechanics",name:"Mechanics",cluster:"nature",gist:"The science of motion and force.",framing:"Mechanics is the science of motion and its causes -- of forces, bodies, and machines. As the first branch of physics to be fully mathematized, it became the model of exact science and the heart of the mechanical worldview.",senses:["The science of machines (the lever and simple machines)","The general science of motion and force (statics, dynamics)","The mechanical philosophy -- all nature as matter in motion","Celestial vs. terrestrial mechanics"],disputes:[{q:"Can all of nature be explained mechanically?",sides:[{view:"Yes -- everything is matter in motion, pushing and pulling",who:"the mechanical philosophy"},{view:"No -- life, mind, and ends resist mechanism",who:"its critics"}]},{q:"Is motion natural, or does it require a cause?",sides:[{view:"Bodies seek their natural places; motion needs a mover",who:"Aristotle"},{view:"Bodies persist in motion by inertia unless forced",who:"Galileo, Newton"}]},{q:"Is action at a distance intelligible?",sides:[{view:"Gravity acts across empty space",who:"Newton's law"},{view:"Only contact and impulse are intelligible",who:"Descartes, the mechanists"}]}],positions:[{name:"Archimedes",claim:"Founds statics -- the law of the lever and the principle of buoyancy."},{name:"Galileo",claim:"Establishes the law of falling bodies and inertia, mathematizing terrestrial motion."},{name:"Descartes",claim:"Makes matter in motion, governed by impact and conserved motion, the key to all nature."},{name:"Newton",claim:"Three laws of motion plus universal gravitation unify mechanics into one system."}],topics:["The simple machines","Statics and dynamics","The laws of motion","Inertia and force","The mechanical philosophy","Action at a distance","Celestial vs. terrestrial mechanics","The conservation laws"],key_texts:[{text:"Archimedes, On the Equilibrium of Planes",when:"c. 250 BC"},{text:"Galileo, Two New Sciences",when:"1638"},{text:"Descartes, Principles II",when:"1644"},{text:"Newton, Principia",when:"1687"}],example:"Newton's insight: the same force pulling an apple down holds the Moon in orbit\u2014terrestrial and celestial motion obey one law.",related:["physics","cause","change"],hook:"Motion, made exact.",quotes:[{text:"Give me a place to stand and I will move the earth.",who:"Archimedes",work:"attributed",when:"c. 250 BC",context:"His boast about the lever. The point is that mechanical advantage has no theoretical limit: any weight can be moved by any force, given enough length of arm."}]},{id:"medicine",name:"Medicine",cluster:"nature",gist:"The art and science of health and healing.",framing:"Medicine is the art and science of health and healing -- of the body's balance, its diseases, and their cure. It raises questions of art versus science, of nature's role in healing, and of the physician's ethical duties.",senses:["A practical art (techne) of healing","A science of the body and its causes","Preventive vs. curative medicine","Health as balance vs. as the absence of disease"],disputes:[{q:"Is medicine an art or a science?",sides:[{view:"A conjectural practical art, judging particulars",who:"the Hippocratic view"},{view:"A rigorous science of causes",who:"the modern aspiration"}]},{q:"Does the physician heal, or only assist nature?",sides:[{view:"Nature is the true healer; the doctor removes obstacles",who:"Hippocrates"},{view:"Active intervention masters disease",who:"modern medicine"}]},{q:"What is health?",sides:[{view:"A balance of the body's humors or constituents",who:"Galen"},{view:"The proper functioning of parts; the absence of pathology",who:"the modern view"}]}],positions:[{name:"Hippocrates",claim:"Disease has natural, not divine, causes; the physician aids nature and, first, does no harm."},{name:"Galen",claim:"Systematizes the four humors, whose balance is health and imbalance disease."},{name:"Descartes",claim:"The body is a machine; medicine studies its mechanism in order to repair it."},{name:"Claude Bernard",claim:"Founds experimental medicine, seeking the constancy of the body's internal environment."}],topics:["Medicine as art and science","The causes of disease","Health as balance","The healing power of nature","Diagnosis and prognosis","The physician's method","Preventive medicine","Medical ethics"],key_texts:[{text:"Hippocrates, Airs, Waters, Places; the Oath",when:"c. 400 BC"},{text:"Galen, On the Natural Faculties",when:"c. 180 AD"},{text:"Descartes, Treatise on Man",when:"1662"},{text:"Claude Bernard, Introduction to the Study of Experimental Medicine",when:"1865"}],example:"Hippocrates broke with superstition by treating epilepsy, the 'sacred disease,' as having natural causes like any other illness\u2014medicine as science, not magic.",related:["life-and-death","animal","art"],hook:"Knowledge aimed at healing.",quotes:[{text:"First, do no harm.",who:"Hippocrates",work:"the Hippocratic corpus",when:"c. 400 BC",context:"The physician's restraint, following from the view that nature is the true healer. Since intervention can worsen what would have mended, the burden lies on the one who acts."}]},{id:"memory-and-imagination",name:"Memory and Imagination",cluster:"mind",gist:"The powers that retain the past and picture the absent.",framing:"Memory retains and recovers the past; imagination forms images of what is absent, past, or merely possible. Together they mediate between sense and thought -- the storehouse and the workshop of the mind.",senses:["Memory as retention and recollection of the past","Imagination as image-making: reproductive (recombining) vs. productive (creating)","Imagination as the bridge between sense and intellect","Fancy vs. the shaping imagination"],disputes:[{q:"Is memory a passive trace or an active reconstruction?",sides:[{view:"A stored impression or imprint",who:"the classic image"},{view:"An active recollection that reconstructs",who:"later views"}]},{q:"Is imagination merely reproductive or genuinely creative?",sides:[{view:"It only recombines what sense supplied",who:"Hobbes, Hume"},{view:"It is productive and shaping",who:"Kant, the Romantics"}]},{q:"What is imagination's role in knowledge?",sides:[{view:"Indispensable -- the soul never thinks without an image",who:"Aristotle"},{view:"A source of error to be disciplined",who:"the rationalists"}]}],positions:[{name:"Aristotle",claim:"Memory is of the past and belongs to the image-making power; the soul never thinks without a phantasm."},{name:"Augustine",claim:"Marvels at the vast 'fields and palaces of memory' where the self and even God are sought."},{name:"Hobbes",claim:"Imagination is 'decaying sense'; memory is sense remembered."},{name:"Hume",claim:"Imagination freely combines ideas, but only from materials given by impressions."},{name:"Kant",claim:"The productive imagination synthesizes the manifold, mediating intuition and concept."}],topics:["Memory and the past","Recollection vs. retention","The arts of memory","Imagination as image-making","Reproductive vs. productive imagination","Imagination and knowledge","Imagination and creativity","Memory, imagination, and error"],key_texts:[{text:"Aristotle, On Memory; On the Soul III",when:"c. 350 BC"},{text:"Augustine, Confessions X",when:"c. 400 AD"},{text:"Hobbes, Leviathan I",when:"1651"},{text:"Hume, Treatise I",when:"1739"},{text:"Kant, Critique of Pure Reason",when:"1781"}],example:"Augustine marvels at memory as vast fields and palaces where he meets himself and even recalls forgetting\u2014an inner world larger than the outer.",related:["sense","idea","mind"],hook:"Holding the past, picturing the absent.",quotes:[{text:"The fields and vast palaces of memory.",who:"Augustine",work:"Confessions X",when:"c. 400 AD",context:"Augustine is astonished that the mind cannot contain itself: memory holds images, skills, emotions, even the idea of God, yet he cannot find where it keeps them or reach its limit."}]},{id:"metaphysics",name:"Metaphysics",cluster:"being",gist:"First philosophy: the study of being as being.",framing:"Metaphysics is the inquiry into the first principles and ultimate nature of reality -- being as such, substance, cause, God, and the categories every other science presupposes. Its very possibility as knowledge has been repeatedly affirmed and denied.",senses:["The science of being as being (ontology)","'First philosophy' -- first causes and principles","The study of what lies beyond physics (God, soul, cosmos)","The a priori structure of thought (Kant's transformed sense)"],disputes:[{q:"Is metaphysics possible as a science?",sides:[{view:"Yes -- the science of being and first causes",who:"Aristotle, Aquinas"},{view:"No -- it oversteps possible experience and breeds illusion",who:"Hume, the positivists"},{view:"Only as a critique of reason's own limits",who:"Kant"}]},{q:"What is metaphysics about?",sides:[{view:"Being as being, in general (ontology)",who:"Aristotle"},{view:"The supreme being, God (special metaphysics)",who:"the theological tradition"}]},{q:"Are metaphysical statements meaningful?",sides:[{view:"They state deep truths about reality",who:"the realists"},{view:"They are literally meaningless -- neither empirical nor logical",who:"logical positivists"}]}],positions:[{name:"Aristotle",claim:"First philosophy studies being as being and its highest cause, the unmoved mover."},{name:"Aquinas",claim:"Metaphysics rises from creatures to God as being itself, distinguishing essence and existence."},{name:"Hume",claim:"Reasoning beyond experience yields 'sophistry and illusion' -- commit it to the flames."},{name:"Kant",claim:"Old metaphysics is impossible as knowledge; a critical metaphysics maps the conditions of experience."},{name:"Carnap",claim:"Metaphysical claims are pseudo-statements lacking any verifiable content."}],topics:["The subject matter of metaphysics","Being as being","Substance and the categories","First principles and first causes","God in metaphysics","The possibility of metaphysical knowledge","Metaphysics vs. physics","The critique of metaphysics"],key_texts:[{text:"Aristotle, Metaphysics",when:"c. 340 BC"},{text:"Aquinas, Summa Theologica I",when:"1265-1274"},{text:"Descartes, Meditations",when:"c. 175 AD"},{text:"Hume, Enquiry XII",when:"1748"},{text:"Kant, Critique of Pure Reason (Preface, Dialectic)",when:"1781"}],example:"Kant compared past metaphysics to a battlefield of endless, undecidable combat\u2014and set out to fix its borders so it would stop overreaching.",related:["being","philosophy","principle"],hook:"The study of being itself.",quotes:[{text:"Commit it then to the flames: for it can contain nothing but sophistry and illusion.",who:"Hume",work:"Enquiry XII",when:"1748",context:"The close of the Enquiry, on books containing neither mathematical demonstration nor experimental reasoning. The line became the slogan of later positivism."}]},{id:"mind",name:"Mind",cluster:"mind",gist:"The thinking, knowing power\u2014and its relation to body.",framing:"Mind is the power of thinking, knowing, and willing -- the intellect that sets the human above the merely animal. Its nature, and its relation to the body, are among philosophy's hardest and most contested questions.",senses:["Intellect or reason (the power of concepts and judgment)","Consciousness in general (all awareness)","The divine ordering Mind (nous)","Mind vs. brain (the mind-body question)"],disputes:[{q:"Is mind distinct from body?",sides:[{view:"A distinct thinking substance",who:"Descartes"},{view:"Identical with, or produced by, the b
