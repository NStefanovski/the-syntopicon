ody",who:"the materialists"},{view:"The form of a living body",who:"Aristotle"}]},{q:"Is intellect separate from sense?",sides:[{view:"Reason grasps universals beyond any sense",who:"Plato, Aristotle"},{view:"Thought is only refined sensation",who:"the empiricists"}]},{q:"Is there mind in nature or the cosmos?",sides:[{view:"A world-ordering nous",who:"Anaxagoras, the Stoics"},{view:"Mind is only in animals and humans",who:"the naturalists"}]}],positions:[{name:"Anaxagoras",claim:"Mind (nous) is the ordering principle that sets the cosmos in motion."},{name:"Aristotle",claim:"The intellect grasps universals; the active intellect may be separable and deathless."},{name:"Descartes",claim:"Mind is a thinking substance, better known than the body and really distinct from it."},{name:"Hobbes",claim:"'Mind' is nothing but motions in the body; all is matter in motion."},{name:"Kant",claim:"The mind actively constitutes experience through its a priori forms and categories."}],topics:["The nature of mind and intellect","Mind and body","Intellect and sense","The active and passive intellect","Consciousness and self-consciousness","Mind in nature","Reason vs. the animal soul","The powers of the mind"],key_texts:[{text:"Anaxagoras (fragments)",when:"5th century BC"},{text:"Plato, Phaedo",when:"c. 380 BC"},{text:"Aristotle, On the Soul III",when:"c. 350 BC"},{text:"Descartes, Meditations",when:"c. 175 AD"},{text:"Hobbes, Leviathan I",when:"1651"},{text:"Kant, Critique of Pure Reason",when:"1781"}],example:"Descartes' cogito: even a deceiving demon can't make me doubt that I, doubting, exist\u2014the one certainty from which mind rebuilds the world.",related:["soul","idea","knowledge"],hook:"The knower, knowing.",quotes:[{text:"Thoughts without content are empty, intuitions without concepts are blind.",who:"Kant",work:"Critique of Pure Reason",when:"1781",context:"Kant's settlement of the rationalist-empiricist quarrel. Concepts without sensory input have nothing to be about; sensation without concepts cannot be organized into experience. Knowledge requires both."}]},{id:"monarchy",name:"Monarchy",cluster:"polis",gist:"Rule by one\u2014for good or ill.",framing:"Monarchy is rule by one -- government in which sovereign power rests with a single person. From the philosopher-king to the absolute sovereign to the constitutional crown, it poses the question whether one ruler can best embody unity, wisdom, and order.",senses:["Rule of one for the common good (the ideal) vs. tyranny (its perversion)","Kingship under law vs. absolute monarchy","Hereditary vs. elective monarchy","Constitutional or limited monarchy (the modern form)"],disputes:[{q:"Is rule by one the best form?",sides:[{view:"One wise ruler gives unity and decisive rule",who:"Plato; Hobbes"},{view:"Concentrated power tends to tyranny; law and the many are safer",who:"the constitutionalists"}]},{q:"Should the monarch be above the law or under it?",sides:[{view:"An absolute sovereign, source of law, above it",who:"Hobbes, Bodin"},{view:"A king under the law -- else he is a tyrant",who:"Aristotle, the constitutionalists"}]},{q:"Whence the king's authority?",sides:[{view:"By divine right or nature",who:"the royalists"},{view:"By the consent or contract of the people",who:"the contractarians"}]}],positions:[{name:"Plato",claim:"The ideal is the rule of the one who knows -- the philosopher-king, wiser than any law."},{name:"Aristotle",claim:"True kingship rules for the common good and by law; lawless, it degenerates into tyranny."},{name:"Hobbes",claim:"Favors an undivided sovereign -- most naturally one man -- whose absolute power alone secures peace."},{name:"Locke",claim:"Rejects absolute monarchy, since none may rightly be judge in his own case."},{name:"Montesquieu",claim:"In a moderate monarchy, intermediate powers and honor restrain the prince from despotism."}],topics:["Monarchy vs. tyranny","Rule of one for the common good","Absolute vs. limited monarchy","Hereditary vs. elective kingship","The king and the law","Divine right vs. consent","The philosopher-king","Constitutional monarchy"],key_texts:[{text:"Plato, Statesman; Republic",when:"c. 360 BC"},{text:"Aristotle, Politics III",when:"c. 335 BC"},{text:"Hobbes, Leviathan II",when:"1651"},{text:"Locke, Two Treatises",when:"1689"},{text:"Montesquieu, The Spirit of the Laws",when:"1748"}],example:"Aristotle's hinge: the king rules for the good of all, the tyrant for his own\u2014same office, opposite aim, and that aim is the whole difference.",related:["tyranny","government","aristocracy"],hook:"One ruler\u2014king or tyrant.",quotes:[{text:"A king under the law.",who:"Aristotle",work:"Politics III",when:"c. 335 BC",context:"The distinction between kingship and tyranny does not lie in the number of rulers but in whether power is bound by law and directed at the common good."}]},{id:"nature",name:"Nature",cluster:"being",gist:"The whole of things, and the essence of each.",framing:"Nature means both the intrinsic principle that makes each thing behave as it does and the whole ordered system of such things -- the cosmos. It also sets a standard: what is 'according to nature' as against the artificial or the merely conventional.",senses:["A thing's essence (its 'nature')","The inner principle of motion and rest","Nature as the totality of things (the universe)","The natural vs. the artificial, conventional, or supernatural"],disputes:[{q:"Is nature purposive?",sides:[{view:"Nature does nothing in vain; it acts for ends",who:"Aristotle"},{view:"Nature is blind mechanism; ends are illusory",who:"the mechanists"}]},{q:"Is the natural the standard of right?",sides:[{view:"There is a natural right or law above convention",who:"Stoics, Aquinas, Locke"},{view:"Justice and law are conventional, not natural",who:"the Sophists, some moderns"}]},{q:"Is nature identical with God?",sides:[{view:"God and Nature are one (Deus sive Natura)",who:"Spinoza"},{view:"Nature is God's creation, distinct from Him",who:"the theistic tradition"}]}],positions:[{name:"Aristotle",claim:"Nature is an inner principle of motion and rest; each thing has an end proper to its kind."},{name:"The Stoics",claim:"To live well is to live 'according to nature,' i.e., the reason pervading the cosmos."},{name:"Spinoza",claim:"There is one substance, God-or-Nature; all things follow by necessity from its nature."},{name:"Bacon",claim:"Nature is to be studied by its laws and, so understood, commanded for human benefit."},{name:"Rousseau",claim:"Contrasts natural man -- good and free -- with man corrupted by society."}],topics:["The meaning of nature (essence vs. the whole)","Nature as principle of motion","The order and laws of nature","Nature and art","Nature and convention","Natural law and natural right","The state of nature","Nature and the supernatural","Nature and God"],key_texts:[{text:"Aristotle, Physics II",when:"c. 350 BC"},{text:"Lucretius, On the Nature of Things",when:"c. 55 BC"},{text:"Spinoza, Ethics I",when:"1677"},{text:"Bacon, Novum Organum",when:"1620"},{text:"Rousseau, Discourse on Inequality",when:"1755"}],example:"Aristotle distinguishes the natural from the made: a bed, if buried, would sprout wood not a bed, because its nature is the wood, and 'bed' is only art.",related:["world","form","cause"],hook:"The whole, and each thing's essence.",quotes:[{text:"Live according to nature.",who:"The Stoics",work:"Epictetus, Discourses",when:"c. 108 AD",context:"Nature here means the rational order of the whole, not raw impulse. Living according to it means accepting what is not up to us and exercising virtue in what is."}]},{id:"necessity-and-contingency",name:"Necessity and Contingency",cluster:"being",gist:"What must be, and what merely happens to be.",framing:"The necessary is what cannot be otherwise; the contingent is what can. Sorting the two runs through logic, nature, freedom, and theology -- deciding whether the world had to be as it is, or might have been different.",senses:["Logical necessity vs. causal necessity","The necessary being (God) vs. contingent beings","Absolute vs. conditional (hypothetical) necessity","Necessity as compulsion vs. as unconditional certainty"],disputes:[{q:"Is everything necessary, or is there real contingency?",sides:[{view:"All events are necessitated; contingency is only apparent",who:"Stoics, Spinoza"},{view:"Some things are genuinely contingent, able to be otherwise",who:"Aristotle, defenders of free will"}]},{q:"Is there a necessary being?",sides:[{view:"Contingent beings require a necessary being as their ground",who:"Aquinas, Leibniz"},{view:"The inference to a necessary being is invalid",who:"Hume, Kant"}]},{q:"Are the laws of nature necessary?",sides:[{view:"Nature's laws hold with necessity",who:"the rationalists"},{view:"They are contingent regularities that might have been otherwise",who:"Hume, empiricists"}]}],positions:[{name:"Aristotle",claim:"Distinguishes the necessary, the possible, and the contingent; future contingents may lack settled truth."},{name:"Aquinas",claim:"From beings that might not have existed he argues to a being that exists necessarily."},{name:"Spinoza",claim:"Nothing is contingent; all follows with geometric necessity from God's nature."},{name:"Leibniz",claim:"Separates necessary 'truths of reason' from contingent 'truths of fact,' grounded in God's choice of the best."},{name:"Hume",claim:"No matter of fact is necessary; its contrary is always conceivable."}],topics:["The kinds of necessity","Necessity and contingency in being","The necessary being","Necessity in causation","Logical vs. real necessity","Contingency and chance","Necessity and free will","Future contingents","Possibility and possible worlds"],key_texts:[{text:"Aristotle, On Interpretation IX; Metaphysics V",when:"c. 350 BC"},{text:"Aquinas, Summa Theologica I Q.2 (Third Way)",when:"1265-1274"},{text:"Spinoza, Ethics I",when:"1677"},{text:"Leibniz, Monadology; Theodicy",when:"1714"},{text:"Hume, Enquiry",when:"1748"}],example:"Aquinas's third way: contingent things need not exist, so if all were contingent, at some point nothing would have existed\u2014hence something must exist necessarily.",related:["cause","fate","chance"],hook:"The must-be and the might-not-be.",quotes:[{text:"Truths of reason and truths of fact.",who:"Leibniz",work:"Monadology",when:"1714",context:"The distinction later called necessary and contingent. Truths of reason are those whose opposite is impossible; truths of fact could have been otherwise, and rest on the principle of sufficient reason."}]},{id:"oligarchy",name:"Oligarchy",cluster:"polis",gist:"Rule by the few\u2014typically the rich.",framing:"Oligarchy is rule by the few -- typically the wealthy -- in their own interest. As the corrupt counterpart of aristocracy, it raises the perennial problem of the rich dominating the poor and of wealth translating into political power.",senses:["Rule of the few (neutral) vs. rule of the wealthy few for themselves","Plutocracy (rule of the rich)","The perversion of aristocracy","The tendency of organizations toward rule by a few"],disputes:[{q:"Is oligarchy ever just?",sides:[{view:"Rule of the few for the common good is aristocracy, not oligarchy",who:"Aristotle"},{view:"Property qualifications for rule are defensible",who:"its defenders"}]},{q:"Is the root conflict wealth vs. poverty?",sides:[{view:"The real political division is rich against poor, oligarchs against democrats",who:"Aristotle"},{view:"Other cleavages matter more",who:"later critics"}]},{q:"Can oligarchy be tempered?",sides:[{view:"Mix it with democracy into a stable 'polity'",who:"Aristotle"},{view:"Concentrated wealth inevitably captures power",who:"the pessimists"}]}],positions:[{name:"Plato",claim:"Oligarchy arises when wealth becomes the qualification for rule; it splits the city into rich and poor."},{name:"Aristotle",claim:"Oligarchy is rule by the wealthy few for their own advantage -- the perversion of aristocracy."},{name:"Polybius",claim:"Oligarchy is a stage in the cycle of constitutions, decaying from aristocracy toward mob rule."},{name:"Michels",claim:"Even democratic organizations tend toward rule by a few -- the 'iron law of oligarchy.'"}],topics:["The meaning of oligarchy","Rule of the few","Oligarchy vs. aristocracy","Wealth and political power","The conflict of rich and poor","Oligarchy and democracy","The mixed constitution","The tendency toward oligarchy"],key_texts:[{text:"Plato, Republic VIII",when:"c. 375 BC"},{text:"Aristotle, Politics III-V",when:"c. 335 BC"},{text:"Polybius, Histories VI",when:"c. 150 BC"}],example:"Aristotle's real dividing line isn't number but wealth: even if the rich were many and the poor few, rule in the rich's interest would still be oligarchy.",related:["aristocracy","democracy","wealth"],hook:"The wealthy few, for themselves.",quotes:[{text:"The iron law of oligarchy.",who:"Michels",work:"Political Parties",when:"1911",context:"His conclusion from studying socialist parties committed to internal democracy. Organization itself breeds a specialized leadership that outlasts and outmaneuvers the membership -- who says organization says oligarchy."}]},{id:"one-and-many",name:"One and Many",cluster:"being",gist:"How unity and plurality coexist in reality.",framing:"How can reality be both one and many -- a single world yet countless distinct things? The tension between unity and plurality runs from the first cosmologies to disputes over identity, wholes, and the universal.",senses:["The One as ultimate principle or source","Unity as a property of each being (a thing is 'one')","The many as a plurality of individuals","The universal (one) present in many"],disputes:[{q:"Is reality ultimately one or many?",sides:[{view:"All is one; plurality is illusion",who:"Parmenides, the monists"},{view:"Reality is irreducibly many (atoms, monads, individuals)",who:"atomists, pluralists"}]},{q:"How is the one present in the many?",sides:[{view:"By participation in a single Form",who:"Plato"},{view:"By the same universal predicated of many",who:"Aristotle"}]},{q:"Is unity prior to plurality?",sides:[{view:"The One is the first principle, source of all",who:"Plotinus"},{view:"Unity and plurality are correlative, neither prior",who:"the pluralists"}]}],positions:[{name:"Parmenides",claim:"What is, is one and continuous; division and change are unreal."},{name:"Plato",claim:"Many sensible things are one by sharing a single Form; the Parmenides probes the puzzles."},{name:"Aristotle",claim:"'One' is said in many ways; the unity of a substance underlies its many accidents."},{name:"Plotinus",claim:"From the ineffable One all multiplicity emanates and to it returns."},{name:"Leibniz",claim:"Reality is a plurality of simple substances (monads), each mirroring the whole."}],topics:["The one and the many as first principles","Unity as a transcendental of being","Whole and parts","Identity and diversity","The universal in the many","Monism vs. pluralism","The One as source (emanation)","Numerical vs. specific unity"],key_texts:[{text:"Parmenides (fragments)",when:"c. 370 BC"},{text:"Plato, Parmenides; Sophist",when:"c. 370 BC"},{text:"Aristotle, Metaphysics V.6, X",when:"c. 340 BC"},{text:"Plotinus, Enneads",when:"c. 270 AD"},{text:"Leibniz, Monadology",when:"1714"}],example:"Plato's 'one over many': many red things share one Form of redness\u2014a single unity accounting for the scattered plurality we sense.",related:["being","same-and-other","universal-and-particular"],hook:"Unity amid plurality.",quotes:[{text:"Entities are not to be multiplied beyond necessity.",who:"Ockham",work:"attributed",when:"c. 1320",context:"The razor, in its traditional formulation. Ockham used the principle to cut away universals as real things existing apart from individuals, holding that only particulars exist."}]},{id:"opinion",name:"Opinion",cluster:"mind",gist:"Belief that falls short of knowledge.",framing:"Opinion is belief that falls short of knowledge -- assent held without full certainty, which may be true or false. Ranking between ignorance and knowledge, it governs most of practical life and the whole realm of the probable.",senses:["Belief without certainty (vs. knowledge)","Right opinion -- true belief lacking an account","The probable, in rhetoric and common life","Public opinion (a community's shared beliefs)"],disputes:[{q:"Is opinion sharply distinct from knowledge?",sides:[{view:"Yes -- knowledge is of the stable Forms, opinion of shifting sensibles",who:"Plato"},{view:"They differ in degree of justification, not in kind",who:"many moderns"}]},{q:"Can true opinion guide action as well as knowledge?",sides:[{view:"Right opinion suffices for action, though it is unstable",who:"Plato's Meno"},{view:"Only secure knowledge is a safe guide",who:"the rationalists"}]},{q:"Should opinion be trusted or overcome?",sides:[{view:"Reputable opinions are a proper starting point",who:"Aristotle"},{view:"Opinion must yield to reasoned knowledge",who:"Descartes"}]}],positions:[{name:"Plato",claim:"Opinion lies between knowledge and ignorance; true opinion becomes knowledge only when tied down by an account."},{name:"Aristotle",claim:"Reputable opinions (endoxa) are the proper starting points of dialectical and ethical inquiry."},{name:"Descartes",claim:"Resolves to treat as false whatever is merely opinion, admitting only the certain."},{name:"Locke",claim:"Where knowledge fails we must be governed by probability, proportioning assent to the evidence."}],topics:["Opinion vs. knowledge","True and false opinion","Right opinion and its instability","The probable and the plausible","Opinion and belief","Public opinion","The ethics of assent","Degrees of certainty"],key_texts:[{text:"Plato, Meno; Republic V; Theaetetus",when:"c. 369 BC"},{text:"Aristotle, Topics I",when:"c. 350 BC"},{text:"Descartes, Meditations I",when:"c. 175 AD"},{text:"Locke, Essay IV",when:"1689"}],example:"Plato notes that a true opinion about the road to a town gets you there as surely as knowledge\u2014until, lacking grounds, it wanders off.",related:["knowledge","truth","judgment"],hook:"Belief without the receipts.",quotes:[{text:"Opinion lies between knowledge and ignorance.",who:"Plato",work:"Republic V",when:"c. 375 BC",context:"Not a middling amount of knowledge but a different object. Knowledge is of what fully is; ignorance of what is not; opinion of the world of becoming, which both is and is not."}]},{id:"opposition",name:"Opposition",cluster:"being",gist:"The relation of contraries, contradictories, and correlatives.",framing:"Opposition is the relation between things that stand against each other -- contraries, contradictories, correlatives. It underlies logic's laws, the analysis of change (between opposite states), and dialectics that make conflict the engine of thought.",senses:["Contradiction (A and not-A)","Contrariety (hot/cold) and correlation (parent/child)","Privation (sight/blindness)","Logical opposition of propositions vs. real opposition of forces"],disputes:[{q:"Is the law of non-contradiction absolute?",sides:[{view:"Nothing can both be and not be in the same respect -- the firmest principle",who:"Aristotle"},{view:"Reality contains real contradictions that drive its development",who:"Hegel"}]},{q:"Do opposites explain nature?",sides:[{view:"Change and nature are governed by pairs of contraries",who:"Heraclitus, Aristotle"},{view:"Fundamental physics needs no contraries, only quantities and laws",who:"mathematical science"}]},{q:"Is opposition real or only conceptual?",sides:[{view:"Some oppositions are real forces (strife, polarity)",who:"Heraclitus; Kant on real opposition"},{view:"Opposition is a relation among concepts and propositions",who:"the logicians"}]}],positions:[{name:"Heraclitus",claim:"Opposites are one; strife is justice, and the world lives by tension."},{name:"Aristotle",claim:"Catalogues the kinds of opposition and defends non-contradiction as the ground of all reasoning."},{name:"Kant",claim:"Distinguishes logical opposition from 'real' opposition -- forces that cancel, like + and - quantities."},{name:"Hegel",claim:"Contradiction is no mere error but the motor of dialectical development."}],topics:["The kinds of opposition","Contradiction vs. contrariety","The square of opposition","Privation and negation","Opposition and change","The law of non-contradiction","Correlatives and relation","Opposition in dialectic"],key_texts:[{text:"Heraclitus (fragments)",when:"c. 500 BC"},{text:"Aristotle, Categories; Metaphysics IV, X",when:"c. 340 BC"},{text:"Kant, essay on negative magnitudes",when:"1763"},{text:"Hegel, Science of Logic",when:"1812-1816"}],example:"Aristotle sorts oppositions: hot/cold are contraries (a mean lies between), while being/not-being are contradictories (no middle is possible).",related:["same-and-other","dialectic","relation"],hook:"Terms that stand against each other.",quotes:[{text:"The same thing cannot at once belong and not belong to the same subject.",who:"Aristotle",work:"Metaphysics IV",when:"c. 340 BC",context:"The principle of non-contradiction, which he calls the firmest of all. It cannot be proved without assuming it -- but he argues anyone denying it says nothing at all."}]},{id:"philosophy",name:"Philosophy",cluster:"mind",gist:"The love of wisdom\u2014reasoned inquiry into first things.",framing:"Philosophy is the love and pursuit of wisdom -- rational inquiry into the ultimate nature of reality, knowledge, and the good life. Its scope, method, and very possibility as knowledge are themselves perennial philosophical questions.",senses:["The pursuit of wisdom and the good life (a way of living)","The science of first principles and causes","The analysis of concepts and language (a modern turn)","Its parts: natural, moral, and first philosophy"],disputes:[{q:"Is philosophy a way of life or a body of doctrine?",sides:[{view:"A transformative practice",who:"the ancients"},{view:"A theoretical system or analysis",who:"many moderns"}]},{q:"Can philosophy attain truth, or only clarify?",sides:[{view:"It reaches first principles and the highest truths",who:"Plato, Aristotle"},{view:"It only analyzes or dissolves problems",who:"some moderns"}]},{q:"What is philosophy's relation to science and faith?",sides:[{view:"Their foundation",who:"Descartes"},{view:"The handmaid of theology",who:"the medievals"},{view:"An autonomous critical inquiry",who:"Kant"}]}],positions:[{name:"Socrates",claim:"Philosophy is the examined life; 'the unexamined life is not worth living.'"},{name:"Plato",claim:"The philosopher ascends from the cave to knowledge of the Forms and should therefore rule."},{name:"Aristotle",claim:"First philosophy studies being and its causes; the contemplative life is the highest happiness."},{name:"Descartes",claim:"Philosophy must be rebuilt from indubitable foundations, like a tree rooted in metaphysics."},{name:"Kant",claim:"Philosophy's task is critique -- to fix the powers and limits of reason itself."}],topics:["The definition of philosophy","Philosophy and wisdom","The branches of philosophy","Philosophy vs. science","Philosophy and religion","The philosophical life","The method of philosophy","The value and limits of philosophy"],key_texts:[{text:"Plato, Republic; Apology",when:"c. 375 BC"},{text:"Aristotle, Metaphysics I",when:"c. 340 BC"},{text:"Descartes, Discourse on Method",when:"1637"},{text:"Kant, Critique of Pure Reason (Preface)",when:"1781"}],example:"Socrates chose death over abandoning inquiry, insisting 'the unexamined life is not worth living'\u2014philosophy as a commitment, not a hobby.",related:["wisdom","metaphysics","knowledge"],hook:"The love of wisdom, by argument.",quotes:[{text:"The unexamined life is not worth living.",who:"Socrates",work:"Plato, Apology",when:"399 BC",context:"Spoken at his trial, refusing exile on condition of silence. Not a claim that philosophy is pleasant -- he is explaining why he would rather die than stop questioning."}]},{id:"physics",name:"Physics",cluster:"nature",gist:"The science of nature\u2014matter, motion, and energy.",framing:"Physics is the science of nature -- of matter, motion, force, and the fundamental laws of the physical world. From Aristotle's study of change to the mathematical laws of the moderns, it is the arena where the deepest questions about reality become exact.",senses:["The general science of nature (Aristotle's study of changing things)","The mathematical science of matter and motion (the modern sense)","Fundamental physics (ultimate constituents and laws) vs. its branches","Physics vs. metaphysics"],disputes:[{q:"Is physics qualitative or quantitative?",sides:[{view:"A study of natures, qualities, and ends",who:"Aristotle"},{view:"The mathematical treatment of matter in motion",who:"Galileo, Newton"}]},{q:"Are there final causes in physics?",sides:[{view:"Nature acts for ends",who:"Aristotle"},{view:"Physics seeks only efficient causes and laws",who:"the moderns"}]},{q:"Is nature continuous or atomic?",sides:[{view:"A plenum of continuous matter",who:"Aristotle, Descartes"},{view:"Atoms moving in the void",who:"the atomists"}]}],positions:[{name:"Aristotle",claim:"Physics studies natural bodies as subject to motion and change, seeking all four kinds of cause."},{name:"Galileo",claim:"Nature's book is written in mathematics; he reduces motion to measurable law."},{name:"Newton",claim:"Formulates the laws of motion and gravitation, unifying the physics of heaven and earth."},{name:"Descartes",claim:"Builds a physics of extended matter and motion, banishing final causes."}],topics:["The science of nature","Matter and motion","Force and the laws of motion","Final vs. efficient causes in nature","The continuous and the atomic","Space, time, and motion","The mathematization of nature","Physics and metaphysics"],key_texts:[{text:"Aristotle, Physics",when:"c. 350 BC"},{text:"Galileo, Two New Sciences",when:"1638"},{text:"Descartes, Principles of Philosophy",when:"1644"},{text:"Newton, Principia",when:"1687"},{text:"(contrast) Lucretius, On the Nature of Things",when:"c. 55 BC"}],example:"Einstein showed that two events simultaneous for one observer aren't for another moving relative to them\u2014time itself depends on the observer's motion.",related:["mechanics","matter","space"],hook:"The laws of the material world.",quotes:[{text:"I frame no hypotheses.",who:"Newton",work:"Principia, General Scholium",when:"1713",context:"On the cause of gravity. He can state the law precisely without explaining what gravity is, and refuses to invent a mechanism -- a decisive shift from asking what things are to describing how they behave."}]},{id:"pleasure-and-pain",name:"Pleasure and Pain",cluster:"good",gist:"The felt goads that drive us toward and away.",framing:"Pleasure and pain are the most immediate goods and evils we feel -- the springs that draw us on and drive us back. Whether pleasure is the good itself, a sign of the good, or a distraction from it is one of ethics' oldest debates.",senses:["Bodily pleasures and pains vs. pleasures of the mind","Pleasure as a feeling vs. as the unimpeded activity of a natural power (Aristotle)","Pleasure as the good (hedonism) vs. as a byproduct","The calculus of pleasures and pains"],disputes:[{q:"Is pleasure the good?",sides:[{view:"Pleasure is the highest good and the end",who:"the hedonists, Epicurus (rightly understood)"},{view:"The good life is virtuous activity, not pleasure",who:"Plato, Aristotle, the Stoics"}]},{q:"Are all pleasures equal, or higher and lower?",sides:[{view:"Measure them only by quantity",who:"Bentham"},{view:"Some pleasures are higher in kind",who:"Mill, Plato"}]},{q:"Is pleasure a process or an activity?",sides:[{view:"The replenishing of a lack -- a process toward a state",who:"Plato"},{view:"The unimpeded activity itself, complete at each moment",who:"Aristotle"}]}],positions:[{name:"Epicurus",claim:"Pleasure is the beginning and end of the happy life -- but chiefly absence of pain and tranquility, not indulgence."},{name:"Plato",claim:"Examines and limits pleasure's claim; unmixed pleasures rank below wisdom in the good life."},{name:"Aristotle",claim:"Pleasure is not the good but accompanies and completes good activity, as bloom crowns youth."},{name:"Bentham",claim:"The good is the greatest pleasure; he proposes a calculus of intensity, duration, and the rest."},{name:"Mill",claim:"Distinguishes higher from lower pleasures -- better Socrates dissatisfied than a fool satisfied."}],topics:["The nature of pleasure and pain","Kinds of pleasure","Pleasure as the good (hedonism)","Higher vs. lower pleasures","Pleasure and activity","Pleasure and happiness","The measurement of pleasures","Pain and evil"],key_texts:[{text:"Plato, Philebus; Republic IX",when:"c. 375 BC"},{text:"Aristotle, Nicomachean Ethics VII, X",when:"c. 340 BC"},{text:"Epicurus, Letter to Menoeceus",when:"c. 300 BC"},{text:"Bentham, Principles of Morals and Legislation",when:"1789"},{text:"Mill, Utilitarianism",when:"1863"}],example:"Mill: better to be Socrates dissatisfied than a fool satisfied\u2014some pleasures are higher, and those who've known both prefer them.",related:["happiness","desire","good-and-evil"],hook:"The goads of gratification and distress.",quotes:[{text:"Better Socrates dissatisfied than a fool satisfied.",who:"Mill",work:"Utilitarianism II",when:"1863",context:"His break with Bentham's arithmetic. Pleasures differ in kind, not just quantity, and the only competent judges are those who have experienced both."}]},{id:"poetry",name:"Poetry",cluster:"expr",gist:"Making in words\u2014imitation, music, and vision.",framing:"Poetry is imaginative making in words -- the art that, through image, rhythm, and story, moves and teaches. Its quarrel with philosophy over truth, and its power over the emotions, have made it a perennial subject of praise and suspicion.",senses:["Imaginative literature generally (including drama and epic)","Verse or metrical composition","Poetry as imitation (of action, character) vs. as inspired vision","The old 'quarrel' of poetry and philosophy"],disputes:[{q:"Does poetry tell truth or falsehood?",sides:[{view:"Poets imitate mere appearances and feed the passions",who:"Plato"},{view:"Poetry is more philosophical than history -- it shows the universal",who:"Aristotle"}]},{q:"Is the poet inspired or skilled?",sides:[{view:"A divine madness seizes the poet",who:"Plato's Ion"},{view:"Poetry is an art with rules and craft",who:"Aristotle, Horace"}]},{q:"Should poetry please or instruct?",sides:[{view:"Its end is delight",who:"the aesthetes"},{view:"Its end is to instruct by delighting",who:"Horace, Sidney"}]}],positions:[{name:"Plato",claim:"Banishes most poetry from the ideal city -- it imitates appearances and inflames the lower soul -- yet honors its power."},{name:"Aristotle",claim:"Defends poetry; tragedy imitates a serious action and, through pity and fear, accomplishes catharsis."},{name:"Horace",claim:"The poet aims to profit and to please; art demands both talent and disciplined craft."},{name:"Sidney",claim:"Poetry teaches virtue more movingly than philosophy or history, joining precept to example."}],topics:["The nature of poetry","Poetry as imitation","The poet -- inspiration or art","Poetry and truth","Poetry and the emotions (catharsis)","The kinds of poetry (epic, tragic, lyric)","Poetry and philosophy","The moral effect of poetry"],key_texts:[{text:"Plato, Republic II-III, X; Ion",when:"c. 375 BC"},{text:"Aristotle, Poetics",when:"c. 335 BC"},{text:"Horace, Ars Poetica",when:"c. 19 BC"},{text:"Sidney, A Defence of Poesie",when:"1595"}],example:"Aristotle defends poetry over history: history tells what Alcibiades did, but poetry shows what a person of a certain kind would do\u2014the universal, not the mere fact.",related:["art","beauty","rhetoric"],hook:"Making, in words.",quotes:[{text:"Poetry is more philosophical than history.",who:"Aristotle",work:"Poetics IX",when:"c. 335 BC",context:"History records what Alcibiades did; poetry shows what such a person would probably or necessarily do. By dealing in the universal rather than the particular, fiction can be truer than fact."}]},{id:"principle",name:"Principle",cluster:"being",gist:"A first thing\u2014that from which something proceeds.",framing:"A principle is a first thing -- a starting point from which something proceeds in being, in becoming, or in knowledge. Every science and every demonstration must begin from principles it does not itself prove.",senses:["Principle of being (source of a thing's existence)","Principle of knowing (axiom, premise)","Principle of action (motive, rule)","First principles -- indemonstrable starting points"],disputes:[{q:"Are there indemonstrable first principles?",sides:[{view:"Yes -- demonstration must rest on principles known without proof",who:"Aristotle"},{view:"All claims need justification; foundations are illusory",who:"coherentists, skeptics"}]},{q:"How are first principles known?",sides:[{view:"By intellectual insight (nous) drawn from experience",who:"Aristotle"},{view:"They are innate to reason",who:"Descartes"},{view:"They are habits or conventions, not intuitions",who:"Hume"}]},{q:"Is there one supreme principle of all?",sides:[{view:"One first principle grounds everything (the One, God, the cogito)",who:"Plotinus, Descartes"},{view:"Knowledge has many independent starting points",who:"the pluralists"}]}],positions:[{name:"Aristotle",claim:"Science demonstrates from first principles; the deepest, non-contradiction, is grasped by intellect."},{name:"Euclid",claim:"Builds all of geometry from definitions, postulates, and common notions."},{name:"Descartes",claim:"Seeks one indubitable principle -- 'I think, therefore I am' -- as the foundation of knowledge."},{name:"Leibniz",claim:"Adds the principle of sufficient reason: nothing is so without a reason why it is so."}],topics:["The kinds of principle","Principles of being vs. of knowledge","First and indemonstrable principles","Axioms, postulates, and definitions","How first principles are known","Non-contradiction as first principle","The principle of sufficient reason","Principles and demonstration"],key_texts:[{text:"Aristotle, Posterior Analytics; Metaphysics IV",when:"c. 350 BC"},{text:"Euclid, Elements I",when:"c. 300 BC"},{text:"Descartes, Meditations; Discourse",when:"c. 175 AD"},{text:"Leibniz, Monadology",when:"1714"}],example:"Aristotle argues demonstration can't go on forever; it must rest on first principles known directly\u2014else nothing could ever be proved at all.",related:["cause","element","metaphysics"],hook:"The source the rest flows from.",quotes:[{text:"I think, therefore I am.",who:"Descartes",work:"Discourse on Method",when:"1637",context:"The one thing that survives radical doubt: even a deceiving demon cannot make me not exist while I am being deceived. Descartes uses it as the fixed point from which to rebuild all knowledge."}]},{id:"progress",name:"Progress",cluster:"polis",gist:"The idea that things improve over time.",framing:"Progress is the idea that humanity advances over time -- in knowledge, in the mastery of nature, in morality or happiness. A hallmark of modern optimism, it is challenged by those who see cycles, decline, or mere change without betterment.",senses:["Advance in knowledge and the arts and sciences (cumulative)","Moral and social progress (improvement of humanity)","History as a whole moving toward a better state","Progress vs. cyclical or declinist views of history"],disputes:[{q:"Does history progress, cycle, or decline?",sides:[{view:"Humanity advances toward greater knowledge and freedom",who:"Condorcet, Hegel"},{view:"History moves in cycles",who:"the ancients, Vico"},{view:"Modernity is decline and corruption",who:"some critics"}]},{q:"Is there moral progress, or only technical?",sides:[{view:"Mankind grows better as well as more knowledgeable",who:"the optimists"},{view:"Knowledge and power grow, but virtue does not",who:"Rousseau"}]},{q:"Is progress inevitable or fragile?",sides:[{view:"A law of history, all but guaranteed",who:"the confident"},{view:"Contingent, reversible, and easily lost",who:"the cautious"}]}],positions:[{name:"Bacon",claim:"Knowledge advances cumulatively; the sciences will progressively extend human power over nature."},{name:"Condorcet",claim:"Charts the indefinite perfectibility of the human mind and the onward march of enlightenment."},{name:"Rousseau",claim:"Dissents -- the progress of the arts and sciences has corrupted morals, not improved them."},{name:"Hegel",claim:"History is genuine progress -- the advancing self-realization of freedom."},{name:"Comte",claim:"Humanity passes through theological, metaphysical, and positive stages toward maturity."}],topics:["The idea of progress","Progress in the arts and sciences","Moral and social progress","The perfectibility of man","Progress vs. cycles and decline","The inevitability of progress","The costs of progress","Progress and history"],key_texts:[{text:"Bacon, The New Organon",when:"1620"},{text:"Condorcet, Sketch of the Progress of the Human Mind",when:"1795"},{text:"Rousseau, Discourse on the Arts and Sciences",when:"1750"},{text:"Hegel, The Philosophy of History",when:"1837"}],example:"Rousseau's provocation: as the sciences and arts advanced, he argued, morals decayed\u2014progress in knowledge is not automatically progress in virtue.",related:["history","evolution","knowledge"],hook:"The faith that things get better.",quotes:[{text:"The indefinite perfectibility of the human mind.",who:"Condorcet",work:"Sketch",when:"1795",context:"Written while in hiding from the Terror that would kill him -- a fact that makes the book either the tradition's most heroic statement of hope or its sharpest irony."}]},{id:"prophecy",name:"Prophecy",cluster:"divine",gist:"Speaking for the divine\u2014foretelling and forth-telling.",framing:"Prophecy is knowledge or speech that comes from God -- foretelling what is to come or declaring the divine will. It raises questions about revelation, about foreknowledge and freedom, and about telling true inspiration from false.",senses:["Prediction of future events","The inspired declaration of God's word (not mainly prediction)","A mode of knowing (illumination of intellect and imagination)","The prophet as messenger and reformer"],disputes:[{q:"Is prophecy supernatural or a natural gift?",sides:[{view:"A divine light elevating the mind",who:"Aquinas"},{view:"A perfection of imagination and virtue, not superior intellect",who:"Spinoza"}]},{q:"Can the future be foreknown without destroying freedom?",sides:[{view:"Yes, through God's eternal vantage",who:"Boethius"},{view:"Foreknowledge seems to fix the future",who:"the classic difficulty"}]},{q:"How is true prophecy told from false?",sides:[{view:"By fulfillment and moral fruit",who:"the tradition"},{view:"Private claims to revelation are politically dangerous",who:"Hobbes"}]}],positions:[{name:"Maimonides",claim:"Prophecy is a natural perfection of intellect and imagination, granted by God to the prepared."},{name:"Aquinas",claim:"Prophecy is a divine light raising the mind to judge and declare what surpasses natural reason."},{name:"Spinoza",claim:"Prophets excelled in imagination and virtue, not speculative knowledge; prophecy adapts to its hearers."},{name:"Hobbes",claim:"Warns that private claims to revelation threaten civil peace."}],topics:["The nature of prophecy","Prophecy and foreknowledge","Revelation and inspiration","True vs. false prophets","Prophecy and freedom of the will","The cessation of prophecy","Prophecy and reason"],key_texts:[{text:"The Hebrew prophets",when:"8th-5th century BC"},{text:"Maimonides, Guide for the Perplexed II",when:"c. 1190"},{text:"Aquinas, Summa Theologica II-II QQ.171-174",when:"1265-1274"},{text:"Spinoza, Theologico-Political Treatise",when:"1670"},{text:"Hobbes, Leviathan III",when:"1651"}],example:"Maimonides made prophecy a natural summit: the prophet is one whose intellect and imagination are so perfected that divine truth can flow through them.",related:["religion","god","fate"],hook:"Speaking for the divine.",quotes:[{text:"Prophets excelled in imagination, not in intellect.",who:"Spinoza",work:"Theologico-Political Treatise",when:"1670",context:"A deflation with political purpose. If prophecy conveys moral certainty rather than speculative knowledge, scripture cannot settle questions of physics or metaphysics -- and clergy cannot claim authority over them."}]},{id:"prudence",name:"Prudence",cluster:"good",gist:"Practical wisdom\u2014knowing what to do here and now.",framing:"Prudence is practical wisdom -- the virtue of deliberating well about what to do, and then doing it. It is the intellectual virtue that governs action, translating knowledge of the good into right choices amid particular, changing circumstances.",senses:["Practical wisdom (phronesis -- right reason about action)","Foresight and good counsel","Everyday caution or self-interest (a narrower, lesser sense)","The charioteer of the virtues"],disputes:[{q:"Is prudence a virtue or a mere knack?",sides:[{view:"A genuine intellectual virtue, uniting reason and right desire",who:"Aristotle"},{view:"Mere cleverness or cunning at getting what one wants",who:"the deflationary view"}]},{q:"Can one be prudent without being good?",sides:[{view:"No -- true prudence presupposes virtue and right ends",who:"Aristotle, Aquinas"},{view:"Yes -- one can deliberate shrewdly toward bad ends",who:"the 'cleverness' view"}]},{q:"Is prudence about means only, or ends too?",sides:[{view:"It deliberates about means to ends set by virtue",who:"one reading of Aristotle"},{view:"It also perceives the right end in the situation",who:"another reading"}]}],positions:[{name:"Aristotle",claim:"Practical wisdom is right reason about things good and bad for man; it cannot exist without moral virtue."},{name:"Aquinas",claim:"Prudence is the charioteer of the virtues -- it applies universal moral principles to particular acts."},{name:"The Stoics",claim:"Prudence is one face of the single virtue -- knowledge of what to choose and avoid."},{name:"Machiavelli",claim:"Prudence becomes the ruler's shrewd calculation of means, adjusting to fortune and necessity."}],topics:["Prudence as practical wisdom","Deliberation and choice","Prudence and moral virtue","Prudence and cleverness","Prudence about means and ends","Foresight and counsel","Prudence and the particular case","Political prudence"],key_texts:[{text:"Aristotle, Nicomachean Ethics VI",when:"c. 340 BC"},{text:"Aquinas, Summa Theologica II-II QQ.47-56",when:"1265-1274"},{text:"Cicero, On Duties",when:"44 BC"},{text:"Machiavelli, The Prince",when:"1532"}],example:"Aristotle distinguishes the prudent person from the merely clever: cunning finds means to any end, prudence finds means to good ends\u2014skill wedded to virtue.",related:["virtue-and-vice","judgment","wisdom"],hook:"Knowing what to do, right now.",quotes:[{text:"The charioteer of the virtues.",who:"Aquinas",work:"Summa Theologica II-II Q.47",when:"1272",context:"Prudence steers the others: courage and temperance supply right desire, but only prudence discerns what this situation actually requires. Hence one cannot be fully virtuous without it."}]},{id:"punishment",name:"Punishment",cluster:"polis",gist:"The deliberate infliction of hardship for wrongdoing.",framing:"Punishment is the deliberate infliction of hardship on a wrongdoer by authority. What justifies it -- desert, deterrence, reform, or the restoration of order -- and what its limits are, lie at the heart of justice and law.",senses:["Retribution (deserved requital)","Deterrence (preventing future crime)","Reform or rehabilitation (correcting the offender)","Protection of society (incapacitation); vs. mere revenge"],disputes:[{q:"What justifies punishment?",sides:[{view:"Just desert -- the guilty deserve to suffer in proportion to their wrong",who:"Kant"},{view:"Its useful consequences -- deterrence, reform, protection",who:"the utilitarians"}]},{q:"Is punishment about the past deed or the future good?",sides:[{view:"Backward-looking: it answers to what was done (retribution)",who:"the retributivists"},{view:"Forward-looking: it aims at future benefit",who:"the consequentialists"}]},{q:"Is capital punishment just?",sides:[{view:"The murderer forfeits his life; justice demands it",who:"Kant"},{view:"It is cruel, ineffective, or not ours to inflict",who:"Beccaria"}]}],positions:[{name:"Plato",claim:"Punishment should heal the wrongdoer's soul, like medicine; no one does wrong willingly."},{name:"Kant",claim:"Punishment is a categorical demand of justice -- inflicted because the offender is guilty, in due proportion."},{name:"Beccaria",claim:"Punishment is justified only to deter; it should be the least severe sufficient, and never capital."},{name:"Bentham",claim:"All punishment is an evil, admitted only insofar as it prevents a greater evil."},{name:"Hegel",claim:"Punishment honors the criminal as rational by annulling his wrong and restoring right."}],topics:["The justification of punishment","Retribution","Deterrence","Reform and rehabilitation","The protection of society","Punishment vs. revenge","Proportion in punishment","Capital punishment"],key_texts:[{text:"Plato, Gorgias; Laws",when:"c. 380 BC"},{text:"Kant, The Metaphysics of Morals",when:"1797"},{text:"Beccaria, On Crimes and Punishments",when:"1764"},{text:"Bentham, Principles of Morals and Legislation",when:"1789"},{text:"Hegel, Philosophy of Right",when:"1821"}],example:"Kant insisted even a society disbanding forever must execute its last murderer, lest justice be traded for utility\u2014punishment as pure desert.",related:["justice","law","duty"],hook:"Hardship imposed for wrong.",quotes:[{text:"Punishment is an evil, admitted only to exclude a greater.",who:"Bentham",work:"Principles of Morals and Legislation",when:"1789",context:"The utilitarian test. Since punishing inflicts suffering, it must be justified by the suffering it prevents -- which rules out punishment that is groundless, needless, or too costly to be worth it."}]},{id:"quality",name:"Quality",cluster:"being",gist:"The 'such' of a thing\u2014its character, not its amount.",framing:"Quality is the 'such' of a thing -- its character or way of being, as distinct from its quantity or relations. Whether qualities like color and warmth belong to things themselves or only to our perception reshaped the modern view of nature.",senses:["Quality as a category (dispositions, capacities, affections, shape)","Primary qualities (size, shape, motion) vs. secondary qualities (color, sound, taste)","Intensive quality that admits of degrees"],disputes:[{q:"Do secondary qualities exist in things?",sides:[{view:"Color, sound, and taste are really in the objects",who:"common sense; the Aristotelian view"},{view:"Only primary qualities are in bodies; the rest are effects in us",who:"Galileo, Locke"}]},{q:"Is quality reducible to quantity?",sides:[{view:"All qualities reduce to quantitative arrangements of matter",who:"the mechanists"},{view:"Some qualities are irreducible features of being",who:"the Aristotelians"}]},{q:"Can qualities change by degrees?",sides:[{view:"Qualities intensify and remit continuously (latitude of forms)",who:"medieval physics"},{view:"Qualitative change reduces to countable rearrangements",who:"the atomists"}]}],positions:[{name:"Aristotle",claim:"Quality is a category; he distinguishes states, capacities, affective qualities, and figure."},{name:"Galileo",claim:"Tastes, odors, and colors reside in consciousness; remove the living creature and they vanish."},{name:"Locke",claim:"Primary qualities resemble their ideas; secondary qualities are powers to produce sensations in us."},{name:"Berkeley",claim:"The primary/secondary distinction collapses -- all qualities are ideas in a mind."}],topics:["The category of quality","The kinds of quality","Primary vs. secondary qualities","Qualities and perception","Intensity and remission of qualities","Quality and quantity","Occult qualities and the mechanical philosophy"],key_texts:[{text:"Aristotle, Categories 8; Metaphysics V.14",when:"c. 340 BC"},{text:"Galileo, The Assayer",when:"1623"},{text:"Locke, Essay II.8",when:"1689"},{text:"Berkeley, Principles",when:"1710"}],example:"Locke's split: a body's shape and motion (primary) are really in it, but its color and warmth (secondary) are powers to produce sensations in us.",related:["quantity","relation","sense"],hook:"The 'such,' not the 'how much.'",quotes:[{text:"Primary and secondary qualities.",who:"Locke",work:"Essay II.8",when:"1689",context:"Primary qualities -- size, shape, motion -- belong to bodies themselves; secondary ones like color and taste are powers to produce sensations in us. Berkeley replies that the same arguments dissolve both."}]},{id:"quantity",name:"Quantity",cluster:"being",gist:"The 'how much' and 'how many' of things.",framing:"Quantity is the 'how much' and 'how many' of things -- magnitude and multitude, the measurable aspect of reality. The rise of modern science was largely the decision to read nature in quantitative, mathematical terms.",senses:["Continuous quantity (magnitude) vs. discrete quantity (number)","Quantity as a category of substance","Measure as the unit that makes quantity known","Extensive vs. intensive magnitude"],disputes:[{q:"Is nature fundamentally quantitative?",sides:[{view:"The book of nature is written in mathematics",who:"Galileo, Descartes"},{view:"Qualities and ends are basic; mathematics abstracts from real nature",who:"the Aristotelians"}]},{q:"Is continuous quantity infinitely divisible?",sides:[{view:"Magnitudes are infinitely divisible",who:"Aristotle, geometry"},{view:"There are indivisible minima or atoms",who:"the atomists"}]},{q:"Is number real or a mental construction?",sides:[{view:"Numbers are real, abstract objects",who:"the Platonists"},{view:"Number is a creation of counting minds and marks",who:"nominalists, formalists"}]}],positions:[{name:"Euclid",claim:"With Archimedes, builds the exact science of magnitude and ratio."},{name:"Aristotle",claim:"Quantity is a category; number is discrete, magnitude continuous, and both admit of measure."},{name:"Galileo",claim:"To know nature is to measure it -- to reduce phenomena to number, figure, and motion."},{name:"Descartes",claim:"Extension (quantity) is the essence of matter, making physics a kind of geometry in motion."},{name:"Kant",claim:"Quantity is a category; mathematics applies a priori to all appearances as extensive magnitudes."}],topics:["The category of quantity","Continuous vs. discrete quantity","Number and magnitude","Measure and the unit","Divisibility of the continuous","The quantitative method in science","Quantity and quality","Intensive magnitude"],key_texts:[{text:"Euclid, Elements V",when:"c. 300 BC"},{text:"Aristotle, Categories 6; Metaphysics V.13",when:"c. 340 BC"},{text:"Galileo, Two New Sciences",when:"1638"},{text:"Descartes, Geometry",when:"1637"},{text:"Kant, Critique of Pure Reason (Axioms of Intuition)",when:"1781"}],example:"Galileo held nature's book is written in mathematics; Kelvin later pressed the creed\u2014when you can't measure something, your knowledge is 'meagre.'",related:["quality","mathematics","infinity"],hook:"The 'how much' of things.",quotes:[{text:"Number is the measure of multitude.",who:"Aristotle",work:"Metaphysics X",when:"c. 340 BC",context:"Quantity divides into the discrete, answering how many, and the continuous, answering how much. The distinction organizes arithmetic and geometry as separate sciences."}]},{id:"reasoning",name:"Reasoning",cluster:"mind",gist:"The mind moving from what it knows to what follows.",framing:"Reasoning is the movement of the mind from what it already knows to what follows -- inferring conclusions from premises. It is the discursive power that, unlike immediate insight, arrives at truth step by step.",senses:["Inference (drawing conclusions from premises)","Deductive vs. inductive reasoning","Discursive (step by step) vs. intuitive (all at once)","Theoretical vs. practical reasoning"],disputes:[{q:"Is all reasoning reducible to the syllogism?",sides:[{view:"Deduction is the core of inference",who:"Aristotle"},{view:"Induction and other forms are irreducible",who:"Bacon, Mill"}]},{q:"Does reasoning discover truth or only unfold the premises?",sides:[{view:"Deduction only draws out what is contained",who:"the critics of syllogism"},{view:"Reasoning genuinely extends knowledge",who:"its defenders"}]},{q:"Is reasoning distinctively human?",sides:[{view:"Only rational animals reason",who:"the tradition"},{view:"Animals infer, and machines compute",who:"modern challenges"}]}],positions:[{name:"Aristotle",claim:"Analyzes inference into the syllogism, distinguishing demonstrative, dialectical, and fallacious reasoning."},{name:"Aquinas",claim:"Reasoning (ratio) is discursive, proper to man; angels and God know by simple intuition (intellectus)."},{name:"Descartes",claim:"Sets rules for rightly conducting reason -- proceeding from simple, clear steps in due order."},{name:"Hume",claim:"Distinguishes demonstrative reasoning (relations of ideas) from probable reasoning (matters of fact)."}],topics:["Reasoning and inference","Deduction and induction","The syllogism","Demonstrative vs. probable reasoning","Intuitive vs. discursive knowledge","Theoretical vs. practical reasoning","Fallacies","Reasoning in animals and machines"],key_texts:[{text:"Aristotle, Prior and Posterior Analytics",when:"c. 350 BC"},{text:"Aquinas, Summa Theologica I Q.79",when:"1265-1274"},{text:"Descartes, Rules for the Direction of the Mind",when:"c. 1628"},{text:"Hume, Enquiry",when:"1748"}],example:"Hume's provocation: reason alone never moves us to act; it maps means to ends but the ends themselves come from passion\u2014reason serves, it doesn't rule.",related:["logic","induction","judgment"],hook:"Thought moving to its conclusion.",quotes:[{text:"A syllogism is discourse in which certain things being stated, something else follows.",who:"Aristotle",work:"Prior Analytics I",when:"c. 350 BC",context:"The definition founding formal logic. What matters is that the conclusion follows by necessity from the form alone, independent of what the terms are about."}]},{id:"relation",name:"Relation",cluster:"being",gist:"The being-toward that links one thing to another.",framing:"A relation is a way one thing stands to another -- greater, cause, father, like. Long treated as the 'weakest' kind of being, relation became central to modern logic, physics, and the idea that things are constituted by their connections.",senses:["Relation as a category (the 'toward something')","Real relations vs. relations of reason","Internal (essential) vs. external relations","Relation as the subject of relational logic"],disputes:[{q:"Do relations have real being?",sides:[{view:"Relations are the least of beings, dependent on their terms",who:"Aristotle, the medievals"},{view:"Relations are as real and basic as their terms; some are irreducible",who:"Russell, modern logic"}]},{q:"Are relations internal or external?",sides:[{view:"Relations are internal -- grounded in the natures of the related things",who:"Leibniz, the idealists"},{view:"Many relations are external, not fixed by their terms' natures",who:"Russell, the pluralists"}]},{q:"Is space and time absolute or relational?",sides:[{view:"They are real, absolute containers",who:"Newton"},{view:"They are systems of relations among things and events",who:"Leibniz, Einstein"}]}],positions:[{name:"Aristotle",claim:"The relative is what it is 'of' or 'than' another -- a distinct but dependent category."},{name:"Aquinas",claim:"Distinguishes real relations from relations of reason (as in the divine persons)."},{name:"Leibniz",claim:"Holds relations to be ideal; space and time are the orders of coexistence and succession."},{name:"Russell",claim:"Relations are irreducible, objective, and the backbone of logic and mathematics."}],topics:["The category of relation","Real vs. rational relations","Internal vs. external relations","The relativity of knowledge","Relations in logic and mathematics","The relational theory of space and time","Relation and order","Symmetry and transitivity"],key_texts:[{text:"Aristotle, Categories 7",when:"c. 350 BC"},{text:"Aquinas, Summa Theologica I Q.28",when:"1265-1274"},{text:"Leibniz-Clarke Correspondence",when:"1715-1716"},{text:"Russell, The Principles of Mathematics",when:"1903"}],example:"Being 'taller than' seems to add nothing to either person alone, yet it holds truly between them\u2014prompting the question whether the relation is out there or in our comparing.",related:["same-and-other","opposition","quantity"],hook:"The link between one thing and another.",quotes:[{text:"The weakest kind of being.",who:"Aristotle",work:"Metaphysics XIV",when:"c. 340 BC",context:"Relations are real but dependent: fatherhood is nothing apart from father and son. Whether a relation adds anything to its terms became a central medieval dispute, sharpened by the Trinity."}]},{id:"religion",name:"Religion",cluster:"divine",gist:"The binding of humanity to the divine.",framing:"Religion is the bond between human beings and the divine -- expressed in belief, worship, and a way of life. It is examined as a source of truth, a social institution, a moral force, and, by its critics, an illusion.",senses:["Worship and ritual (the cult)","A body of revealed belief (faith or creed)","Morality under a divine sanction","A natural human disposition or need"],disputes:[{q:"Is religion founded on truth or illusion?",sides:[{view:"It rests on real knowledge of God",who:"natural and revealed theology"},{view:"It is projection, wish, or 'the opium of the people'",who:"Hume, Feuerbach, Marx, Freud"}]},{q:"Faith or reason -- which governs?",sides:[{view:"Reason supports and clarifies faith",who:"Aquinas"},{view:"Faith stands above or against reason",who:"Tertullian, Kierkegaard"},{view:"Reason alone suffices (natural religion)",who:"the deists"}]},{q:"Is religion good or bad for society?",sides:[{view:"It is the bond of morality and community",who:"the tradition"},{view:"It breeds conflict and superstition",who:"its critics"}]}],positions:[{name:"Augustine",claim:"True religion is the soul's ordered love returning to God, its source and end."},{name:"Aquinas",claim:"Faith and reason are distinct but harmonious paths to the same God."},{name:"Hume",claim:"Traces religion to fear and ignorance and criticizes miracles and the design argument."},{name:"William James",claim:"Judges religion by its fruits in lived experience and defends the will to believe."},{name:"Marx",claim:"Religion is the sigh of the oppressed creature, the opium of the people."}],topics:["The nature and origin of religion","Natural vs. revealed religion","Faith and reason","Religion and morality","The social role of religion","The critique of religion","Toleration","Religious experience"],key_texts:[{text:"Augustine, City of God",when:"413-426 AD"},{text:"Aquinas, Summa Theologica II-II QQ.1-16",when:"1265-1274"},{text:"Hume, The Natural History of Religion",when:"1757"},{text:"Kant, Religion within the Limits of Reason Alone",when:"1793"},{text:"James, The Varieties of Religious Experience",when:"1902"}],example:"Augustine's opening confession\u2014'our heart is restless until it rests in Thee'\u2014casts religion as the answer to a longing built into human nature.",related:["god","theology","prophecy"],hook:"Binding the human to the divine.",quotes:[{text:"The opium of the people.",who:"Marx",work:"Critique of Hegel's Philosophy of Right",when:"1844",context:"Usually read as pure contempt, but the surrounding sentences call religion the sigh of the oppressed creature and the heart of a heartless world -- a painkiller for real suffering, whose cause is what Marx wants abolished."}]},{id:"revolution",name:"Revolution",cluster:"polis",gist:"The overturning of an established order.",framing:"Revolution is the overthrow and radical remaking of a political order. Whether it is a crime against order, a right of an oppressed people, or the engine of historical progress divides those who prize stability from those who demand transformation.",senses:["The violent change of government or constitution (political)","A fundamental transformation of the whole social order (the modern sense)","Revolution vs. rebellion or coup (systemic change vs. a change of rulers)","Revolution as a right vs. as a crime"],disputes:[{q:"Is there a right of revolution?",sides:[{view:"A people may justly overthrow a government that violates its trust",who:"Locke, the Declaration"},{view:"Rebellion is never justified; it dissolves the order that makes rights possible",who:"Hobbes"}]},{q:"Is revolution progress or catastrophe?",sides:[{view:"Revolutions drive history toward freedom and justice",who:"the revolutionaries, Marx"},{view:"They unleash chaos and tyranny, destroying accumulated wisdom",who:"Burke"}]},{q:"What causes revolutions?",sides:[{view:"Inequality, injustice, and the desire for equality",who:"Aristotle"},{view:"Contradictions in the mode of production and class struggle",who:"Marx"}]}],positions:[{name:"Aristotle",claim:"Analyzes the causes of revolution (stasis) -- above all the desire for equality or superiority."},{name:"Locke",claim:"When government breaks its trust, power reverts to the people, who may establish a new one."},{name:"Burke",claim:"Condemns the abstract remaking of society; reform should respect prescription and grow organically."},{name:"Marx",claim:"Revolution is the violent midwife of history, by which a rising class overturns outworn social relations."}],topics:["The meaning of revolution","The causes of revolution","The right of revolution","Revolution vs. reform","Revolution and progress","The dangers of revolution","Class and revolution","Revolution and the social order"],key_texts:[{text:"Aristotle, Politics V",when:"c. 335 BC"},{text:"Locke, Second Treatise (XIX)",when:"1689"},{text:"Burke, Reflections on the Revolution in France",when:"1790"},{text:"Marx & Engels, The Communist Manifesto",when:"1848"}],example:"Locke grounded a right of revolution: when rulers break the trust and turn to arbitrary power, the people may reclaim the authority they lent.",related:["government","liberty","justice"],hook:"The overturning of the order.",quotes:[{text:"A partnership between those living, those dead, and those yet to be born.",who:"Burke",work:"Reflections",when:"1790",context:"His counter to the revolutionary claim that each generation may remake society at will. The present holds society in trust, which is why he prefers reform that repairs to abstraction that rebuilds."}]},{id:"rhetoric",name:"Rhetoric",cluster:"expr",gist:"The art of persuasion by speech.",framing:"Rhetoric is the art of persuasion -- of finding, in any case, the available means of moving an audience. Poised between philosophy and mere manipulation, it raises the question whether persuasion serves truth or supplants it.",senses:["The art of persuasive speech","Eloquence, the art of speaking well","The three appeals (ethos, pathos, logos)","A neutral tool vs. flattery and manipulation"],disputes:[{q:"Is rhetoric an art or a knack?",sides:[{view:"A genuine art, the counterpart of dialectic",who:"Aristotle"},{view:"Mere flattery, a knack for pleasing, not a true art",who:"Plato's Gorgias"}]},{q:"Does rhetoric serve truth or manipulate?",sides:[{view:"Joined to knowledge and justice, it can serve truth",who:"Plato's Phaedrus"},{view:"It persuades regardless of truth -- hence its danger",who:"the critics"}]},{q:"Is persuasion about reason or emotion?",sides:[{view:"Argument (logos) is its body",who:"the rationalist emphasis"},{view:"Moving character (ethos) and passion (pathos) are decisive",who:"the practical emphasis"}]}],positions:[{name:"Plato",claim:"In the Gorgias he condemns rhetoric as flattery; in the Phaedrus he allows a true rhetoric wedded to knowledge of souls."},{name:"Aristotle",claim:"Rhetoric is the faculty of discovering the available means of persuasion -- ethos, pathos, and logos."},{name:"Cicero",claim:"The ideal orator unites wisdom with eloquence in the service of the commonwealth."},{name:"Quintilian",claim:"Rhetoric is 'the good man skilled in speaking'; eloquence is inseparable from character."}],topics:["The nature of rhetoric","Rhetoric and dialectic","The means of persuasion (ethos, pathos, logos)","Rhetoric and truth","Rhetoric and morality","The parts of an oration","Eloquence and the orator","Rhetoric and politics"],key_texts:[{text:"Plato, Gorgias; Phaedrus",when:"c. 370 BC"},{text:"Aristotle, Rhetoric",when:"c. 335 BC"},{text:"Cicero, De Oratore",when:"55 BC"},{text:"Quintilian, Institutes of Oratory",when:"c. 95 AD"}],example:"Aristotle's three levers: persuade by the argument (logos), by your credibility (ethos), and by the audience's feelings (pathos)\u2014rarely by one alone.",related:["language","poetry","dialectic"],hook:"Persuasion, made an art.",quotes:[{text:"The good man skilled in speaking.",who:"Quintilian",work:"Institutes XII",when:"c. 95 AD",context:"His definition of the orator, answering Plato's charge that rhetoric is flattery. Eloquence divorced from character is not imperfect rhetoric but a different and dangerous thing."}]},{id:"same-and-other",name:"Same and Other",cluster:"being",gist:"Identity and difference\u2014the ground of all distinction.",framing:"To think at all is to judge what is the same and what is different. Identity and difference underlie counting, classifying, personal identity over time, and the very logic of predication.",senses:["Numerical identity (one and the same thing)","Specific or generic sameness (same kind)","Qualitative sameness (exact likeness) vs. otherness","Identity through time -- the 'same' self"],disputes:[{q:"What makes a thing the same over time?",sides:[{view:"Same matter or bodily continuity",who:"materialist views"},{view:"Same form or soul, or continuity of memory",who:"Aristotle; Locke on memory"}]},{q:"Is the identity of indiscernibles true?",sides:[{view:"No two things share all properties; total sameness is identity",who:"Leibniz"},{view:"Two distinct things could be exactly alike",who:"his critics"}]},{q:"Is personal identity substantial or constructed?",sides:[{view:"A persisting soul or substance is the self",who:"Descartes"},{view:"Identity is continuity of consciousness and memory",who:"Locke"},{view:"The self is a bundle of perceptions; no simple identity",who:"Hume"}]}],positions:[{name:"Plato",claim:"The Sophist treats Same and Other as great kinds pervading all being."},{name:"Aristotle",claim:"Distinguishes numerical, specific, and generic sameness; difference within a genus defines species."},{name:"Leibniz",claim:"The identity of indiscernibles: things differing in no property are one and the same."},{name:"Locke",claim:"Personal identity is sameness of consciousness, not of substance."},{name:"Hume",claim:"Finds no impression of a persisting self -- only a bundle in flux."}],topics:["Identity and diversity","Numerical vs. specific sameness","The identity of indiscernibles","Sameness through change and time","Personal identity","Likeness and difference","Same and other as categories of thought"],key_texts:[{text:"Plato, Sophist",when:"c. 360 BC"},{text:"Aristotle, Metaphysics V.9, X",when:"c. 340 BC"},{text:"Leibniz, Discourse on Metaphysics",when:"c. 340 BC"},{text:"Locke, Essay II.27",when:"1689"},{text:"Hume, Treatise I.4.6",when:"1739"}],example:"Leibniz claimed no two leaves are perfectly identical, for if they shared every property they'd be one thing\u2014difference is guaranteed by distinctness.",related:["one-and-many","relation","opposition"],hook:"Identity and difference.",quotes:[{text:"The identity of indiscernibles.",who:"Leibniz",work:"Monadology",when:"1714",context:"If two things share every property they are not two but one. It follows from sufficient reason: God could have no ground for placing one rather than the other in a given position."}]},{id:"science",name:"Science",cluster:"mind",gist:"Organized, demonstrated knowledge of causes.",framing:"Science is organized, demonstrative knowledge of things through their causes and principles. From Aristotle's certain knowledge of the necessary to the modern experimental enterprise, what counts as science has itself transformed.",senses:["Certain knowledge of causes (Aristotle's episteme)","Any organized body of knowledge (a 'science' of X)","Modern natural science (empirical, experimental, mathematical)","The classification and hierarchy of the sciences"],disputes:[{q:"What makes knowledge scientific?",sides:[{view:"Demonstration from necessary first principles",who:"Aristotle"},{view:"Testable prediction and experiment",who:"the moderns"}]},{q:"Is science certain or provisional?",sides:[{view:"It yields necessary truth",who:"the classical view"},{view:"It offers ever-revisable hypotheses",who:"the modern view"}]},{q:"Is there one method for all sciences?",sides:[{view:"A single method (induction, or hypothesis-testing)",who:"Bacon, the unifiers"},{view:"Different methods for different subject-matters",who:"Aristotle"}]}],positions:[{name:"Aristotle",claim:"Science is knowledge of the reasoned fact -- why a thing must be so -- demonstrated from first principles."},{name:"Bacon",claim:"Calls for a new method: systematic observation and induction, to command nature by obeying it."},{name:"Descartes",claim:"Seeks a unified science on the model of mathematics, deduced from clear first principles."},{name:"Newton",claim:"Unites experiment and mathematics, deducing universal laws from the phenomena."},{name:"Kant",claim:"Secures the a priori foundations that make natural science, with its necessary laws, possible."}],topics:["The definition of science","Science and its causes","Demonstration and first principles","The experimental method","The classification of the sciences","Certainty vs. probability in science","Science and philosophy","The unity of science"],key_texts:[{text:"Aristotle, Posterior Analytics; Physics",when:"c. 350 BC"},{text:"Bacon, Novum Organum",when:"1620"},{text:"Descartes, Discourse",when:"1637"},{text:"Newton, Principia",when:"1687"},{text:"Kant, Critique of Pure Reason",when:"1781"}],example:"Bacon urged replacing armchair deduction with active experiment\u2014'twisting the lion's tail'\u2014to force nature to reveal her causes.",related:["knowledge","hypothesis","mathematics"],hook:"Demonstrated knowledge of causes.",quotes:[{text:"Nature is commanded only by being obeyed.",who:"Bacon",work:"Novum Organum",when:"1620",context:"The program of modern science in one line: power over nature comes not from magic or wishing but from discovering how nature actually works and conforming to it."}]},{id:"sense",name:"Sense",cluster:"mind",gist:"The gateways through which the world enters the mind.",framing:"Sense is the power of perceiving the world through the body -- sight, hearing, touch, and the rest. As the mind's first contact with reality, it is both the foundation of knowledge and, for its critics, a source of illusion.",senses:["The external senses (sight, hearing, smell, taste, touch)","The 'common sense' that unites and judges them","Sensation vs. perception (bare feeling vs. perceiving an object)","Sense as the criterion of reality vs. sense as mere appearance"],disputes:[{q:"Do the senses give knowledge of things as they are?",sides:[{view:"Yes -- perception is basically reliable",who:"Aristotle, the realists"},{view:"No -- they give only appearances and secondary qualities",who:"Democritus, Descartes"}]},{q:"Is all knowledge founded on sense?",sides:[{view:"Nothing is in the intellect not first in sense",who:"the empiricists"},{view:"Reason has objects sense cannot reach",who:"Plato, the rationalists"}]},{q:"Are the sensible qualities in things or in us?",sides:[{view:"In the objects themselves",who:"common sense"},{view:"Secondary qualities are effects in the perceiver",who:"Galileo, Locke"}]}],positions:[{name:"Aristotle",claim:"Each sense receives the form of its object without the matter; the common sense integrates them."},{name:"Democritus",claim:"'By convention color, by convention sweet; in reality atoms and void' -- the senses report appearances."},{name:"Descartes",claim:"The senses often deceive, so they cannot be the foundation of certain knowledge."},{name:"Locke",claim:"All ideas ultimately trace to sensation and reflection; experience furnishes the mind."},{name:"Berkeley",claim:"Sensible things just are collections of ideas perceived; there is no unperceived sensible object."}],topics:["The external senses","Sensation and perception","The common sense","The reliability of the senses","Sense and intellect","Primary and secondary qualities","The objects of sense","Illusion and the senses"],key_texts:[{text:"Aristotle, On the Soul II-III",when:"c. 350 BC"},{text:"Lucretius, On the Nature of Things IV",when:"c. 55 BC"},{text:"Descartes, Meditations",when:"c. 175 AD"},{text:"Locke, Essay II",when:"1689"},{text:"Berkeley, Principles",when:"1710"}],example:"Descartes noted a straight oar looks bent in water; since the senses sometimes deceive, he resolved to trust nothing they report without independent warrant.",related:["experience","memory-and-imagination","quality"],hook:"The world's gateways into the mind.",quotes:[{text:"By convention sweet, by convention bitter; in reality atoms and void.",who:"Democritus",work:"Fragments",when:"c. 400 BC",context:"The first statement of the primary/secondary quality distinction. Colors and tastes are effects in the perceiver; what is really there has only size, shape and motion."}]},{id:"sign-and-symbol",name:"Sign and Symbol",cluster:"expr",gist:"That which stands for something else to a mind.",framing:"A sign is something that stands for something else -- pointing beyond itself to a thing, an idea, or another sign. The study of signs underlies language, logic, art, and religion, and asks how meaning is possible at all.",senses:["Natural signs (smoke signifies fire) vs. conventional signs (words)","Sign vs. symbol (the arbitrary marker vs. the meaning-laden image)","The sign as pointing to a thing vs. to a concept","Symbols in religion, art, and mathematics"],disputes:[{q:"Are signs natural or conventional?",sides:[{view:"Some signify by nature (symptoms), others by convention (words)",who:"the standard distinction"},{view:"Which kind is basic remains disputed",who:"the debates"}]},{q:"Does a sign point to a thing or to an idea?",sides:[{view:"Words signify things directly",who:"one view"},{view:"Words signify concepts in the mind, which signify things",who:"the mediating view"}]},{q:"Is a symbol a mere substitute or does it share in its meaning?",sides:[{view:"A conventional stand-in, replaceable at will",who:"the arbitrary view"},{view:"The symbol embodies and participates in what it means",who:"the religious and artistic view"}]}],positions:[{name:"Augustine",claim:"A sign is a thing that, beyond its own appearance, brings something else to mind; distinguishes natural and given signs."},{name:"Aquinas",claim:"Sacraments are signs that both signify and, by God's institution, effect what they signify."},{name:"Hobbes",claim:"Distinguishes marks (private aids to memory) from signs (public means of communication)."},{name:"Locke",claim:"Words are signs of ideas; meaning is the idea a word is made to stand for."}],topics:["The definition of sign","Natural vs. conventional signs","Sign vs. symbol","Signs, things, and ideas","Symbols in religion and sacrament","Symbols in art and mathematics","The interpretation of signs","Meaning and reference"],key_texts:[{text:"Augustine, On Christian Doctrine II; On the Teacher",when:"397-426 AD"},{text:"Aquinas, Summa Theologica III Q.60",when:"1265-1274"},{text:"Hobbes, Leviathan I",when:"1651"},{text:"Locke, Essay III",when:"1689"}],example:"Augustine distinguishes natural signs, like smoke meaning fire, from given signs, like words\u2014where a sound means only because a community agrees it does.",related:["language","idea","definition"],hook:"Something standing for something else.",quotes:[{text:"A sign brings something else to mind beyond itself.",who:"Augustine",work:"On Christian Doctrine II",when:"c. 397 AD",context:"The definition that founds Western semiotics. Augustine divides signs into natural (smoke of fire) and given (words), and treats interpretation as the central problem of reading scripture."}]},{id:"sin",name:"Sin",cluster:"divine",gist:"The offense against the divine or moral order.",framing:"Sin is moral evil conceived as an offense against God or the divine order -- more than mere wrongdoing, a rupture in one's relation to the highest good. It binds together ethics, freedom, and theology.",senses:["Transgression of divine law","A disordered turning from God to lesser goods (privation)","Original sin (inherited fault) vs. actual sin","Mortal vs. venial sin"],disputes:[{q:"Is evil a positive thing or a privation?",sides:[{view:"Evil is a privation of a due good, not a thing",who:"Augustine, Aquinas"},{view:"Evil is a real, opposing principle",who:"the Manichaeans"}]},{q:"Is there original sin?",sides:[{view:"Adam's fall corrupts the will of all his heirs",who:"Augustine"},{view:"Each sins only by his own act; there is no inherited sin",who:"Pelagius"}]},{q:"Does sin require free will?",sides:[{view:"Only the free can sin",who:"the mainstream"},{view:"Wrongdoing can be given a determinist account",who:"some critics"}]}],positions:[{name:"Augustine",claim:"Sin is the will's turning from the immutable good to mutable goods; original sin wounds all."},{name:"Pelagius",claim:"Denies inherited sin; the will is free to keep the law, so grace is not strictly necessary."},{name:"Aquinas",claim:"Sin is an act against right reason and eternal law; he distinguishes mortal from venial."},{name:"Kant",claim:"Locates 'radical evil' in the free choice to set self-love above the moral law."}],topics:["The nature of sin","Evil as privation","Original sin","Kinds and degrees of sin","Sin and free will","Sin, grace, and redemption","Conscience and guilt","Sin vs. crime"],key_texts:[{text:"Genesis; Paul, Romans",when:"c. 6th century BC"},{text:"Augustine, Confessions; City of God",when:"c. 400 AD"},{text:"Aquinas, Summa Theologica I-II QQ.71-89",when:"1265-1274"},{text:"Kant, Religion within the Limits of Reason Alone",when:"1793"}],example:"Augustine's stolen pears haunt him because he stole not from need but for the thrill of the forbidden\u2014evidence, to him, of a will drawn to evil for its own sake.",related:["good-and-evil","will","religion"],hook:"Wrong as offense against the order.",quotes:[{text:"Evil is the privation of good.",who:"Augustine",work:"Confessions VII",when:"c. 400 AD",context:"His escape from Manichaean dualism. Evil is not a rival substance created by God but a lack in something good -- as blindness is not a thing but the absence of sight."}]},{id:"slavery",name:"Slavery",cluster:"polis",gist:"The owning of persons as property.",framing:"Slavery is the condition of one human being owned and ruled as the property of another. Defended in antiquity as natural and attacked in modernity as the deepest injustice, it forces the question of what is owed to every human being as such.",senses:["Chattel slavery (the human being as property)","Slavery 'by nature' (the ancient defense) vs. by law or conquest","Political slavery (subjection to despotic rule)","Slavery as a metaphor for bondage to passion"],disputes:[{q:"Is any slavery natural or just?",sides:[{view:"Some are slaves by nature, benefited by being ruled",who:"Aristotle"},{view:"All are bo
