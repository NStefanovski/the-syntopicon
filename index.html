view:"Angels differ as individuals within kinds",who:"other schoolmen"}]},{q:"How do angels know and act?",sides:[{view:"By infused ideas and intuitive, not discursive, knowledge",who:"Aquinas"},{view:"Such claims exceed what can be known",who:"the skeptics"}]}],positions:[{name:"Pseudo-Dionysius",claim:"Sets out the celestial hierarchy of nine angelic orders."},{name:"Aristotle",claim:"The separate intelligences that move the heavenly spheres are a philosophical ancestor of the angels."},{name:"Aquinas",claim:"Angels are subsistent forms without matter; each is its own species and knows by infused ideas."},{name:"Milton",claim:"Dramatizes the angels, their war, and their fall in Paradise Lost."}],topics:["The existence of spiritual beings","Angelic nature and knowledge","The hierarchy of angels","Angels and the motion of the heavens","Guardian angels","The fall of the angels","Angels vs. human souls"],key_texts:["Pseudo-Dionysius, The Celestial Hierarchy","Aquinas, Summa Theologica I QQ.50-64","Dante, Paradiso","Milton, Paradise Lost"],example:"Aquinas argues each angel is its own species because, having no matter to divide it, nothing could distinguish two angels of one kind.",related:["soul","mind","immortality"],hook:"Mind with the body subtracted."},{id:"animal",name:"Animal",cluster:"nature",gist:"The living, sensing, moving creature\u2014including and excluding man.",framing:"The animal is the living, sentient being -- possessing soul, sensation, and self-motion, yet (for most of the tradition) lacking reason. It is the mirror in which humanity defines itself, and the test case for whether life and mind are more than mechanism.",senses:["Any living, ensouled being (including man, the 'rational animal')","The sentient, self-moving creature (vs. plants)","The brute or beast (non-rational, contrasted with man)","The organism studied by biology"],disputes:[{q:"Do animals have reason or only sensation?",sides:[{view:"Only sense, appetite, and imagination -- no reason",who:"Aristotle, Aquinas"},{view:"They show intelligence differing in degree, not kind",who:"Montaigne, Darwin"}]},{q:"Are animals machines or ensouled?",sides:[{view:"Mere automata, without thought or feeling",who:"Descartes"},{view:"Sentient beings with a sensitive soul",who:"Aristotle"}]},{q:"Is man an animal like the rest?",sides:[{view:"A distinct rational animal, set apart",who:"the classical view"},{view:"One species continuous with the others",who:"the evolutionary view"}]}],positions:[{name:"Aristotle",claim:"Classifies animals by their powers of soul; the animal has sensation and self-motion, not reason."},{name:"Descartes",claim:"Animals are machines -- complex automata lacking thought or a rational soul."},{name:"Montaigne",claim:"Mocks human presumption, arguing beasts show cunning, communication, and feeling."},{name:"Darwin",claim:"Man differs from the higher animals in degree, not kind; mind itself has an animal ancestry."}],topics:["The definition of animal","The animal soul (sensation, appetite, motion)","Animals vs. plants","Animals vs. man","Reason and instinct in animals","The classification of animals","Whether animals are machines","Animal and human continuity"],key_texts:["Aristotle, History of Animals; On the Soul","Descartes, Discourse V","Montaigne, Apology for Raymond Sebond","Darwin, The Descent of Man"],example:"Aristotle's ladder of souls gives plants nutrition, animals sensation and movement, and humans reason atop both.",related:["man","life-and-death","evolution"],hook:"The body that feels and moves."},{id:"aristocracy",name:"Aristocracy",cluster:"polis",gist:"Rule by the best\u2014and the problem of who they are.",framing:"Aristocracy is rule by the best -- government by a select few distinguished by virtue or excellence. As one of the classic forms of government, it raises the question whether the wisest and best should rule, and how they are to be identified.",senses:["Rule of the best or most virtuous (the ideal sense)","Rule of the few (contrasted with the many)","A hereditary nobility (the historical sense)","'Natural aristocracy' of talent vs. aristocracy of birth"],disputes:[{q:"Who are 'the best' fit to rule?",sides:[{view:"The truly virtuous and wise",who:"Plato, Aristotle"},{view:"In practice the wellborn and wealthy -- so it decays into oligarchy",who:"the realist caution"}]},{q:"Should the best rule, or the people?",sides:[{view:"The wisest should govern for the common good",who:"Plato"},{view:"The people should rule themselves",who:"the democrats"}]},{q:"Is aristocracy natural or a usurpation?",sides:[{view:"A natural aristocracy of virtue is just",who:"Jefferson"},{view:"Hereditary privilege is arbitrary and unjust",who:"the modern critique"}]}],positions:[{name:"Plato",claim:"The ideal city is ruled by philosopher-kings -- the few who know the good -- a true aristocracy of wisdom."},{name:"Aristotle",claim:"Aristocracy is rule of the few for the common good; it decays into oligarchy when the rich rule for themselves."},{name:"Montesquieu",claim:"In aristocracy power rests with a body of nobles; its animating principle is moderation."},{name:"Jefferson",claim:"Distinguishes a 'natural aristocracy' of virtue and talent from an artificial one of birth and wealth."}],topics:["The meaning of aristocracy","Rule of the best","Aristocracy vs. oligarchy","The identification of the best","Hereditary vs. natural aristocracy","The mixed constitution","Aristocracy and virtue","Aristocracy and the common good"],key_texts:["Plato, Republic","Aristotle, Politics III-IV","Montesquieu, The Spirit of the Laws","the Jefferson-Adams correspondence"],example:"Plato's guardians are bred, tested, and educated for decades so that only the genuinely wise reach the top\u2014an attempt to make merit, not birth, the credential.",related:["oligarchy","democracy","government"],hook:"The best rule\u2014if you can find them."},{id:"art",name:"Art",cluster:"expr",gist:"The made thing, and the human power of making by rule.",framing:"Art is the making of things by skill according to a conception -- from craft to fine art. Whether art imitates nature, expresses its maker, or creates beauty, and what its value is, are questions running from Plato to the moderns.",senses:["Skill or craft (techne -- any productive know-how)","Fine art (the arts of beauty)","The liberal arts vs. the mechanical or servile arts","Art as imitation (mimesis) vs. art as creation and expression"],disputes:[{q:"Does art imitate nature or create anew?",sides:[{view:"Art imitates nature and reality",who:"Plato, Aristotle"},{view:"Art expresses the artist and creates a new world",who:"the Romantics, the moderns"}]},{q:"Is art morally beneficial or dangerous?",sides:[{view:"It can corrupt -- imitations feeding the passions",who:"Plato"},{view:"It instructs and purges the emotions",who:"Aristotle"}]},{q:"Is 'art' one thing?",sides:[{view:"A single genus of skilled making",who:"the classical view"},{view:"The fine arts are radically distinct from crafts",who:"the modern view"}]}],positions:[{name:"Plato",claim:"Art imitates appearances, thrice removed from the Forms; the poets must be watched, even banished."},{name:"Aristotle",claim:"Art completes or imitates nature; tragedy imitates action and, through pity and fear, purges the emotions."},{name:"Kant",claim:"Fine art is the product of genius -- purposive yet free, pleasing without a concept."},{name:"Tolstoy",claim:"Art is the communication of feeling; its worth lies in the sincerity and value of what it transmits."}],topics:["The definition of art","Art as skill and as fine art","The liberal and mechanical arts","Art and nature","Art as imitation","Art and beauty","The moral effect of art","Art and the artist"],key_texts:["Plato, Republic X; Ion","Aristotle, Poetics","Kant, Critique of Judgment","Tolstoy, What Is Art?"],example:"A doctor practicing the 'art of medicine' and a sculptor practicing sculpture were, classically, doing the same kind of thing: making by rule.",related:["beauty","poetry","nature"],hook:"Making, by rule."},{id:"astronomy",name:"Astronomy",cluster:"nature",gist:"The oldest science: reading order in the heavens.",framing:"Astronomy is the science of the heavens -- the motions of stars and planets and the structure of the cosmos. Its revolutions, from geocentric to heliocentric, reshaped not only physics but humanity's sense of its place.",senses:["The mathematical account of celestial motions ('saving the appearances')","Cosmology -- the real structure of the universe","Observational vs. theoretical astronomy","Astronomy vs. astrology"],disputes:[{q:"Does the earth or the sun stand at the center?",sides:[{view:"Geocentric -- the earth is fixed at the center",who:"Ptolemy"},{view:"Heliocentric -- the earth moves about the sun",who:"Copernicus, Galileo, Kepler"}]},{q:"Do astronomical models describe reality or merely predict?",sides:[{view:"Mere calculating devices to save the appearances",who:"the instrumentalists"},{view:"True descriptions of the heavens",who:"Galileo's realism"}]},{q:"Are the heavens a different matter from the earth?",sides:[{view:"A perfect, changeless fifth element",who:"Aristotle"},{view:"The same physics rules heaven and earth",who:"Galileo, Newton"}]}],positions:[{name:"Ptolemy",claim:"A geocentric system of epicycles and deferents that accurately predicts the planets' motions."},{name:"Copernicus",claim:"Places the sun at the center, setting the earth in motion among the planets."},{name:"Kepler",claim:"The planets travel in ellipses, sweeping equal areas in equal times."},{name:"Galileo",claim:"Telescopic evidence -- Jupiter's moons, the phases of Venus -- supports the heliocentric cosmos."},{name:"Newton",claim:"Universal gravitation explains celestial and terrestrial motion by one law."}],topics:["The motions of the heavens","Geocentric vs. heliocentric systems","Saving the appearances","The laws of planetary motion","The matter of the heavens","The size and structure of the cosmos","Astronomy and physics","Astronomy vs. astrology"],key_texts:["Ptolemy, Almagest","Copernicus, On the Revolutions","Kepler, New Astronomy","Galileo, Dialogue Concerning the Two Chief World Systems","Newton, Principia"],example:"Kepler abandoned the perfect circle\u2014sacred since antiquity\u2014because Mars's orbit only fit an ellipse, letting data overrule beauty.",related:["astronomy","world","mathematics"],hook:"Order read off the sky."},{id:"beauty",name:"Beauty",cluster:"expr",gist:"The quality that pleases when merely beheld.",framing:"Beauty is that which pleases when perceived -- the splendor of form, order, and proportion. Whether beauty is a real property of things or lies in the eye of the beholder, and how it relates to the good and the true, are its central questions.",senses:["Objective proportion, harmony, order (in the thing)","What pleases the beholder (in the response)","Sensible beauty vs. intelligible or moral beauty","Beauty and the sublime"],disputes:[{q:"Is beauty in the object or the beholder?",sides:[{view:"A real feature -- proportion, harmony, radiance",who:"Plato, Aquinas"},{view:"A feeling in the subject -- no quality in things themselves",who:"Hume, Kant"}]},{q:"Is beauty objective or a matter of taste?",sides:[{view:"There are real standards of taste and beauty",who:"the objectivists"},{view:"Taste is relative; to each his own",who:"the relativists"}]},{q:"Is beauty the same as the good and the true?",sides:[{view:"The beautiful, good, and true are one at the summit",who:"Plato"},{view:"Beauty is distinct -- a disinterested pleasure, not desire or use",who:"Kant"}]}],positions:[{name:"Plato",claim:"The soul ascends from beautiful bodies to Beauty itself -- eternal, absolute, the object of love."},{name:"Aristotle",claim:"Beauty consists in order, symmetry, and definiteness, which the mathematical sciences reveal."},{name:"Aquinas",claim:"The beautiful is 'that which pleases when seen'; it requires wholeness, proportion, and radiance."},{name:"Hume",claim:"Beauty is no quality in things; it exists in the mind -- yet a standard of taste can be found."},{name:"Kant",claim:"The judgment of beauty is a disinterested, universal pleasure in form, claiming all agreement without a concept."}],topics:["The nature of beauty","Beauty as proportion and harmony","Beauty in the object vs. the beholder","The standard of taste","Beauty and the good and true","Sensible and intelligible beauty","Beauty and the sublime","Beauty and art"],key_texts:["Plato, Symposium; Hippias Major","Aristotle, Poetics; Metaphysics XIII","Aquinas, Summa Theologica I Q.5, Q.39","Hume, Of the Standard of Taste","Kant, Critique of Judgment"],example:"Kant's test: your pleasure in a rose is aesthetic only if you'd want anyone to feel it too, yet can't prove they should\u2014universal but not provable.",related:["art","good-and-evil","truth"],hook:"Pleasing just to behold."},{id:"being",name:"Being",cluster:"being",gist:"That anything is at all\u2014the root question.",framing:"Being is the most universal and most puzzling of ideas: what it means for anything to be at all, and whether 'being' names one thing or many. It is the very subject of metaphysics, the science of being as being.",senses:["Existence (that a thing is) vs. essence (what it is)","Being as substance vs. being as attribute or relation","Actual being vs. potential being","Being as the one vs. being as the many"],disputes:[{q:"Is being one or many?",sides:[{view:"One changeless reality; plurality and change are illusion",who:"Parmenides"},{view:"Being is said in many ways; there are many beings and kinds of being",who:"Aristotle"}]},{q:"Is 'being' univocal or analogical?",sides:[{view:"'Being' means the same in every case",who:"Scotus"},{view:"God and creatures 'are' in related but different senses (analogy)",who:"Aquinas"}]},{q:"Does becoming have being, or only what is permanent?",sides:[{view:"Only the eternal Forms truly are; sensibles merely become",who:"Plato"},{view:"All is flux; being is becoming",who:"Heraclitus"}]}],positions:[{name:"Parmenides",claim:"Being simply is, ungenerated and changeless; since not-being cannot be thought, change and plurality are illusory."},{name:"Heraclitus",claim:"Reality is ceaseless becoming; you cannot step into the same river twice."},{name:"Plato",claim:"True being belongs to the eternal Forms; sensible things are shadows that partake of them."},{name:"Aristotle",claim:"Being is said in many ways but primarily of substance; a science of being as being studies its universal features."},{name:"Aquinas",claim:"God is being itself (ipsum esse); creatures have being by participation, so essence and existence differ in them."}],topics:["The meaning of 'to be'","Being and not-being","Essence vs. existence","Substance and accident","Potential and actual being","The analogy of being","Being, unity, truth, goodness (the transcendentals)","Being and becoming","Degrees or kinds of being","Being as the object of metaphysics"],key_texts:["Parmenides, On Nature (fragments)","Plato, Sophist; Republic","Aristotle, Metaphysics IV, VII","Aquinas, Summa Theologica I QQ.2-11; On Being and Essence"],example:"Parmenides argued that since 'what is not' can't even be thought, change\u2014which needs a passage from not-being\u2014must be illusion.",related:["cause","form","god"],hook:"That it is, before what it is."},{id:"cause",name:"Cause",cluster:"being",gist:"Why things are and come to be as they do.",framing:"A cause is that on which a thing depends for its being or its coming-to-be. The idea governs whether the world is intelligible -- whether things happen for reasons, by purpose, by mechanism, or merely in constant sequence.",senses:["The four causes: material, formal, efficient, final","Cause as necessitating vs. cause as probabilistic","First cause vs. secondary causes","Cause as real power vs. cause as regular succession"],disputes:[{q:"How many kinds of cause are there?",sides:[{view:"Four -- material, formal, efficient, final",who:"Aristotle"},{view:"Really only efficient (mechanical) causes; final causes are illusory in nature",who:"Bacon, Descartes"}]},{q:"Is there purpose (final cause) in nature?",sides:[{view:"Nature acts for ends; teleology is real",who:"Aristotle, Aquinas"},{view:"Apparent purpose is the product of blind mechanism or selection",who:"Darwin, mechanists"}]},{q:"Can causation be observed?",sides:[{view:"We perceive only constant conjunction and succession, never necessary connection",who:"Hume"},{view:"Causality is an a priori category the mind supplies to experience",who:"Kant"}]},{q:"Is there a first cause?",sides:[{view:"An uncaused first cause is required to end the regress",who:"Aristotle, Aquinas"},{view:"The demand for a first cause is unprovable or illegitimate",who:"Hume, Kant"}]}],positions:[{name:"Aristotle",claim:"Distinguishes four causes and argues both nature and art act for ends; a prime mover is the first cause of motion."},{name:"Aquinas",claim:"Uses efficient causation and the impossibility of infinite regress to argue for God as first cause."},{name:"Hume",claim:"We never observe the 'must'; causal belief is a habit born of repeated conjunction."},{name:"Kant",claim:"Cause-and-effect is a category structuring all possible experience, not derived from it."},{name:"Mill",claim:"Causes are found by empirical methods of agreement and difference among phenomena."}],topics:["The kinds of cause","Material and formal causes","The efficient cause and the transmission of motion","Final cause and teleology","Chance as a cause","The first cause and infinite regress","The necessity in causal connection","The knowability of causes","Cause in nature vs. cause in art"],key_texts:["Aristotle, Physics II; Metaphysics V","Aquinas, Summa Theologica I Q.2","Hume, Enquiry Concerning Human Understanding VII","Kant, Critique of Pure Reason (Second Analogy)","Mill, A System of Logic"],example:"Hume noted that no matter how often the cue ball strikes the eight, we see only one motion then another\u2014never the 'must' between them.",related:["chance","necessity-and-contingency","change"],hook:"The 'why' behind the 'that'."},{id:"chance",name:"Chance",cluster:"being",gist:"The uncaused, the coincidental, the merely probable.",framing:"Chance names what happens neither always nor for the most part, seemingly without cause or purpose. Whether chance is real or merely a mask for our ignorance shapes the whole question of order and design in the world.",senses:["Chance as the coincidental (a cause outside intention)","Chance as pure randomness (uncaused)","Chance as our ignorance of hidden causes","Luck and fortune in human affairs"],disputes:[{q:"Is chance real or only apparent?",sides:[{view:"Chance is real: the coincidence of independent causal lines",who:"Aristotle"},{view:"Nothing happens by chance; 'chance' names causes we do not know",who:"Stoics, Spinoza"}]},{q:"Does randomness operate in nature?",sides:[{view:"Random variation is a genuine factor (mutation, drift)",who:"Darwin, modern biology"},{view:"Apparent randomness reduces to strict law at bottom",who:"Laplace's determinism"}]},{q:"Can chance be quantified?",sides:[{view:"Yes -- probability turns chance into calculable degrees",who:"Pascal, Laplace"},{view:"Probability measures our ignorance, not chance in things",who:"subjectivists"}]}],positions:[{name:"Aristotle",claim:"Chance is the coincidental intersection of purposive or natural processes -- real but parasitic on regular causes."},{name:"Epicurus",claim:"Adds a random 'swerve' to the fall of atoms to break the chain of necessity."},{name:"The Stoics",claim:"Fate rules all; nothing is by chance, only by our failure to see the cause."},{name:"Laplace",claim:"An intelligence knowing all forces could predict everything; chance is merely ignorance."},{name:"Darwin",claim:"Chance variation supplies the raw material that natural selection shapes."}],topics:["The meaning of chance","Chance and coincidence","Chance vs. fortune and luck","Whether chance has a cause","Chance and determinism","Chance in nature and evolution","Chance and probability","Chance, providence, and design"],key_texts:["Aristotle, Physics II.4-6","Lucretius, On the Nature of Things","Aquinas, Summa Theologica I Q.103","Laplace, A Philosophical Essay on Probabilities"],example:"Aristotle's example: a man goes to market for bread and, by chance, meets a debtor who repays him\u2014two purposeful paths crossing without either intending the meeting.",related:["cause","fate","necessity-and-contingency"],hook:"Causal lines that cross by accident."},{id:"change",name:"Change",cluster:"being",gist:"The passage from one state to another\u2014and whether it is real.",framing:"Change is the passage from one state to another -- the most obvious fact of experience and the hardest to make intelligible. To explain change is to explain how a thing can become what it was not while remaining itself.",senses:["Change of place (locomotion)","Change of quality (alteration)","Change of quantity (growth and diminution)","Coming-to-be and passing-away (substantial change)"],disputes:[{q:"Is change real?",sides:[{view:"Change is impossible; being cannot come from not-being",who:"Parmenides, Zeno"},{view:"Change is the fundamental reality",who:"Heraclitus"},{view:"Change is real, explained by potency and act",who:"Aristotle"}]},{q:"What underlies change?",sides:[{view:"An enduring substratum (matter) persists through change",who:"Aristotle"},{view:"Only successive states or events; no enduring substance needed",who:"Hume, process views"}]},{q:"Is change reducible to motion of parts?",sides:[{view:"All qualitative change reduces to local motion of matter",who:"atomists, Descartes"},{view:"Some change is genuinely qualitative or substantial",who:"Aristotelians"}]}],positions:[{name:"Heraclitus",claim:"All things flow; strife and flux are the very law of the world."},{name:"Parmenides",claim:"What is, is; motion and change are illusion -- as Zeno's paradoxes press."},{name:"Aristotle",claim:"Change is the actualizing of a potentiality; it requires matter, form, and privation."},{name:"Newton",claim:"Change of motion is proportional to impressed force; nature's changes fall under laws of motion."},{name:"Hegel",claim:"Reality develops dialectically; change through contradiction is the engine of the real."}],topics:["The reality of change","The kinds of change","The substratum of change","Potency and act","Motion as a species of change","Substantial vs. accidental change","The paradoxes of motion","Change and time","The laws of change"],key_texts:["Heraclitus & Parmenides (fragments)","Aristotle, Physics I, III, V","Newton, Principia","Hegel, Science of Logic"],example:"Aristotle's acorn resolves the old paradox: it is actually an acorn but potentially an oak, so becoming an oak is potency made actual, not being from non-being.",related:["being","cause","time"],hook:"Potential becoming actual."},{id:"citizen",name:"Citizen",cluster:"polis",gist:"The member of a political community, ruling and ruled in turn.",framing:"The citizen is the member of a political community who shares in its rule and its rights. What makes one a citizen, what citizens owe and are owed, and who is included or excluded are foundational questions of political life.",senses:["One who shares in ruling and being ruled (the participatory sense)","One holding legal rights and status (the juridical sense)","Citizen vs. subject (active member vs. one merely ruled)","Citizen vs. alien or slave (the included vs. the excluded)"],disputes:[{q:"What defines a citizen?",sides:[{view:"Sharing in the offices and judgments of the city",who:"Aristotle"},{view:"Holding legal rights and protections",who:"the modern liberal view"}]},{q:"Who should be citizens?",sides:[{view:"Only those with the leisure and virtue to rule well",who:"the ancient restriction"},{view:"All who are subject to the laws",who:"the democratic expansion"}]},{q:"Do citizens owe primary loyalty to the state?",sides:[{view:"The citizen is part of the whole, owing devotion",who:"the classical view"},{view:"Individuals have rights prior to the state, which serves them",who:"liberalism"}]}],positions:[{name:"Aristotle",claim:"The citizen is one who shares in ruling and being ruled in turn; citizenship varies with the constitution."},{name:"The Romans",claim:"Develop citizenship as a legal status with defined rights, extendable across an empire."},{name:"Rousseau",claim:"The citizen participates in the general will; sovereignty belongs to the assembled people."},{name:"Modern liberalism",claim:"Citizenship is equal legal membership, securing rights even against the state."}],topics:["The definition of citizenship","Ruling and being ruled","The rights and duties of citizens","Who is included as a citizen","Citizen vs. subject","Citizenship and the constitution","Civic virtue","Citizenship and the state"],key_texts:["Aristotle, Politics III","Cicero, On the Commonwealth","Rousseau, The Social Contract","the modern declarations of rights"],example:"Aristotle defines the citizen not by residence but by eligibility to hold office and sit in judgment\u2014so a resident alien or laborer, present but excluded, was not a citizen.",related:["state","constitution","democracy"],hook:"Ruler and ruled in one person."},{id:"constitution",name:"Constitution",cluster:"polis",gist:"The ordering form of a state\u2014its arrangement of powers.",framing:"A constitution is the ordering of a state -- the arrangement of its offices, the distribution of power, and the way of life it embodies. It is at once the political structure and the fundamental law by which a people governs itself.",senses:["The arrangement of offices and form of government (who rules and how)","The fundamental or higher law (a written or unwritten frame)","The whole 'way of life' or character of a community","The mixed constitution (blending forms)"],disputes:[{q:"Is a constitution just a structure, or a way of life?",sides:[{view:"The arrangement of the ruling offices",who:"the formal sense"},{view:"The whole ethos and character of the community",who:"Aristotle's fuller sense"}]},{q:"What is the best constitution?",sides:[{view:"The rule of the best or of philosopher-kings",who:"Plato"},{view:"A mixed constitution balancing the one, few, and many",who:"Aristotle, Polybius"}]},{q:"Should the fundamental law be fixed or changeable?",sides:[{view:"A stable higher law binding even the rulers",who:"the constitutionalists"},{view:"A living frame the people may amend",who:"the reformers"}]}],positions:[{name:"Aristotle",claim:"Classifies constitutions by who rules and for whose good; the best practical form is a mixed 'polity.'"},{name:"Polybius",claim:"Praises the Roman mixed constitution, balancing consuls, senate, and people to slow decay."},{name:"Montesquieu",claim:"Liberty is secured by the separation of powers -- legislative, executive, judicial."},{name:"The Federalist",claim:"A written constitution with checks, balances, and divided powers guards against tyranny."}],topics:["The meaning of constitution","The forms of government","The mixed constitution","The best constitution","Constitution as fundamental law","The separation of powers","Constitutional change","Constitution and the way of life"],key_texts:["Plato, Republic; Statesman","Aristotle, Politics III-VI","Polybius, Histories VI","Montesquieu, The Spirit of the Laws","The Federalist"],example:"Polybius credited Rome's strength to mixing monarchy (consuls), aristocracy (senate), and democracy (assemblies) so each checked the others.",related:["government","state","law"],hook:"The form that shapes the state."},{id:"courage",name:"Courage",cluster:"good",gist:"Firmness of will in the face of fear and danger.",framing:"Courage is the virtue of facing danger, fear, and pain for the sake of a good -- steadiness of will where much is at risk. Long counted a cardinal virtue, it presses the question of what is worth risking and how fear and confidence should be governed.",senses:["Fortitude in battle or physical danger","Moral courage -- standing for the right against opposition","Endurance of pain and adversity","The mean between cowardice and rashness"],disputes:[{q:"Is courage knowledge or a trained passion?",sides:[{view:"A kind of knowledge of what is and is not to be feared",who:"Socrates"},{view:"A trained disposition of the spirited part, a mean",who:"Aristotle"}]},{q:"Does true courage require a good cause?",sides:[{view:"Only a noble end makes daring courageous",who:"Aristotle"},{view:"Mere fearlessness or daring already counts",who:"the popular view"}]},{q:"Is courage one virtue or bound up with all?",sides:[{view:"Inseparable from wisdom -- the virtues are one",who:"Socrates"},{view:"A distinct virtue among others",who:"Aristotle"}]}],positions:[{name:"Socrates",claim:"In the Laches, courage looks like a kind of wisdom -- knowledge of what is truly to be feared and dared."},{name:"Plato",claim:"Courage is the spirited part's preservation of reason's judgment about what to fear."},{name:"Aristotle",claim:"Courage is the mean between cowardice and rashness, shown above all in facing a noble death."},{name:"The Stoics",claim:"Courage is reason's endurance, unmoved by what is not truly evil."}],topics:["The nature of courage","Courage and fear","The mean between cowardice and rashness","Physical vs. moral courage","Courage and the noble","Courage and knowledge","Endurance and daring","Courage and the other virtues"],key_texts:["Plato, Laches; Republic IV","Aristotle, Nicomachean Ethics III","the Stoics (Epictetus, Seneca)"],example:"Aristotle notes the truly brave soldier feels fear\u2014the fearless one is merely reckless; courage is acting rightly while afraid.",related:["virtue-and-vice","temperance","honor"],hook:"Holding firm while afraid."},{id:"custom-and-convention",name:"Custom and Convention",cluster:"polis",gist:"The unwritten rules that nature does not fix.",framing:"Custom and convention are the settled but unwritten rules of a community -- what is done, expected, and agreed. Whether they rest on nature or mere agreement, and how far they bind, shapes debates over law, morality, and progress.",senses:["Custom as habitual practice (the ways of a people)","Convention as agreement or posit (nomos, vs. physis, nature)","Customary law (unwritten but binding) vs. enacted law","Convention as arbitrary vs. as accumulated wisdom"],disputes:[{q:"Nature or convention -- which grounds right?",sides:[{view:"Justice and morality are natural, above convention",who:"Plato, the Stoics"},{view:"They are conventional, mere human agreement",who:"the Sophists"}]},{q:"Is custom binding, or to be questioned?",sides:[{view:"Custom carries the wisdom of ages and rightly guides us",who:"Burke"},{view:"Custom is often mere prejudice, to be tested by reason",who:"the Enlightenment"}]},{q:"Are conventions arbitrary or grounded?",sides:[{view:"Purely arbitrary -- they could be otherwise",who:"the skeptics"},{view:"They solve real problems and embody experience",who:"Hume"}]}],positions:[{name:"The Sophists",claim:"Draw the great antithesis of nomos (convention) and physis (nature); much that seems just is merely conventional."},{name:"Aristotle",claim:"Some justice is natural, the same everywhere; some is legal and conventional, varying by place."},{name:"Montaigne",claim:"Marvels at the diversity of customs, warning we mistake our own habits for nature's law."},{name:"Hume",claim:"Justice and property are 'artificial' conventions -- yet indispensable, and not arbitrary."},{name:"Burke",claim:"Custom and prescription embody the tacit wisdom of generations; reformers scorn them at their peril."}],topics:["Nature vs. convention (physis vs. nomos)","Custom and law","The authority of custom","The diversity of customs","Convention and agreement","Custom and morality","Custom, prejudice, and reason","Tradition and change"],key_texts:["Plato, Gorgias","Aristotle, Nicomachean Ethics V","Montaigne, Of Custom","Hume, Treatise III","Burke, Reflections on the Revolution in France"],example:"Herodotus tells of Darius asking Greeks and Indians to adopt each other's funeral customs; both were horrified\u2014showing how custom masquerades as nature.",related:["law","nature","habit"],hook:"The rules nature didn't write."},{id:"definition",name:"Definition",cluster:"mind",gist:"Saying what a thing is\u2014fixing the boundary of a concept.",framing:"A definition states what a thing is -- fixing the meaning of a term or the essence of a thing. It is the starting point of demonstration and the arena where disputes over essences, words, and clarity are fought.",senses:["Nominal definition (meaning of a word) vs. real definition (essence of a thing)","Definition by genus and specific difference","Ostensive definition (by pointing)","Stipulative vs. lexical definition"],disputes:[{q:"Do definitions capture real essences or only word-use?",sides:[{view:"Real definitions state the essences of things",who:"Aristotle"},{view:"Definitions are of names only; we reach nominal essences",who:"Hobbes, Locke"}]},{q:"Can the most basic terms be defined?",sides:[{view:"The first and simplest terms are indefinable",who:"Aristotle"},{view:"All can in principle be analyzed",who:"some analysts"}]},{q:"Is definition the start of inquiry or its result?",sides:[{view:"We must first ask 'What is it?'",who:"Socrates"},{view:"Definition is the hard-won end of investigation",who:"Aristotle"}]}],positions:[{name:"Socrates",claim:"Presses the 'What is it?' question, seeking the single form common to all instances."},{name:"Aristotle",claim:"Real definition states the essence by genus and difference and grounds demonstration."},{name:"Hobbes",claim:"Definitions are of names; 'truth consists in the right ordering of names.'"},{name:"Locke",claim:"We define the nominal essences (our ideas), not the hidden real essences of things."}],topics:["Nominal vs. real definition","Definition by genus and difference","The indefinable and the simple","Definition and essence","Definition and demonstration","Defining words vs. things","The Socratic search for definitions"],key_texts:["Plato, Meno; Euthyphro","Aristotle, Posterior Analytics II; Topics","Hobbes, Leviathan I","Locke, Essay III"],example:"Aristotle's 'man is a rational animal' defines by placing man in a genus (animal) and naming the difference (rational) that marks him within it.",related:["idea","logic","language"],hook:"Drawing the concept's edge."},{id:"democracy",name:"Democracy",cluster:"polis",gist:"Rule by the people\u2014and the question of the many's competence.",framing:"Democracy is rule by the people -- government in which the many, or all, share sovereign power. Praised as the reign of freedom and equality and feared as the tyranny of the majority, it is the most contested of political forms.",senses:["Rule of the many or the people (the classic sense)","Direct (the assembled people) vs. representative democracy","Majority rule vs. the protection of rights","A form of government vs. a whole way of life and equality"],disputes:[{q:"Is democracy good or corrupt?",sides:[{view:"A perverted form -- rule of the poor many for themselves",who:"Plato, Aristotle"},{view:"The best or only legitimate government -- self-rule of a free people",who:"the moderns"}]},{q:"Should the majority rule without limit?",sides:[{view:"The will of the people is sovereign",who:"Rousseau"},{view:"Majorities can tyrannize; rights must limit them",who:"Madison, Tocqueville, Mill"}]},{q:"Is equality democracy's strength or danger?",sides:[{view:"Equal participation is just and ennobling",who:"the democrats"},{view:"Leveling equality breeds mediocrity and despotism",who:"Tocqueville"}]}],positions:[{name:"Plato",claim:"Ranks democracy low -- liberty becomes license, and the disordered city slides toward tyranny."},{name:"Aristotle",claim:"Democracy is rule by the many (usually the poor); a moderate 'polity' mixing it with oligarchy is more stable."},{name:"Rousseau",claim:"Legitimate rule expresses the general will; sovereignty belongs inalienably to the people."},{name:"Tocqueville",claim:"Democratic equality is providential and just, yet risks the 'tyranny of the majority' and soft despotism."},{name:"Mill",claim:"Representative democracy is the best government, but must protect individual liberty against the majority."}],topics:["The meaning of democracy","Rule of the many","Direct vs. representative democracy","Majority rule and minority rights","Democracy and equality","Democracy and liberty","The tyranny of the majority","The dangers and defenses of democracy"],key_texts:["Plato, Republic VIII","Aristotle, Politics III-VI","Rousseau, The Social Contract","Tocqueville, Democracy in America","Mill, Representative Government"],example:"Tocqueville admired American equality yet warned that a majority can crush dissent more completely than any king, since it claims to speak for all.",related:["aristocracy","liberty","justice"],hook:"The many rule themselves."},{id:"desire",name:"Desire",cluster:"good",gist:"The reaching of the soul toward what it lacks.",framing:"Desire is the movement of the soul toward what it lacks and finds good -- the spring of action and the root of both fulfillment and disorder. Whether desire should be satisfied, guided, or extinguished is a central ethical question.",senses:["Appetite for a sensible good (hunger, thirst, lust)","The rational will's wish for the good","Longing or eros (for beauty, the good, the divine)","Natural vs. vain (unnecessary) desires"],disputes:[{q:"Should desire be indulged, disciplined, or extinguished?",sides:[{view:"Moderate and order it",who:"Aristotle"},{view:"Limit it to the natural and necessary",who:"Epicurus"},{view:"Extirpate the passions",who:"the Stoics"}]},{q:"Is desire always for the good?",sides:[{view:"We desire only what appears good",who:"Socrates, Aristotle"},{view:"We can desire the bad against our own judgment",who:"Augustine, common experience"}]},{q:"Is desire the master or servant of reason?",sides:[{view:"Reason should rule appetite",who:"Plato"},{view:"Reason is the slave of the passions",who:"Hume"}]}],positions:[{name:"Plato",claim:"Desire (appetite) is one part of the soul, to be ruled by reason with the help of spirit."},{name:"Aristotle",claim:"Rational desire (wish) aims at the good; virtue trains appetite to obey reason."},{name:"Epicurus",claim:"Classifies desires; happiness lies in satisfying only the natural and necessary."},{name:"The Stoics",claim:"Disordered desire is a false judgment; the sage is free of the passions."},{name:"Hume",claim:"Reason alone moves no one; desire is the ultimate spring of action."}],topics:["The nature of desire","Kinds of desire (natural, necessary, vain)","Desire and the good","The objects of desire","Desire and reason","The control of desire","Desire and happiness","Eros and longing"],key_texts:["Plato, Republic IV, IX; Symposium","Aristotle, Nicomachean Ethics","Epicurus, Letter to Menoeceus","Hume, Treatise II"],example:"Plato's chariot has reason as charioteer struggling to control two horses\u2014noble spirit and unruly appetite\u2014a picture of desire needing government.",related:["emotion","pleasure-and-pain","will"],hook:"The soul reaching for what it lacks."},{id:"dialectic",name:"Dialectic",cluster:"mind",gist:"Reasoning by dialogue, opposition, and ascent.",framing:"Dialectic is the art of reasoning through dialogue and opposition -- questioning, refuting, drawing distinctions to reach truth. Its meaning shifts sharply: the ascent to the Forms, mere probable argument, or the logic of contradiction that drives history.",senses:["Socratic dialectic (question, answer, refutation)","Platonic dialectic (the ascent to the Forms)","Aristotelian dialectic (reasoning from accepted opinions, below demonstration)","Hegelian dialectic (development through contradiction)"],disputes:[{q:"Does dialectic yield knowledge or only the probable?",sides:[{view:"It is the highest science, of the Forms",who:"Plato"},{view:"It reasons from mere opinions, beneath demonstration",who:"Aristotle"}]},{q:"Is dialectic a method of thought or a law of reality?",sides:[{view:"A mode of argument",who:"Plato, Aristotle"},{view:"The very structure of reality and history",who:"Hegel, Marx"}]},{q:"Is dialectic discovery or mere disputation?",sides:[{view:"A path to truth",who:"Socrates, Plato"},{view:"Eristic word-battling",who:"as practiced by the Sophists"}]}],positions:[{name:"Socrates",claim:"By question and refutation (elenchus) he exposes ignorance and clears the way to knowledge."},{name:"Plato",claim:"Dialectic ascends from hypotheses to the unhypothetical first principle, the Form of the Good."},{name:"Aristotle",claim:"Dialectic reasons from generally accepted opinions -- useful, but distinct from demonstration."},{name:"Kant",claim:"'Transcendental dialectic' exposes the illusions reason falls into beyond experience."},{name:"Hegel",claim:"Dialectic is the movement by which contradictions are overcome in a higher unity."}],topics:["Dialectic vs. demonstration","The Socratic method","Dialectic and the Forms","Dialectic and rhetoric","Dialectic as the logic of illusion","The dialectic of history","Thesis, antithesis, synthesis"],key_texts:["Plato, Republic VI-VII; Parmenides","Aristotle, Topics","Kant, Critique of Pure Reason (Dialectic)","Hegel, Phenomenology of Spirit"],example:"Hegel's master and slave: the master's dominance undoes itself because he comes to depend on the slave's recognition\u2014a contradiction that drives history forward.",related:["logic","reasoning","opposition"],hook:"Truth born from clashing views."},{id:"duty",name:"Duty",cluster:"good",gist:"What is owed\u2014action commanded regardless of desire.",framing:"Duty is what one is morally bound to do -- obligation owed regardless of inclination or advantage. Whether morality is fundamentally about duty, and where duties come from, distinguishes the major ethical traditions.",senses:["Moral obligation (what one ought to do)","The duties of one's station or role","Duty to law and country","Duty as the motive of moral worth (Kant)"],disputes:[{q:"Is morality grounded in duty or in the good?",sides:[{view:"Right action is doing one's duty from the moral law",who:"Kant"},{view:"Right action is pursuing the good and flourishing",who:"Aristotle, the utilitarians"}]},{q:"Do duties bind unconditionally, or depend on consequences?",sides:[{view:"Categorical, exceptionless duties",who:"Kant"},{view:"Duties yield to the greater good",who:"consequentialism"}]},{q:"What is the source of duty?",sides:[{view:"Reason's own law",who:"Kant"},{view:"God's command, or the social contract, or one's role",who:"rival accounts"}]}],positions:[{name:"Cicero",claim:"Our obligations flow from our nature and roles and the demands of honesty and the common good."},{name:"Kant",claim:"To act from duty is to act from respect for the moral law; the categorical imperative binds unconditionally."},{name:"The utilitarians",claim:"Our one duty is to promote the greatest happiness; particular duties are rules that serve it."},{name:"Bradley",claim:"'My station and its duties' -- obligation is concretely embodied in one's social roles."}],topics:["The nature of moral obligation","Duty vs. inclination","Duty and the good","The categorical imperative","Conflicts of duty","Duties to self and others","Duty, law, and the state","The source of duty"],key_texts:["Cicero, On Duties","Kant, Groundwork of the Metaphysics of Morals","Mill, Utilitarianism","(contrast) Aristotle, Nicomachean Ethics"],example:"Kant insists the shopkeeper who is honest only because it's good for business acts rightly but without moral worth; duty done for duty's sake alone counts.",related:["justice","virtue-and-vice","will"],hook:"What you owe, want it or not."},{id:"education",name:"Education",cluster:"polis",gist:"The forming of a human being\u2014mind and character.",framing:"Education is the forming of mind and character -- the passing on of knowledge, skill, and virtue to the young. What its ends should be, what should be taught, and who should control it are questions on which the future of every society turns.",senses:["The cultivation of virtue and character (moral formation)","The transmission of knowledge and skill (instruction)","The drawing-out of the learner's own powers vs. filling with content","Liberal education vs. vocational training"],disputes:[{q:"What is education for -- virtue, knowledge, or use?",sides:[{view:"The formation of virtuous citizens and souls",who:"Plato, Aristotle"},{view:"Useful knowledge and productive skill",who:"the utilitarians"},{view:"The free development of the individual",who:"Rousseau, Dewey"}]},{q:"Is learning discovery or transmission?",sides:[{view:"Knowledge is recollected or drawn out from within",who:"Socrates, Plato"},{view:"The mind is filled from without by instruction",who:"the empiricist model"}]},{q:"Who should control education?",sides:[{view:"The state must form its citizens",who:"Plato, Aristotle"},{view:"The family and individual, guarding against indoctrination",who:"the liberals"}]}],positions:[{name:"Plato",claim:"Education turns the soul from shadows toward the good; the guardians undergo a long, ordered ascent to knowledge."},{name:"Aristotle",claim:"Education habituates the young to virtue and prepares them for the leisure of the free citizen."},{name:"Rousseau",claim:"In Emile, education should follow nature, shielding the child's growth from corrupting society."},{name:"Dewey",claim:"Education is growth through experience; the school is a form of community life -- learning by doing."}],topics:["The ends of education","Education and virtue","Liberal vs. vocational education","Learning as recollection or instruction","The curriculum","Education and the state","The education of women","Education and society"],key_texts:["Plato, Republic VII","Aristotle, Politics VII-VIII","Rousseau, Emile","Dewey, Democracy and Education"],example:"Plato's cave: education is not installing sight in blind eyes but turning the whole soul away from shadows toward the sun\u2014a conversion, not a filling.",related:["knowledge","virtue-and-vice","family"],hook:"Turning the soul toward the light."},{id:"element",name:"Element",cluster:"being",gist:"The simplest constituents from which all else is composed.",framing:"An element is a first, simplest constituent out of which composite things are made and into which they resolve. What counts as elementary -- earth, water, air, fire; atoms; or chemical simples -- marks each era's picture of matter.",senses:["One of the classical four (or five) roots","The indivisible atom","A chemical simple (the modern sense)","Any basic constituent (of a proof, a language)"],disputes:[{q:"What are the true elements?",sides:[{view:"Four roots: earth, water, air, fire",who:"Empedocles, Aristotle"},{view:"Indivisible atoms and the void",who:"Democritus, Epicurus"}]},{q:"Is matter continuous or atomic?",sides:[{view:"Matter is infinitely divisible; no smallest part",who:"Aristotle"},{view:"Matter is composed of indivisible atoms",who:"the atomists"}]},{q:"Are elements changeable into one another?",sides:[{view:"The elements transform into one another",who:"Aristotle, the alchemists"},{view:"Elements are permanent, distinct kinds",who:"early modern chemistry"}]}],positions:[{name:"Empedocles",claim:"Four roots combine and separate under the forces of Love and Strife."},{name:"Democritus",claim:"Atoms differing in shape, order, and position, moving in the void, compose all things."},{name:"Aristotle",claim:"Four elements defined by pairs of qualities (hot/cold, wet/dry), plus aether for the heavens."},{name:"Lavoisier",claim:"An element is a substance not decomposable by chemical means -- the modern definition."}],topics:["The meaning of element","The classical four elements","The atomic theory of elements","Continuity vs. atomism of matter","Transmutation of elements","Elements and compounds","The fifth element (aether)","Elements in geometry and logic"],key_texts:["Empedocles & Democritus (fragments)","Plato, Timaeus","Aristotle, On Generation and Corruption; On the Heavens","Lucretius, On the Nature of Things"],example:"Democritus proposed that if you kept cutting a thing you'd reach uncuttable pieces\u2014'atoms'\u2014whose arrangements explain every visible quality.",related:["matter","principle","quantity"],hook:"The simplest building blocks."},{id:"emotion",name:"Emotion",cluster:"good",gist:"The stirrings of the soul that color thought and move action.",framing:"Emotion, or passion, is the soul's stirred response -- fear, anger, love, joy, grief -- felt in the body and moving us to act. Whether the passions are to be trusted, trained, or conquered has divided the moral traditions.",senses:["Passion (something undergone) vs. action","A bodily-felt movement of appetite","An emotion involving judgment or belief (the cognitive view)","Emotion as distinct from reason and from calm desire"],disputes:[{q:"Are emotions judgments or brute feelings?",sides:[{view:"They contain evaluative judgments",who:"the Stoics, cognitivists"},{view:"They are bodily feelings, even prior to thought",who:"William James"}]},{q:"Should the passions be uprooted or moderated?",sides:[{view:"Uproot them -- the sage is passionless",who:"the Stoics"},{view:"Moderate and habituate them to reason",who:"Aristotle"}]},{q:"Are emotions obstacles to reason or aids?",sides:[{view:"They cloud judgment",who:"the rationalists"},{view:"Rightly trained, they are part of virtue",who:"Aristotle"}]}],positions:[{name:"Aristotle",claim:"Virtue is partly feeling the right emotions, to the right degree, at the right time."},{name:"The Stoics",claim:"Passions are mistaken judgments about good and evil; the wise achieve freedom from them."},{name:"Descartes",claim:"Catalogues the passions as motions of the 'animal spirits,' to be mastered by the will."},{name:"Spinoza",claim:"The emotions follow necessary laws; freedom comes through understanding them."},{name:"William James",claim:"Emotion is the felt perception of bodily changes -- we are afraid because we tremble."}],topics:["The nature of the passions","Emotion and judgment","Emotion and the body","The classification of the emotions","Emotion and reason","The control of the passions","Emotion and virtue","Emotion and action"],key_texts:["Aristotle, Rhetoric II; Nicomachean Ethics","Seneca, On Anger","Descartes, The Passions of the Soul","Spinoza, Ethics III-IV","James, Principles of Psychology"],example:"Spinoza held that an emotion 'ceases to be a passion as soon as we form a clear idea of it'\u2014understanding your anger changes it.",related:["desire","pleasure-and-pain","soul"],hook:"The soul stirred, and moved."},{id:"eternity",name:"Eternity",cluster:"being",gist:"Timeless being\u2014or endless time.",framing:"Eternity is being without beginning, end, or succession -- either endless time or a timeless present. It frames how we conceive God, the soul, truth, and whether the world itself had a beginning.",senses:["Endless duration (sempiternity)","Timelessness -- the whole possessed at once","The eternal as the necessary and unchanging (Forms, truths)","Eternity vs. the merely everlasting"],disputes:[{q:"Is eternity timeless or endless time?",sides:[{view:"The complete, simultaneous possession of unlimited life -- timeless",who:"Boethius, Aquinas"},{view:"Unending temporal duration",who:"much ordinary and some philosophical usage"}]},{q:"Did the world have a beginning?",sides:[{view:"The world is eternal, without temporal beginning",who:"Aristotle"},{view:"The world was created and began to be",who:"Augustine, Aquinas (by faith)"},{view:"Reason cannot decide the question",who:"Kant's antinomy"}]},{q:"Is anything besides God eternal?",sides:[{view:"Forms and mathematical truths are eternal",who:"Plato"},{view:"Only God is eternal; creatures are temporal or everlasting by gift",who:"Christian tradition"}]}],positions:[{name:"Plato",claim:"The Forms and truths of mathematics are eternal; time is 'a moving image of eternity.'"},{name:"Aristotle",claim:"Motion and the world are eternal; the prime mover is eternal actuality."},{name:"Boethius",claim:"God's eternity is the whole of life possessed at once, reconciling foreknowledge and freedom."},{name:"Augustine",claim:"God created time together with the world; there is no 'before' creation."},{name:"Kant",claim:"Whether the world is eternal or began is an antinomy reason cannot resolve."}],topics:["The meaning of eternity","Eternity vs. time","The timeless present","The eternity of God","The eternity or beginning of the world","Eternal truths","Foreknowledge and eternity","Eternity and immortality"],key_texts:["Plato, Timaeus","Aristotle, Physics VIII; Metaphysics XII","Augustine, Confessions XI","Boethius, Consolation of Philosophy V","Aquinas, Summa Theologica I Q.10"],example:"Boethius pictures God's eternity not as a very long time but as the total, simultaneous grasp of all life\u2014no before or after, all present at once.",related:["time","immortality","god"],hook:"All at once, no before or after."},{id:"evolution",name:"Evolution",cluster:"nature",gist:"The descent and transformation of living kinds over time.",framing:"Evolution is the idea that the forms of life -- and perhaps of all things -- develop and change over time rather than being fixed once for all. It transformed biology and challenged older beliefs in fixed species and design.",senses:["The descent of species with modification (biological)","Any gradual development or unfolding (cosmic, social)","Evolution by natural selection (Darwin's mechanism)","Evolution vs. the fixity of species and special creation"],disputes:[{q:"Are species fixed or mutable?",sides:[{view:"Each kind is fixed by its eternal form or by creation",who:"the classical and traditional view"},{view:"Species descend and change over time",who:"Darwin"}]},{q:"What drives evolution?",sides:[{view:"Chance variation sifted by natural selection",who:"Darwin"},{view:"The inheritance of acquired characteristics",who:"Lamarck"},{view:"A directing purpose or vital force",who:"the teleologists"}]},{q:"Does evolution abolish design and purpose?",sides:[{view:"Yes -- apparent design is the work of blind selection",who:"the Darwinians"},{view:"Evolution is the means of a larger providence",who:"theistic evolutionists"}]}],positions:[{name:"Lamarck",claim:"Organisms change by use and disuse, passing acquired characteristics to their offspring."},{name:"Darwin",claim:"Descent with modification through natural selection acting on chance variation."},{name:"Aristotle",claim:"By contrast holds species eternal; nature acts for ends, not by cumulative accident."},{name:"The modern synthesis",claim:"Heredity -- genes -- supplies the variation on which selection works."}],topics:["The mutability of species","Descent with modification","Natural selection","Chance and adaptation","Evolution and design","The origin of life and of man","Evolution beyond biology","Heredity and variation"],key_texts:["Lamarck, Zoological Philosophy","Darwin, On the Origin of Species; The Descent of Man","(contrast) Aristotle, Parts of Animals"],example:"Darwin's finches: island by island their beaks differed to match available food, suggesting one ancestral kind had diverged rather than being separately created.",related:["animal","man","life-and-death"],hook:"Kinds that change by descent."},{id:"experience",name:"Experience",cluster:"mind",gist:"What the senses and living deliver to the mind.",framing:"Experience is what we learn through the senses and through living -- the encounter with particular facts. Whether experience is the source of all knowledge, or merely its occasion, splits empiricists from rationalists.",senses:["Sense-experience (perception of particulars)","Accumulated practical familiarity (the experienced person)","The tribunal of science (observation and experiment)","All conscious life, in the widest sense"],disputes:[{q:"Is all knowledge from experience?",sides:[{view:"Yes -- the mind begins a blank slate",who:"Locke, Hume"},{view:"No -- some knowledge is a priori",who:"Plato, Descartes, Kant"}]},{q:"Does experience yield necessity and universality?",sides:[{view:"No -- only 'so far, always'",who:"Hume"},{view:"The mind supplies the necessary forms that shape experience",who:"Kant"}]},{q:"Are the senses trustworthy?",sides:[{view:"They are the basis of all science",who:"the empiricists"},{view:"They deceive; trust reason",who:"rationalists and skeptics"}]}],positions:[{name:"Aristotle",claim:"Knowledge begins in sense; from many memories comes experience, and from experience art and science."},{name:"Locke",claim:"There are no innate ideas; all the materials of knowledge come from sensation and reflection."},{name:"Hume",claim:"All ideas derive from impressions; experience gives matters of fact but never necessity."},{name:"Kant",claim:"Knowledge begins with experience but is not all derived from it; the mind's forms make experience possible."},{name:"Dewey",claim:"Experience is the organism's active transaction with its environment, not passive reception."}],topics:["Experience as the source of knowledge","A priori vs. a posteriori","Experience and the senses","Experience, memory, and art","The limits of experience","Experience and experiment","Experience vs. innate ideas"],key_texts:["Aristotle, Metaphysics I; Posterior Analytics II.19","Locke, Essay II","Hume, Enquiry","Kant, Critique of Pure Reason (Introduction)","Dewey, Experience and Nature"],example:"Locke's blank slate: a child born knowing nothing, its ideas all traceable to sights, sounds, and inner sensations\u2014no truths stamped in at birth.",related:["knowledge","sense","induction"],hook:"What living teaches the mind."},{id:"family",name:"Family",cluster:"polis",gist:"The first community, prior to the state.",framing:"The family is the primary community -- of husband and wife, parents and children -- the first association from which larger society grows. Its nature, authority, and relation to the state are debated from the household of the ancients to modern individualism.",senses:["The household (including its economy and, anciently, its slaves)","The natural community of reproduction and rearing","The basic unit of society -- the state in miniature","The family as private sphere vs. as object of political concern"],disputes:[{q:"Is the family natural or conventional?",sides:[{view:"A natural association, prior to the state",who:"Aristotle"},{view:"A conventional, variable arrangement, open to reshaping",who:"Plato, the moderns"}]},{q:"Should the family be preserved or transcended?",sides:[{view:"The family is the seedbed of affection and society",who:"Aristotle, Hegel"},{view:"Abolish the private family among the guardians for unity",who:"Plato's Republic"}]},{q:"What authority governs within the family?",sides:[{view:"Natural paternal or parental rule",who:"the traditional view"},{view:"An equal partnership; and it differs in kind from political rule",who:"Locke"}]}],positions:[{name:"Aristotle",claim:"The household -- husband/wife, parent/child, master/slave -- is the natural first community; the state grows from it."},{name:"Plato",claim:"For the guardian class he abolishes the private family, so that none says 'mine' -- securing the city's unity."},{name:"Locke",claim:"Distinguishes parental authority, temporary and for the child's good, from political power."},{name:"Hegel",claim:"The family, grounded in love, is the first moment of ethical life, completed in civil society and the state."}],topics:["The nature and origin of the family","The household and its economy","The authority of parents","Family and property","Family vs. state","The community of women and children (Plato)","Marriage","The family and society"],key_texts:["Aristotle, Politics I","Plato, Republic V","Locke, Second Treatise (VI)","Hegel, Philosophy of Right"],example:"Plato shocked readers by proposing guardians hold wives and children in common, so no ruler would favor 'his own' over the city\u2014dissolving the family for the state.",related:["state","education","love"],hook:"The community you're born into."},{id:"fate",name:"Fate",cluster:"being",gist:"The appointed order that binds even the gods.",framing:"Fate is the idea that events are fixed in advance by an order beyond human control -- by the stars, the gods, necessity, or divine decree. It presses the question whether anything is truly up to us.",senses:["Cosmic necessity or destiny","Divine providence unfolding in time","The decree of the Fates or gods","Fatalism -- the view that deliberation changes nothing"],disputes:[{q:"Is everything fated?",sides:[{view:"All is bound by fate and necessity",who:"the Stoics"},{view:"Some things are 'up to us'; not all is fated",who:"Aristotle, Epicurus"}]},{q:"Does fate destroy responsibility?",sides:[{view:"If all is fated, praise and blame are empty (the 'lazy argument')",who:"critics of Stoicism"},{view:"We remain responsible for our assent even under fate",who:"Chrysippus' compatibilism"}]},{q:"Is fate the same as providence?",sides:[{view:"Fate is providence as executed in the temporal order",who:"Boethius, Aquinas"},{view:"Fate is blind necessity, opposed to a provident God",who:"much theology rejects the term"}]}],positions:[{name:"The tragedians",claim:"The Fates and gods weave destinies mortals struggle against but cannot escape (Oedipus)."},{name:"The Stoics",claim:"Fate is the rational order of the cosmos; freedom is the wise assent to necessity."},{name:"Epicurus",claim:"The atomic swerve frees us from the 'tyranny of fate.'"},{name:"Boethius",claim:"Providence is the divine plan; fate its unfolding in time; foreknowledge leaves freedom intact."},{name:"Aquinas",claim:"God's providence governs all, yet works through contingent and free secondary causes."}],topics:["The meaning of fate and destiny","Fate and the gods","Fate and necessity","Fate vs. chance","Fate and free will","Fate and providence","Astrology and the stars","Fatalism and moral responsibility"],key_texts:["Homer, Iliad; Sophocles, Oedipus Rex","Cicero, On Fate","Boethius, Consolation IV-V","Aquinas, Summa Theologica I Q.116"],example:"Oedipus does everything to avoid killing his father and marrying his mother\u2014and each precaution is a step toward fulfilling exactly that fate.",related:["necessity-and-contingency","chance","will"],hook:"What must be, will be."},{id:"form",name:"Form",cluster:"being",gist:"The shaping principle that makes a thing what it is.",framing:"Form is what makes a thing the kind of thing it is -- its shape, structure, essence, or defining principle -- as opposed to the matter it informs. Whether forms exist apart from things, or only in them, is one of philosophy's oldest divides.",senses:["Visible shape or figure","Essence or species (the what-it-is)","The Platonic Idea existing apart","The organizing principle of matter (substantial form)"],disputes:[{q:"Do forms exist apart from things?",sides:[{view:"Forms are separate, eternal realities; things imitate them",who:"Plato"},{view:"Form exists only in the individual, joined to matter",who:"Aristotle"}]},{q:"Are universals (forms) real or names?",sides:[{view:"Universals are real",who:"the realists"},{view:"Universals are mere names or concepts",who:"nominalists, Ockham"}]},{q:"Is form the intelligible in things?",sides:[{view:"Form is the object of intellect; matter individuates",who:"Aristotle, Aquinas"},{view:"Only particulars are real; 'form' is our abstraction",who:"the empiricists"}]}],positions:[{name:"Plato",claim:"Forms are eternal originals; the soul knows them by recollection; particulars merely participate."},{name:"Aristotle",claim:"Form and matter are inseparable co-principles of substance; the soul is the form of the living body."},{name:"Aquinas",claim:"Substantial form gives a thing its being and species; God is pure form without matter."},{name:"Ockham",claim:"Only individuals exist; universals are signs in the mind, not things."}],topics:["The meaning of form","Form and matter","Substantial vs. accidental form","The separateness of the Forms","Form as essence and definition","The problem of universals","Form and the soul","Intelligible vs. sensible form"],key_texts:["Plato, Republic; Phaedo; Parmenides","Aristotle, Metaphysics VII-VIII; On the Soul","Aquinas, On Being and Essence","Ockham, Summa Logicae"],example:"The same bronze is a lump, then a horse, then melted and made a bell: matter persists, but form is what makes it, at each stage, this thing rather than that.",related:["matter","being","universal-and-particular"],hook:"What makes the stuff this thing."},{id:"god",name:"God",cluster:"divine",gist:"The supreme being\u2014ground of the world and its order.",framing:"God is the idea of a supreme being -- creator, first cause, and highest good -- on which all else depends. Whether such a being exists, and what can be known of it, is perhaps the most consequential question in the whole tradition.",senses:["The God of philosophy (first cause, unmoved mover, necessary being)","The God of religion (personal, providential, revealed)","The one God vs. the many gods","God as being itself vs. God as a supreme being"],disputes:[{q:"Can God's existence be proved?",sides:[{view:"Yes -- by cosmological, design, and ontological arguments",who:"Anselm, Aquinas"},{view:"No -- the proofs fail",who:"Hume, Kant"},{view:"God is known by faith, not proof",who:"the fideists"}]},{q:"Is God's nature knowable?",sides:[{view:"By analogy we affirm perfections of God",who:"Aquinas"},{view:"Only the negative way -- what God is not -- is safe",who:"Maimonides, Dionysius"}]},{q:"Is God personal and providential?",sides:[{view:"A personal creator who knows and wills",who:"theism"},{view:"God is the impersonal order of Nature itself",who:"Spinoza, the deists"}]}],positions:[{name:"Anselm",claim:"The ontological argument: that than which nothing greater can be conceived must exist."},{name:"Aquinas",claim:"The Five Ways argue from motion, cause, contingency, degree, and design to God."},{name:"Maimonides",claim:"We can say only what God is not; positive attributes mislead."},{name:"Hume",claim:"Dismantles the design argument; the world's order does not prove a perfect designer."},{name:"Kant",claim:"Theoretical reason cannot prove God, but morality postulates him."},{name:"Spinoza",claim:"God is the one infinite substance -- Nature itself -- not a person who chooses."}],topics:["The existence of God","The proofs and their critics","The divine attributes","God's knowledge and will","Providence and the problem of evil","God and creation","The one and the many gods","Faith and reason about God"],key_texts:["Anselm, Proslogion","Aquinas, Summa Theologica I QQ.2-26","Maimonides, Guide for the Perplexed","Hume, Dialogues Concerning Natural Religion","Kant, Critique of Practical Reason","Spinoza, Ethics I"],example:"Aquinas's first way: things move only if moved by another, but the chain can't regress forever, so there must be a first, unmoved mover\u2014which he calls God.",related:["being","theology","cause"],hook:"The being all else depends on."},{id:"good-and-evil",name:"Good and Evil",cluster:"good",gist:"The most basic distinction in the realm of action.",framing:"The good is what all things seek -- the desirable, the perfective, the end of action; evil is its privation or opposite. What the good is, whether it is one or many, and how evil enters the world are founding questions of ethics and theodicy.",senses:["The good as the object of desire and the end","The useful, the pleasant, the noble (kinds of good)","The highest good (summum bonum)","Moral vs. natural good and evil; evil as privation vs. as a positive force"],disputes:[{q:"Is the good one or many?",sides:[{view:"A single Form of the Good above all",who:"Plato"},{view:"Good is said in as many ways as being -- no one Idea",who:"Aristotle"}]},{q:"Is the good objective or relative?",sides:[{view:"A real feature of things, the end of nature",who:"Plato, Aristotle"},{view:"Whatever we desire or approve -- relative to us",who:"Hobbes, Spinoza"}]},{q:"Is evil real or a privation?",sides:[{view:"Only the absence or corruption of a due good",who:"Augustine, Aquinas"},{view:"A real, opposing principle",who:"the Manichaeans"}]}],positions:[{name:"Plato",claim:"The Form of the Good is the highest reality, source of being and knowledge, like the sun."},{name:"Aristotle",claim:"The good is that at which all things aim; the human good is activity of soul according to virtue."},{name:"Augustine",claim:"All that exists is good insofar as it exists; evil is the privation or corruption of good."},{name:"Hobbes",claim:"'Good' and 'evil' are just names for what we desire and avoid; nothing is good in itself."},{name:"Kant",claim:"The only thing good without qualification is a good will."}],topics:["The meaning of good","The good as the end","Kinds of good (useful, pleasant, noble)","The highest good","The good as one or many","Moral vs. natural good","The problem of evil","Evil as privation"],key_texts:["Plato, Republic VI-VII","Aristotle, Nicomachean Ethics I","Augustine, Confessions; Enchiridion","Hobbes, Leviathan I","Kant, Groundwork"],example:"Augustine argued evil is not a thing God made but a hole in the good, as blindness is not a substance but the absence of sight\u2014so no evil creator is needed.",related:["virtue-and-vice","happiness","beauty"],hook:"What to seek, what to shun."},{id:"government",name:"Government",cluster:"polis",gist:"The organized power that rules a community.",framing:"Government is the ruling power in a community -- the authority that makes and enforces its common decisions. Its origin, its forms, its proper ends, and the limits of its power are the enduring questions of political philosophy.",senses:["The ruling authority, those who rule","A form or type (monarchy, aristocracy, democracy)","The activity of governing (administration)","Government vs. the state or society (the apparatus vs. the whole)"],disputes:[{q:"Whence does government derive its authority?",sides:[{view:"From nature or God",who:"the classical and divine-right views"},{view:"From the consent of the governed -- a social contract",who:"Locke, Rousseau"}]},{q:"What is the best form of government?",sides:[{view:"Rule of the best, or of one wise ruler",who:"Plato"},{view:"A mixed or balanced constitution",who:"Aristotle, Polybius"},{view:"Representative democracy",who:"the moderns"}]},{q:"What are the limits of government?",sides:[{view:"It exists to secure rights and may be resisted if it violates them",who:"Locke"},{view:"Sovereignty must be near-absolute to keep the peace",who:"Hobbes"}]}],positions:[{name:"Aristotle",claim:"Distinguishes correct governments (for the common good) from perversions (for the rulers); prefers the mixed polity."},{name:"Hobbes",claim:"To escape the war of all against all, men covenant to erect a sovereign whose power must be undivided."},{name:"Locke",claim:"Government is a trust to protect life, liberty, and property; betraying it, it may be replaced."},{name:"Montesquieu",claim:"Liberty depends on dividing and balancing the powers of government."}],topics:["The origin of government","The authority to rule","The forms of government","The ends of government","The consent of the governed","The limits of government","The separation of powers","The right of revolution"],key_texts:["Aristotle, Politics III","Hobbes, Leviathan II","Locke, Second Treatise of Government","Montesquieu, The Spirit of the Laws","The Federalist"],example:"Hobbes argued that without a common power to keep all in awe, life would be 'solitary, poor, nasty, brutish, and short'\u2014so we trade some liberty for order.",related:["constitution","state","law"],hook:"Power organized to rule."},{id:"habit",name:"Habit",cluster:"good",gist:"The second nature built by repeated action.",framing:"Habit is a stable disposition, acquired by repetition, that makes action easy, prompt, and reliable. It is the very stuff of character -- for virtues and vices alike are habits -- and the means by which we become what we repeatedly do.",senses:["An acquired disposition or 'second nature'","Mere routine or custom vs. trained skill or virtue","Good habits (virtues) vs. bad habits (vices)","The learned automatic response (in psychology)"],disputes:[{q:"Is character made by habit or given by nature?",sides:[{view:"We become just by doing just acts -- virtue is habituated",who:"Aristotle"},{view:"Temperament and nature set the limits",who:"the naturists"}]},{q:"Is habit freeing or enslaving?",sides:[{view:"It frees attention and perfects action",who:"James"},{view:"It deadens and mechanizes -- the enemy of thought",who:"the critics"}]},{q:"Can habit produce real virtue, or only its form?",sides:[{view:"Repeated right action forms genuine virtue",who:"Aristotle"},{view:"True virtue needs right motive, not just habit",who:"Kant-leaning views"}]}],positions:[{name:"Aristotle",claim:"Moral virtue comes about by habituation; we acquire the virtues by first exercising them."},{name:"Aquinas",claim:"Habits are stable qualities perfecting a power for good or ill; virtues and vices are habits."},{name:"Hume",claim:"Custom is 'the great guide of human life,' the basis of causal expectation itself."},{name:"William James",claim:"Habit is the great flywheel of society; make the nervous system an ally, not an enemy."}],topics:["The nature of habit","Habit and repetition","Habit as second nature","Habit and character","Virtue and vice as habits","Habit and custom","Forming and breaking habits","Habit, freedom, and mechanism"],key_texts:["Aristotle, Nicomachean Ethics II","Aquinas, Summa Theologica I-II QQ.49-54","Hume, Enquiry V","James, Principles of Psychology"],example:"Aristotle: we aren't born just or brave but become so by practice, as a builder becomes a builder by building\u2014character is habituated, not innate.",related:["virtue-and-vice","custom-and-convention","will"],hook:"Repetition become character."},{id:"happiness",name:"Happiness",cluster:"good",gist:"The final end\u2014what all else is sought for.",framing:"Happiness is the good life fully lived -- the final end that all our actions aim at for its own sake. What it consists in -- pleasure, virtue, contemplation, or fortune -- is the central question of ethics.",senses:["Flourishing, a life well lived (eudaimonia -- an activity, not a mood)","Pleasure or contentment (a subjective state)","Blessedness -- union with God","The greatest happiness (the utilitarian standard)"],disputes:[{q:"What does happiness consist in?",sides:[{view:"Virtuous activity, crowned by contemplation",who:"Aristotle"},{view:"Pleasure, or freedom from pain",who:"Epicurus, the hedonists"},{view:"Virtue alone",who:"the Stoics"}]},{q:"Is happiness in our power or dependent on fortune?",sides:[{view:"It needs some external goods and luck",who:"Aristotle"},{view:"It depends only on virtue, immune to fortune",who:"the Stoics"}]},{q:"Is happiness the right standard of morality?",sides:[{view:"Yes -- the good is what conduces to happiness",who:"eudaimonists, utilitarians"},{view:"No -- duty, not happiness, defines the moral",who:"Kant"}]}],positions:[{name:"Aristotle",claim:"Happiness is activity of soul in accordance with virtue, over a complete life, perfected in contemplation."},{name:"Epicurus",claim:"Happiness is pleasure rightly understood -- freedom from bodily pain and mental disturbance."},{name:"The Stoics",claim:"Happiness is virtue alone; nothing external is needed, for only the good will is truly good."},{name:"Augustine",claim:"The heart is restless until it rests in God; true happiness is enjoyment of the eternal."},{name:"Mill",claim:"The standard is the greatest happiness of the greatest number, higher pleasures counting for more."}],topics:["The definition of happiness","Happiness as the final end","Happiness and pleasure","Happiness and virtue","Happiness and fortune","The contemplative vs. the active life","Happiness and the highest good","The greatest-happiness principle"],key_texts:["Aristotle, Nicomachean Ethics I, X","Epicurus, Letter to Menoeceus","Epictetus; Marcus Aurelius","Augustine, Confessions","Mill, Utilitarianism"],example:"Aristotle warns we can't call anyone happy until we see how the whole life ends\u2014Priam was fortunate for decades, then lost everything in old age.",related:["good-and-evil","pleasure-and-pain","virtue-and-vice"],hook:"The end behind every end."},{id:"history",name:"History",cluster:"polis",gist:"The record and meaning of human events in time.",framing:"History is both the course of human events and the inquiry that records and explains them. Whether history has a pattern or meaning, and whether it is science, art, or a guide to life, shapes how we understand our past and future.",senses:["The events themselves (what happened) vs. the account or inquiry","Narrative and political history vs. the philosophy of history","History as a science of causes vs. an art of narration","History as unique and unrepeatable vs. as lawlike and recurring"],disputes:[{q:"Does history have a meaning or direction?",sides:[{view:"It unfolds a rational or providential plan toward freedom",who:"Hegel; or class-liberation, Marx"},{view:"It is contingent, cyclical, or without overall meaning",who:"the ancients, the skeptics"}]},{q:"Is history a science or an art?",sides:[{view:"A rigorous inquiry into causes, even lawlike",who:"Thucydides, the positivists"},{view:"An interpretive narrative of the singular",who:"the humanists"}]},{q:"Does history teach lessons?",sides:[{view:"It is philosophy teaching by examples",who:"the classical view"},{view:"Its situations are too singular to yield laws",who:"the skeptics"}]}],positions:[{name:"Thucydides",claim:"Writes a rigorous, causal history 'as a possession for all time,' expecting patterns to recur."},{name:"Augustine",claim:"History is the drama of two cities, moving under providence toward a divine end."},{name:"Vico",claim:"History passes through recurring ages -- of gods, heroes, men -- knowable because men make it."},{name:"Hegel",claim:"History is the rational progress of Spirit in the consciousness of freedom."},{name:"Marx",claim:"History is driven by material conditions and class struggle toward a classless society."}],topics:["The nature of history","History as event and as inquiry","The causes in history","The philosophy of history","Progress, cycles, or providence in history","History as science or art","The lessons of history","Individuals vs. forces in history"],key_texts:["Thucydides, History of the Peloponnesian War","Augustine, City of God","Vico, The New Science","Hegel, The Philosophy of History","Marx, on historical materialism"],example:"Tolstoy in War and Peace argues Napoleon merely rode a wave he didn't create; the war's course was the sum of countless small wills, not one man's plan.",related:["progress","man","time"],hook:"The past, and its pattern."},{id:"honor",name:"Honor",cluster:"good",gist:"The public recognition of worth\u2014and the love of it.",framing:"Honor is the recognition and esteem owed to excellence -- the outward reward of virtue and the mark of worth in others' eyes. Whether honor is a worthy aim or a snare of vanity has divided moralists and shaped the ethics of warrior and citizen.",senses:["Public esteem or recognition (reputation, glory)","The inner sense of one's own worth (a code of honor)","The reward due to virtue","Rank or office"],disputes:[{q:"Is honor a worthy end?",sides:[{view:"The greatest of external goods, the prize of virtue",who:"Aristotle"},{view:"A hollow, unstable good
