.syn-search input{ border:0; outline:0; background:none; font-family:var(--serif);
  font-size:16px; color:INK; width:100%; }
.syn-search input::placeholder{ color:FAINT }
.syn-chips{ display:flex; gap:7px; flex-wrap:wrap }
.syn-chip{ font-family:var(--mono); font-size:10.5px; letter-spacing:.8px;
  text-transform:uppercase; padding:6px 11px; border:1px solid RULE; background:none;
  color:MUTED; cursor:pointer; border-radius:20px; transition:all .15s }
.syn-chip:hover{ border-color:OXTINT; color:INK }
.syn-chip[data-on="1"]{ background:INK; color:PAPER; border-color:INK }

/* ---- cluster + idea grid ---- */
.syn-cluster{ margin-bottom:40px }
.syn-eyebrow{ display:flex; align-items:baseline; gap:12px; margin-bottom:4px }
.syn-eyebrow h2{ font-size:15px; font-family:var(--mono); letter-spacing:1.5px;
  text-transform:uppercase; color:OXBLOOD; font-weight:700 }
.syn-eyebrow em{ font-size:11px; font-family:var(--mono); color:FAINT; font-style:normal;
  letter-spacing:.5px }
.syn-cluster-blurb{ font-style:italic; color:MUTED; font-size:15px; margin-bottom:16px }
.syn-idea-grid{ display:grid; grid-template-columns:1fr 1fr; gap:1px; background:RULE;
  border:1px solid RULE; border-radius:5px; overflow:hidden }
.syn-idea{ text-align:left; border:0; background:PANEL; cursor:pointer;
  padding:14px 16px; display:flex; gap:12px; align-items:flex-start;
  transition:background .14s }
.syn-idea:hover{ background:#fff }
.syn-dot{ width:9px; height:9px; border-radius:50%; margin-top:7px; flex:0 0 9px }
.syn-idea-body{ min-width:0 }
.syn-idea-name{ font-size:18px; font-weight:700; letter-spacing:.2px }
.syn-idea-gist{ font-size:13.5px; color:MUTED; font-style:italic; margin-top:2px;
  overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2;
  -webkit-box-orient:vertical }
.syn-idea-xn{ font-family:var(--mono); font-size:9.5px; color:FAINT; letter-spacing:.5px;
  margin-top:6px; text-transform:uppercase }
.syn-empty{ font-style:italic; color:MUTED; padding:40px 0 }

/* ---- the page (idea detail) : the signature element ---- */
.syn-back{ font-family:var(--mono); font-size:11px; letter-spacing:1px; text-transform:uppercase;
  color:MUTED; background:none; border:0; cursor:pointer; display:inline-flex; gap:7px;
  align-items:center; margin-bottom:26px; padding:0 }
.syn-back:hover{ color:OXBLOOD }
.syn-page{ position:relative; padding-left:26px }
.syn-spine{ position:absolute; left:0; top:4px; bottom:4px; width:9px; border-radius:2px;
  background:linear-gradient(180deg,OXBLOOD,#4E1723);
  box-shadow:inset 0 0 0 1px rgba(156,122,60,.5) }
.syn-page-e{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:8px }
.syn-page-e .k{ font-family:var(--mono); font-size:10.5px; letter-spacing:2px;
  text-transform:uppercase; color:OXBLOOD }
.syn-status{ font-family:var(--mono); font-size:10px; letter-spacing:1px; text-transform:uppercase;
  padding:3px 9px; border-radius:20px; color:#fff }
.syn-title{ font-size:46px; font-weight:700; line-height:1.02; letter-spacing:.3px; margin:2px 0 10px }
.syn-page-gist{ font-size:20px; font-style:italic; color:OXBLOOD; margin-bottom:22px }
.syn-def{ font-size:18.5px; line-height:1.62; margin-bottom:30px }
.syn-sec-h{ font-family:var(--mono); font-size:11px; letter-spacing:2px; text-transform:uppercase;
  color:FAINT; border-bottom:1px solid RULE; padding-bottom:6px; margin:0 0 14px }
.syn-topics{ list-style:none; counter-reset:t; padding:0; margin:0 0 30px }
.syn-topics li{ counter-increment:t; display:flex; gap:14px; padding:7px 0; font-size:17px;
  line-height:1.5; align-items:baseline }
.syn-topics li::before{ content:counter(t,upper-roman); font-family:var(--mono); font-size:12px;
  color:OXBLOOD; min-width:34px; text-align:right; flex:0 0 34px }
.syn-thinkers{ margin:0 0 30px; display:flex; flex-direction:column; gap:11px }
.syn-thinker{ display:flex; gap:14px; align-items:baseline }
.syn-thinker b{ font-weight:700; min-width:150px; flex:0 0 150px }
.syn-thinker span{ color:MUTED; font-style:italic; font-size:16px }
.syn-dates{ display:block; font-family:var(--mono); font-style:normal; font-size:9.5px;
  letter-spacing:.6px; color:GILT; font-weight:400; margin-top:2px }
.syn-bio{ display:block; font-style:normal; font-size:13.5px; line-height:1.5;
  color:FAINT; margin-top:5px; padding-left:11px; border-left:1px solid RULE }
.syn-when{ font-family:var(--mono); font-style:normal; font-size:9.5px; letter-spacing:.6px;
  color:GILT; font-weight:400; margin-left:8px }
.syn-quotes{ margin:0 0 30px; display:flex; flex-direction:column; gap:22px }
.syn-quote{ margin:0 }
.syn-quote blockquote{ margin:0; font-size:19px; line-height:1.45; color:OXBLOOD;
  font-style:italic; padding-left:18px; border-left:2px solid OXTINT }
.syn-quote figcaption{ font-family:var(--mono); font-size:10px; letter-spacing:1.1px;
  text-transform:uppercase; color:SLATE; padding-left:20px; margin-top:8px }
.syn-quote figcaption i{ font-style:normal; text-transform:none; letter-spacing:.3px }
.syn-quote-ctx{ margin:9px 0 0; padding-left:20px; font-size:15.5px; line-height:1.6; color:MUTED }
.syn-person-dates{ font-family:var(--mono); font-size:9.5px; letter-spacing:.6px; color:GILT;
  display:block; margin:3px 0 5px }
.syn-linkbtn{ font-family:var(--serif); font-weight:700; font-size:inherit; color:SLATE;
  background:none; border:0; padding:0; cursor:pointer; text-align:left;
  text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:3px;
  text-decoration-color:RULE }
.syn-linkbtn:hover{ color:OXBLOOD; text-decoration-color:OXBLOOD }
.syn-senses{ list-style:none; padding:0; margin:0 0 30px }
.syn-senses li{ position:relative; padding:5px 0 5px 22px; font-size:16.5px; line-height:1.55; color:INK }
.syn-senses li::before{ content:"\xB7"; position:absolute; left:6px; top:3px; color:OXBLOOD;
  font-weight:700; font-size:20px }
.syn-disputes{ margin:0 0 30px; display:flex; flex-direction:column; gap:20px }
.syn-dispute{ border-left:2px solid OXBLOOD; padding:2px 0 2px 18px }
.syn-dispute-q{ font-weight:700; font-size:17.5px; line-height:1.45; margin:0 0 11px }
.syn-sides{ display:flex; flex-direction:column; gap:9px }
.syn-side{ display:flex; gap:12px; align-items:baseline }
.syn-side-who{ font-family:var(--mono); font-size:10.5px; letter-spacing:.5px; text-transform:uppercase;
  color:SLATE; flex:0 0 118px; min-width:118px; line-height:1.5; padding-top:2px }
.syn-side-view{ font-size:16px; line-height:1.5; color:INK }
.syn-reading{ margin:0 0 34px }
.syn-reading .k{ font-family:var(--mono); font-size:10px; letter-spacing:2px; text-transform:uppercase;
  color:GILT; display:block; margin-bottom:9px }
.syn-reading ul{ list-style:none; padding:0; margin:0 }
.syn-reading li{ font-size:15.5px; line-height:1.5; color:MUTED; padding:3px 0; font-style:italic }
.syn-example{ border-left:2px solid GILT; background:rgba(156,122,60,.06);
  padding:16px 20px; font-size:17px; line-height:1.6; margin:0 0 30px; border-radius:0 4px 4px 0 }
.syn-example .k{ font-family:var(--mono); font-size:10px; letter-spacing:2px; text-transform:uppercase;
  color:GILT; display:block; margin-bottom:7px }
.syn-xref{ margin:0 0 34px }
.syn-xref .k{ font-family:var(--mono); font-size:10px; letter-spacing:2px; text-transform:uppercase;
  color:FAINT; margin-right:12px }
.syn-xref button{ font-family:var(--serif); font-size:16px; color:SLATE; background:none; border:0;
  cursor:pointer; text-decoration:underline; text-decoration-color:RULE; text-underline-offset:3px;
  padding:0 2px }
.syn-xref button:hover{ color:OXBLOOD; text-decoration-color:OXBLOOD }
.syn-note{ border:1px solid RULE; border-radius:5px; background:PANEL; padding:18px 20px; margin-bottom:30px }
.syn-note-h{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px }
.syn-note-h .k{ font-family:var(--mono); font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:OXBLOOD }
.syn-note-h em{ font-size:12.5px; color:FAINT; font-style:italic }
.syn-note textarea{ width:100%; min-height:92px; border:0; outline:0; resize:vertical;
  font-family:var(--serif); font-size:16.5px; line-height:1.55; color:INK; background:none }
.syn-note textarea::placeholder{ color:FAINT; font-style:italic }
.syn-saved{ font-family:var(--mono); font-size:10px; letter-spacing:1px; text-transform:uppercase; color:GILT }

.syn-pagenav{ display:flex; justify-content:space-between; gap:12px; border-top:1px solid RULE; padding-top:20px }
.syn-pagenav button{ font-family:var(--mono); font-size:11px; letter-spacing:1px; text-transform:uppercase;
  background:none; border:0; color:MUTED; cursor:pointer; display:flex; gap:8px; align-items:center; max-width:46% }
.syn-pagenav button:hover{ color:OXBLOOD }
.syn-pagenav .nm{ font-family:var(--serif); text-transform:none; letter-spacing:0; font-size:15px;
  color:INK; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }

/* ---- buttons ---- */
.syn-btn{ font-family:var(--mono); font-size:12px; letter-spacing:1px; text-transform:uppercase;
  padding:11px 20px; border-radius:4px; cursor:pointer; border:1px solid INK; background:INK; color:PAPER;
  transition:opacity .15s }
.syn-btn:hover{ opacity:.85 }
.syn-btn.ghost{ background:none; color:INK }
.syn-btn.ox{ background:OXBLOOD; border-color:OXBLOOD; color:#fff }

/* focus visibility */
.syn-root :focus-visible{ outline:2px solid SLATE; outline-offset:2px; border-radius:3px }

/* ---- recall ---- */
.syn-recall-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; flex-wrap:wrap; gap:10px }
.syn-recall-count{ font-family:var(--mono); font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:FAINT }
.syn-modeswitch{ display:flex; gap:0; border:1px solid RULE; border-radius:20px; overflow:hidden }
.syn-modeswitch button{ font-family:var(--mono); font-size:10px; letter-spacing:.8px; text-transform:uppercase;
  padding:7px 13px; border:0; background:none; color:MUTED; cursor:pointer }
.syn-modeswitch button[data-on="1"]{ background:SLATE; color:#fff }
.syn-prog{ height:3px; background:RULE; border-radius:3px; overflow:hidden; margin-bottom:34px }
.syn-prog i{ display:block; height:100%; background:OXBLOOD }
.syn-card{ border:1px solid RULE; border-radius:8px; background:PANEL; padding:44px 40px; min-height:340px;
  display:flex; flex-direction:column }
.syn-card-e{ font-family:var(--mono); font-size:10.5px; letter-spacing:2px; text-transform:uppercase; color:OXBLOOD; margin-bottom:auto }
.syn-prompt-name{ font-size:44px; font-weight:700; text-align:center; margin:26px 0 }
.syn-prompt-q{ font-size:23px; font-style:italic; text-align:center; color:INK; margin:20px auto; max-width:40ch; line-height:1.4 }
.syn-prompt-hint{ font-family:var(--mono); font-size:11px; letter-spacing:1px; text-transform:uppercase; color:FAINT; text-align:center; margin-top:auto }
.syn-scratch{ width:100%; min-height:70px; border:1px dashed RULE; border-radius:5px; background:rgba(0,0,0,.015);
  padding:12px 14px; font-family:var(--serif); font-size:16px; color:INK; outline:0; resize:vertical; margin-top:20px }
.syn-scratch::placeholder{ color:FAINT; font-style:italic }
.syn-reveal{ animation:fade .25s ease }
@keyframes fade{ from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none} }
.syn-reveal-name{ font-size:34px; font-weight:700; margin-bottom:6px }
.syn-reveal-gist{ font-size:18px; font-style:italic; color:OXBLOOD; margin-bottom:16px }
.syn-reveal-def{ font-size:16.5px; line-height:1.55; margin-bottom:16px }
.syn-reveal-row{ font-size:14.5px; color:MUTED; margin-bottom:8px }
.syn-reveal-row b{ color:INK; font-weight:700 }
.syn-rate{ display:grid; grid-template-columns:repeat(4,1fr); gap:9px; margin-top:26px }
.syn-rate-btn{ font-family:var(--mono); font-size:11px; letter-spacing:.8px; text-transform:uppercase;
  padding:14px 6px; border-radius:5px; cursor:pointer; border:1px solid RULE; background:PANEL; color:INK;
  display:flex; flex-direction:column; gap:5px; align-items:center; transition:all .13s }
.syn-rate-btn:hover{ border-color:INK; transform:translateY(-1px) }
.syn-rate-btn small{ font-size:9px; color:FAINT; letter-spacing:.5px }
.syn-rate-btn .kbd{ font-size:9px; color:FAINT }
.syn-reveal-btn{ margin-top:24px; align-self:center }
.syn-done{ text-align:center; padding:70px 20px }
.syn-done h3{ font-size:30px; font-weight:700; margin-bottom:10px }
.syn-done p{ color:MUTED; font-style:italic; margin-bottom:26px }

/* ---- progress ---- */
.syn-stats-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:38px }
.syn-stat{ border:1px solid RULE; border-radius:6px; background:PANEL; padding:18px 16px; text-align:center }
.syn-stat b{ font-size:34px; font-weight:700; display:block; line-height:1 }
.syn-stat.gilt b{ color:GILT } .syn-stat.ox b{ color:OXBLOOD } .syn-stat.slate b{ color:SLATE }
.syn-stat span{ font-family:var(--mono); font-size:9.5px; letter-spacing:1.2px; text-transform:uppercase; color:FAINT; margin-top:7px; display:block }
.syn-legend{ display:flex; gap:18px; flex-wrap:wrap; margin:14px 0 30px }
.syn-legend div{ display:flex; align-items:center; gap:7px; font-family:var(--mono); font-size:10.5px;
  letter-spacing:.5px; text-transform:uppercase; color:MUTED }
.syn-legend i{ width:11px; height:11px; border-radius:2px; display:block }
.syn-distbar{ display:flex; height:30px; border-radius:5px; overflow:hidden; border:1px solid RULE }
.syn-distbar i{ display:block; height:100% }
.syn-cov{ display:flex; flex-direction:column; gap:14px; margin-top:10px }
.syn-cov-row .cr-top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:5px }
.syn-cov-row .cr-name{ font-size:15px; font-weight:700 }
.syn-cov-row .cr-n{ font-family:var(--mono); font-size:11px; color:FAINT; letter-spacing:.5px }
.syn-cov-track{ height:9px; background:RULE; border-radius:5px; overflow:hidden; display:flex }
.syn-cov-track i{ height:100%; display:block }
.syn-reset{ font-family:var(--mono); font-size:10px; letter-spacing:1px; text-transform:uppercase;
  color:FAINT; background:none; border:0; cursor:pointer; margin-top:40px; text-decoration:underline }
.syn-reset:hover{ color:OXBLOOD }

/* ---- mobile ---- */
@media (max-width:820px){
  .syn-root{ font-size:17px }
  .syn-app{ flex-direction:column }
  .syn-rail{ position:fixed; bottom:0; left:0; right:0; top:auto; width:100%; height:auto;
    flex-direction:row; z-index:40; padding:8px 8px calc(8px + env(safe-area-inset-bottom));
    border-right:0; border-top:1px solid RULE; gap:2px; justify-content:space-around }
  .syn-brand,.syn-rail-foot{ display:none }
  .syn-nav-btn{ flex-direction:column; gap:3px; font-size:9.5px; padding:6px 4px; flex:1; text-align:center; align-items:center }
  .syn-nav-num{ display:none }
  .syn-wrap{ padding:30px 20px 110px }
  .syn-hero-t{ font-size:38px } .syn-title{ font-size:34px } .syn-prompt-name{ font-size:32px }
  .syn-idea-grid{ grid-template-columns:1fr }
  .syn-stats-row{ grid-template-columns:1fr 1fr }
  .syn-thinker{ flex-direction:column; gap:2px } .syn-thinker b{ min-width:0; flex:none }
  .syn-side{ flex-direction:column; gap:2px } .syn-side-who{ min-width:0; flex:none; padding-top:0 }
  .syn-rate{ grid-template-columns:1fr 1fr }
  .syn-card{ padding:30px 22px }
}
@media (prefers-reduced-motion:reduce){ *{ animation:none!important; transition:none!important } }
