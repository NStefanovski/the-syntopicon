tes:[{q:"Does poetry tell truth or falsehood?",sides:[{view:"Poets imitate mere appearances and feed the passions",who:"Plato"},{view:"Poetry is more philosophical than history -- it shows the universal",who:"Aristotle"}]},{q:"Is the poet inspired or skilled?",sides:[{view:"A divine madness seizes the poet",who:"Plato's Ion"},{view:"Poetry is an art with rules and craft",who:"Aristotle, Horace"}]},{q:"Should poetry please or instruct?",sides:[{view:"Its end is delight",who:"the aesthetes"},{view:"Its end is to instruct by delighting",who:"Horace, Sidney"}]}],positions:[{name:"Plato",claim:"Banishes most poetry from the ideal city -- it imitates appearances and inflames the lower soul -- yet honors its power."},{name:"Aristotle",claim:"Defends poetry; tragedy imitates a serious action and, through pity and fear, accomplishes catharsis."},{name:"Horace",claim:"The poet aims to profit and to please; art demands both talent and disciplined craft."},{name:"Sidney",claim:"Poetry teaches virtue more movingly than philosophy or history, joining precept to example."}],topics:["The nature of poetry","Poetry as imitation","The poet -- inspiration or art","Poetry and truth","Poetry and the emotions (catharsis)","The kinds of poetry (epic, tragic, lyric)","Poetry and philosophy","The moral effect of poetry"],key_texts:["Plato, Republic II-III, X; Ion","Aristotle, Poetics","Horace, Ars Poetica","Sidney, A Defence of Poesie"],example:"Aristotle defends poetry over history: history tells what Alcibiades did, but poetry shows what a person of a certain kind would do\u2014the universal, not the mere fact.",related:["art","beauty","rhetoric"],hook:"Making, in words."},{id:"principle",name:"Principle",cluster:"being",gist:"A first thing\u2014that from which something proceeds.",framing:"A principle is a first thing -- a starting point from which something proceeds in being, in becoming, or in knowledge. Every science and every demonstration must begin from principles it does not itself prove.",senses:["Principle of being (source of a thing's existence)","Principle of knowing (axiom, premise)","Principle of action (motive, rule)","First principles -- indemonstrable starting points"],disputes:[{q:"Are there indemonstrable first principles?",sides:[{view:"Yes -- demonstration must rest on principles known without proof",who:"Aristotle"},{view:"All claims need justification; foundations are illusory",who:"coherentists, skeptics"}]},{q:"How are first principles known?",sides:[{view:"By intellectual insight (nous) drawn from experience",who:"Aristotle"},{view:"They are innate to reason",who:"Descartes"},{view:"They are habits or conventions, not intuitions",who:"Hume"}]},{q:"Is there one supreme principle of all?",sides:[{view:"One first principle grounds everything (the One, God, the cogito)",who:"Plotinus, Descartes"},{view:"Knowledge has many independent starting points",who:"the pluralists"}]}],positions:[{name:"Aristotle",claim:"Science demonstrates from first principles; the deepest, non-contradiction, is grasped by intellect."},{name:"Euclid",claim:"Builds all of geometry from definitions, postulates, and common notions."},{name:"Descartes",claim:"Seeks one indubitable principle -- 'I think, therefore I am' -- as the foundation of knowledge."},{name:"Leibniz",claim:"Adds the principle of sufficient reason: nothing is so without a reason why it is so."}],topics:["The kinds of principle","Principles of being vs. of knowledge","First and indemonstrable principles","Axioms, postulates, and definitions","How first principles are known","Non-contradiction as first principle","The principle of sufficient reason","Principles and demonstration"],key_texts:["Aristotle, Posterior Analytics; Metaphysics IV","Euclid, Elements I","Descartes, Meditations; Discourse","Leibniz, Monadology"],example:"Aristotle argues demonstration can't go on forever; it must rest on first principles known directly\u2014else nothing could ever be proved at all.",related:["cause","element","metaphysics"],hook:"The source the rest flows from."},{id:"progress",name:"Progress",cluster:"polis",gist:"The idea that things improve over time.",framing:"Progress is the idea that humanity advances over time -- in knowledge, in the mastery of nature, in morality or happiness. A hallmark of modern optimism, it is challenged by those who see cycles, decline, or mere change without betterment.",senses:["Advance in knowledge and the arts and sciences (cumulative)","Moral and social progress (improvement of humanity)","History as a whole moving toward a better state","Progress vs. cyclical or declinist views of history"],disputes:[{q:"Does history progress, cycle, or decline?",sides:[{view:"Humanity advances toward greater knowledge and freedom",who:"Condorcet, Hegel"},{view:"History moves in cycles",who:"the ancients, Vico"},{view:"Modernity is decline and corruption",who:"some critics"}]},{q:"Is there moral progress, or only technical?",sides:[{view:"Mankind grows better as well as more knowledgeable",who:"the optimists"},{view:"Knowledge and power grow, but virtue does not",who:"Rousseau"}]},{q:"Is progress inevitable or fragile?",sides:[{view:"A law of history, all but guaranteed",who:"the confident"},{view:"Contingent, reversible, and easily lost",who:"the cautious"}]}],positions:[{name:"Bacon",claim:"Knowledge advances cumulatively; the sciences will progressively extend human power over nature."},{name:"Condorcet",claim:"Charts the indefinite perfectibility of the human mind and the onward march of enlightenment."},{name:"Rousseau",claim:"Dissents -- the progress of the arts and sciences has corrupted morals, not improved them."},{name:"Hegel",claim:"History is genuine progress -- the advancing self-realization of freedom."},{name:"Comte",claim:"Humanity passes through theological, metaphysical, and positive stages toward maturity."}],topics:["The idea of progress","Progress in the arts and sciences","Moral and social progress","The perfectibility of man","Progress vs. cycles and decline","The inevitability of progress","The costs of progress","Progress and history"],key_texts:["Bacon, The New Organon","Condorcet, Sketch of the Progress of the Human Mind","Rousseau, Discourse on the Arts and Sciences","Hegel, The Philosophy of History"],example:"Rousseau's provocation: as the sciences and arts advanced, he argued, morals decayed\u2014progress in knowledge is not automatically progress in virtue.",related:["history","evolution","knowledge"],hook:"The faith that things get better."},{id:"prophecy",name:"Prophecy",cluster:"divine",gist:"Speaking for the divine\u2014foretelling and forth-telling.",framing:"Prophecy is knowledge or speech that comes from God -- foretelling what is to come or declaring the divine will. It raises questions about revelation, about foreknowledge and freedom, and about telling true inspiration from false.",senses:["Prediction of future events","The inspired declaration of God's word (not mainly prediction)","A mode of knowing (illumination of intellect and imagination)","The prophet as messenger and reformer"],disputes:[{q:"Is prophecy supernatural or a natural gift?",sides:[{view:"A divine light elevating the mind",who:"Aquinas"},{view:"A perfection of imagination and virtue, not superior intellect",who:"Spinoza"}]},{q:"Can the future be foreknown without destroying freedom?",sides:[{view:"Yes, through God's eternal vantage",who:"Boethius"},{view:"Foreknowledge seems to fix the future",who:"the classic difficulty"}]},{q:"How is true prophecy told from false?",sides:[{view:"By fulfillment and moral fruit",who:"the tradition"},{view:"Private claims to revelation are politically dangerous",who:"Hobbes"}]}],positions:[{name:"Maimonides",claim:"Prophecy is a natural perfection of intellect and imagination, granted by God to the prepared."},{name:"Aquinas",claim:"Prophecy is a divine light raising the mind to judge and declare what surpasses natural reason."},{name:"Spinoza",claim:"Prophets excelled in imagination and virtue, not speculative knowledge; prophecy adapts to its hearers."},{name:"Hobbes",claim:"Warns that private claims to revelation threaten civil peace."}],topics:["The nature of prophecy","Prophecy and foreknowledge","Revelation and inspiration","True vs. false prophets","Prophecy and freedom of the will","The cessation of prophecy","Prophecy and reason"],key_texts:["The Hebrew prophets","Maimonides, Guide for the Perplexed II","Aquinas, Summa Theologica II-II QQ.171-174","Spinoza, Theologico-Political Treatise","Hobbes, Leviathan III"],example:"Maimonides made prophecy a natural summit: the prophet is one whose intellect and imagination are so perfected that divine truth can flow through them.",related:["religion","god","fate"],hook:"Speaking for the divine."},{id:"prudence",name:"Prudence",cluster:"good",gist:"Practical wisdom\u2014knowing what to do here and now.",framing:"Prudence is practical wisdom -- the virtue of deliberating well about what to do, and then doing it. It is the intellectual virtue that governs action, translating knowledge of the good into right choices amid particular, changing circumstances.",senses:["Practical wisdom (phronesis -- right reason about action)","Foresight and good counsel","Everyday caution or self-interest (a narrower, lesser sense)","The charioteer of the virtues"],disputes:[{q:"Is prudence a virtue or a mere knack?",sides:[{view:"A genuine intellectual virtue, uniting reason and right desire",who:"Aristotle"},{view:"Mere cleverness or cunning at getting what one wants",who:"the deflationary view"}]},{q:"Can one be prudent without being good?",sides:[{view:"No -- true prudence presupposes virtue and right ends",who:"Aristotle, Aquinas"},{view:"Yes -- one can deliberate shrewdly toward bad ends",who:"the 'cleverness' view"}]},{q:"Is prudence about means only, or ends too?",sides:[{view:"It deliberates about means to ends set by virtue",who:"one reading of Aristotle"},{view:"It also perceives the right end in the situation",who:"another reading"}]}],positions:[{name:"Aristotle",claim:"Practical wisdom is right reason about things good and bad for man; it cannot exist without moral virtue."},{name:"Aquinas",claim:"Prudence is the charioteer of the virtues -- it applies universal moral principles to particular acts."},{name:"The Stoics",claim:"Prudence is one face of the single virtue -- knowledge of what to choose and avoid."},{name:"Machiavelli",claim:"Prudence becomes the ruler's shrewd calculation of means, adjusting to fortune and necessity."}],topics:["Prudence as practical wisdom","Deliberation and choice","Prudence and moral virtue","Prudence and cleverness","Prudence about means and ends","Foresight and counsel","Prudence and the particular case","Political prudence"],key_texts:["Aristotle, Nicomachean Ethics VI","Aquinas, Summa Theologica II-II QQ.47-56","Cicero, On Duties","Machiavelli, The Prince"],example:"Aristotle distinguishes the prudent person from the merely clever: cunning finds means to any end, prudence finds means to good ends\u2014skill wedded to virtue.",related:["virtue-and-vice","judgment","wisdom"],hook:"Knowing what to do, right now."},{id:"punishment",name:"Punishment",cluster:"polis",gist:"The deliberate infliction of hardship for wrongdoing.",framing:"Punishment is the deliberate infliction of hardship on a wrongdoer by authority. What justifies it -- desert, deterrence, reform, or the restoration of order -- and what its limits are, lie at the heart of justice and law.",senses:["Retribution (deserved requital)","Deterrence (preventing future crime)","Reform or rehabilitation (correcting the offender)","Protection of society (incapacitation); vs. mere revenge"],disputes:[{q:"What justifies punishment?",sides:[{view:"Just desert -- the guilty deserve to suffer in proportion to their wrong",who:"Kant"},{view:"Its useful consequences -- deterrence, reform, protection",who:"the utilitarians"}]},{q:"Is punishment about the past deed or the future good?",sides:[{view:"Backward-looking: it answers to what was done (retribution)",who:"the retributivists"},{view:"Forward-looking: it aims at future benefit",who:"the consequentialists"}]},{q:"Is capital punishment just?",sides:[{view:"The murderer forfeits his life; justice demands it",who:"Kant"},{view:"It is cruel, ineffective, or not ours to inflict",who:"Beccaria"}]}],positions:[{name:"Plato",claim:"Punishment should heal the wrongdoer's soul, like medicine; no one does wrong willingly."},{name:"Kant",claim:"Punishment is a categorical demand of justice -- inflicted because the offender is guilty, in due proportion."},{name:"Beccaria",claim:"Punishment is justified only to deter; it should be the least severe sufficient, and never capital."},{name:"Bentham",claim:"All punishment is an evil, admitted only insofar as it prevents a greater evil."},{name:"Hegel",claim:"Punishment honors the criminal as rational by annulling his wrong and restoring right."}],topics:["The justification of punishment","Retribution","Deterrence","Reform and rehabilitation","The protection of society","Punishment vs. revenge","Proportion in punishment","Capital punishment"],key_texts:["Plato, Gorgias; Laws","Kant, The Metaphysics of Morals","Beccaria, On Crimes and Punishments","Bentham, Principles of Morals and Legislation","Hegel, Philosophy of Right"],example:"Kant insisted even a society disbanding forever must execute its last murderer, lest justice be traded for utility\u2014punishment as pure desert.",related:["justice","law","duty"],hook:"Hardship imposed for wrong."},{id:"quality",name:"Quality",cluster:"being",gist:"The 'such' of a thing\u2014its character, not its amount.",framing:"Quality is the 'such' of a thing -- its character or way of being, as distinct from its quantity or relations. Whether qualities like color and warmth belong to things themselves or only to our perception reshaped the modern view of nature.",senses:["Quality as a category (dispositions, capacities, affections, shape)","Primary qualities (size, shape, motion) vs. secondary qualities (color, sound, taste)","Intensive quality that admits of degrees"],disputes:[{q:"Do secondary qualities exist in things?",sides:[{view:"Color, sound, and taste are really in the objects",who:"common sense; the Aristotelian view"},{view:"Only primary qualities are in bodies; the rest are effects in us",who:"Galileo, Locke"}]},{q:"Is quality reducible to quantity?",sides:[{view:"All qualities reduce to quantitative arrangements of matter",who:"the mechanists"},{view:"Some qualities are irreducible features of being",who:"the Aristotelians"}]},{q:"Can qualities change by degrees?",sides:[{view:"Qualities intensify and remit continuously (latitude of forms)",who:"medieval physics"},{view:"Qualitative change reduces to countable rearrangements",who:"the atomists"}]}],positions:[{name:"Aristotle",claim:"Quality is a category; he distinguishes states, capacities, affective qualities, and figure."},{name:"Galileo",claim:"Tastes, odors, and colors reside in consciousness; remove the living creature and they vanish."},{name:"Locke",claim:"Primary qualities resemble their ideas; secondary qualities are powers to produce sensations in us."},{name:"Berkeley",claim:"The primary/secondary distinction collapses -- all qualities are ideas in a mind."}],topics:["The category of quality","The kinds of quality","Primary vs. secondary qualities","Qualities and perception","Intensity and remission of qualities","Quality and quantity","Occult qualities and the mechanical philosophy"],key_texts:["Aristotle, Categories 8; Metaphysics V.14","Galileo, The Assayer","Locke, Essay II.8","Berkeley, Principles"],example:"Locke's split: a body's shape and motion (primary) are really in it, but its color and warmth (secondary) are powers to produce sensations in us.",related:["quantity","relation","sense"],hook:"The 'such,' not the 'how much.'"},{id:"quantity",name:"Quantity",cluster:"being",gist:"The 'how much' and 'how many' of things.",framing:"Quantity is the 'how much' and 'how many' of things -- magnitude and multitude, the measurable aspect of reality. The rise of modern science was largely the decision to read nature in quantitative, mathematical terms.",senses:["Continuous quantity (magnitude) vs. discrete quantity (number)","Quantity as a category of substance","Measure as the unit that makes quantity known","Extensive vs. intensive magnitude"],disputes:[{q:"Is nature fundamentally quantitative?",sides:[{view:"The book of nature is written in mathematics",who:"Galileo, Descartes"},{view:"Qualities and ends are basic; mathematics abstracts from real nature",who:"the Aristotelians"}]},{q:"Is continuous quantity infinitely divisible?",sides:[{view:"Magnitudes are infinitely divisible",who:"Aristotle, geometry"},{view:"There are indivisible minima or atoms",who:"the atomists"}]},{q:"Is number real or a mental construction?",sides:[{view:"Numbers are real, abstract objects",who:"the Platonists"},{view:"Number is a creation of counting minds and marks",who:"nominalists, formalists"}]}],positions:[{name:"Euclid",claim:"With Archimedes, builds the exact science of magnitude and ratio."},{name:"Aristotle",claim:"Quantity is a category; number is discrete, magnitude continuous, and both admit of measure."},{name:"Galileo",claim:"To know nature is to measure it -- to reduce phenomena to number, figure, and motion."},{name:"Descartes",claim:"Extension (quantity) is the essence of matter, making physics a kind of geometry in motion."},{name:"Kant",claim:"Quantity is a category; mathematics applies a priori to all appearances as extensive magnitudes."}],topics:["The category of quantity","Continuous vs. discrete quantity","Number and magnitude","Measure and the unit","Divisibility of the continuous","The quantitative method in science","Quantity and quality","Intensive magnitude"],key_texts:["Euclid, Elements V","Aristotle, Categories 6; Metaphysics V.13","Galileo, Two New Sciences","Descartes, Geometry","Kant, Critique of Pure Reason (Axioms of Intuition)"],example:"Galileo held nature's book is written in mathematics; Kelvin later pressed the creed\u2014when you can't measure something, your knowledge is 'meagre.'",related:["quality","mathematics","infinity"],hook:"The 'how much' of things."},{id:"reasoning",name:"Reasoning",cluster:"mind",gist:"The mind moving from what it knows to what follows.",framing:"Reasoning is the movement of the mind from what it already knows to what follows -- inferring conclusions from premises. It is the discursive power that, unlike immediate insight, arrives at truth step by step.",senses:["Inference (drawing conclusions from premises)","Deductive vs. inductive reasoning","Discursive (step by step) vs. intuitive (all at once)","Theoretical vs. practical reasoning"],disputes:[{q:"Is all reasoning reducible to the syllogism?",sides:[{view:"Deduction is the core of inference",who:"Aristotle"},{view:"Induction and other forms are irreducible",who:"Bacon, Mill"}]},{q:"Does reasoning discover truth or only unfold the premises?",sides:[{view:"Deduction only draws out what is contained",who:"the critics of syllogism"},{view:"Reasoning genuinely extends knowledge",who:"its defenders"}]},{q:"Is reasoning distinctively human?",sides:[{view:"Only rational animals reason",who:"the tradition"},{view:"Animals infer, and machines compute",who:"modern challenges"}]}],positions:[{name:"Aristotle",claim:"Analyzes inference into the syllogism, distinguishing demonstrative, dialectical, and fallacious reasoning."},{name:"Aquinas",claim:"Reasoning (ratio) is discursive, proper to man; angels and God know by simple intuition (intellectus)."},{name:"Descartes",claim:"Sets rules for rightly conducting reason -- proceeding from simple, clear steps in due order."},{name:"Hume",claim:"Distinguishes demonstrative reasoning (relations of ideas) from probable reasoning (matters of fact)."}],topics:["Reasoning and inference","Deduction and induction","The syllogism","Demonstrative vs. probable reasoning","Intuitive vs. discursive knowledge","Theoretical vs. practical reasoning","Fallacies","Reasoning in animals and machines"],key_texts:["Aristotle, Prior and Posterior Analytics","Aquinas, Summa Theologica I Q.79","Descartes, Rules for the Direction of the Mind","Hume, Enquiry"],example:"Hume's provocation: reason alone never moves us to act; it maps means to ends but the ends themselves come from passion\u2014reason serves, it doesn't rule.",related:["logic","induction","judgment"],hook:"Thought moving to its conclusion."},{id:"relation",name:"Relation",cluster:"being",gist:"The being-toward that links one thing to another.",framing:"A relation is a way one thing stands to another -- greater, cause, father, like. Long treated as the 'weakest' kind of being, relation became central to modern logic, physics, and the idea that things are constituted by their connections.",senses:["Relation as a category (the 'toward something')","Real relations vs. relations of reason","Internal (essential) vs. external relations","Relation as the subject of relational logic"],disputes:[{q:"Do relations have real being?",sides:[{view:"Relations are the least of beings, dependent on their terms",who:"Aristotle, the medievals"},{view:"Relations are as real and basic as their terms; some are irreducible",who:"Russell, modern logic"}]},{q:"Are relations internal or external?",sides:[{view:"Relations are internal -- grounded in the natures of the related things",who:"Leibniz, the idealists"},{view:"Many relations are external, not fixed by their terms' natures",who:"Russell, the pluralists"}]},{q:"Is space and time absolute or relational?",sides:[{view:"They are real, absolute containers",who:"Newton"},{view:"They are systems of relations among things and events",who:"Leibniz, Einstein"}]}],positions:[{name:"Aristotle",claim:"The relative is what it is 'of' or 'than' another -- a distinct but dependent category."},{name:"Aquinas",claim:"Distinguishes real relations from relations of reason (as in the divine persons)."},{name:"Leibniz",claim:"Holds relations to be ideal; space and time are the orders of coexistence and succession."},{name:"Russell",claim:"Relations are irreducible, objective, and the backbone of logic and mathematics."}],topics:["The category of relation","Real vs. rational relations","Internal vs. external relations","The relativity of knowledge","Relations in logic and mathematics","The relational theory of space and time","Relation and order","Symmetry and transitivity"],key_texts:["Aristotle, Categories 7","Aquinas, Summa Theologica I Q.28","Leibniz-Clarke Correspondence","Russell, The Principles of Mathematics"],example:"Being 'taller than' seems to add nothing to either person alone, yet it holds truly between them\u2014prompting the question whether the relation is out there or in our comparing.",related:["same-and-other","opposition","quantity"],hook:"The link between one thing and another."},{id:"religion",name:"Religion",cluster:"divine",gist:"The binding of humanity to the divine.",framing:"Religion is the bond between human beings and the divine -- expressed in belief, worship, and a way of life. It is examined as a source of truth, a social institution, a moral force, and, by its critics, an illusion.",senses:["Worship and ritual (the cult)","A body of revealed belief (faith or creed)","Morality under a divine sanction","A natural human disposition or need"],disputes:[{q:"Is religion founded on truth or illusion?",sides:[{view:"It rests on real knowledge of God",who:"natural and revealed theology"},{view:"It is projection, wish, or 'the opium of the people'",who:"Hume, Feuerbach, Marx, Freud"}]},{q:"Faith or reason -- which governs?",sides:[{view:"Reason supports and clarifies faith",who:"Aquinas"},{view:"Faith stands above or against reason",who:"Tertullian, Kierkegaard"},{view:"Reason alone suffices (natural religion)",who:"the deists"}]},{q:"Is religion good or bad for society?",sides:[{view:"It is the bond of morality and community",who:"the tradition"},{view:"It breeds conflict and superstition",who:"its critics"}]}],positions:[{name:"Augustine",claim:"True religion is the soul's ordered love returning to God, its source and end."},{name:"Aquinas",claim:"Faith and reason are distinct but harmonious paths to the same God."},{name:"Hume",claim:"Traces religion to fear and ignorance and criticizes miracles and the design argument."},{name:"William James",claim:"Judges religion by its fruits in lived experience and defends the will to believe."},{name:"Marx",claim:"Religion is the sigh of the oppressed creature, the opium of the people."}],topics:["The nature and origin of religion","Natural vs. revealed religion","Faith and reason","Religion and morality","The social role of religion","The critique of religion","Toleration","Religious experience"],key_texts:["Augustine, City of God","Aquinas, Summa Theologica II-II QQ.1-16","Hume, The Natural History of Religion","Kant, Religion within the Limits of Reason Alone","James, The Varieties of Religious Experience"],example:"Augustine's opening confession\u2014'our heart is restless until it rests in Thee'\u2014casts religion as the answer to a longing built into human nature.",related:["god","theology","prophecy"],hook:"Binding the human to the divine."},{id:"revolution",name:"Revolution",cluster:"polis",gist:"The overturning of an established order.",framing:"Revolution is the overthrow and radical remaking of a political order. Whether it is a crime against order, a right of an oppressed people, or the engine of historical progress divides those who prize stability from those who demand transformation.",senses:["The violent change of government or constitution (political)","A fundamental transformation of the whole social order (the modern sense)","Revolution vs. rebellion or coup (systemic change vs. a change of rulers)","Revolution as a right vs. as a crime"],disputes:[{q:"Is there a right of revolution?",sides:[{view:"A people may justly overthrow a government that violates its trust",who:"Locke, the Declaration"},{view:"Rebellion is never justified; it dissolves the order that makes rights possible",who:"Hobbes"}]},{q:"Is revolution progress or catastrophe?",sides:[{view:"Revolutions drive history toward freedom and justice",who:"the revolutionaries, Marx"},{view:"They unleash chaos and tyranny, destroying accumulated wisdom",who:"Burke"}]},{q:"What causes revolutions?",sides:[{view:"Inequality, injustice, and the desire for equality",who:"Aristotle"},{view:"Contradictions in the mode of production and class struggle",who:"Marx"}]}],positions:[{name:"Aristotle",claim:"Analyzes the causes of revolution (stasis) -- above all the desire for equality or superiority."},{name:"Locke",claim:"When government breaks its trust, power reverts to the people, who may establish a new one."},{name:"Burke",claim:"Condemns the abstract remaking of society; reform should respect prescription and grow organically."},{name:"Marx",claim:"Revolution is the violent midwife of history, by which a rising class overturns outworn social relations."}],topics:["The meaning of revolution","The causes of revolution","The right of revolution","Revolution vs. reform","Revolution and progress","The dangers of revolution","Class and revolution","Revolution and the social order"],key_texts:["Aristotle, Politics V","Locke, Second Treatise (XIX)","Burke, Reflections on the Revolution in France","Marx & Engels, The Communist Manifesto"],example:"Locke grounded a right of revolution: when rulers break the trust and turn to arbitrary power, the people may reclaim the authority they lent.",related:["government","liberty","justice"],hook:"The overturning of the order."},{id:"rhetoric",name:"Rhetoric",cluster:"expr",gist:"The art of persuasion by speech.",framing:"Rhetoric is the art of persuasion -- of finding, in any case, the available means of moving an audience. Poised between philosophy and mere manipulation, it raises the question whether persuasion serves truth or supplants it.",senses:["The art of persuasive speech","Eloquence, the art of speaking well","The three appeals (ethos, pathos, logos)","A neutral tool vs. flattery and manipulation"],disputes:[{q:"Is rhetoric an art or a knack?",sides:[{view:"A genuine art, the counterpart of dialectic",who:"Aristotle"},{view:"Mere flattery, a knack for pleasing, not a true art",who:"Plato's Gorgias"}]},{q:"Does rhetoric serve truth or manipulate?",sides:[{view:"Joined to knowledge and justice, it can serve truth",who:"Plato's Phaedrus"},{view:"It persuades regardless of truth -- hence its danger",who:"the critics"}]},{q:"Is persuasion about reason or emotion?",sides:[{view:"Argument (logos) is its body",who:"the rationalist emphasis"},{view:"Moving character (ethos) and passion (pathos) are decisive",who:"the practical emphasis"}]}],positions:[{name:"Plato",claim:"In the Gorgias he condemns rhetoric as flattery; in the Phaedrus he allows a true rhetoric wedded to knowledge of souls."},{name:"Aristotle",claim:"Rhetoric is the faculty of discovering the available means of persuasion -- ethos, pathos, and logos."},{name:"Cicero",claim:"The ideal orator unites wisdom with eloquence in the service of the commonwealth."},{name:"Quintilian",claim:"Rhetoric is 'the good man skilled in speaking'; eloquence is inseparable from character."}],topics:["The nature of rhetoric","Rhetoric and dialectic","The means of persuasion (ethos, pathos, logos)","Rhetoric and truth","Rhetoric and morality","The parts of an oration","Eloquence and the orator","Rhetoric and politics"],key_texts:["Plato, Gorgias; Phaedrus","Aristotle, Rhetoric","Cicero, De Oratore","Quintilian, Institutes of Oratory"],example:"Aristotle's three levers: persuade by the argument (logos), by your credibility (ethos), and by the audience's feelings (pathos)\u2014rarely by one alone.",related:["language","poetry","dialectic"],hook:"Persuasion, made an art."},{id:"same-and-other",name:"Same and Other",cluster:"being",gist:"Identity and difference\u2014the ground of all distinction.",framing:"To think at all is to judge what is the same and what is different. Identity and difference underlie counting, classifying, personal identity over time, and the very logic of predication.",senses:["Numerical identity (one and the same thing)","Specific or generic sameness (same kind)","Qualitative sameness (exact likeness) vs. otherness","Identity through time -- the 'same' self"],disputes:[{q:"What makes a thing the same over time?",sides:[{view:"Same matter or bodily continuity",who:"materialist views"},{view:"Same form or soul, or continuity of memory",who:"Aristotle; Locke on memory"}]},{q:"Is the identity of indiscernibles true?",sides:[{view:"No two things share all properties; total sameness is identity",who:"Leibniz"},{view:"Two distinct things could be exactly alike",who:"his critics"}]},{q:"Is personal identity substantial or constructed?",sides:[{view:"A persisting soul or substance is the self",who:"Descartes"},{view:"Identity is continuity of consciousness and memory",who:"Locke"},{view:"The self is a bundle of perceptions; no simple identity",who:"Hume"}]}],positions:[{name:"Plato",claim:"The Sophist treats Same and Other as great kinds pervading all being."},{name:"Aristotle",claim:"Distinguishes numerical, specific, and generic sameness; difference within a genus defines species."},{name:"Leibniz",claim:"The identity of indiscernibles: things differing in no property are one and the same."},{name:"Locke",claim:"Personal identity is sameness of consciousness, not of substance."},{name:"Hume",claim:"Finds no impression of a persisting self -- only a bundle in flux."}],topics:["Identity and diversity","Numerical vs. specific sameness","The identity of indiscernibles","Sameness through change and time","Personal identity","Likeness and difference","Same and other as categories of thought"],key_texts:["Plato, Sophist","Aristotle, Metaphysics V.9, X","Leibniz, Discourse on Metaphysics","Locke, Essay II.27","Hume, Treatise I.4.6"],example:"Leibniz claimed no two leaves are perfectly identical, for if they shared every property they'd be one thing\u2014difference is guaranteed by distinctness.",related:["one-and-many","relation","opposition"],hook:"Identity and difference."},{id:"science",name:"Science",cluster:"mind",gist:"Organized, demonstrated knowledge of causes.",framing:"Science is organized, demonstrative knowledge of things through their causes and principles. From Aristotle's certain knowledge of the necessary to the modern experimental enterprise, what counts as science has itself transformed.",senses:["Certain knowledge of causes (Aristotle's episteme)","Any organized body of knowledge (a 'science' of X)","Modern natural science (empirical, experimental, mathematical)","The classification and hierarchy of the sciences"],disputes:[{q:"What makes knowledge scientific?",sides:[{view:"Demonstration from necessary first principles",who:"Aristotle"},{view:"Testable prediction and experiment",who:"the moderns"}]},{q:"Is science certain or provisional?",sides:[{view:"It yields necessary truth",who:"the classical view"},{view:"It offers ever-revisable hypotheses",who:"the modern view"}]},{q:"Is there one method for all sciences?",sides:[{view:"A single method (induction, or hypothesis-testing)",who:"Bacon, the unifiers"},{view:"Different methods for different subject-matters",who:"Aristotle"}]}],positions:[{name:"Aristotle",claim:"Science is knowledge of the reasoned fact -- why a thing must be so -- demonstrated from first principles."},{name:"Bacon",claim:"Calls for a new method: systematic observation and induction, to command nature by obeying it."},{name:"Descartes",claim:"Seeks a unified science on the model of mathematics, deduced from clear first principles."},{name:"Newton",claim:"Unites experiment and mathematics, deducing universal laws from the phenomena."},{name:"Kant",claim:"Secures the a priori foundations that make natural science, with its necessary laws, possible."}],topics:["The definition of science","Science and its causes","Demonstration and first principles","The experimental method","The classification of the sciences","Certainty vs. probability in science","Science and philosophy","The unity of science"],key_texts:["Aristotle, Posterior Analytics; Physics","Bacon, Novum Organum","Descartes, Discourse","Newton, Principia","Kant, Critique of Pure Reason"],example:"Bacon urged replacing armchair deduction with active experiment\u2014'twisting the lion's tail'\u2014to force nature to reveal her causes.",related:["knowledge","hypothesis","mathematics"],hook:"Demonstrated knowledge of causes."},{id:"sense",name:"Sense",cluster:"mind",gist:"The gateways through which the world enters the mind.",framing:"Sense is the power of perceiving the world through the body -- sight, hearing, touch, and the rest. As the mind's first contact with reality, it is both the foundation of knowledge and, for its critics, a source of illusion.",senses:["The external senses (sight, hearing, smell, taste, touch)","The 'common sense' that unites and judges them","Sensation vs. perception (bare feeling vs. perceiving an object)","Sense as the criterion of reality vs. sense as mere appearance"],disputes:[{q:"Do the senses give knowledge of things as they are?",sides:[{view:"Yes -- perception is basically reliable",who:"Aristotle, the realists"},{view:"No -- they give only appearances and secondary qualities",who:"Democritus, Descartes"}]},{q:"Is all knowledge founded on sense?",sides:[{view:"Nothing is in the intellect not first in sense",who:"the empiricists"},{view:"Reason has objects sense cannot reach",who:"Plato, the rationalists"}]},{q:"Are the sensible qualities in things or in us?",sides:[{view:"In the objects themselves",who:"common sense"},{view:"Secondary qualities are effects in the perceiver",who:"Galileo, Locke"}]}],positions:[{name:"Aristotle",claim:"Each sense receives the form of its object without the matter; the common sense integrates them."},{name:"Democritus",claim:"'By convention color, by convention sweet; in reality atoms and void' -- the senses report appearances."},{name:"Descartes",claim:"The senses often deceive, so they cannot be the foundation of certain knowledge."},{name:"Locke",claim:"All ideas ultimately trace to sensation and reflection; experience furnishes the mind."},{name:"Berkeley",claim:"Sensible things just are collections of ideas perceived; there is no unperceived sensible object."}],topics:["The external senses","Sensation and perception","The common sense","The reliability of the senses","Sense and intellect","Primary and secondary qualities","The objects of sense","Illusion and the senses"],key_texts:["Aristotle, On the Soul II-III","Lucretius, On the Nature of Things IV","Descartes, Meditations","Locke, Essay II","Berkeley, Principles"],example:"Descartes noted a straight oar looks bent in water; since the senses sometimes deceive, he resolved to trust nothing they report without independent warrant.",related:["experience","memory-and-imagination","quality"],hook:"The world's gateways into the mind."},{id:"sign-and-symbol",name:"Sign and Symbol",cluster:"expr",gist:"That which stands for something else to a mind.",framing:"A sign is something that stands for something else -- pointing beyond itself to a thing, an idea, or another sign. The study of signs underlies language, logic, art, and religion, and asks how meaning is possible at all.",senses:["Natural signs (smoke signifies fire) vs. conventional signs (words)","Sign vs. symbol (the arbitrary marker vs. the meaning-laden image)","The sign as pointing to a thing vs. to a concept","Symbols in religion, art, and mathematics"],disputes:[{q:"Are signs natural or conventional?",sides:[{view:"Some signify by nature (symptoms), others by convention (words)",who:"the standard distinction"},{view:"Which kind is basic remains disputed",who:"the debates"}]},{q:"Does a sign point to a thing or to an idea?",sides:[{view:"Words signify things directly",who:"one view"},{view:"Words signify concepts in the mind, which signify things",who:"the mediating view"}]},{q:"Is a symbol a mere substitute or does it share in its meaning?",sides:[{view:"A conventional stand-in, replaceable at will",who:"the arbitrary view"},{view:"The symbol embodies and participates in what it means",who:"the religious and artistic view"}]}],positions:[{name:"Augustine",claim:"A sign is a thing that, beyond its own appearance, brings something else to mind; distinguishes natural and given signs."},{name:"Aquinas",claim:"Sacraments are signs that both signify and, by God's institution, effect what they signify."},{name:"Hobbes",claim:"Distinguishes marks (private aids to memory) from signs (public means of communication)."},{name:"Locke",claim:"Words are signs of ideas; meaning is the idea a word is made to stand for."}],topics:["The definition of sign","Natural vs. conventional signs","Sign vs. symbol","Signs, things, and ideas","Symbols in religion and sacrament","Symbols in art and mathematics","The interpretation of signs","Meaning and reference"],key_texts:["Augustine, On Christian Doctrine II; On the Teacher","Aquinas, Summa Theologica III Q.60","Hobbes, Leviathan I","Locke, Essay III"],example:"Augustine distinguishes natural signs, like smoke meaning fire, from given signs, like words\u2014where a sound means only because a community agrees it does.",related:["language","idea","definition"],hook:"Something standing for something else."},{id:"sin",name:"Sin",cluster:"divine",gist:"The offense against the divine or moral order.",framing:"Sin is moral evil conceived as an offense against God or the divine order -- more than mere wrongdoing, a rupture in one's relation to the highest good. It binds together ethics, freedom, and theology.",senses:["Transgression of divine law","A disordered turning from God to lesser goods (privation)","Original sin (inherited fault) vs. actual sin","Mortal vs. venial sin"],disputes:[{q:"Is evil a positive thing or a privation?",sides:[{view:"Evil is a privation of a due good, not a thing",who:"Augustine, Aquinas"},{view:"Evil is a real, opposing principle",who:"the Manichaeans"}]},{q:"Is there original sin?",sides:[{view:"Adam's fall corrupts the will of all his heirs",who:"Augustine"},{view:"Each sins only by his own act; there is no inherited sin",who:"Pelagius"}]},{q:"Does sin require free will?",sides:[{view:"Only the free can sin",who:"the mainstream"},{view:"Wrongdoing can be given a determinist account",who:"some critics"}]}],positions:[{name:"Augustine",claim:"Sin is the will's turning from the immutable good to mutable goods; original sin wounds all."},{name:"Pelagius",claim:"Denies inherited sin; the will is free to keep the law, so grace is not strictly necessary."},{name:"Aquinas",claim:"Sin is an act against right reason and eternal law; he distinguishes mortal from venial."},{name:"Kant",claim:"Locates 'radical evil' in the free choice to set self-love above the moral law."}],topics:["The nature of sin","Evil as privation","Original sin","Kinds and degrees of sin","Sin and free will","Sin, grace, and redemption","Conscience and guilt","Sin vs. crime"],key_texts:["Genesis; Paul, Romans","Augustine, Confessions; City of God","Aquinas, Summa Theologica I-II QQ.71-89","Kant, Religion within the Limits of Reason Alone"],example:"Augustine's stolen pears haunt him because he stole not from need but for the thrill of the forbidden\u2014evidence, to him, of a will drawn to evil for its own sake.",related:["good-and-evil","will","religion"],hook:"Wrong as offense against the order."},{id:"slavery",name:"Slavery",cluster:"polis",gist:"The owning of persons as property.",framing:"Slavery is the condition of one human being owned and ruled as the property of another. Defended in antiquity as natural and attacked in modernity as the deepest injustice, it forces the question of what is owed to every human being as such.",senses:["Chattel slavery (the human being as property)","Slavery 'by nature' (the ancient defense) vs. by law or conquest","Political slavery (subjection to despotic rule)","Slavery as a metaphor for bondage to passion"],disputes:[{q:"Is any slavery natural or just?",sides:[{view:"Some are slaves by nature, benefited by being ruled",who:"Aristotle"},{view:"All are born free and equal; slavery is always against nature",who:"the Stoics, Rousseau, the abolitionists"}]},{q:"Is slavery merely conventional?",sides:[{view:"It rests only on law, force, and convention, not nature",who:"the critics"},{view:"It reflects a real natural hierarchy",who:"the ancient defenders"}]},{q:"Can enslavement ever be legitimate?",sides:[{view:"By just war or consent, to spare a life",who:"some traditions"},{view:"No one can rightfully own another or alienate their freedom",who:"Rousseau"}]}],positions:[{name:"Aristotle",claim:"Holds some are 'slaves by nature,' lacking the capacity to rule themselves -- though many, he grants, are enslaved unjustly."},{name:"The Stoics",claim:"All human beings share in reason; slavery binds only the body -- all are by nature free and kin."},{name:"Rousseau",claim:"'Man is born free'; to renounce liberty is to renounce one's humanity -- 'slavery' and 'right' contradict."},{name:"Locke",claim:"Rejects voluntary self-enslavement, though he allows enslaving captives of a just war -- a much-criticized view."}],topics:["The nature of slavery","Slavery by nature vs. by convention","The justice of slavery","The ancient defense and its critics","Freedom and human equality","Political slavery and despotism","The abolition of slavery","Slavery and natural law"],key_texts:["Aristotle, Politics I","Seneca; Epictetus","Locke, Second Treatise (IV)","Rousseau, The Social Contract I"],example:"Rousseau cut the old defense: might makes no right, for if force alone rules, then the moment the slave can break free, he does no wrong in doing so.",related:["liberty","justice","labor"],hook:"Persons held as property."},{id:"soul",name:"Soul",cluster:"divine",gist:"The principle of life\u2014and perhaps of immortality.",framing:"The soul is the principle of life and mind -- what makes a living thing alive and, in us, what thinks and chooses. Whether it is a separate substance, the body's form, or nothing beyond the body is a defining question.",senses:["Principle of life (nutrition, growth) shared by all that lives","Seat of sensation and desire (in animals)","Rational intellect (in humans)","A separable substance vs. the body's form"],disputes:[{q:"What is the soul's relation to the body?",sides:[{view:"A separate substance lodged in the body",who:"Plato, Descartes"},{view:"The form or first actuality of a living body",who:"Aristotle"},{view:"Nothing but the body's functions",who:"the materialists"}]},{q:"Is the soul immortal?",sides:[{view:"Yes -- being simple and rational",who:"Plato, Aquinas"},{view:"No -- it perishes with the body",who:"Lucretius"}]},{q:"Do plants and animals have souls?",sides:[{view:"Yes -- graded vegetative, sensitive, and rational souls",who:"Aristotle"},{view:"No -- animals are mere machines",who:"Descartes"}]}],positions:[{name:"Plato",claim:"The soul is immortal and tripartite -- reason, spirit, appetite -- ruling the body from within."},{name:"Aristotle",claim:"The soul is the form or first actuality of a living body; its powers are graded."},{name:"Descartes",claim:"The soul is a thinking substance, wholly distinct from the extended body it inhabits."},{name:"Aquinas",claim:"The rational soul is the single substantial form of the human being, subsistent and immortal."},{name:"Hume",claim:"Finds no soul-substance -- only a bundle of perceptions."}],topics:["The definition of the soul","Soul and body","The parts or powers of the soul","The vegetative, sensitive, and rational soul","The intellect","The soul's immortality","The seat of the soul","Soul in plants and animals"],key_texts:["Plato, Phaedo; Phaedrus","Aristotle, On the Soul","Descartes, Meditations","Aquinas, Summa Theologica I QQ.75-89"],example:"Aristotle rejects Plato's separable soul: as sight is to the eye, soul is to the body\u2014the form that makes this matter a living thing, not a ghost within it.",related:["mind","life-and-death","immortality"],hook:"What makes a body alive."},{id:"space",name:"Space",cluster:"being",gist:"The extension in which bodies exist and move.",framing:"Space is the extension in which bodies are located and move -- but is it a real thing, a mere relation among bodies, or a form our minds impose? The answer shapes physics and metaphysics alike.",senses:["Place (the boundary containing a body) vs. space (extension in general)","The void or empty space","Absolute space (a fixed container) vs. relational space","Space as a form of intuition (Kant)"],disputes:[{q:"Is there void or empty space?",sides:[{view:"A void is impossible; nature abhors a vacuum",who:"Aristotle, Descartes"},{view:"Empty space exists and is needed for motion",who:"the atomists, Newton"}]},{q:"Is space absolute or relational?",sides:[{view:"Absolute space exists independent of bodies",who:"Newton"},{view:"Space is only the order of relations among bodies",who:"Leibniz, Einstein"}]},{q:"Is space real or mind-dependent?",sides:[{view:"Space is a real feature of the world",who:"the realists"},{view:"Space is the a priori form of outer intuition",who:"Kant"}]}],positions:[{name:"Aristotle",claim:"Denies the void and defines place as the inner surface of the containing body."},{name:"Descartes",claim:"Identifies space with extended matter; there is no empty extension."},{name:"Newton",claim:"Absolute space exists -- uniform, immovable, the frame of true motion."},{name:"Leibniz",claim:"Space is nothing but the order of coexisting things; absolute space is a fiction."},{name:"Kant",claim:"Space is not a thing but the form under which we must perceive outer objects."}],topics:["Space and place","The reality of the void","The infinity of space","Absolute vs. relational space","Space and matter","Space as a form of intuition","The geometry of space","Space and motion"],key_texts:["Aristotle, Physics IV.1-9","Descartes, Principles II","Newton, Principia (Scholium)","Leibniz-Clarke Correspondence","Kant, Critique of Pure Reason (Transcendental Aesthetic)"],example:"Leibniz argued that if space were an absolute container, God could have no reason to place the whole universe here rather than three feet over\u2014so space must be relational.",related:["time","matter","physics"],hook:"Where bodies are, and move."},{id:"state",name:"State",cluster:"polis",gist:"The sovereign political community.",framing:"The state is the sovereign political community -- the highest and most complete association, claiming authority over all within its bounds. Its origin, its ends, its rights over the individual, and its relation to society are foundational political questions.",senses:["The political community or city (Aristotle's complete association)","The sovereign apparatus of authority (the modern state, monopolizing legitimate force)","The state vs. society (the political order vs. the broader social life)","The state as an end in itself vs. an instrument for individual ends"],disputes:[{q:"Is the state natural or artificial?",sides:[{view:"Natural -- man is a political animal, completed in the state",who:"Aristotle"},{view:"Artificial -- erected by contract to escape the state of nature",who:"Hobbes, Locke, Rousseau"}]},{q:"Is the state prior to the individual, or the reverse?",sides:[{view:"The whole is prior; the individual is fulfilled only in it",who:"Aristotle, Hegel"},{view:"Individuals with rights are prior; the state serves them",who:"liberalism"}]},{q:"What are the ends and limits of the state?",sides:[{view:"To secure the good life and virtue",who:"the ancients"},{view:"To secure peace and rights, leaving the rest free",who:"the liberals"}]}],positions:[{name:"Aristotle",claim:"The state exists by nature and is prior to the individual; it comes to be for life, but exists for the good life."},{name:"Hobbes",claim:"The state ('Leviathan') is an artificial person created by covenant, ending the war of all against all."},{name:"Locke",claim:"The state is instituted by consent to protect natural rights; its power is limited and held in trust."},{name:"Rousseau",claim:"The state embodies the general will, through which a people becomes a sovereign moral body."},{name:"Hegel",claim:"The state is the actuality of ethical life -- the realization of concrete freedom, higher than family or civil society."}],topics:["The nature and origin of the state","The state as natural or conventional","The ends of the state","The state and the individual","Sovereignty","The state and society","The limits of state power","The state and the good life"],key_texts:["Aristotle, Politics I, III","Hobbes, Leviathan","Locke, Second Treatise","Rousseau, The Social Contract","Hegel, Philosophy of Right"],example:"Aristotle held the state comes to be for survival but exists for the good life\u2014its point is not mere living together but living well.",related:["government","constitution","citizen"],hook:"The sovereign community."},{id:"temperance",name:"Temperance",cluster:"good",gist:"Self-mastery over pleasure and appetite.",framing:"Temperance is the virtue that moderates desire and pleasure -- self-mastery over the appetites for food, drink, and sex. The discipline by which reason governs the body's cravings, it is a cardinal virtue and the mark of a well-ordered soul.",senses:["Moderation of bodily appetites and pleasures","Self-control or self-mastery generally","The harmony of the soul's parts (reason ruling appetite)","The mean between self-indulgence and insensibility"],disputes:[{q:"Is temperance the same as self-control, or higher?",sides:[{view:"The temperate person has ordered desires and feels no inner conflict",who:"Aristotle"},{view:"The merely continent must fight their appetites",who:"the contrast Aristotle draws"}]},{q:"Should appetite be moderated or denied?",sides:[{view:"Moderate and order the appetites",who:"Aristotle"},{view:"Renounce and mortify them",who:"the ascetic ideal"}]},{q:"Is temperance chiefly personal or also political?",sides:[{view:"A virtue of the individual soul",who:"the ethical focus"},{view:"Also the civic harmony where each part accepts its place",who:"Plato"}]}],positions:[{name:"Plato",claim:"Temperance is the harmony in which reason rules and appetite consents -- in soul and city alike."},{name:"Aristotle",claim:"Temperance is the mean concerning bodily pleasures; the temperate person desires rightly, not merely resists."},{name:"The Stoics",claim:"Temperance is knowledge of what to choose in matters of desire; the sage is master of appetite."},{name:"Aquinas",claim:"Temperance restrains the concupiscible appetite according to reason; its parts include humility and chastity."}],topics:["The nature of temperance","The appetites and their pleasures","Self-mastery","Temperance vs. continence","The mean in pleasure","Temperance and reason","Asceticism and moderation","Temperance in soul and city"],key_texts:["Plato, Republic IV; Charmides","Aristotle, Nicomachean Ethics III","Epictetus, Discourses","Aquinas, Summa Theologica II-II QQ.141-170"],example:"Plato locates temperance not in one part of the soul but in the agreement of all three about who should rule\u2014harmony, not mere suppression of appetite.",related:["virtue-and-vice","courage","pleasure-and-pain"],hook:"Mastery of one's own appetites."},{id:"theology",name:"Theology",cluster:"divine",gist:"Reasoned discourse about God.",framing:"Theology is reasoned discourse about God -- founded either on revelation (sacred theology) or on unaided reason (natural theology). Its scope and method mark the boundary, and the meeting-point, of faith and philosophy.",senses:["Natural theology (God known by reason from creatures)","Sacred or revealed theology (from Scripture)","Theology as a science ordered from principles","The negative (apophatic) and mystical ways"],disputes:[{q:"Is theology a science?",sides:[{view:"Yes -- it reasons from revealed principles",who:"Aquinas"},{view:"No -- it lacks self-evident premises",who:"its critics"}]},{q:"How much of God can reason reach?",sides:[{view:"Much -- his existence and some attributes",who:"natural theology"},{view:"Little or nothing without revelation",who:"the fideists"}]},{q:"Faith seeking understanding, or reason grounding faith?",sides:[{view:"Believe in order to understand",who:"Augustine, Anselm"},{view:"Reason must first secure its ground",who:"the rationalists"}]}],positions:[{name:"Augustine",claim:"'Faith seeking understanding' -- belief first, then reason illumines what is believed."},{name:"Anselm",claim:"'I believe in order that I may understand'; reason unfolds the content of faith."},{name:"Aquinas",claim:"Sacred doctrine is a science drawing its principles from God's revelation; reason serves faith."},{name:"Maimonides",claim:"Guards God's transcendence; negative attributes protect against anthropomorphism."},{name:"Kant",claim:"Speculative theology overreaches; God is a matter of practical faith, not theoretical science."}],topics:["Natural vs. revealed theology","Theology as a science","The knowledge of God","The divine attributes","Faith and reason","The methods of theology (affirmation, negation, analogy)","Theology and philosophy","Mystical theology"],key_texts:["Augustine, On Christian Doctrine","Anselm, Proslogion","Aquinas, Summa Theologica I Q.1","Maimonides, Guide for the Perplexed","Calvin, Institutes of the Christian Religion"],example:"Aquinas treats theology as a genuine science that borrows its first principles from God's own knowledge, as optics borrows from geometry\u2014faith supplying what reason cannot reach.",related:["god","religion","metaphysics"],hook:"Reason turned toward God."},{id:"time",name:"Time",cluster:"being",gist:"The measure of change\u2014past, present, and future.",framing:"Time is the measure of change, the order of before and after -- yet what it is, and whether it is real, remains among the deepest puzzles. It binds together motion, memory, eternity, and the self.",senses:["The measure or number of motion","Duration lived and felt","Absolute time (flowing uniformly) vs. relative time","The tensed present vs. the tenseless order of events"],disputes:[{q:"Is time real or ideal?",sides:[{view:"Time is a real feature of motion and the world",who:"Aristotle, Newton"},{view:"Time depends on the numbering soul, or is a form of intuition",who:"Aristotle's puzzle; Kant"}]},{q:"Is time absolute or relative?",sides:[{view:"Absolute time flows equably, independent of all else",who:"Newton"},{view:"Time is an order of events, relative to observers",who:"Leibniz; Einstein"}]},{q:"Does time have a beginning?",sides:[{view:"Time began with creation; there was no time before the world",who:"Augustine"},{view:"Time is eternal, without beginning",who:"Aristotle"}]}],positions:[{name:"Aristotle",claim:"Time is the number of motion with respect to before and after; he puzzles over the reality of past and future."},{name:"Augustine",claim:"We measure past and future only in the present mind -- memory and expectation."},{name:"Newton",claim:"Absolute, true, mathematical time flows uniformly without relation to anything external."},{name:"Leibniz",claim:"Time is the order of succession, not a self-standing thing."},{name:"Kant",claim:"Time is the a priori form of inner sense, ordering all our experience."}],topics:["The definition of time","Time and motion","The reality of past and future","The now or instant","Lived vs. measured time","Absolute vs. relative time","The beginning of time","Time and eternity","Time and the soul"],key_texts:["Aristotle, Physics IV.10-14","Augustine, Confessions XI","Newton, Principia (Scholium)","Leibniz-Clarke Correspondence","Kant, Transcendental Aesthetic"],example:"Augustine's famous confession: 'What then is time? If no one asks me, I know; if I wish to explain, I do not know'\u2014the most familiar thing turned mysterious.",related:["change","eternity","space"],hook:"The measure of before and after."},{id:"truth",name:"Truth",cluster:"mind",gist:"The agreement of thought with what is.",framing:"Truth is the agreement of thought or statement with reality -- the goal of all inquiry and the standard by which belief is judged. What truth consists in, and whether we can attain it, are questions as old as philosophy.",senses:["Correspondence (thought matching reality)","Coherence (fitting a consistent system)","What works (pragmatism)","Logical truth of propositions vs. the intelligibility of being; eternal vs. changing truth"],disputes:[{q:"What does truth consist in?",sides:[{view:"Correspondence of statement to fact",who:"Aristotle"},{view:"Coherence within a system",who:"the rationalists and idealists"},{view:"Practical success",who:"the pragmatists"}]},{q:"Is truth absolute or relative?",sides:[{view:"Some truths are timeless and universal",who:"the mainstream"},{view:"'Man is the measure' -- truth is relative to the perceiver",who:"Protagoras"}]},{q:"Can truth be attained with certainty?",sides:[{view:"Yes -- of first principles and clear ideas",who:"the rationalists"},{view:"The skeptic withholds assent",who:"the skeptics"}]}],positions:[{name:"Aristotle",claim:"To say of what is that it is, and of what is not that it is not, is true -- truth is in the judgment."},{name:"Protagoras",claim:"'Man is the measure of all things' -- things are as they appear to each, relativizing truth."},{name:"Aquinas",claim:"Truth is the adequation of intellect and thing, grounded ultimately in the divine intellect."},{name:"Kant",claim:"Truth is agreement of knowledge with its object, but we know objects only as they appear."},{name:"James",claim:"An idea is true insofar as it works, proving itself in the course of experience."}],topics:["The nature of truth","Correspondence, coherence, and pragmatic theories","Truth in judgment and proposition","The truth of being","Absolute vs. relative truth","Eternal truths","The criterion of truth","Truth and skepticism"],key_texts:["Plato, Theaetetus","Aristotle, Metaphysics IV","Aquinas, Summa Theologica I Q.16","Kant, Critique of Pure Reason","James, Pragmatism"],example:"William James unsettled the tradition by making truth a matter of 'cash value'\u2014an idea is true insofar as believing it works and leads us rightly through experience.",related:["knowledge","opinion","judgment"],hook:"Thought matching what is."},{id:"tyranny",name:"Tyranny",cluster:"polis",gist:"Lawless rule for the ruler's own sake.",framing:"Tyranny is the corrupt rule of one who governs for his own interest, lawlessly and by force, against the good of the ruled. The archetypal bad regime, it defines by contrast what legitimate authority and the rule of law must be.",senses:["The perversion of monarchy (one ruling for himself)","Lawless, arbitrary rule (unbound by law or consent)","Despotism (ruling free men as a master rules slaves)","The 'tyranny of the majority' (a modern extension)"],disputes:[{q:"What makes rule tyrannical -- who rules or how?",sides:[{view:"The selfish, lawless end, not the number of rulers -- so even the many can be tyrants",who:"Aristotle, Tocqueville"},{view:"The usurpation or illegitimacy of a single ruler",who:"the narrower sense"}]},{q:"May a tyrant be resisted or killed?",sides:[{view:"Tyranny forfeits authority; tyrannicide can be just",who:"the classical and medieval tradition"},{view:"Resistance breeds worse disorder; endure or restrain by lawful means",who:"the order-first view"}]},{q:"Can tyranny take modern, softer forms?",sides:[{view:"Only overt despotism is tyranny",who:"the classical sense"},{view:"Majorities and administrative power can tyrannize over mind and custom",who:"Tocqueville, Mill"}]}],positions:[{name:"Plato",claim:"The tyrant is the least happy of men -- a slave to his own lawless desires, the soul in worst disorder."},{name:"Aristotle",claim:"Tyranny is the worst constitution, the perversion of kingship -- ruling for the tyrant's good by force and fear."},{name:"Aquinas",claim:"Since the tyrant governs against the common good, his rule lacks true authority and may be resisted."},{name:"Tocqueville",claim:"Warns of a new 'tyranny of the majority' and a mild but all-encompassing administrative despotism."}],topics:["The nature of tyranny","Tyranny as perverted rule","Lawlessness and arbitrary power","Despotism","The unhappiness of the tyrant","Resistance and tyrannicide","The tyranny of the majority","Tyranny and the rule of law"],key_texts:["Plato, Republic VIII-IX","Aristotle, Politics IV-V","Aquinas, On Kingship","Tocqueville, Democracy in America"],example:"Plato paints the tyrant as the unhappiest man alive\u2014ruler of a city but slave to his own appetites, feared by all and trusting no one.",related:["monarchy","liberty","government"],hook:"Lawless rule, for the ruler."},{id:"universal-and-particular",name:"Universal and Particular",cluster:"being",gist:"The general kind and the individual instance.",framing:"The universal is what can be common to many (man, red, triangle); the particular is the individual, this one here. Their relation -- whether universals are real, mental, or mere words -- is the 'problem of universals' that divides the whole tradition.",senses:["The universal as a real Form apart from things","As a common nature in things","As a concept in the mind","As a general name; the particular as the concrete individual"],disputes:[{q:"Do universals exist, and how?",sides:[{view:"Real and separate, before the thing (ante rem)",who:"Plato"},{view:"Real but only in things (in re)",who:"Aristotle"},{view:"Only names or concepts, after the thing (post rem)",who:"nominalists, Ockham"}]},{q:"What is known -- universals or particulars?",sides:[{view:"Science is of the universal; the particular as such is not known",who:"Aristotle"},{view:"Only particulars are real objects of knowledge",who:"empiricists, nominalists"}]},{q:"How is the individual individuated?",sides:[{view:"Matter individuates the common form",who:"Aquinas"},{view:"A unique 'thisness' (haecceity) individuates",who:"Scotus"}]}],positions:[{name:"Plato",claim:"Universals are eternal Forms; particulars are real only by participating in them."},{name:"Aristotle",claim:"The universal exists in particulars and is abstracted by intellect; only individuals subsist."},{name:"Ockham",claim:"Only individuals exist; universals are natural signs in the mind, not things."},{name:"Aquinas",claim:"The common nature exists in individuals and is universalized by the mind; matter individuates."}],topics:["The problem of universals","Realism, conceptualism, nominalism","Universals ante rem, in re, post rem","Abstraction","The individuation of particulars","Universality in knowledge and science","Genus, species, and individual"],key_texts:["Plato, Republic; Parmenides","Aristotle, Categories; Metaphysics VII","Porphyry, Isagoge","Ockham, Summa Logicae","Aquinas, On Being and Essence"],example:"Ockham's razor cuts against Plato's Forms: why posit a realm of universals when only individual things exist and 'humanity' is just a name we apply to many?",related:["form","one-and-many","idea"],hook:"The kind, and the individual."},{id:"virtue-and-vice",name:"Virtue and Vice",cluster:"good",gist:"Excellence and defect of character.",framing:"Virtue is excellence of character -- the settled disposition to be and do good; vice is its corruption. What the virtues are, whether they can be taught, and whether they suffice for the good life form the core of moral philosophy.",senses:["Excellence of any kind (arete) vs. specifically moral virtue","Moral virtues (of character) vs. intellectual virtues (of mind)","The cardinal virtues and the theological virtues","Virtue as a mean; vice as excess or defect"],disputes:[{q:"Can virtue be taught?",sides:[{view:"Virtue is knowledge, hence teachable",who:"Socrates"},{view:"It comes by habit and practice, not teaching alone",who:"Aristotle"},{view:"It is a gift of grace or nature",who:"the theologians"}]},{q:"Is virtue one or many?",sides:[{view:"The virtues are one -- to have one is to have all, since all are wisdom",who:"Socrates, the Stoics"},{view:"The virtues are distinct",who:"Aristotle"}]},{q:"Is virtue sufficient for happiness?",sides:[{view:"Yes -- virtue alone makes the happy life",who:"the Stoics"},{view:"No -- some external goods are also needed",who:"Aristotle"}]}],positions:[{name:"Socrates",claim:"Virtue is knowledge; no one does wrong willingly, so vice is a kind of ignorance."},{name:"Aristotle",claim:"Moral virtue is a settled disposition to choose the mean, formed by habit and guided by practical wisdom."},{name:"The Stoics",claim:"Virtue is the only good, sufficient for happiness; the passions are to be overcome."},{name:"Aquinas",claim:"Adds the theological virtues -- faith, hope, charity, infused by grace -- to the cardinal virtues."},{name:"Hume",claim:"Virtues are qualities useful or agreeable to ourselves or others, approved by moral sentiment."}],topics:["The nature of virtue","Moral vs. intellectual virtue","The cardinal and theological virtues","Virtue as a mean","Whether virtue can be taught","The unity of the virtues","Virtue and happiness","Vice and moral weakness"],key_texts:["Plato, Meno; Protagoras","Aristotle, Nicomachean Ethics II-VI","Epictetus; Seneca","Aquinas, Summa Theologica I-II QQ.55-67","Hume, Enquiry Concerning the Principles of Morals"],example:"Socrates' paradox: no one does wrong willingly, since to truly know the good is to do it\u2014vice, then, is a kind of ignorance rather than a free choice of evil.",related:["good-and-evil","habit","happiness"],hook:"Excellence and defect of character."},{id:"war-and-peace",name:"War and Peace",cluster:"polis",gist:"Organized violence between communities\u2014and its cessation.",framing:"War is organized armed conflict between communities; peace, the condition of concord and order. Whether war is natural or avoidable, whether it can be just, and how a lasting peace might be secured are questions of the gravest human weight.",senses:["Armed conflict between states or peoples","The 'state of war' (a relation of hostility, even without fighting)","Just war vs. unjust war","Peace as the mere absence of war vs. the 'tranquillity of order'; perpetual peace as an ideal"],disputes:[{q:"Is war natural or contrary to nature?",sides:[{view:"A permanent possibility rooted in human nature and scarcity",who:"Hobbes, Thucydides"},{view:"An aberration; peace is the natural and rational condition",who:"the cosmopolitans"}]},{q:"Can war be just?",sides:[{view:"Yes -- under just cause, right authority, and right conduct",who:"Augustine, Aquinas"},{view:"War is beyond justice, or is always a crime",who:"realists and pacifists"}]},{q:"Can lasting peace be achieved?",sides:[{view:"A federation of states under law could secure perpetual peace",who:"Kant"},{view:"Peace is only ever a pause between wars",who:"the tragic realists"}]}],positions:[{name:"Thucydides",claim:"Exposes the harsh logic of power -- 'the strong do what they can, the weak suffer what they must.'"},{name:"Augustine",claim:"Even war is waged for the sake of peace; a just war requires just cause and rightful authority."},{name:"Aquinas",claim:"Sets the conditions of a just war -- legitimate authority, just cause, and right intention."},{name:"Hobbes",claim:"Without a common power, men are in a war of all against all; peace requires the sovereign."},{name:"Kant",claim:"Proposes 'perpetual peace' through republican constitutions and a federation of free states under law."}],topics:["The nature and causes of war","The state of war","Just and unjust war","War and human nature","The ends of war","Peace as the tranquillity of order","The possibility of perpetual peace","War among nations and international law"],key_texts:["Thucydides, History of the Peloponnesian War","Augustine, City of God XIX","Aquinas, Summa Theologica II-II Q.40","Hobbes, Leviathan I","Kant, Perpetual Peace"],example:"Kant argued that republics, whose citizens bear war's costs, would tend toward peace\u2014sketching a federation of free states as the road to ending war.",related:["justice","state","government"],hook:"Organized violence, and its end."},{id:"wealth",name:"Wealth",cluster:"polis",gist:"The possession and production of external goods.",framing:"Wealth is the abundance of goods and money -- the material means of life and power. What wealth is, how it is rightly acquired and used, and its place in the good life and the just society are questions of economics and ethics alike.",senses:["An abundance of useful goods and property","Money or riches (a store of exchangeable value)","Natural wealth (goods for use) vs. artificial (money-making for its own sake)","Wealth as a means to the good life vs. as an end in itself"],disputes:[{q:"Is the pursuit of wealth natural and good, or corrupting?",sides:[{view:"Providing the means of life is natural and limited; unlimited money-making is unnatural",who:"Aristotle"},{view:"The pursuit of wealth through exchange enriches all",who:"Adam Smith"}]},{q:"What is the source and measure of wealth?",sides:[{view:"The labor embodied in goods",who:"Smith, Ricardo, Marx"},{view:"Money and gold",who:"the mercantilists"}]},{q:"How should wealth be distributed?",sides:[{view:"By merit and law, through free exchange",who:"Smith and the classical liberals"},{view:"Private accumulation is theft from labor -- abolish private property",who:"Marx"}]}],positions:[{name:"Aristotle",claim:"Distinguishes natural, limited household provision from unlimited money-making; condemns usury."},{name:"Adam Smith",claim:"Wealth is the annual produce of a nation's labor; free exchange, guided by an 'invisible hand,' increases it for all."},{name:"Marx",claim:"Capitalist wealth is accumulated from the surplus value of unpaid labor; private property should be abolished."},{name:"The Gospels",claim:"Warn of the love of money as a root of evils, and of how hard it is for the rich to enter the kingdom."}],topics:["The nature of wealth","The acquisition of wealth (natural and unnatural)","Money and exchange","Wealth as means or end","The source and measure of value","The distribution of wealth","Wealth and the good life","Wealth, poverty, and justice"],key_texts:["Aristotle, Politics I; Nicomachean Ethics","Adam Smith, The Wealth of Nations","Marx, Capital","the Gospels (on riches)"],example:"Aristotle warned against chrematistics\u2014wealth-seeking with no natural limit\u2014since money, unlike food or shelter, tempts us to pursue it endlessly for its own sake.",related:["labor","justice","happiness"],hook:"External goods, made and held."},{id:"will",name:"Will",cluster:"good",gist:"The power of rational choice and self-determination.",framing:"The will is the power of rational choice -- by which we decide, consent, and commit ourselves to act. Whether the will is free, how it relates to reason and desire, and whether it can choose against the good are pivotal questions for ethics and theology.",senses:["Rational appetite (the desire that follows reason's judgment)","The power of free choice (liberum arbitrium)","Sheer volition or self-determination","The will as distinct from -- and sometimes opposed to -- the intellect"],disputes:[{q:"Is the will free?",sides:[{view:"Yes -- we are the undetermined authors of our choices",who:"the libertarians"},{view:"No -- the will is determined by motives, causes, or God",who:"the determinists"},{view:"Freedom is acting from one's own nature without compulsion",who:"the compatibilists"}]},{q:"Does intellect or will have primacy?",sides:[{view:"The will follows the intellect's judgment of the good",who:"Aquinas (intellectualism)"},{view:"The will is the higher, freer power",who:"Scotus (voluntarism)"}]},{q:"Can the will choose evil knowingly?",sides:[{view:"No -- we will only under the aspect of good",who:"the classical view"},{view:"Yes -- the will can perversely reject the known good",who:"Augustine on sin"}]}],positions:[{name:"Augustine",claim:"The will is free but, since the Fall, in bondage to sin, needing grace to will the good rightly."},{name:"Aquinas",claim:"The will is rational appetite; it necessarily seeks the good in general but is free as to particular goods."},{name:"Scotus",claim:"The will is self-determining and, in a sense, superior to the intellect (voluntarism)."},{name:"Kant",claim:"A free, autonomous will legislating the moral law to itself is the ground of morality."},{name:"Schopenhauer",claim:"Will is the blind, striving essence of the world, of which intellect is only the servant."}],topics:["The nature of the will","Will and reason","Will and desire","Free will and determinism","Freedom and grace","The primacy of will or intellect","Weakness of will","The will and the good"],key_texts:["Augustine, On Free Choice of the Will","Aquinas, Summa Theologica I QQ.82-83; I-II QQ.6-17","Kant, Groundwork; Critique of Practical Reason","Schopenhauer, The World as Will and Representation"],example:"Augustine agonizes that he commands his hand and it obeys, yet commands his will and it resists\u2014the self strangely unable to simply will what it wills.",related:["liberty","desire","duty"],hook:"The power of rational choice."},{id:"wisdom",name:"Wisdom",cluster:"mind",gist:"Knowledge of the highest things, and how to live.",framing:"Wisdom is the highest knowledge -- of first causes and of how to live well. It unites the theoretical grasp of ultimate things with the practical mastery of conduct, and is the very end that philosophy loves.",senses:["Theoretical wisdom (sophia -- of first principles and highest things)","Practical wisdom (phronesis or prudence -- knowing how to act)","Wisdom as a gift of God (in Scripture)","Wisdom vs. mere cleverness or learning"],disputes:[{q:"Is wisdom theoretical or practical?",sides:[{view:"Contemplation of the highest truths is its peak",who:"Aristotle"},{view:"Wisdom is chiefly knowing how to live",who:"the Stoics, practical traditions"}]},{q:"Is wisdom human or divine?",sides:[{view:"The philosopher can attain it",who:"the Aristotelian view"},{view:"Only God is wise; humans merely love wisdom",who:"Socrates"}]},{q:"Can wisdom be taught?",sides:[{view:"It can be cultivated and learned",who:"the schools"},{view:"Even the wise cannot simply transmit it",who:"the Socratic doubt"}]}],positions:[{name:"Socrates",claim:"Knows that he knows nothing; human wisdom begins in recognizing one's own ignorance."},{name:"Aristotle",claim:"Distinguishes theoretical wisdom (of first causes) from practical wisdom (right deliberation about action)."},{name:"The Stoics",claim:"The sage is wholly governed by reason and virtue, indifferent to fortune."},{name:"Aquinas",claim:"Wisdom judges all things by the highest cause, God; it is both a virtue and a gift."}],topics:["The nature of wisdom","Theoretical vs. practical wisdom","Wisdom and the first causes","Wisdom and virtue","Human vs. divine wisdom","The wise man or sage","Wisdom and philosophy","Whether wisdom can be taught"],key_texts:["Plato, Apology","Aristotle, Nicomachean Ethics VI; Metaphysics I","Proverbs; Ecclesiastes","Aquinas, Summa Theologica II-II Q.45"],example:"The oracle called Socrates wisest, and he agreed only in this: others thought they knew what they didn't, while he alone knew the extent of his own ignorance.",related:["knowledge","philosophy","prudence"],hook:"Knowing the highest things, and how to live."},{id:"world",name:"World",cluster:"being",gist:"The ordered whole of all that is.",framing:"The world is the ordered whole of all that is -- the cosmos. Ideas about it swing between order and chaos, eternity and creation, one world or many, and whether it is intelligible, good, and made for a purpose.",senses:["The physical universe or cosmos","An ordered whole (kosmos = order)","The totality of finite things, as against God","The plurality of worlds"],disputes:[{q:"Did the world have a beginning?",sides:[{view:"The world is eternal",who:"Aristotle"},{view:"The world was created and began",who:"Augustine, Aquinas"},{view:"Reason cannot decide (antinomy)",who:"Kant"}]},{q:"Is there one world or many?",sides:[{view:"One unique, finite cosmos",who:"Aristotle, Ptolemy"},{view:"Infinitely many worlds",who:"atomists, Bruno"}]},{q:"Is the world ordered by design or chance?",sides:[{view:"The cosmos is a work of intelligence and providence",who:"Plato, Stoics, theists"},{view:"Order arises from the chance motion of atoms",who:"Democritus, Epicurus"}]}],positions:[{name:"Plato",claim:"The Timaeus depicts a craftsman shaping the cosmos on eternal models -- an ordered, ensouled whole."},{name:"Aristotle",claim:"One eternal, finite cosmos, moved from beyond by the unmoved mover."},{name:"Lucretius",claim:"Infinite worlds form and dissolve by the chance concourse of atoms."},{name:"Augustine",claim:"God freely created the world, and time with it, out of nothing."},{name:"Kant",claim:"The world-whole is an idea of reason; claims about its bounds fall into antinomies."}],topics:["The world as ordered whole","The origin of the world (eternity vs. creation)","The plurality of worlds","The order and design of the cosmos","The world-soul","The extent and shape of the universe","The end or destiny of the world","The world and God"],key_texts:["Plato, Timaeus","Aristotle, On the Heavens","Lucretius, On the Nature of Things","Augustine, City of God XI-XII","Kant, Critique of Pure Reason (Antinomies)"],example:"Plato's Timaeus depicts the cosmos as the work of a craftsman shaping chaos toward the good\u2014the world as ordered artifact, not
